<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ee7fa5"><title>โปรไฟล์ • Mari JP SMP</title><link rel="stylesheet" href="/app.css?v=1"></head><body><header class="top"><nav class="nav"><a class="brand" href="/"><span class="brand-icon">M</span><span><b>Mari JP SMP</b><small>PROFILE</small></span></a><div class="navlinks"><a class="btn ghost" href="/">หน้าหลัก</a><a class="btn soft" href="/topup.html">เติมเงิน</a></div></nav></header><main class="wrap"><section class="section-title"><div><h2>โปรไฟล์ของฉัน</h2><p>ข้อมูลจากบัญชีเดิม</p></div></section><div id="profileRoot" class="grid"><div class="card empty">กำลังโหลด...</div></div></main><div id="toast" class="toast"></div><script>async function api(p,o={}){const r=await fetch(p,Object.assign({credentials:'include',cache:'no-store'},o));const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'HTTP '+r.status);return d}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const root=document.getElementById('profileRoot');try{const u=(await api('/api/me')).user;root.innerHTML='<article class="card"><div style="display:flex;gap:12px;align-items:center">'+(u.avatarUrl?'<img src="'+esc(u.avatarUrl)+'" style="width:74px;height:74px;border-radius:18px;object-fit:cover">':'<div class="brand-icon" style="width:74px;height:74px">M</div>')+'<div><h2 style="margin:0">'+esc(u.displayName||u.username)+'</h2><div class="muted">@'+esc(u.username)+'</div><div class="muted">UID '+esc(u.uid||'-')+'</div></div></div><div class="mini-grid" style="margin-top:14px"><div class="info-row"><span>ยศ</span><b>'+esc(u.title?.label||u.titleId||'สมาชิก')+'</b></div><div class="info-row"><span>เครดิต</span><b>฿'+Number(u.balance||0).toLocaleString('th-TH')+'</b></div><div class="info-row"><span>Minecraft</span><b>'+esc(u.minecraft||'ยังไม่ได้ผูก')+'</b></div><div class="info-row"><span>ยืนยัน Minecraft</span><b>'+((u.minecraftVerified)?'แล้ว':'ยัง')+'</b></div></div></article><article class="card"><h3>การทำงานต่อ</h3><div class="actions"><a class="btn primary" href="/topup.html">เติมเครดิต</a><a class="btn dark" href="/index.html#shopSection">ร้านค้า</a><button id="logout" class="btn ghost" type="button">ออกจากระบบ</button></div><p class="muted" style="margin-top:12px;font-size:13px">ระบบอื่นยังใช้ API เดิมผ่าน Cloudflare compatibility layer</p></article>';document.getElementById('logout').onclick=async()=>{try{await api('/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});location.href='/auth.html?mode=login'}catch(e){document.getElementById('toast').textContent=e.message;document.getElementById('toast').classList.add('show')}}}catch(e){root.innerHTML='<div class="card empty">'+esc(e.message)+'<div style="margin-top:12px"><a class="btn primary" href="/auth.html">เข้าสู่ระบบ</a></div></div>'}}load()</script></body></html>
