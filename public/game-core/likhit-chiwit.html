<script>
/* ===== ระบบใหม่ 8: กองทุนการศึกษาลูก / ชมรมและกลุ่มเพื่อน / สืบทอดกิจการ ===== */
(function(){
const fm=n=>'฿'+Math.round(n).toLocaleString('en-US');
const N=o=>{o.custom='x';ACTS.splice(ACTS.length-1,0,o)};
const once=(k,fn)=>{if(S.done[k])return toast('ทำแล้วในปีนี้');S.done[k]=1;fn()};
const nodo=()=>{if(S.jail>0){toast('ใช้ไม่ได้ขณะอยู่ในเรือนจำ');return true}return false};
const kids=()=>S.people.filter(p=>p.alive&&p.type==='ลูก'&&!p.pl);

/* ---------- 🎓 กองทุนการศึกษาลูก ---------- */
const _nw3=netWorth;netWorth=function(){return _nw3()+Math.round(S.edf||0)};
function fundPanel2(){
  if(nodo())return;
  const bal=Math.round(S.edf||0),ks=kids().filter(p=>p.age>=4&&p.age<=21);
  sheet('🎓 กองทุนการศึกษาลูก',b=>{
    b.appendChild(el('div','pcard','<div class="pl">ยอดกองทุน '+fm(bal)+'</div><div class="ps">ผลตอบแทน ~4%/ปี · ทุกปีกองทุนจ่ายเรียนพิเศษ ฿60,000 ให้ลูกอายุ 4–21 ปีอัตโนมัติ (ตอนนี้มี '+ks.length+' คน)</div>'));
    [100000,500000,2000000].forEach(n=>b.appendChild(row('ฝากเข้ากองทุน '+fm(n),S.money>=n?'เก็บไว้ให้ลูกเรียน':'เงินไม่พอ',S.money>=n?()=>{mon(-n);S.edf=(S.edf||0)+n;add('คุณฝากเงิน '+fm(n)+' เข้ากองทุนการศึกษาของลูก','info');fundPanel2();render()}:null)));
    if(bal>0)b.appendChild(row('ถอนกองทุนทั้งหมด','รับเงิน '+fm(bal)+' คืน',()=>{mon(bal);S.edf=0;add('คุณถอนกองทุนการศึกษา '+fm(bal),'info');fundPanel2();render()}))})}
N({k:'edfund',t:'🎓 กองทุนการศึกษาลูก',s:'ฝากเงินให้กองทุนจ่ายเรียนพิเศษของลูกอัตโนมัติทุกปี',min:20,open:fundPanel2});
function fundYear(){
  if(!S.edf||S.edf<=0)return;
  S.edf=Math.round(S.edf*1.04);
  kids().filter(p=>p.age>=4&&p.age<=21).forEach(p=>{
    if(S.edf<60000)return;S.edf-=60000;const k=p.kd||(p.kd={sm:R(30,80),hl:R(70,100),ed:0,career:'',gk:0});
    k.ed=Math.min(5,k.ed+1);k.sm=cl(k.sm+R(2,5));add('กองทุนการศึกษาจ่ายเรียนพิเศษให้ '+p.name,'good')})}

/* ---------- 👥 ชมรมและกลุ่มเพื่อน ---------- */
const CL=[
 {k:'book',i:'📚',n:'ชมรมนักอ่าน',d:'ความฉลาด +',f:()=>{chg('smarts',R(1,3))}},
 {k:'hike',i:'🥾',n:'ชมรมเดินป่า',d:'สุขภาพ + ',f:()=>{chg('health',R(1,3))}},

 {k:'inv',i:'💼',n:'ชมรมนักลงทุน',d:'ได้ทิปการลงทุนเป็นเงิน',f:()=>{const m=R(2000,30000);mon(m);add('เพื่อนในชมรมแบ่งปันทิปการลงทุน คุณได้กำไร '+fm(m),'good')}}];

      b.appendChild(row('🎉 ไปร่วมกิจกรรมของชมรม','ฟรี มีโอกาสได้เพื่อนใหม่',S.done.club?null:()=>{once('club',()=>{
        x.f();chg('happy',R(1,3));c.n=(c.n||0)+1;
        if(chance(30)&&S.people.filter(p=>p.type==='เพื่อน').length<12){const f=addFriend();add('คุณได้เพื่อนใหม่จากชมรม: '+f.name,'good')}else add('คุณไปร่วมกิจกรรมของ'+x.n+' สนุกมาก','good')});clubPanel();render()},S.done.club?'ทำแล้ว':''));
      b.appendChild(row('🚪 ออกจากชมรม','',()=>{S.club=null;add('คุณออกจาก'+x.n,'info');clubPanel()}))}
    else{b.appendChild(el('div','note','เข้าชมรมเพื่อได้พบเพื่อนใหม่และพัฒนาตัวเองทุกปี'));
      CL.forEach(x=>b.appendChild(row(x.i+' '+x.n,x.d,()=>{S.club={k:x.k,since:S.age,n:0};add('คุณเข้าร่วม'+x.n,'info');clubPanel()})))}})}
N({k:'club',t:'👥 ชมรมและกลุ่มเพื่อน',s:'เข้าชมรม ได้เพื่อนใหม่ พัฒนาตัวเองทุกปี',min:12,open:clubPanel});

const au4=ageUp;
ageUp=function(){const a0=S&&S.age;au4();if(!S||!S.alive||S.age===a0)return;try{fundYear()}catch(e){}render()};
$('#ageBtn').onclick=ageUp;
})();

<script>
/* ===== ระบบใหม่ 9: ซื้อบ้านผ่อน (สินเชื่อบ้าน) + เหตุการณ์ซ่อมบ้าน ===== */
(function(){
const fm=n=>'฿'+Math.round(n).toLocaleString('en-US');
const N=o=>{o.custom='x';ACTS.splice(ACTS.length-1,0,o)};
const RATE=.065;
const pmtOf=(P,n)=>Math.round(P*RATE/(1-Math.pow(1+RATE,-n)));
const _nw4=netWorth;netWorth=function(){return _nw4()-Math.round((S.mort&&S.mort.bal)||0)};
const homeAsset=()=>S.mort&&S.assets.find(a=>a.id===S.mort.aid);

function mortPanel(){
  if(S.jail>0)return toast('ใช้ไม่ได้ขณะอยู่ในเรือนจำ');
  const M=S.mort,a=M&&homeAsset();
  sheet('🏦 ซื้อบ้านผ่อน',b=>{
    if(M){
      b.appendChild(el('div','pcard','<div class="pl">'+(a?a.i+' '+a.n:'บ้าน')+' · ยอดค้างชำระ '+fm(M.bal)+'</div><div class="ps">ดอกเบี้ย '+(RATE*100).toFixed(1)+'%/ปี · ผ่อนปีละ '+fm(M.pmt)+' · เหลืออีก '+M.left+' ปี'+(M.miss?' · ⚠️ ค้างชำระ '+M.miss+' งวด':'')+'</div>'));
      b.appendChild(row('💵 ชำระเพิ่ม ฿500,000','ลดเงินต้น ประหยัดดอกเบี้ย',S.money>=500000&&M.bal>0?()=>{const x=Math.min(500000,M.bal);mon(-x);M.bal-=x;add('คุณชำระเงินกู้บ้านเพิ่ม '+fm(x),'good');mortPanel();render()}:null));
      b.appendChild(row('✅ ปิดบัญชีทั้งหมด','จ่าย '+fm(M.bal),S.money>=M.bal?()=>{mon(-M.bal);add('คุณปิดสินเชื่อบ้านทั้งหมด '+fm(M.bal)+' บ้านเป็นของคุณเต็มตัวแล้ว','good');chg('happy',8);S.mort=null;mortPanel();render()}:null));
      if(a)b.appendChild(row('🏷️ ขายบ้านหลังนี้','ได้ '+fm(a.v*.97)+' หักหนี้ '+fm(M.bal)+' (ค่าธรรมเนียม 3%)',()=>{const net=Math.round(a.v*.97-M.bal);
        S.assets=S.assets.filter(y=>y!==a);S.mort=null;if(net>=0)mon(net);else{S.loan=(S.loan||0)-net}add('คุณขาย'+a.n+' ปิดสินเชื่อ'+(net>=0?' ได้เงินสุทธิ '+fm(net):' ยังเหลือหนี้ '+fm(-net)),net>=0?'good':'bad');closeSheet()}));
      return}
    b.appendChild(el('div','note','ซื้อบ้านด้วยสินเชื่อ ดาวน์ 20–40% ผ่อนรายปี ดอกเบี้ย '+(RATE*100).toFixed(1)+'% ธนาคารพิจารณาจากรายได้ (ผ่อนไม่เกิน 40% ของเงินเดือน) หรือเงินสดที่มี 10 เท่าของค่างวด'));
    SHOP.filter(x=>x.home).forEach(x=>b.appendChild(row(x.i+' '+x.n,S.age<x.min?'ต้องอายุ '+x.min+' ปีขึ้นไป':'ราคา '+fm(x.p)+' · ดาวน์ตั้งแต่ '+fm(x.p*.2),S.age<x.min?null:()=>homeOpts(x),fm(x.p))))});
}
function homeOpts(x){
  sheet(x.i+' '+x.n+' — เลือกเงื่อนไข',b=>{
    const inc=S.job?S.job.sal:0;
    [[.2,30],[.2,20],[.4,30],[.4,20]].forEach(o=>{
      const down=Math.round(x.p*o[0]),P=x.p-down,pm=pmtOf(P,o[1]);
      const ok=S.money>=down&&(pm<=inc*.4||S.money-down>=pm*10);
      b.appendChild(row('ดาวน์ '+(o[0]*100)+'% · ผ่อน '+o[1]+' ปี','ดาวน์ '+fm(down)+' · ผ่อนปีละ '+fm(pm)+' · ดอกเบี้ยรวม ~'+fm(pm*o[1]-P)+(S.money<down?' (เงินสดไม่พอดาวน์)':ok?'':' (รายได้ไม่ผ่านเกณฑ์ธนาคาร)'),ok?()=>{
        mon(-down);const id=uid();S.assets.push({id,n:x.n,p:x.p,v:x.p,up:x.up,gr:x.gr,i:x.i,home:1,mort:1});
        S.mort={aid:id,bal:P,left:o[1],pmt:pm,miss:0};chg('happy',R(8,14));
        add('คุณซื้อ'+x.n+' ราคา '+fm(x.p)+' ดาวน์ '+fm(down)+' กู้ '+fm(P)+' ผ่อนปีละ '+fm(pm)+' นาน '+o[1]+' ปี','good');closeSheet()}:null))})})}
N({k:'mortgage',t:'🏦 ซื้อบ้านผ่อน',s:'สินเชื่อบ้านและคอนโด ดาวน์ 20–40% ผ่อนรายปี ผิดนัดเสี่ยงถูกยึด',min:20,open:mortPanel});

function mortYear(){
  const M=S.mort;if(!M)return;
  const a=homeAsset();
  if(!a){ /* บ้านถูกขายผ่านเมนูทรัพย์สิน: ต้องปิดหนี้ที่เหลือ */
    const d=Math.round(M.bal);S.mort=null;
    if(S.money>=d){mon(-d);add('คุณขายบ้านที่ผ่อนอยู่ ธนาคารหักเงินปิดสินเชื่อ '+fm(d),'info')}
    else{const pay=Math.max(0,S.money);S.loan=(S.loan||0)+d-pay;mon(-pay);add('คุณขายบ้านที่ยังผ่อนไม่หมด หนี้ที่เหลือ '+fm(d)+' ถูกโอนเป็นเงินกู้','bad')}
    return}
  M.bal=Math.round(M.bal*(1+RATE));
  if(M.bal<=0){S.mort=null;return}
  const pm=Math.min(M.pmt,M.bal);
  if(S.money>=pm){mon(-pm);M.bal-=pm;M.left--;M.miss=0;
    if(M.bal<=0||M.left<=0){const rest=Math.max(0,Math.round(M.bal));if(rest>0&&S.money>=rest)mon(-rest);S.mort=null;chg('happy',12);add('🏠 คุณผ่อนบ้านหมดแล้ว! '+a.n+'เป็นของคุณเต็มตัว','good')}
    else add('ผ่อนบ้านปีนี้ '+fm(pm)+' (ยอดคงเหลือ '+fm(M.bal)+')','info')}
  else{M.miss++;M.bal=Math.round(M.bal*1.03);chg('happy',-6);S.stress=Math.min(100,(S.stress==null?20:S.stress)+10);
    if(M.miss>=2){const sale=Math.round(a.v*.8),net=sale-Math.round(M.bal);S.assets=S.assets.filter(y=>y!==a);S.mort=null;
      if(net>=0)mon(net);else S.loan=(S.loan||0)-net;
      chg('happy',-12);S.flags.foreclosed=1;add('🏚️ คุณผิดนัดผ่อนบ้านติดต่อกัน 2 ปี ธนาคารยึดและขายทอดตลาด'+(net>=0?' คุณได้เงินส่วนที่เหลือ '+fm(net):' คุณยังเป็นหนี้ '+fm(-net)),'bad')}
    else add('⚠️ คุณผ่อนบ้านปีนี้ไม่ไหว (ค้างชำระ 1 งวด) ปีหน้าหากยังผิดนัดอีก ธนาคารจะยึดบ้าน','bad')}}

EV.push(
{cond:()=>S.assets.some(a=>a.home)&&S.jail===0&&Math.random()<.22,go:()=>{
  const a=S.assets.find(x=>x.home),c=Math.max(20000,Math.round(a.v*.02));
  ask('บ้านของคุณมีปัญหา: หลังคารั่วและท่อน้ำเสียหาย ค่าซ่อมประมาณ '+fm(c),[
   {t:'ซ่อมทันที '+fm(c),f:()=>{if(S.money>=c){mon(-c);add('คุณซ่อมบ้านเรียบร้อย เสียเงิน '+fm(c),'info')}else{a.v=Math.round(a.v*.97);chg('happy',-3);add('คุณไม่มีเงินซ่อม บ้านทรุดโทรมลง มูลค่าลดลง','bad')}}},
   {t:'ซ่อมแบบประหยัด',f:()=>{const x=Math.round(c/2);if(S.money>=x)mon(-x);a.v=Math.round(a.v*.99);add('คุณซ่อมแบบพอใช้ ค่าใช้จ่าย '+fm(x)+' แต่ยังมีปัญหาเล็กน้อย','info')}},
   {t:'ปล่อยไว้ก่อน',f:()=>{a.v=Math.round(a.v*.95);chg('happy',-4);add('คุณปล่อยปัญหาบ้านไว้ ราคาบ้านตกลง','bad')}}],'ซ่อมบ้าน')}}
);
const au5=ageUp;
ageUp=function(){const a0=S&&S.age;au5();if(!S||!S.alive||S.age===a0)return;try{mortYear()}catch(e){}render()};
$('#ageBtn').onclick=ageUp;
})();

<script>
/* ===== ระบบใหม่ 10: เงินเฟ้อ / ค่าครองชีพ ===== */
(function(){
const fm=n=>'฿'+Math.round(n).toLocaleString('en-US');
const N=o=>{o.custom='x';ACTS.splice(ACTS.length-1,0,o)};
const ST=()=>{if(!S.infl)S.infl={i:1,r:.025,h:[],base:0};return S.infl};
const rnd=(a,b)=>a+Math.random()*(b-a);
const lbl=r=>r<0?'เงินฝืด':r<.015?'ต่ำมาก':r<.035?'ปกติ':r<.06?'สูง':r<.1?'สูงมาก':'วิกฤตราคาแพง';
function roll(){
  const I=ST();let r;
  const x=Math.random();
  if(I.crisis>0){I.crisis--;r=rnd(.07,.14)}
  else if(x<.04){I.crisis=1+((Math.random()*2)|0);r=rnd(.08,.16);I.news='วิกฤตเศรษฐกิจ ราคาสินค้าพุ่งสูง'}
  else if(x<.08){r=rnd(-.012,.004);I.news='เศรษฐกิจซบเซา ราคาสินค้าทรงตัวหรือลดลง'}
  else{r=Math.max(.0,(I.r>.06?.03:(I.r||.02))*.4+rnd(0,.026))}
  r=Math.round(r*1000)/1000;
  I.r=r;I.i=Math.max(.5,I.i*(1+r));I.h.push([S.age,r]);if(I.h.length>40)I.h.shift();
  if(S.pen)S.pen=Math.round(S.pen*(1+Math.max(0,r)*.6));
  return r}
function infLog(r){
  const I=ST();
  add('📈 เงินเฟ้อปีนี้ '+(r*100).toFixed(1)+'% ('+lbl(r)+') · ค่าครองชีพเทียบวันเริ่มเกม ×'+I.i.toFixed(2),r>=.08?'bad':r<0?'good':'info');
  if(r>=.08){chg('happy',-3);S.stress=cl((S.stress==null?20:S.stress)+4)}
  if(I.news&&(r>=.08||r<0)&&!I.said){I.said=1;toast(I.news)}
  if(r<.08&&r>=0)I.said=0;
  delete I.news}
function panel(){
  const I=ST();
  sheet('📈 เงินเฟ้อและค่าครองชีพ',b=>{
    b.appendChild(el('div','pcard','<div class="pl">อัตราเงินเฟ้อล่าสุด '+(I.r*100).toFixed(1)+'% · '+lbl(I.r)+'</div><div class="ps">ดัชนีค่าครองชีพ ×'+I.i.toFixed(2)+' เทียบตอนเริ่มเกม<br>กาแฟแก้วละ ~'+fm(60*I.i)+' · ข้าวมื้อละ ~'+fm(50*I.i)+' · ค่าเช่าหอ '+fm(48000*W())+'/ปี<br>เงินเดือนและค่าเช่าปรับตามเงินเฟ้อ แต่ค่างวดบ้านคงที่ (ผ่อนบ้านได้เปรียบเมื่อเฟ้อสูง)</div>'));
    const h=I.h.slice(-12).reverse();
    if(h.length)b.appendChild(el('div','pcard','<div class="pl">ประวัติ</div><div class="ps">'+h.map(a=>'อายุ '+a[0]+': '+(a[1]*100).toFixed(1)+'%').join('<br>')+'</div>'))})}
N({k:'infl',t:'📈 เงินเฟ้อ / ค่าครองชีพ',s:'ดูอัตราเงินเฟ้อและราคาสินค้า',min:12,open:panel});
const au0=ageUp;
ageUp=function(){
  if(!S||!S.alive||S.world==='ninja')return au0();
  const old=JSON.stringify(S.infl||null),oldPen=S.pen,a0=S.age;
  const r=roll();
  au0();
  if(!S||!S.alive)return;
  if(S.age===a0){S.infl=old==='null'?undefined:JSON.parse(old);S.pen=oldPen;return}
  try{infLog(r)}catch(e){}
  render();
};
$('#ageBtn').onclick=ageUp;
})();
</script>
<script>

(function(){

const N=o=>{o.custom='x';ACTS.splice(ACTS.length-1,0,o)};
const SS=()=>{if(!S.ss)S.ss={y:0,avg:0,paid:0,p:0,got:0};return S.ss};

function estimate(){const s=SS();if(s.y<15)return 0;return Math.round(Math.min(s.avg||BASE(),BASE())*(0.2+0.015*(s.y-15)))}
function panel(){
  const s=SS(),pf=S.pf||0;
  sheet('🏛️ ประกันสังคมและเงินเกษียณ',b=>{
    b.appendChild(el('div','pcard','<div class="pl">ประกันสังคม</div><div class="ps">ส่งสมทบมาแล้ว '+s.y+' ปี · รวม '+fm(s.paid)+'<br>'+(s.p?'รับบำนาญปีละ '+fm(s.p):s.y>=15?'ประมาณการบำนาญเมื่ออายุ 60: '+fm(estimate())+'/ปี':'ต้องส่งครบ 15 ปีจึงได้บำนาญรายปี (ไม่ครบจะได้เงินก้อนคืนตอนอายุ 60)')+'<br>ลูกจ้างถูกหักอัตโนมัติ 5% ของเงินเดือน (เพดาน '+fm(CAP())+'/ปี)</div>'));
    if(S.age<60&&!working()&&S.age>=18){const c=Math.round(CAP()*.7),bt=el('button','big ghost','จ่ายเอง (มาตรา 39/40) '+fm(c)+' นับเป็น 1 ปี');bt.onclick=()=>{if(S.done.ssv)return toast('ทำแล้วในปีนี้');if(S.money<c)return toast('เงินไม่พอ');S.done.ssv=1;mon(-c);s.y++;s.paid+=c;s.avg=Math.round(((s.avg||0)*(s.y-1)+c/.7/.05*.5)/s.y);toast('ส่งสมทบแล้ว');render()};b.appendChild(bt)}
    b.appendChild(el('div','pcard','<div class="pl">กองทุนสำรองเลี้ยงชีพ</div><div class="ps">ยอดสะสม '+fm(pf)+' · ผลตอบแทนเฉลี่ย 3–6%/ปี · ถอนอัตโนมัติตอนอายุ 60<br>ลูกจ้างนายจ้างสมทบให้ 3% ของเงินเดือนอัตโนมัติเมื่อมีงานประจำ</div>'));
    if(S.age>=18&&S.age<60)[50000,200000].forEach(v=>{const w=Math.round(v*W()),bt=el('button','big ghost','ฝากเพิ่ม '+fm(w));bt.onclick=()=>{if(S.money<w)return toast('เงินไม่พอ');mon(-w);S.pf=(S.pf||0)+w;toast('ฝากแล้ว');render();panel()};b.appendChild(bt)});
  })}
N({k:'ss',t:'🏛️ ประกันสังคม / เงินเกษียณ',s:'ส่งสมทบ กองทุนสำรองเลี้ยงชีพ บำนาญ',min:18,open:panel});
function year(){
  const s=SS();
  if(working()){
    const c=Math.min(Math.round(S.job.sal*.05),CAP());mon(-c);s.y++;s.paid+=c;
    s.avg=Math.round(((s.avg||0)*(s.y-1)+Math.min(S.job.sal,BASE()))/s.y);
    const pc=Math.round(S.job.sal*.03);S.pf=(S.pf||0)+pc;
    add('หักประกันสังคม '+fm(c)+' · นายจ้างสมทบกองทุน '+fm(pc),'info')}
  if(S.pf>0&&S.age<60){const g=Math.round(S.pf*(0.03+Math.random()*.03));S.pf+=g}
  if(S.age===60){
    if(S.pf>0){mon(S.pf);add('🎉 ถอนกองทุนสำรองเลี้ยงชีพ '+fm(S.pf),'good');S.pf=0}
    if(s.y>=15){s.p=estimate();add('คุณมีสิทธิ์รับบำนาญชราภาพปีละ '+fm(s.p),'good')}
    else if(s.paid>0){const l=Math.round(s.paid*2);mon(l);add('ส่งสมทบไม่ครบ 15 ปี ได้รับเงินก้อนชราภาพ '+fm(l),'info')}}
  if(S.age>60&&s.p>0){const r=(S.infl&&S.infl.r)||0;s.p=Math.round(s.p*(1+Math.max(0,r)*.6));mon(s.p);s.got+=s.p;add('รับบำนาญประกันสังคม '+fm(s.p),'good')}
}
const au0=ageUp;
ageUp=function(){
  const a0=S&&S.age;au0();
  if(!S||!S.alive||S.age===a0)return;
  try{year()}catch(e){}
  render();
};
$('#ageBtn').onclick=ageUp;
})();
</script>
<script>
/* ===== ระบบใหม่ 12: เหตุการณ์ระดับประเทศ ===== */
(function(){
const fm=n=>'฿'+Math.round(n).toLocaleString('en-US');
const N=o=>{o.custom='x';ACTS.splice(ACTS.length-1,0,o)};
const H=()=>{if(!S.natH)S.natH=[];return S.natH};
const rec=t=>{H().push([S.age,t]);if(S.natH.length>30)S.natH.shift()};
function mkScale(k){if(S.mk&&S.mk.px)Object.keys(S.mk.px).forEach(t=>{S.mk.px[t]=Math.max(1,Math.round(S.mk.px[t]*k*100)/100)})}
function stk(k){S.stock=Math.round((S.stock||0)*k);mkScale(k)}
function crisis(){

  if(S.biz){const l=Math.round(S.biz.v*.15);S.biz.v-=l;add('กิจการของคุณมูลค่าลดลง '+fm(l),'bad')}
  if(S.job&&S.age>=18&&S.jail===0&&Math.random()<.3){const J=S.job;
    ask('บริษัทปรับลดพนักงานเพราะวิกฤต คุณจะทำอย่างไร?',[
      {t:'ยอมลดเงินเดือน 20% เพื่อรักษางาน',f:()=>{J.sal=Math.round(J.sal*.8);add('คุณยอมลดเงินเดือนเพื่ออยู่รอด','info');render()}},
      {t:'ลาออกพร้อมเงินชดเชย',f:()=>{const c=Math.round(J.sal*.5);mon(c);S.job=null;add('คุณออกจากงานพร้อมเงินชดเชย '+fm(c),'info');render()}}],'📉 ถูกปรับลดพนักงาน')}}
function pandemic(){
  rec('โรคระบาด');S.nat={t:'pandemic',left:2};
  add('🦠 เกิดโรคระบาดครั้งใหญ่ทั่วประเทศ! (คาดว่ากินเวลา ~2 ปี)','bad');toast('🦠 โรคระบาด');
  const c=Math.round(3000*W());
  ask('วัคซีนเริ่มเปิดให้บริการ คุณจะฉีดหรือไม่? (ค่าใช้จ่าย '+fm(c)+')',[
    {t:'ฉีดวัคซีน',f:()=>{if(S.money>=c){mon(-c);S.nat&&(S.nat.vax=1);add('คุณฉีดวัคซีนแล้ว','good')}else add('เงินไม่พอฉีดวัคซีน','bad');render()}},
    {t:'ไม่ฉีด',f:()=>{}}],'🦠 โรคระบาด')}
function pandYear(){
  const n=S.nat;if(!n||n.t!=='pandemic')return;
  if(S.biz){const l=Math.round(S.biz.v*.08);S.biz.v-=l;add('กิจการเสียหายจากล็อกดาวน์ '+fm(l),'bad')}
  if(S.job&&S.age>=18&&Math.random()<.1){S.job=null;add('คุณถูกเลิกจ้างจากผลกระทบโรคระบาด','bad');chg('happy',-6)}
  S.stress=Math.min(100,(S.stress==null?20:S.stress)+5);
  if(Math.random()<(n.vax?.08:.4)){const d=S.ins?6:10;chg('health',-d);chg('happy',-3);add('คุณติดเชื้อจากโรคระบาด สุขภาพลดลง','bad')}
  n.left--;if(n.left<=0){S.nat=null;rec('โรคระบาดสิ้นสุด');add('โรคระบาดสิ้นสุดลง เศรษฐกิจเริ่มฟื้น','good');stk(1.15)}}
function pm(){
  rec('ฝุ่น PM2.5');const c=Math.round(12000*W());
  add('😷 ฝุ่น PM2.5 ปกคลุมหนักทั้งปี','bad');
  ask('ฝุ่นพิษรุนแรง คุณจะซื้อเครื่องฟอกอากาศและหน้ากากหรือไม่? ('+fm(c)+')',[
    {t:'ซื้อ',f:()=>{if(S.money>=c){mon(-c);chg('health',-1);add('คุณป้องกันตัวจากฝุ่นได้ดี','good')}else{chg('health',-4);add('เงินไม่พอ คุณสูดฝุ่นเต็มๆ','bad')}render()}},
    {t:'ไม่ซื้อ',f:()=>{chg('health',-4);add('คุณสูดฝุ่นพิษ สุขภาพลดลง','bad');render()}}],'😷 PM2.5')}
function flood(){
  rec('น้ำท่วม');const as=(S.assets||[]).filter(x=>x.v>0);
  add('🌊 น้ำท่วมใหญ่ในพื้นที่ของคุณ','bad');toast('🌊 น้ำท่วม');
  if(as.length){let t=0;as.forEach(x=>{const l=Math.round(x.v*(S.ins?.05:.12));x.v-=l;t+=l});add('ทรัพย์สินเสียหายรวม '+fm(t)+(S.ins?' (ประกันช่วยลดความเสียหาย)':''),'bad')}
  else{const c=Math.round(20000*W());mon(-c);add('ค่าซ่อมแซมและข้าวของเสียหาย '+fm(c),'bad')}
  chg('happy',-4)}
function boom(){
  rec('เศรษฐกิจรุ่งเรือง');stk(1.25);if(S.job&&S.job.sal)S.job.sal=Math.round(S.job.sal*1.05);chg('happy',3);
  add('📈 เศรษฐกิจรุ่งเรือง! ตลาดหุ้นพุ่ง เงินเดือนปรับขึ้น','good');toast('📈 เศรษฐกิจรุ่งเรือง')}
function unrest(){
  rec('ความไม่สงบทางการเมือง');stk(.9);S.stress=Math.min(100,(S.stress==null?20:S.stress)+8);chg('happy',-2);
  add('🏛️ ความไม่สงบทางการเมือง ตลาดหุ้นผันผวน ประชาชนเครียด','bad')}
function yearly(){

  pandYear();
  if(S.nat)return;

  if(x<.035)crisis();else if(x<.06)pandemic();else if(x<.16)pm();else if(x<.20)flood();else if(x<.26)boom();else if(x<.28)unrest()}
function panel(){

N({k:'news',t:'📰 ข่าวประเทศ',s:'เศรษฐกิจ โรคระบาด ฝุ่น น้ำท่วม',min:10,open:panel});
const au0=ageUp;
ageUp=function(){
  const a0=S&&S.age;au0();
  if(!S||!S.alive||S.age===a0)return;
  try{yearly()}catch(e){}

};
$('#ageBtn').onclick=ageUp;
})();
</script>
<script>
/* ===== ระบบใหม่ 13: ชีวิตคู่เชิงลึก (ทะเลาะ นอกใจ หย่า ค่าเลี้ยงดู เลี้ยงลูกเล็ก) ===== */
(function(){
const fm=n=>'฿'+Math.round(n).toLocaleString('en-US');
const N=o=>{o.custom='x';ACTS.splice(ACTS.length-1,0,o)};
const sp=()=>S.people.find(p=>p.alive&&p.type==='คู่สมรส');
const kids=()=>S.people.filter(p=>p.alive&&p.type==='ลูก');
const ok=c=>{if(S.money<c){toast('เงินไม่พอ');return false}mon(-c);return true};
function divorce(p,why){
  const k=kids().filter(x=>x.age<18);
  const lose=S.money>0?Math.round(S.money*(why==='cheat'?.35:.5)):0;
  if(lose>0)mon(-lose);
  p.type='อดีตคู่รัก';chg('happy',-10);S.stress=Math.min(100,(S.stress==null?20:S.stress)+10);
  add('คุณหย่ากับ '+p.name+' แบ่งสินสมรสไป '+fm(lose),'bad');
  if(k.length){const amt=Math.round(60000*W()*k.length);S.cs={amt,until:Math.max(...k.map(x=>x.age))};
    add('ศาลสั่งให้จ่ายค่าเลี้ยงดูบุตรปีละ '+fm(amt)+' จนลูกอายุครบ 18','info');S.cs.left=Math.max(...k.map(x=>18-x.age))}
  render()}
function fight(p){
  const t=Math.round(8000*W());
  ask(p.name+' ทะเลาะกับคุณเรื่องเงินและเวลาที่ให้กัน',[
    {t:'ขอโทษและคุยกันดีๆ',f:()=>{p.rel=cl(p.rel+4);chg('happy',1);add('คุณคืนดีกับ '+p.name,'good');render()}},
    {t:'พาไปปรึกษานักบำบัดคู่รัก ('+fm(t)+')',f:()=>{if(!ok(t))return;p.rel=cl(p.rel+10);S.stress=Math.max(0,(S.stress||20)-5);add('การปรึกษาช่วยให้ความสัมพันธ์ดีขึ้นมาก','good');render()}},
    {t:'เงียบใส่ ไม่คุยกัน',f:()=>{p.rel=cl(p.rel-12);chg('happy',-3);add('ความสัมพันธ์เย็นชาลง','bad');render()}}],'💢 ทะเลาะกัน')}
function cheated(p){
  ask('คุณพบว่า '+p.name+' นอกใจ!',[
    {t:'ให้อภัย และเริ่มต้นใหม่',f:()=>{p.rel=cl(p.rel-20);chg('happy',-6);add('คุณให้อภัยแต่ความไว้ใจลดลง','info');render()}},
    {t:'ฟ้องหย่า (ได้สินสมรสมากขึ้น)',f:()=>divorce(p,'cheat')}],'💔 ถูกนอกใจ')}
function yearly(){
  const p=sp();
  if(S.cs){if(S.cs.left>0){const a=Math.min(S.cs.amt,Math.max(0,S.money)+S.cs.amt);mon(-a);S.cs.left--;add('จ่ายค่าเลี้ยงดูบุตร '+fm(a),'info');if(S.cs.left<=0)S.cs=null}else S.cs=null}
  if(!p)return;
  if(p.rel<35&&Math.random()<.3)return fight(p);
  if(Math.random()<.12)return fight(p);
  if(p.rel<45&&Math.random()<.1)return cheated(p);
  if(p.rel<12&&Math.random()<.5){add(p.name+' ขอหย่า','bad');return divorce(p)}
  const baby=kids().find(k=>k.age<=2&&!(k.d&&k.d.bc===S.age));
  if(baby){baby.d=baby.d||{};baby.d.bc=S.age;const c=Math.round(80000*W());
    ask('ลูกเล็กต้องการการดูแลตลอดเวลา คุณจะทำอย่างไร?',[
      {t:'ดูแลเองกับคู่สมรส',f:()=>{S.stress=Math.min(100,(S.stress||20)+6);baby.rel=cl(baby.rel+6);p.rel=cl(p.rel-3);add('คุณเหนื่อยแต่ผูกพันกับลูกมากขึ้น','info');render()}},
      {t:'จ้างพี่เลี้ยง ('+fm(c)+')',f:()=>{if(!ok(c))return;S.stress=Math.max(0,(S.stress||20)-2);add('พี่เลี้ยงช่วยแบ่งเบาภาระ','good');render()}}],'👶 เลี้ยงลูกเล็ก')}
}
function date(){
  const p=sp();if(!p)return toast('ต้องมีคู่สมรส');
  if(S.done.date)return toast('ทำแล้วในปีนี้');const c=Math.round(30000*W());
  if(!ok(c))return;S.done.date=1;p.rel=cl(p.rel+10);chg('happy',4);add('คุณพา '+p.name+' ไปเที่ยวฉลองครบรอบ ความรักหวานขึ้น','good');render()}

<script>
/* ===== ระบบใหม่ 14: โรคตามวัย / ประกันสุขภาพหลายระดับ ===== */
(function(){
const fm=n=>'฿'+Math.round(n).toLocaleString('en-US');
const N=o=>{o.custom='x';ACTS.splice(ACTS.length-1,0,o)};
const DZ={
 dm:{i:'🍬',n:'เบาหวาน',a:40,p:.025,c:30000,h:-2,life:1},
 ht:{i:'🩸',n:'ความดันโลหิตสูง',a:40,p:.03,c:15000,h:-1,life:1},
 hd:{i:'🫀',n:'โรคหัวใจ',a:50,p:.02,c:120000,h:-4,life:1},
 ar:{i:'🦴',n:'ข้อเข่าเสื่อม',a:55,p:.035,c:20000,h:-1,life:1},
 dem:{i:'🧠',n:'สมองเสื่อม',a:70,p:.04,c:150000,h:-3,life:1},
 ca:{i:'🎗️',n:'มะเร็ง',a:40,p:.015,c:400000,h:-6,life:0},
 cat:{i:'👁️',n:'ต้อกระจก',a:60,p:.04,c:60000,h:-1,life:0}};
const TIER=[
 {n:'ไม่มีประกัน',cov:0,pr:0},
 {n:'สิทธิ์ประกันสังคม/บัตรทอง',cov:.4,pr:0},
 {n:'ประกันสุขภาพระดับเงิน',cov:.7,pr:15000},
 {n:'ประกันสุขภาพระดับทอง',cov:.9,pr:45000}];
const hi=()=>S.hi==null?(S.ss&&S.ss.y>0||S.age<18?1:0):S.hi;
const prem=t=>Math.round(TIER[t].pr*W()*(1+Math.max(0,S.age-30)/40));

    TIER.forEach((x,i)=>{if(i===t||(i===1&&!(S.ss&&S.ss.y>0)&&S.age>=18))return;const bt=el('button','big ghost','เปลี่ยนเป็น '+x.n+' · เบี้ย '+fm(prem(i))+'/ปี · คุ้มครอง '+Math.round(x.cov*100)+'%');bt.onclick=()=>{S.hi=i;toast('เปลี่ยนแผนแล้ว');render();panel()};b.appendChild(bt)});
    const ks=Object.keys(d);
    b.appendChild(el('div','pcard','<div class="pl">โรคประจำตัว</div><div class="ps">'+(ks.length?ks.map(k=>DZ[k].i+' '+DZ[k].n+' (ตั้งแต่อายุ '+d[k].since+(d[k].left?' · เหลือรักษา ~'+d[k].left+' ปี':'')+')').join('<br>'):'ยังไม่มี')+'</div>'));
    const c=Math.round(10000*W()),bt=el('button','big',(S.done.chk?'ตรวจสุขภาพแล้วในปีนี้':'ตรวจสุขภาพประจำปี '+fm(c)));
    bt.onclick=()=>{if(S.done.chk)return toast('ทำแล้วในปีนี้');if(S.money<c)return toast('เงินไม่พอ');S.done.chk=1;mon(-c);chg('health',1);toast('ตรวจสุขภาพแล้ว ความเสี่ยงโรคลดลงปีนี้');render();panel()};
    b.appendChild(bt)})}
N({k:'hlth',t:'🩺 สุขภาพ / ประกันสุขภาพ',s:'โรคตามวัย ตรวจสุขภาพ เลือกแผนประกัน',min:18,open:panel});
function yearly(){
  if(S.age<18)return;
  const d=D(),t=hi(),cov=TIER[t].cov;
  // เบี้ยประกัน
  const pr=prem(t);if(pr>0){mon(-pr);add('เบี้ยประกันสุขภาพ '+fm(pr),'info')}
  // โรคใหม่
  const lowH=Math.max(0,(100-(S.health==null?70:S.health))/100),mul=(S.done.chk?.4:1)*(S.res?.6:1)*(1+lowH*1.5);
  Object.keys(DZ).forEach(k=>{const z=DZ[k];if(d[k]||S.age<z.a||Math.random()>z.p*mul)return;
    d[k]={since:S.age,left:k==='ca'?3:k==='cat'?1:0};chg('happy',-5);S.stress=Math.min(100,(S.stress==null?20:S.stress)+8);
    add(z.i+' แพทย์วินิจฉัยว่าคุณเป็น'+z.n+'!','bad');toast(z.i+' เป็น'+z.n)});
  // ค่ารักษา
  let tot=0,untreated=[];
  Object.keys(d).forEach(k=>{const z=DZ[k],pay=Math.round(z.c*W()*(1-cov));
    if(S.money>=pay){mon(-pay);tot+=pay;chg('health',z.h+(z.life?1:0));
      if(!z.life){d[k].left--;if(d[k].left<=0){if(Math.random()<(k==='cat'?1:.7)){add(z.i+'รักษา'+z.n+'หายแล้ว','good');chg('happy',6);delete d[k]}else{d[k].left=2;add(z.n+'ยังไม่หาย ต้องรักษาต่อ','bad')}}}}
    else{untreated.push(z.n);chg('health',z.h*(k==='ca'?4:3))}});
  if(tot>0)add('ค่ารักษาพยาบาลปีนี้ '+fm(tot)+(cov?' (ประกันช่วยจ่าย '+Math.round(cov*100)+'%)':''),'info');
  if(untreated.length)add('คุณไม่มีเงินรักษา '+untreated.join(', ')+' อาการทรุดลง','bad');
}
const au0=ageUp;
ageUp=function(){
  const a0=S&&S.age;au0();
  if(!S||!S.alive||S.age===a0)return;
  try{yearly()}catch(e){}
  render();
};
$('#ageBtn').onclick=ageUp;
})();
</script>
<script>
/* ===== ระบบใหม่ 15: อาชีพเชิงลึก (เจรจาเงินเดือน ย้ายงาน สหภาพ งานเสริม หมดไฟ) ===== */
(function(){
const fm=n=>'฿'+Math.round(n).toLocaleString('en-US');
const N=o=>{o.custom='x';ACTS.splice(ACTS.length-1,0,o)};
const can=()=>{if(!S.job||S.jail>0||S.service>0){toast('ต้องมีงานประจำและไม่ได้อยู่ในเรือนจำ');return false}return true};
const once=k=>{if(S.done[k]){toast('ทำแล้วในปีนี้');return false}S.done[k]=1;return true};
function raise(f){const J=S.job;J.sal=Math.round(J.sal*f);if(J.v)J.m=(J.m||1)*f}
function negotiate(){
  if(!can()||!once('neg'))return;const J=S.job;
  const p=Math.min(.75,.15+J.perf/160+(S.union?.08:0));
  if(Math.random()<p){const f=1+(.06+Math.random()*.1);raise(f);chg('happy',5);add('💬 คุณเจรจาขอขึ้นเงินเดือนสำเร็จ เป็น '+fm(J.sal)+'/ปี','good')}
  else{J.perf=Math.max(0,J.perf-6);chg('happy',-3);add('💬 เจ้านายปฏิเสธการขึ้นเงินเดือน และมองว่าคุณเรียกร้องเกินไป','bad');
    if(Math.random()<.08&&J.perf<40){S.job=null;add('คุณถูกไล่ออกหลังเจรจาไม่สำเร็จ','bad')}}render()}
function hop(){
  if(!can()||!once('hop'))return;const J=S.job;
  const f=1.05+Math.random()*.2,risk=Math.random()<.25;
  ask('บริษัทอื่นเสนองานแบบเดียวกันให้คุณ เงินเดือน '+fm(J.sal*f)+'/ปี ('+(f>1.15?'สูงกว่ามาก':'สูงกว่าเล็กน้อย')+') จะย้ายหรือไม่?',[
    {t:'ย้ายงาน',f:()=>{if(!S.job)return;raise(f);S.job.years=0;S.job.perf=Math.min(100,S.job.perf+(risk?-10:5));chg('happy',risk?-2:4);S.union=false;add(risk?'🔄 ย้ายงานใหม่ เงินเดือนดีขึ้นแต่ที่ทำงานไม่ค่อยเป็นมิตร':'🔄 ย้ายงานใหม่ เงินเดือนดีขึ้นและทีมดี','info');render()}},
    {t:'อยู่ที่เดิม',f:()=>{S.job&&(S.job.perf=Math.min(100,S.job.perf+2));add('คุณเลือกอยู่บริษัทเดิม','info');render()}}],'🔄 ข้อเสนอจากบริษัทอื่น')}
function union(){
  if(!can())return;
  if(S.union){S.union=false;add('คุณลาออกจากสหภาพแรงงาน','info');return toast('ออกจากสหภาพแล้ว')}
  S.union=true;toast('เข้าร่วมสหภาพแล้ว (ค่าสมาชิก 1% ของเงินเดือน/ปี)');add('✊ คุณเข้าร่วมสหภาพแรงงาน','info')}
function side(){
  if(!can()||!once('side'))return;
  const g=Math.round(S.job.sal*(.08+Math.random()*.15));mon(g);S.stress=Math.min(100,(S.stress==null?20:S.stress)+10);chg('health',-1);
  add('🛠️ คุณรับงานเสริมนอกเวลา ได้เงิน '+fm(g)+' แต่เหนื่อยมาก','info');render()}
N({k:'neg',t:'💬 เจรจาขอขึ้นเงินเดือน',s:'เสี่ยงถูกปฏิเสธ ปีละครั้ง',min:18,open:negotiate});
N({k:'hop',t:'🔄 หาข้อเสนองานใหม่',s:'ย้ายงานเพื่อเงินเดือนที่ดีกว่า',min:20,open:hop});
N({k:'union',t:'✊ สหภาพแรงงาน',s:'เข้า/ออก เพิ่มอำนาจต่อรอง',min:18,open:union});
N({k:'side',t:'🛠️ งานเสริมนอกเวลา',s:'ได้เงินเพิ่ม แต่เครียด',min:18,open:side});
function yearly(){
  if(!S.job||S.jail>0||S.service>0)return;const J=S.job;
  if(S.union){const d=Math.round(J.sal*.01);mon(-d);raise(1.01);
    if(Math.random()<.1){const a=Math.random()<.5;if(a){raise(1.05);add('✊ สหภาพต่อรองสำเร็จ ทุกคนได้ขึ้นเงินเดือน 5%','good')}else{mon(-Math.round(J.sal*.1));add('✊ การนัดหยุดงานของสหภาพทำให้คุณขาดรายได้','bad')}}}
  if((S.stress||0)>=85&&Math.random()<.35){
    ask('คุณเครียดสะสมจนหมดไฟ (Burnout) จะทำอย่างไร?',[
      {t:'ลาพักยาว (เสียเงินเดือน 25%)',f:()=>{if(!S.job)return;mon(-Math.round(S.job.sal*.25));S.stress=30;chg('health',3);chg('happy',6);add('😮‍💨 คุณลาพักจนหายหมดไฟ','good');render()}},
      {t:'ฝืนทำต่อ',f:()=>{if(!S.job)return;S.job.perf=Math.max(0,S.job.perf-18);chg('health',-5);chg('happy',-6);add('คุณฝืนทำงานทั้งที่หมดไฟ ผลงานตกฮวบ','bad');render()}}],'😮‍💨 หมดไฟ')}
  else if(Math.random()<.12){const good=J.perf>=60;
    if(good){const b=Math.round(J.sal*.15);mon(b);add('⭐ ผลประเมินดีเยี่ยม ได้โบนัส '+fm(b),'good')}
    else{chg('happy',-3);add('⚠️ ผลประเมินต่ำกว่าเกณฑ์ ถูกเตือนให้ปรับปรุง','bad')}}
}
const au0=ageUp;
ageUp=function(){
  const a0=S&&S.age;au0();
  if(!S||!S.alive||S.age===a0)return;
  try{yearly()}catch(e){}
  render();
};
$('#ageBtn').onclick=ageUp;
})();

<script>
/* ===== ระบบใหม่ 16: ท่องเที่ยวต่างประเทศ / วีซ่า / ถิ่นที่อยู่ ===== */
(function(){
const fm=n=>'฿'+Math.round(n).toLocaleString('en-US');
const N=o=>{o.custom='x';ACTS.splice(ACTS.length-1,0,o)};

      if(k===S.country)return;const C=COUNTRIES[k],c=Math.round(70000*W()*Math.max(.6,C.c/3+.5));

function vpanel(){

    else if(v.y>=10){const cf=Math.round(250000*W());
      b.appendChild(row('ยื่นขอสัญชาติ','อยู่ครบ 10 ปี · ค่าธรรมเนียม '+fm(cf),S.money>=cf&&!S.done.cit?()=>{S.done.cit=1;mon(-cf);if(Math.random()<.65){v.t='cit';add('🎉 คุณได้รับสัญชาติ '+S.country,'good');chg('happy',15)}else{add('คำขอสัญชาติถูกปฏิเสธ','bad')}vpanel()}:null))}

N({k:'visa',t:'🛂 วีซ่า / ถิ่นที่อยู่',s:'ต่ออายุ ขอ PR และสัญชาติเมื่ออยู่ต่างประเทศ',min:18,open:vpanel});
function yearly(){

<script>
/* ===== ระบบใหม่ 20: การศึกษาเชิงลึก (ติวพิเศษ เกรดเฉลี่ย ฝึกงาน แลกเปลี่ยน ปริญญาเอก) ===== */
(function(){
const fm=n=>'฿'+Math.round(n).toLocaleString('en-US');
const N=o=>{o.custom='x';ACTS.splice(ACTS.length-1,0,o)};
const ok=c=>{if(S.money<c){toast('เงินไม่พอ');return false}mon(-c);return true};
const once=k=>{if(S.done[k]){toast('ทำแล้วในปีนี้');return false}S.done[k]=1;return true};
const inUni=()=>S.uni>0;
function tutor(){
  if(!inSchool()||S.age<6)return toast('ใช้ได้ตอนอยู่ในวัยเรียน');
  const c=Math.round(25000*W());
  if(!once('tutor')||!ok(c))return;
  S.smarts=Math.min(100,(S.smarts||0)+2);if(S.grade!=null)S.grade=Math.min(100,S.grade+6);
  S.gpaB=(S.gpaB||0)+.15;chg('happy',-1);add('📚 คุณเรียนพิเศษเพิ่ม ความฉลาดและเกรดดีขึ้น','good');render()}
function intern(){
  if(!inUni())return toast('ใช้ได้ตอนเรียนมหาวิทยาลัย');
  if(!once('intern'))return;
  const g=Math.round(30000*W());mon(g);S.intern=(S.intern||0)+1;S.stress=Math.min(100,(S.stress==null?20:S.stress)+3);S.smarts=Math.min(100,(S.smarts||0)+1);
  add('🏢 คุณไปฝึกงานช่วงปิดเทอม ได้ค่าตอบแทน '+fm(g)+' และประสบการณ์ (ฝึกงานแล้ว '+S.intern+' ครั้ง)','good');render()}
function exch(){
  if(!inUni())return toast('ใช้ได้ตอนเรียนมหาวิทยาลัย');
  if(S.flags.exch)return toast('คุณเคยไปแลกเปลี่ยนแล้ว');
  const c=Math.round(300000*W());if(!ok(c))return;
  S.flags.exch=1;S.smarts=Math.min(100,(S.smarts||0)+3);chg('happy',6);
  S.lang=S.lang||[];const l=['อังกฤษ','ญี่ปุ่น','เกาหลี','จีน'].filter(x=>!S.lang.includes(x));if(l.length){const x=l[(Math.random()*l.length)|0];S.lang.push(x);add('🌏 คุณไปเรียนแลกเปลี่ยนต่างประเทศ และพูด'+x+'ได้','good')}else add('🌏 คุณไปเรียนแลกเปลี่ยนต่างประเทศ','good');render()}
function phd(){
  if(!S.flags.masters)return toast('ต้องจบปริญญาโทก่อน');
  if(S.flags.phd)return toast('คุณจบปริญญาเอกแล้ว');
  if(S.phd)return toast('กำลังเรียนปริญญาเอก เหลืออีก '+S.phd+' ปี');
  const c=Math.round(200000*W());if(!ok(c))return;
  S.phd=3;add('🧪 คุณเริ่มเรียนปริญญาเอก (3 ปี)','info');render()}
N({k:'tutor',t:'📚 เรียนพิเศษ/ติวเข้ม',s:'เพิ่มความฉลาดและเกรด ปีละครั้ง',min:6,open:tutor});
N({k:'intern',t:'🏢 ฝึกงานช่วงปิดเทอม',s:'สำหรับนักศึกษา ได้เงินและโอกาสได้งานหลังจบ',min:18,open:intern});
N({k:'exch',t:'🌏 แลกเปลี่ยนต่างประเทศ',s:'สำหรับนักศึกษา ได้ภาษาและประสบการณ์',min:18,open:exch});
N({k:'phd',t:'🧪 เรียนปริญญาเอก',s:'ใช้เวลา 3 ปี ต้องจบปริญญาโทก่อน',min:24,open:phd});
function yearly(wasUni){
  if(inUni()||wasUni){
    const sm=S.smarts||50,g=Math.max(1,Math.min(4,1+sm/40+(S.gpaB||0)+(Math.random()-.5)*.8-(S.stress>80?.3:0)));
    S.gpa=S.gpa||[];S.gpa.push(g);add('🎓 เกรดเฉลี่ยปีนี้ '+g.toFixed(2),g>=3.5?'good':'info')}
  if(wasUni&&!inUni()&&S.edu>=4&&S.gpa&&S.gpa.length){
    const avg=S.gpa.reduce((a,b)=>a+b,0)/S.gpa.length;S.finalGpa=avg;
    const hon=avg>=3.6?'เกียรตินิยมอันดับ 1':avg>=3.25?'เกียรตินิยมอันดับ 2':'';
    add('🎓 เกรดเฉลี่ยสะสมตอนจบ '+avg.toFixed(2)+(hon?' ('+hon+')':''),'good');if(hon){chg('happy',6);S.smarts=Math.min(100,(S.smarts||0)+1)}
    if(!S.job&&(S.intern>0||avg>=3.5)){
      const ps=JOBS.filter(j=>!j.v&&j.edu>=3&&j.edu<=4&&(j.sm||0)>=30&&(!j.maj||!S.major||j.maj===S.major)&&(j.sm||0)<=(S.smarts||0)+10&&j.s[0]>0);
      if(ps.length){const J=ps[(Math.random()*ps.length)|0];
        S.job={n:J.n,v:J.v,lvl:0,perf:60+(S.intern>0?8:0),years:0,sal:Math.round((J.s[0]+(J.s[1]-J.s[0])*(hon?.35:.15))*W())};
        add('💼 บริษัทที่คุณเคยฝึกงาน/เกรดดี เสนองานตำแหน่ง '+J.n+' ให้ทันทีหลังจบ','good');chg('happy',5)}}
    S.gpa=[];S.intern=0;S.gpaB=0}
  if(S.phd){S.phd--;S.stress=Math.min(100,(S.stress==null?20:S.stress)+4);
    if(S.phd<=0){S.phd=0;S.flags.phd=1;S.smarts=Math.min(100,(S.smarts||0)+10);if(S.job)S.job.sal=Math.round(S.job.sal*1.2);if(S.job&&S.job.v)S.job.m=(S.job.m||1)*1.2;chg('happy',10);add('🧪 คุณจบปริญญาเอก! ได้เป็น "ดอกเตอร์"','good');toast('🧪 จบปริญญาเอก')}
    else add('🧪 กำลังเรียนปริญญาเอก (เหลืออีก '+S.phd+' ปี)','info')}
}
const au0=ageUp;
ageUp=function(){
  const a0=S&&S.age,wu=S&&S.uni>0;au0();
  if(!S||!S.alive||S.age===a0)return;
  try{yearly(wu)}catch(e){}
  render();
};
$('#ageBtn').onclick=ageUp;
})();
</script>
<script>
/* ===== ระบบใหม่ 21: งานอดิเรกเพิ่ม + ต่อยอดเป็นรายได้/การแข่งขัน ===== */
(function(){
const fm=n=>'฿'+Math.round(n).toLocaleString('en-US');
const N=o=>{o.custom='x';ACTS.splice(ACTS.length-1,0,o)};
const H=[['music','🎸','ดนตรี'],['art','🎨','วาดรูป'],['cook','🍳','ทำอาหาร'],['sport','⚽','กีฬา'],['game','🎮','เล่นเกม'],['write','✍️','เขียนหนังสือ'],['photo','📷','ถ่ายภาพ']];
const NEWK=['game','write','photo'];
const SIDE={music:'รับเล่นดนตรีตามงาน',art:'ขายภาพวาด',cook:'ขายอาหาร',sport:'สอนกีฬา',game:'สตรีมเกม/รับจ้างเล่น',write:'ขายงานเขียน',photo:'รับถ่ายภาพ'};
const lv=k=>(S.sk&&S.sk[k])||0;
function panel(){
  S.sk=S.sk||{};S.side=S.side||{};
  sheet('🎮 งานอดิเรกและการต่อยอด',b=>{
    b.appendChild(el('div','note','ฝึกถึงระดับ 3 ขึ้นไปจึงเปิดรายได้เสริมได้ · ระดับ 5 มีโอกาสลงแข่งขันชิงรางวัล (งานอดิเรก ดนตรี/วาดรูป/ทำอาหาร/กีฬา ฝึกได้ในเมนู "ฝึกงานอดิเรก")'));
    const c=Math.round(6000*W());
    H.forEach(h=>{const k=h[0],l=lv(k);
      if(NEWK.includes(k))b.appendChild(row(h[1]+' '+h[2],'ระดับ '+l+'/5 · ฝึก '+fm(c)+(S.done['h'+k]?' · ฝึกแล้วปีนี้':''),(l<5&&S.money>=c&&!S.done['h'+k])?()=>{S.done['h'+k]=1;mon(-c);S.sk[k]=l+1;chg('happy',R(2,5));add('คุณฝึก'+h[2]+'จนเก่งขึ้น (ระดับ '+(l+1)+')','good');panel()}:null));
      if(l>=3)b.appendChild(row('💵 '+h[2]+': '+SIDE[k],S.side[k]?'เปิดอยู่ · แตะเพื่อปิด':'แตะเพื่อเปิดรายได้เสริม (เหนื่อยขึ้นเล็กน้อย)',()=>{S.side[k]=!S.side[k];panel()}))})})}
N({k:'hobby2',t:'🎮 งานอดิเรกต่อยอด',s:'เกม เขียน ถ่ายภาพ และรายได้เสริม',min:8,open:panel});
function comp(k,h){
  const fee=Math.round(5000*W()),pz=Math.round(150000*W()*(1+Math.random()));
  ask('มีการแข่งขัน'+h[2]+'ระดับประเทศ คุณมีฝีมือระดับสูงสุด จะลงแข่งหรือไม่? (ค่าสมัคร '+fm(fee)+')',[
    {t:'ลงแข่ง',f:()=>{if(S.money<fee)return;mon(-fee);
      if(Math.random()<.35+(S.smarts||0)/250){mon(pz);S.fame=Math.min(100,(S.fame||0)+5);S.fans=(S.fans||0)+R(1000,20000);chg('happy',10);add('🏆 คุณชนะการแข่งขัน'+h[2]+' ได้รางวัล '+fm(pz)+' และมีชื่อเสียงขึ้น','good');toast('🏆 ชนะการแข่งขัน!')}
      else{chg('happy',-2);add('คุณแพ้การแข่งขัน'+h[2]+' แต่ได้ประสบการณ์','info')}render()}},
    {t:'ไม่ลง',f:()=>{}}],'🏆 การแข่งขัน')}
function yearly(){
  if(!S.side)return;
  H.forEach(h=>{const k=h[0];if(!S.side[k])return;
    const l=lv(k);if(l<3||S.jail>0){return}
    const g=Math.round(l*9000*W()*(.5+Math.random()));mon(g);S.stress=Math.min(100,(S.stress==null?20:S.stress)+1);
    add(h[1]+' รายได้เสริมจาก'+h[2]+' '+fm(g),'good');
    if(k==='game'&&l>=4)S.fans=(S.fans||0)+R(100,2000)});
  const top=H.filter(h=>lv(h[0])>=5);
  if(top.length&&Math.random()<.18)comp(0,top[(Math.random()*top.length)|0])}
const au0=ageUp;
ageUp=function(){
  const a0=S&&S.age;au0();
  if(!S||!S.alive||S.age===a0)return;
  try{yearly()}catch(e){}
  render();
};
$('#ageBtn').onclick=ageUp;
})();
</script>
<script>

  ping();setInterval(ping,30000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)ping()});

  /* ปุ่มโทรศัพท์/คอมพิวเตอร์: แสดงเมื่อมีของในกระเป๋าเท่านั้น (กระเป๋าแสดงเสมอ) */
  function tools(){
    var t=document.getElementById('tools');if(!t)return;
    var has=!!S,inv=(S&&S.inv)||{};
    var ph=t.querySelector('[data-t="phone"]'),pc=t.querySelector('[data-t="pc"]');
    if(ph)ph.hidden=!(has&&inv.phone);if(pc)pc.hidden=!(has&&inv.laptop);
    t.style.display=has?'':'none';
  }
  var r0=render;render=function(){r0.apply(this,arguments);tools()};
  tools();setInterval(tools,1000); /* กันพลาดกรณีของเปลี่ยนโดยไม่ผ่าน render */

  var sd=showDeath;
  showDeath=function(){
    sd.apply(this,arguments);
    try{
      if(!S||S.cheat||S.world==='ninja')return; /* โหมดโกง/แอดมิน/โลกนินจาไม่นับสถิติ (แยกจากโลกเดิม) */
      var sig=S.name+'|'+S.age+'|'+S.cause;
      if(localStorage.getItem('lk_rep')===sig)return; /* ชีวิตเดิมที่รายงานแล้ว (เช่น โหลดหน้าใหม่) */
      localStorage.setItem('lk_rep',sig);
      post('end',{name:S.name,age:S.age,cause:S.cause,worth:netWorth(),job:S.job?S.job.n:(S.retired?'เกษียณ':''),country:S.country,kids:S.people.filter(function(p){return p.type==='ลูก'}).length});
    }catch(e){}
  };
})();
</script>
<script>
/* ===== ทำเนียบผู้เล่น + เพื่อนจริง (เห็นกันได้แม้ออฟไลน์) + โหมดเวลา 6 เดือน ===== */
(function(){
  var ov=document.getElementById('lkc'),cl=document.getElementById('cL'),cf=document.getElementById('cF');
  if(!ov||!cl)return;
  var cid='';try{cid=localStorage.getItem('lk_cid')||''}catch(e){}
  function api(path,body){body.cid=cid;return fetch('/api/likhit/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()}).catch(function(){return null})}
  window.__lkProf=function(){
    if(!S)return null;
    return {name:S.name,tt:(window.nTitleSel?window.nTitleSel():''),age:S.age,alive:!!S.alive,g:S.g,job:S.job?S.job.n:(S.retired?'เกษียณ':''),country:S.country,ap:S.ap,fame:S.fame|0,fans:S.fans|0,worth:netWorth()}
  };

  /* แท็บ แชท / ผู้เล่น */
  var css=document.createElement('style');
  css.textContent='#lkc .tb{display:flex;gap:6px;padding:8px 12px 0}#lkc .tb button{flex:1;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font:600 13px inherit;cursor:pointer}#lkc .tb button.on{background:var(--head);color:var(--on-head);border-color:var(--head)}'
   +'#pL{flex:1;overflow-y:auto;padding:10px 12px;display:none;flex-direction:column;gap:8px}#lkc.pt #pL{display:flex}#lkc.pt #cL,#lkc.pt #cF{display:none}'
   +'#pL .pr{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}#pL .pr .av{width:46px;height:46px;flex:none;border-radius:50%;overflow:hidden}#pL .pr .av svg{width:100%;height:100%;display:block}'
   +'#pL .pr .if{flex:1;min-width:0}#pL .pr b{display:block;font-size:14px;overflow-wrap:anywhere}#pL .pr small{display:block;color:var(--mute);font-size:12px}#pL .pr .dt{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:#9aa3b5}#pL .pr .dt.on{background:#3ddc84}'
   +'#pL .pr button{flex:none;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:600 12.5px inherit;cursor:pointer}#pL .pr button.fr{background:var(--head);color:var(--on-head);border-color:var(--head)}#pL .em{margin:auto;color:var(--mute);font-size:13px;text-align:center}'
   +'#hfBtn{flex:none}#hfBtn.on{background:var(--head);color:var(--on-head)}';
  document.head.appendChild(css);
  var tb=document.createElement('div');tb.className='tb';tb.innerHTML='<button type="button" class="on" id="tbC">💬 แชท</button><button type="button" id="tbP">👥 ผู้เล่น</button>';
  cl.parentNode.insertBefore(tb,cl);
  var pL=document.createElement('div');pL.id='pL';cl.after(pL);
  var tm=0;
  function tab(p){
    ov.classList.toggle('pt',p);document.getElementById('tbC').classList.toggle('on',!p);document.getElementById('tbP').classList.toggle('on',p);
    clearInterval(tm);if(p){loadP();tm=setInterval(function(){if(!document.hidden)loadP()},10000)}
  }
  document.getElementById('tbC').onclick=function(){tab(false)};
  document.getElementById('tbP').onclick=function(){tab(true)};
  var obs=new MutationObserver(function(){if(!ov.classList.contains('open')&&ov.classList.contains('pt')){clearInterval(tm);tm=0;ov.classList.remove('pt');document.getElementById('tbC').classList.add('on');document.getElementById('tbP').classList.remove('on')}});
  obs.observe(ov,{attributes:true,attributeFilter:['class']});

  function ago(t){var m=Math.round((Date.now()-t)/60000);return m<1?'เมื่อกี้':m<60?m+' นาทีที่แล้ว':m<1440?Math.floor(m/60)+' ชม.ที่แล้ว':Math.floor(m/1440)+' วันที่แล้ว'}
  function loadP(){
    fetch('/api/likhit/players?cid='+encodeURIComponent(cid),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){paintP(j.players||[])}).catch(function(){if(!pL.children.length)pL.innerHTML='<div class="em">โหลดรายชื่อไม่ได้</div>'});
  }
  function paintP(list){
    pL.innerHTML='';
    if(!list.length){pL.innerHTML='<div class="em">ยังไม่มีผู้เล่นคนอื่นในทำเนียบ<br>ชวนเพื่อนมาเล่นลิขิตชีวิตสิ 🎲</div>';return}
    list.forEach(function(p){
      var d=document.createElement('div');d.className='pr';
      var av=document.createElement('div');av.className='av';try{av.innerHTML=avatar(p.ap,{g:p.g,age:p.age,happy:60,dead:!p.alive})}catch(e){}
      var inf=document.createElement('div');inf.className='if';
      var b=document.createElement('b');b.textContent=p.name+(p.tt?' “'+p.tt+'”':'')+(p.friend?' 💚':'');
      var s1=document.createElement('small');s1.textContent=(p.alive?'อายุ '+p.age+' ปี':'เสียชีวิตแล้ว ('+p.age+' ปี)')+(p.job?' · '+p.job:'')+(p.country?' · '+p.country:'');
      var s2=document.createElement('small');var dt=document.createElement('span');dt.className='dt'+(p.online?' on':'');s2.appendChild(dt);s2.appendChild(document.createTextNode(p.online?'ออนไลน์':'ออฟไลน์ · '+ago(p.t)));
      inf.appendChild(b);inf.appendChild(s1);inf.appendChild(s2);
      var bt=document.createElement('button');bt.type='button';bt.className=p.friend?'':'fr';bt.textContent=p.friend?'เลิกเป็นเพื่อน':'➕ เป็นเพื่อน';
      bt.onclick=function(){bt.disabled=true;api('friend',{to:p.u,op:p.friend?'del':'add'}).then(function(j){
        if(j&&j.ok){toast(p.friend?'เลิกเป็นเพื่อนแล้ว':'เป็นเพื่อนกับ '+p.name+' แล้ว');syncF(true);loadP()}
        else{bt.disabled=false;toast(j&&j.err==='full'?'รายชื่อเพื่อนเต็ม':'ทำไม่สำเร็จ')}})};
      d.appendChild(av);d.appendChild(inf);d.appendChild(bt);pL.appendChild(d);
    });
  }

  /* ซิงก์เพื่อนจริงเข้า "ความสัมพันธ์" ของตัวละคร — เห็นกันได้แม้อีกฝ่ายออฟไลน์ (ใช้ข้อมูลล่าสุดที่เซิร์ฟเวอร์เก็บ) */
  function syncF(now){
    if(!S||!S.alive&&0)return;
    fetch('/api/likhit/friends?cid='+encodeURIComponent(cid),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
      if(!S)return;var fl=j.friends||[],ids={};
      fl.forEach(function(f){
        ids[f.u]=1;
        var p=S.people.find(function(x){return x.pl===f.u});
        if(!p){S.people.push({id:uid(),type:'เพื่อน',g:f.g,name:f.name,age:f.age,rel:60,alive:f.alive,d:{},ap:f.ap&&Object.keys(f.ap).length?f.ap:mkAp(f.g),pl:f.u});add('คุณได้เป็นเพื่อนกับผู้เล่นจริง '+f.name+' 🌐','good')}
        else{p.name=f.name;p.age=f.age;p.g=f.g;if(f.ap&&Object.keys(f.ap).length)p.ap=f.ap;
          if(p.alive&&!f.alive){p.alive=false;add('เพื่อนของคุณ '+f.name+' เสียชีวิตแล้ว (อายุ '+f.age+' ปี)','bad');chg('happy',-8)}
          else if(!p.alive&&f.alive)p.alive=true}
      });
      /* เพื่อนที่ถูกลบฝั่งเซิร์ฟเวอร์ (เลิกเป็นเพื่อน) */
      var before=S.people.length;S.people=S.people.filter(function(x){return !x.pl||ids[x.pl]});
      if(now||before!==S.people.length)render();
    }).catch(function(){});
  }
  setTimeout(function(){syncF(false)},2500);setInterval(function(){if(!document.hidden)syncF(false)},60000);

  /* ===== โหมดเวลา 6 เดือน (ตั้งได้) =====
     เปิดแล้วกดปุ่มอายุครั้งแรก = ผ่านไปครึ่งปี (กิจกรรมประจำปีกลับมาใช้ได้อีกรอบ + เหตุการณ์สุ่ม)
     กดครั้งที่สอง = ครบปี คิดรายได้/รายจ่าย/อายุตามเดิม */
  var half=false;try{half=localStorage.getItem('lk_half')==='1'}catch(e){}
  var ab=document.getElementById('ageBtn'),au=ageUp;
  function abLabel(){ab.innerHTML=half?(S&&S.half?'<b>＋</b>ครบปี':'<b>½</b>6 เดือน'):'<b>＋</b>อายุ'}
  ageUp=function(){
    if(!S||!S.alive||showing||queue.length)return au();
    if(!half){S.half=0;return au()}
    if(!S.half){
      S.half=1;S.done={};
      chg('happy',R(-2,3));chg('health',R(-1,1));
      add('ผ่านไปครึ่งปี (6 เดือน) ชีวิตดำเนินต่อไป','info');
      try{if(S.jail===0&&chance(50))randomEvent()}catch(e){}
      abLabel();render();try{save()}catch(e){}
      return}
    S.half=0;au();abLabel();
  };
  ab.onclick=ageUp;
  var hb=document.createElement('button');hb.id='hfBtn';hb.type='button';
  function hbPaint(){hb.className=half?'on':'';hb.textContent='⏱️ 6 เดือน: '+(half?'เปิด':'ปิด')}
  hbPaint();abLabel();
  hb.addEventListener('click',function(e){e.stopPropagation();half=!half;try{localStorage.setItem('lk_half',half?'1':'0')}catch(x){}hbPaint();abLabel();toast(half?'เปิดโหมด 6 เดือน: กดอายุ 2 ครั้ง = 1 ปี':'ปิดโหมด 6 เดือนแล้ว')});
  var tl=document.getElementById('tools');if(tl)tl.appendChild(hb);
  var ag=document.getElementById('ag');
  new MutationObserver(function(){if(S&&S.half&&half&&ag.textContent.indexOf('เดือน')<0)ag.textContent=ag.textContent.replace(/(อายุ \d+ ปี)/,'$1 6 เดือน')}).observe(ag,{childList:true,characterData:true,subtree:true});
})();
</script>
<script>
/* ===== ภารกิจรายวัน: 3 ข้อ/วัน (เวลาเครื่องผู้เล่น) รางวัลเงิน + โบนัสต่อเนื่อง เก็บแยกจากเซฟชีวิต ===== */
(function(){
  var DK='lk_dq',st=null,track=null;
  var POOL=[
    {id:'yrs',ic:'⏳',t:'ใช้ชีวิตให้ผ่านไป 4 ปี',tg:function(){return 4},rw:8000},
    {id:'acts',ic:'🎯',t:'ทำกิจกรรมให้ครบ 3 อย่างในปีเดียว',tg:function(){return 3},rw:6000},
    {id:'ach',ic:'🏆',t:'ปลดล็อกความสำเร็จใหม่ 1 อย่าง',tg:function(){return 1},rw:10000},
    {id:'worth',ic:'💰',t:'เพิ่มทรัพย์สินสุทธิ',tg:function(){return Math.max(1000,Math.round(30000*wf()/1000)*1000)},rw:12000,money:1},
    {id:'happy',ic:'😊',t:'ทำให้ความสุขถึง 90',tg:function(){return 90},rw:5000},
    {id:'smarts',ic:'🧠',t:'เพิ่มความฉลาดสะสม 3 แต้ม',tg:function(){return 3},rw:6000},
    {id:'board',ic:'📊',t:'เปิดดูตารางอันดับผู้เล่น',tg:function(){return 1},rw:3000}
  ];
  function wf(){var w=1;try{w=+W()}catch(e){}return(w>0&&isFinite(w))?w:1}
  function dayStr(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
  function load(){try{var v=JSON.parse(localStorage.getItem(DK));if(v&&typeof v==='object')return v}catch(e){}return{streak:0,last:''}}
  function put(){try{localStorage.setItem(DK,JSON.stringify(st))}catch(e){}}
  function rng(seed){var a=0;for(var i=0;i<seed.length;i++)a=(a*31+seed.charCodeAt(i))|0;return function(){a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
  function def(id){for(var i=0;i<POOL.length;i++)if(POOL[i].id===id)return POOL[i];return null}
  function ensure(){
    if(!S)return false;
    if(!st)st=load();
    var d=dayStr();
    if(st.day!==d||!st.q){
      var r=rng(d+(st.seed||'')),ids=POOL.map(function(p){return p.id}),pk=[];
      while(pk.length<3){pk.push(ids.splice(Math.floor(r()*ids.length),1)[0])}
      st.day=d;st.q=pk.map(function(id){return{id:id,tg:def(id).tg(),p:0,done:0,cl:0}});st.bonus=0;put();
    }
    return true;
  }
  function lifeId(){return S.name+'|'+(S.ap?S.ap.skin+S.ap.hair:'')}
  function Q(id){if(!st||!st.q)return null;for(var i=0;i<st.q.length;i++)if(st.q[i].id===id)return st.q[i];return null}
  function setP(q,v){if(!q||q.done)return;if(v>q.p)q.p=v;if(q.p>=q.tg){q.p=q.tg;q.done=1;try{toast('📅 ภารกิจสำเร็จ: '+def(q.id).t.replace(/^\S+\s/,'')+' · รับรางวัลที่เมนูโปรไฟล์')}catch(e){}}}
  function tick(){
    try{
      if(!S||!S.alive||!ensure())return;
      var id=lifeId(),ach=(S.ach||[]).length,wo=netWorth();
      if(!track||track.id!==id){track={id:id,age:S.age,ach:ach,sm:S.smarts||0,wo:wo};return}
      var before=JSON.stringify(st.q),d;
      d=S.age-track.age;if(d>0){var q1=Q('yrs');if(q1&&!q1.done)setP(q1,q1.p+Math.min(d,2))}track.age=S.age;
      d=ach-track.ach;if(d>0){var q2=Q('ach');if(q2&&!q2.done)setP(q2,q2.p+d)}track.ach=ach;
      d=(S.smarts||0)-track.sm;if(d>0){var q3=Q('smarts');if(q3&&!q3.done)setP(q3,q3.p+d)}track.sm=S.smarts||0;
      var q4=Q('acts');if(q4)setP(q4,Object.keys(S.done||{}).length);
      var q5=Q('happy');if(q5)setP(q5,S.happy|0);
      var q6=Q('worth');if(q6)setP(q6,Math.round(wo-track.wo));
      if(JSON.stringify(st.q)!==before)put();
    }catch(e){}
  }
  window.dqHit=function(k){try{if(!ensure())return;var q=Q(k);if(q&&!q.done){setP(q,1);put()}}catch(e){}};
  window.dqRight=function(){try{if(!ensure())return'';var n=0;st.q.forEach(function(q){if(q.cl)n++});var rdy=st.q.filter(function(q){return q.done&&!q.cl}).length;return(rdy?'🎁 ':'')+n+'/3'}catch(e){return''}};
  function reward(q){return Math.round(def(q.id).rw*wf()/100)*100}
  function bonusAmt(){return Math.round(10000*wf()*(1+0.25*Math.min(Math.max((st.streak||1)-1,0),6))/100)*100}
  function claim(q){
    if(!S||!S.alive)return toast('ต้องมีชีวิตที่ยังเล่นอยู่ถึงจะรับรางวัลได้');
    if(!q.done||q.cl)return;
    q.cl=1;var amt=reward(q);mon(amt);chg('happy',2);
    try{add('📅 ภารกิจรายวันสำเร็จ: ได้รับเงินรางวัล '+fmt(amt),'good')}catch(e){}
    var today=dayStr();
    if(st.last!==today){var y=dayStr(new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()-1));st.streak=(st.last===y)?(st.streak||0)+1:1;st.last=today}
    var all=st.q.every(function(x){return x.cl});
    if(all&&!st.bonus){st.bonus=1;var b=bonusAmt();mon(b);chg('happy',4);try{add('🎉 ทำภารกิจรายวันครบ 3 ข้อ! โบนัส '+fmt(b)+' (ต่อเนื่อง '+st.streak+' วัน)','good')}catch(e){}toast('🎉 ครบ 3 ข้อ! โบนัส '+fmt(b))}
    else toast('🎁 ได้รับ '+fmt(amt));
    put();save();render();window.panelDaily();
  }
  window.panelDaily=function(){
    if(!S)return;
    ensure();
    sheet('📅 ภารกิจรายวัน',function(b){
      b.appendChild(el('div','sum','<div>ทำต่อเนื่อง<b>'+(st.streak|0)+' วัน</b></div><div>วันนี้สำเร็จ<b>'+st.q.filter(function(q){return q.cl}).length+'/3</b></div>'));
      b.appendChild(el('div','sec','ภารกิจวันนี้'));
      st.q.forEach(function(q){
        var D=def(q.id),pr=q.tg?Math.min(100,Math.round(q.p/q.tg*100)):0;
        var txt=q.id==='worth'?(D.t+' '+fmt(q.tg)):D.t;
        var prog=q.id==='worth'?(fmt(q.p)+' / '+fmt(q.tg)):(Math.floor(q.p)+' / '+q.tg);
        var c=el('div','ach','<span style="font-size:22px">'+(q.cl?'✅':D.ic)+'</span><div style="min-width:0;flex:1"><b>'+txt+'</b><div style="font-size:12.5px;color:var(--mute)">'+prog+' · รางวัล '+fmt(reward(q))+'</div>'+bar(pr,'smart')+'</div>');
        if(q.done&&!q.cl){var x=el('button','','รับ');x.style.cssText='padding:8px 12px;border-radius:10px;border:0;background:var(--pop);color:var(--on-pop);font:inherit;font-weight:600;cursor:pointer';x.onclick=function(){claim(q)};c.appendChild(x)}
        b.appendChild(c);
      });
      b.appendChild(el('div','note','โบนัสเมื่อทำครบ 3 ข้อ: '+fmt(bonusAmt())+(st.bonus?' (รับแล้ว)':'')+' · ยิ่งทำต่อเนื่องหลายวัน โบนัสยิ่งเพิ่ม (สูงสุด 7 วัน)'));
      b.appendChild(el('div','note','ภารกิจรีเซ็ตทุกเที่ยงคืนตามเวลาเครื่องคุณ ความคืบหน้านับเฉพาะตอนเล่นชีวิตที่ยังมีชีวิตอยู่'));
    });
  };
  window.dqAdmin={
    info:function(){try{if(!ensure())return null;return{day:st.day,streak:st.streak|0,bonus:st.bonus,q:st.q.map(function(q){return{id:q.id,t:def(q.id).t,p:q.p,tg:q.tg,done:q.done,cl:q.cl}})}}catch(e){return null}},
    complete:function(){if(!ensure())return false;st.q.forEach(function(q){q.p=q.tg;q.done=1});put();return true},
    reroll:function(){if(!ensure())return false;st.seed=String(Math.random()).slice(2,8);st.q=null;ensure();return true},
    reset:function(){try{localStorage.removeItem(DK)}catch(e){}st=null;track=null;return true}
  };
  setInterval(tick,1000);tick();
})();

<script>
/* ===== ภาษีเงินได้แยกตามประเทศ (เดิมทุกประเทศใช้อัตราเดียวกัน) ===== */
(function(){
  /* ตัวคูณอัตราภาษีขั้นบันได 10/20/30% ของเกม: 1 = เท่าเดิม (ไทย) */
  var TX={'ไทย':1,'ญี่ปุ่น':1.5,'เกาหลีใต้':1.3,'สหรัฐอเมริกา':1.2,'อังกฤษ':1.5,'จีน':1.2,'ฝรั่งเศส':1.8,'อินเดีย':1,'สิงคโปร์':.6,'ออสเตรเลีย':1.4,'เยอรมนี':1.8,'แคนาดา':1.5,'เวียดนาม':1,'สหรัฐอาหรับเอมิเรตส์':0,'บราซิล':1.4,'อินโดนีเซีย':.9,'อิตาลี':1.7,'เม็กซิโก':1.1,'นิวซีแลนด์':1.3,'ตุรกี':1.2,'มาเลเซีย':.9,'ฟิลิปปินส์':1.1,'ลาว':.7,'กัมพูชา':.7,'เมียนมา':.7,'บรูไน':0,'ติมอร์-เลสเต':.5};
  Object.keys(TX).forEach(function(k){if(COUNTRIES[k])COUNTRIES[k].tx=TX[k]});
  var txOf=function(C){return (C&&C.tx!=null)?C.tx:1};
  window.taxLbl=function(C){var t=txOf(C);return t<=0?'ไม่มีภาษีเงินได้':'ภาษีสูงสุด '+Math.round(30*t)+'%'};
  var lastTax=0;
  netPay=function(g){
    var k=W(),x=txOf(CN()),t=0;
    [[3e5,1e6,.1],[1e6,3e6,.2],[3e6,1e12,.3]].forEach(function(b){t+=Math.max(0,Math.min(g,b[1]*k)-b[0]*k)*b[2]*x});
    var net=Math.round(g-t);lastTax=g-net;return net};
  var _ag=ageUp;
  ageUp=function(){
    var a0=S&&S.age;lastTax=0;_ag();
    if(!S||!S.alive||S.age===a0||lastTax<=0)return;
    var g=lastTax+0,eff=S.job&&S.job.sal?Math.round(g/S.job.sal*100):0;
    try{add('🧾 ภาษีเงินได้ปีนี้ '+fmt(g)+(eff?' (เฉลี่ย '+eff+'% ของเงินเดือน)':''),'info')}catch(e){}
    try{render()}catch(e){}
  };
  $('#ageBtn').onclick=ageUp;
})();
</script>

<script>

(function(){

    {id:'mom',ic:'💐',t:'วันแม่แห่งชาติ',d:'วันที่ลูก ๆ แสดงความรักและกตัญญูต่อแม่',r:[8,11,2],c:TH,cost:500,happy:4,rel:'mom',log:'คุณมอบดอกมะลิให้แม่และบอกรักท่าน'},
    {id:'hw',ic:'🎃',t:'ฮาโลวีน',d:'เด็ก ๆ แต่งตัวเป็นผีเดินขอขนมตามบ้าน',r:[10,29,3],c:['สหรัฐอเมริกา','อังกฤษ','แคนาดา','ออสเตรเลีย','นิวซีแลนด์'],cost:800,happy:5,rel:'friend',log:'คุณแต่งตัวสุดอลังการไปปาร์ตี้ฮาโลวีน'},
    {id:'dv',ic:'🪔',t:'ดีวาลี',d:'เทศกาลแห่งแสงสว่าง ประดับตะเกียงและกินขนมหวานกับครอบครัว',x:['2026-11-08'],span:2,c:['อินเดีย','สิงคโปร์','มาเลเซีย'],cost:700,happy:6,rel:'family',log:'คุณจุดตะเกียงรอบบ้านและกินขนมหวานกับครอบครัว'},
    {id:'lk',ic:'🏮',t:'ลอยกระทง',d:'คืนพระจันทร์เต็มดวง ผู้คนลอยกระทงขอขมาแม่น้ำ',x:['2026-11-24'],span:1,c:TH,cost:200,happy:6,rel:'partner',log:'คุณลอยกระทงอธิษฐานขอพรให้ปีหน้าดีกว่าเดิม'},
    {id:'dad',ic:'🌼',t:'วันพ่อแห่งชาติ',d:'วันที่ลูก ๆ แสดงความรักและกตัญญูต่อพ่อ',r:[12,4,2],c:TH,cost:500,happy:4,rel:'dad',log:'คุณมอบดอกพุทธรักษาให้พ่อและกล่าวขอบคุณ'},
    {id:'xm',ic:'🎄',t:'คริสต์มาส',d:'ต้นคริสต์มาสประดับไฟระยิบระยับ ผู้คนแลกของขวัญกัน',r:[12,24,3],c:null,cost:1500,happy:6,rel:'family',log:'คุณแลกของขวัญกับคนใกล้ชิดในวันคริสต์มาส'}
  ];
  function ld(){try{return JSON.parse(localStorage.getItem(FK))||{}}catch(e){return{}}}
  function sv(o){try{localStorage.setItem(FK,JSON.stringify(o))}catch(e){}}
  function dayN(y,m,d){return Math.floor(Date.UTC(y,m-1,d)/864e5)}
  function activeIn(f,now){
    var t=dayN(now.getFullYear(),now.getMonth()+1,now.getDate());
    if(f.x){for(var i=0;i<f.x.length;i++){var a=f.x[i].split('-'),c=dayN(+a[0],+a[1],+a[2]);if(Math.abs(t-c)<=(f.span||1))return +a[0]}return 0}
    for(var y=now.getFullYear()-1;y<=now.getFullYear();y++){var s0=dayN(y,f.r[0],f.r[1]);if(t>=s0&&t<s0+f.r[2])return y}
    return 0;
  }
  function here(f){return over===f.id||!f.c||(S&&f.c.indexOf(S.country)>=0)}
  function current(){
    if(!S||!S.alive)return null;
    var now=new Date(),done=ld(),res=null;
    if(over){var fo=F.filter(function(f){return f.id===over})[0];if(fo)return{f:fo,key:fo.id+'-'+now.getFullYear()}}
    F.forEach(function(f){
      if(res||!here(f))return;
      var y=over===f.id?now.getFullYear():activeIn(f,now);
      if(!y)return;
      var key=f.id+'-'+y;
      if(done[key]&&over!==f.id)return;
      res={f:f,key:key};
    });
    return res;
  }
  function pers(kind){
    if(!S)return null;
    if(kind==='partner')return (typeof partner==='function')?partner():null;
    var ty=kind==='mom'?'แม่':kind==='dad'?'พ่อ':kind==='friend'?'เพื่อน':null;
    var l=S.people.filter(function(p){return p.alive&&(kind==='family'?(p.type==='พ่อ'||p.type==='แม่'||p.type==='พี่น้อง'||p.type==='ลูก'):p.type===ty)});
    return l.length?l[Math.floor(Math.random()*l.length)]:null;
  }
  function join(c){
    var f=c.f;
    if(!S||!S.alive)return;
    if(S.jail>0)return toast('ร่วมงานไม่ได้ขณะอยู่ในเรือนจำ');
    var cost=Math.round(f.cost*W());
    if(S.money<cost)return toast('เงินไม่พอ');
    if(cost)mon(-cost);
    if(f.gain){var g=Math.round(f.gain*W());mon(g)}
    chg('happy',f.happy);
    var p=pers(f.rel);if(p)p.rel=cl(p.rel+6);
    var d=ld();d[c.key]=1;sv(d);
    add(f.ic+' '+f.t+': '+f.log+(cost?' (ใช้จ่าย '+fmt(cost)+')':'')+(f.gain?' (ได้รับ '+fmt(Math.round(f.gain*W()))+')':''),'good');
    toast(f.ic+' ร่วมงาน'+f.t+'แล้ว');
    try{closeSheet()}catch(e){}
    render();paint();
  }
  function open(){
    var c=current();if(!c)return;
    var f=c.f,cost=Math.round(f.cost*W());
    sheet(f.ic+' '+f.t,function(b){
      b.appendChild(el('div','pcard','<div style="font-size:42px;text-align:center">'+f.ic+'</div><div class="ps" style="text-align:center;margin-top:6px">'+f.d+'</div>'));
      b.appendChild(el('div','note','เทศกาลนี้จัดตามวันที่จริงของคุณ ร่วมงานได้ปีละครั้ง'+(f.gain?' · ได้รับอั่งเปา':'')+' · ความสุข +'+f.happy+(p0(f)?' · ความสัมพันธ์ดีขึ้น':'')));
      b.appendChild(row('🎉 ร่วมงาน',cost?'ค่าใช้จ่าย '+fmt(cost):'ฟรี',function(){join(c)}));
      b.appendChild(row('ไว้ปีหน้า','',function(){try{closeSheet()}catch(e){}}));
    });
  }
  function p0(f){return !!pers(f.rel)}
  var btn=document.createElement('button');btn.id='fsBtn';btn.type='button';btn.style.display='none';
  btn.addEventListener('click',function(e){e.stopPropagation();open()});
  var tl=document.getElementById('tools');if(tl)tl.insertBefore(btn,tl.firstChild);
  var shown={};
  function paint(){
    try{
      var c=current();
      if(!c){btn.style.display='none';return}
      btn.style.display='';btn.textContent=c.f.ic+' '+c.f.t;btn.className='on';
      if(!shown[c.key]){shown[c.key]=1;toast(c.f.ic+' ตอนนี้เป็นช่วง'+c.f.t+' กดปุ่มด้านบนเพื่อร่วมงาน')}
    }catch(e){}
  }
  setInterval(paint,2500);setTimeout(paint,800);
  window.festAdmin={
    list:function(){return F.map(function(f){return{id:f.id,t:f.ic+' '+f.t}})},
    force:function(id){over=id;shown={};paint()},
    clear:function(){over=null;sv({});paint()},
    state:function(){var c=current();return c?c.f.ic+' '+c.f.t+(over?' (บังคับเปิด)':''):'ไม่มีเทศกาลตอนนี้'}
  };
})();
</script>

<script>
/* ===== สุขภาพใจ: ภาวะซึมเศร้า/วิตกกังวล + นักจิตวิทยา (เดิมมีแค่แถบความเครียดกับเหตุการณ์หมดไฟ) ===== */
(function(){
  var MH=[{n:'ภาวะซึมเศร้า',ic:'🌧️'},{n:'โรควิตกกังวล',ic:'😟'}];
  function st(){return S.stress==null?20:S.stress}
  function setStress(v){S.stress=cl(st()+v)}
  function cost(){var hc=(CN().hc||0),cov=[0,.4,.7,.9][S.hi!=null?S.hi:((S.ss&&S.ss.y>0)?1:0)]||0;return Math.max(300,Math.round(1800*W()*(1-cov*.8)*(1-.04*hc)/50)*50)}
  window.mhLabel=function(){if(!S)return'-';return S.mh?(S.mh.ic+' '+S.mh.n+(S.mh.tx?' (กำลังรักษา)':'')):'ปกติ'};

  /* ผูกกับกิจกรรม "พบนักจิตบำบัด" ที่มีอยู่เดิม: ถ้ามีภาวะทางใจ การไปพบจะนับเป็นการรักษา และช่วยลดความเครียด */
  var th=ACTS.filter(function(a){return a.k==='therapy'})[0];
  if(th&&th.open){
    var o0=th.open;
    th.open=function(){
      var had=!!S.done.therapy;o0();
      if(had||!S.done.therapy)return;
      setStress(-20);
      if(S.mh){S.mh.tx=1;add('🧠 การบำบัดช่วยให้อาการ'+S.mh.n+'ดีขึ้น หมอนัดติดตามอาการต่อเนื่อง','good')}
    };
  }

  function friendOrFamily(){var l=S.people.filter(function(p){return p.alive&&(p.type==='เพื่อน'||p.type==='พ่อ'||p.type==='แม่'||p.type==='พี่น้อง'||p.type==='คู่สมรส'||p.type==='แฟน')});return l.length?l[Math.floor(Math.random()*l.length)]:null}

  function onset(){
    var p=1.5+Math.max(0,st()-60)*.25+(S.happy<30?4:0)+(S.jail>0?4:0)+(S.addict?3:0);
    p=Math.min(30,p);if(!chance(p))return;
    var t=(st()>=70&&chance(60))?MH[1]:MH[0];
    S.mh={n:t.n,ic:t.ic,y:0,tx:0};
    var c=cost();
    ask('คุณรู้สึกแย่ต่อเนื่องมานาน นอนไม่หลับ ไม่มีแรง และไม่อยากทำอะไร แพทย์ประเมินว่าอาจเป็น'+t.n+' คุณจะทำอย่างไร',[
      {t:'พบจิตแพทย์ '+fmt(c),f:function(){
        if(S.money>=c){mon(-c);S.mh.tx=1;setStress(-20);chg('happy',2);add('🧠 คุณเริ่มเข้ารับการรักษา'+t.n+' อาการเริ่มคงที่','good')}
        else{add('🧠 เงินไม่พอจะพบแพทย์ คุณต้องทนไปก่อน','bad')}}},
      {t:'ปรึกษาคนใกล้ชิด',f:function(){
        var q=friendOrFamily();setStress(-8);
        if(q){q.rel=cl(q.rel+6);add('🧠 คุณเปิดใจคุยกับ'+q.name+' รู้สึกดีขึ้นเล็กน้อยและความสัมพันธ์แน่นแฟ้นขึ้น','good')}
        else add('🧠 คุณไม่มีใครให้ปรึกษา ได้แต่เก็บไว้คนเดียว','bad')}},
      {t:'ฝืนทนต่อไป',f:function(){chg('happy',-3);add('🧠 คุณเลือกฝืนทนและทำเป็นว่าไม่เป็นอะไร','bad')}}
    ],'🧠 สุขภาพใจ');
  }

  function yearly(){
    if(S.mh){
      var m=S.mh;m.y++;
      if(m.tx){chg('happy',-1);setStress(-3)}else{chg('happy',-4);setStress(3);chg('health',-1)}
      if(chance(m.tx?32:6)){add('🌤️ อาการ'+m.n+'ดีขึ้นจนกลับมาเป็นปกติ คุณรู้สึกเหมือนได้เกิดใหม่','good');chg('happy',6);S.mhHist=(S.mhHist||0)+1;S.mh=null}
      else{m.tx=0;if(m.y===3)add('🧠 '+m.n+'ยังไม่หาย ลองไปพบนักจิตบำบัดที่เมนูกิจกรรม จะช่วยให้ดีขึ้นเร็วกว่า','bad')}
      return;
    }
    if(S.age>=12)onset();
  }

  var _a=ageUp;
  ageUp=function(){
    var a0=S&&S.age;_a();
    if(!S||!S.alive||S.age===a0)return;
    try{yearly()}catch(e){}
    try{render()}catch(e){}
  };
  $('#ageBtn').onclick=ageUp;
})();

<script>
/* ===== สอนเล่น: ทัวร์ครั้งแรกชี้ของจริงบนหน้าจอ + หน้า "วิธีเล่น" เปิดซ้ำได้จากเมนู ===== */
(function(){
  var KEY='lk_tut',ix=0,root=null,tmr=null,first=true;
  var STEPS=[
    {sel:'#top',at:'below',t:'นี่คือตัวละครของคุณ',x:'ดูชื่อ อายุ และเงินสดได้ที่นี่ แตะรูปตัวละครหรือปุ่ม ⋯ เพื่อเปิดโปรไฟล์ ภารกิจรายวัน และตารางอันดับ'},
    {sel:'#log',at:'in',t:'ประวัติชีวิต',x:'ทุกอย่างที่เกิดขึ้นจะไล่เรียงเป็นปีๆ ตรงนี้ แถบสีเขียวคือข่าวดี สีแดงคือข่าวร้าย'},
    {sel:'#stats',at:'above',t:'ค่าสถานะ',x:'ความสุข สุขภาพ ความฉลาด และหน้าตา ถ้าสุขภาพหมด ชีวิตจะจบ ดูแลให้สมดุลเข้าไว้'},
    {sel:'#ageBtn',at:'above',t:'ปุ่มหลักของเกม',x:'กดเพื่อให้เวลาผ่านไป 1 ปี จะมีเหตุการณ์สุ่มให้ตัดสินใจ ทุกตัวเลือกส่งผลต่อชีวิตคุณ'},
    {sel:'#nav',at:'above',t:'เมนูด้านล่าง',x:'💼 อาชีพ: หางาน ลงทุน\n🏠 ทรัพย์สิน: บ้าน รถ กระเป๋า\n👨‍👩‍👧 ความสัมพันธ์: ครอบครัว เพื่อน แฟน\n🎯 กิจกรรม: เรียน เที่ยว ออกกำลังกาย ฯลฯ'},
    {sel:'#menuBtn',at:'below',t:'เมนูเพิ่มเติม',x:'ในนี้มีวิธีเล่น ภารกิจรายวัน ตารางอันดับ และการเริ่มชีวิตใหม่ กลับมาอ่านวิธีเล่นได้ทุกเมื่อ พร้อมแล้วก็เริ่มเลย!'}
  ];
  function seen(){try{return localStorage.getItem(KEY)==='1'}catch(e){return false}}
  function mark(){try{localStorage.setItem(KEY,'1')}catch(e){}}

  var css=document.createElement('style');
  css.textContent='#tut{position:fixed;inset:0;z-index:400;touch-action:none}'
   +'#tut .thole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(8,12,26,.78);border:2px solid #fff;pointer-events:none;transition:left .25s,top .25s,width .25s,height .25s}'
   +'#tut .tcard{position:fixed;width:min(86vw,320px);box-sizing:border-box;background:var(--card,#fff);color:var(--ink,#1b2236);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.4)}'
   +'#tut .tn{font-size:12px;color:var(--mute,#5d6882);margin-bottom:2px}'
   +'#tut .tt{font-weight:700;font-size:17px;margin-bottom:6px}'
   +'#tut .tx{font-size:14.5px;line-height:1.55;overflow-wrap:anywhere;white-space:pre-line}'
   +'#tut .tb{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:12px}'
   +'#tut button{font:inherit;cursor:pointer;border-radius:12px;border:0;padding:9px 14px}'
   +'#tut .tskip{background:transparent;color:var(--mute,#5d6882)}'
   +'#tut .tnext{background:var(--pop,#cf4218);color:var(--on-pop,#fff);font-weight:700}'
   +'.thelp b{display:block;margin:2px 0 4px}.thelp p{margin:0;font-size:14px;line-height:1.55}';
  document.head.appendChild(css);

  function busy(){
    var q=function(id){var e=document.getElementById(id);return e&&e.classList.contains('open')};
    return q('start')||q('death')||q('evm')||q('sheet')||q('dev')||q('adm')||q('lkc');
  }
  function end(){
    mark();
    if(root){root.remove();root=null}
    window.removeEventListener('resize',place);
  }
  function place(){
    if(!root)return;
    var s=STEPS[ix],t=document.querySelector(s.sel);
    if(!t||!t.offsetWidth){next();return}
    var r=t.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,pad=6;
    var hole=root.querySelector('.thole'),card=root.querySelector('.tcard');
    root.querySelector('.tn').textContent='ขั้นที่ '+(ix+1)+' จาก '+STEPS.length;
    root.querySelector('.tt').textContent=s.t;root.querySelector('.tx').textContent=s.x;
    root.querySelector('.tnext').textContent=ix===STEPS.length-1?'เริ่มเล่นเลย!':'ถัดไป ▸';
    var L=Math.max(0,r.left-pad),T=Math.max(0,r.top-pad),W_=Math.min(vw,r.right+pad)-L,H_=Math.min(vh,r.bottom+pad)-T;
    hole.style.left=L+'px';hole.style.top=T+'px';hole.style.width=W_+'px';hole.style.height=H_+'px';
    var ch=card.offsetHeight,cw=card.offsetWidth,top;
    if(s.at==='in')top=T+(H_-ch)/2;else if(s.at==='above')top=T-ch-12;else top=T+H_+12;
    top=Math.max(8,Math.min(vh-ch-8,top));
    var left=Math.max(8,Math.min(vw-cw-8,r.left+r.width/2-cw/2));
    card.style.top=top+'px';card.style.left=left+'px';
  }
  function next(){
    ix++;
    if(ix>=STEPS.length){end();return}
    place();
  }
  window.lkTour=function(force){
    if(root)return;
    if(!S||!S.alive)return;
    if(!force&&(seen()||busy()))return;
    ix=0;root=document.createElement('div');root.id='tut';
    root.innerHTML='<div class="thole"></div><div class="tcard"><div class="tn"></div><div class="tt"></div><div class="tx"></div><div class="tb"><button class="tskip" type="button">ข้าม</button><button class="tnext" type="button">ถัดไป ▸</button></div></div>';
    document.body.appendChild(root);
    root.querySelector('.tskip').onclick=end;
    root.querySelector('.tnext').onclick=next;
    window.addEventListener('resize',place);
    place();
  };

  window.lkHelp=function(){
    sheet('❓ วิธีเล่น',function(b){
      var P=function(h,t){b.appendChild(el('div','pcard thelp','<b>'+h+'</b><p>'+t+'</p>'))};
      P('🎯 เป้าหมาย','จำลองชีวิตตั้งแต่เกิดจนวาระสุดท้าย ไม่มีผู้ชนะหรือผู้แพ้ ทุกการตัดสินใจมีผลต่อชีวิต ลองใช้ชีวิตให้ต่างกันในแต่ละรอบ');
      P('＋ ปุ่มอายุ','กดเพื่อให้เวลาผ่านไป 1 ปี เงินเดือนและค่าใช้จ่ายถูกคิดตอนสิ้นปี และอาจเกิดเหตุการณ์สุ่มให้เลือกตัดสินใจ (เปิดโหมด 6 เดือนได้จากปุ่ม ⏱️ ในแถบเครื่องมือ)');
      P('❤️ ค่าสถานะ','ความสุข สุขภาพ ความฉลาด หน้าตา และความเครียด ถ้าสุขภาพหมด ชีวิตจะจบ ความเครียดสะสมนานๆ ทำให้หมดไฟหรือป่วยทางใจ แก้ได้ด้วยการพักผ่อน ทำบุญ หรือพบนักจิตบำบัด');
      P('💼 เงินและอาชีพ','ทำงานเพื่อรับเงินเดือน (หักภาษีตามประเทศ) เลื่อนตำแหน่งตามผลงาน ลงทุนหรือทำธุรกิจเพิ่มรายได้ ระวังหนี้และการพนัน');
      P('👨‍👩‍👧 ครอบครัวและคนรอบตัว','ความสัมพันธ์ดีขึ้นเมื่อใช้เวลาร่วมกัน เช่น กลับไปเยี่ยมพ่อแม่หรือพบเพื่อนในเมนูกิจกรรม ดูแลพวกเขาให้ดี ชีวิตจะอบอุ่นขึ้น');
      P('🕯️ เมื่อชีวิตจบลง','จะมีหน้าสรุปชีวิตให้ดู ได้แต้มมรดกไปเลือกฐานะครอบครัวในชีวิตหน้า และเริ่มชีวิตใหม่ได้ทันที จะสุ่มประเทศหรือเลือกเองก็ได้');
      P('💡 เคล็ดลับ','ซื้อประกันสุขภาพและตรวจสุขภาพเป็นประจำ · ทำภารกิจรายวันเพื่อรับเงินรางวัล · มีเทศกาลตามวันที่จริงให้ร่วมงานปีละครั้ง · เซฟไฟล์เก็บไว้ได้จากปุ่ม 💾 เซฟ ในแถบเครื่องมือ');
      b.appendChild(row('▶ ดูทัวร์สอนเล่นอีกครั้ง','ชี้ส่วนต่างๆ บนหน้าจอทีละจุด',function(){closeSheet();setTimeout(function(){lkTour(true)},200)}));
    });
  };

  /* เริ่มทัวร์อัตโนมัติ: เฉพาะผู้เล่นใหม่ที่ยังไม่เคยเห็น และอยู่ในชีวิตช่วงต้น (เซฟเก่าที่เล่นมาแล้วจะไม่ถูกรบกวน) */
  tmr=setInterval(function(){
    try{
      if(seen()){clearInterval(tmr);return}
      if(!S||!S.alive)return;
      if(first){first=false;if(S.age>5){mark();clearInterval(tmr);return}}
      if(S.age<=5&&!busy())lkTour();
    }catch(e){}
  },800);
})();
</script>

<script>
/* ===== หลานเป็นตัวละครจริง (เดิมนับเป็นตัวเลขเฉยๆ): มีชื่อ อายุ ความสัมพันธ์ และมีกิจกรรมกับหลาน ===== */
(function(){
  function grands(){return S.people.filter(function(p){return p.type==='หลาน'})}
  function allKids(){return S.people.filter(function(p){return p.type==='ลูก'&&!p.pl})}
  window.grandKids=function(){return S?grands().filter(function(p){return p.alive}):[]};
  function lastOf(p){var a=String(p.name).split(' ');return a.slice(1).join(' ')||a[0]}
  function born(kid,age){
    var g=Math.random()<.5?'M':'F';
    var c=mkPerson('หลาน',g,age,0,lastOf(kid));
    c.rel=cl(Math.round(kid.rel*.7)+R(0,15));c.par=kid.id;c.kd2={sm:R(30,80)};
    try{if(S.ap&&S.ap.skin)c.ap.skin=S.ap.skin}catch(e){}
    S.people.push(c);return c;
  }
  /* สร้างตัวหลานให้ตรงกับจำนวนที่ระบบลูกเดิมนับไว้ (เซฟเก่าจะได้หลานย้อนหลังอายุสมเหตุสมผล) */
  function sync(){
    var first=!S.gcInit;S.gcInit=1;
    allKids().forEach(function(k){
      var gk=(k.kd&&k.kd.gk)||0,have=grands().filter(function(x){return x.par===k.id}).length;
      for(var i=have;i<gk;i++){
        var c=born(k,first?R(0,Math.max(0,Math.min(18,k.age-22))):0);
        if(!first)add('👶 หลานคนใหม่ของคุณชื่อ '+c.name+' (ลูกของ '+k.name+')','good');
      }
    });
  }
  window.grandSync=sync;
  /* เหตุการณ์รายปีของหลาน (จำกัดไม่เกิน 2 บรรทัดต่อปี กันบันทึกรก) */
  function yearly(){
    var n=0;
    grands().forEach(function(c){
      if(!c.alive||c.pl||n>=2)return;
      if(c.age===3&&c.rel>=50){n++;add('🧒 '+c.name+' เข้าเรียนอนุบาลวันแรก คุณไปส่งด้วยความภูมิใจ','good');chg('happy',2)}
      else if(c.age===18){n++;add('🎓 '+c.name+' เรียนจบมัธยมแล้ว','good');chg('happy',3)}
      else if(S.age>=60&&c.age>=4&&c.rel>=60&&chance(22)){n++;c.rel=cl(c.rel+3);chg('happy',3);add('👧 '+c.name+' มาเยี่ยมและกอดคุณแน่น ชื่นใจที่สุด','good')}
    });
  }
  var _pp=panelPerson;
  panelPerson=function(p){
    _pp(p);
    if(p.type!=='หลาน')return;
    var b=document.getElementById('sheetBody');if(!b)return;
    p.d=p.d||{};p.kd2=p.kd2||{sm:50};
    var re=function(){panelPerson(p);render()};
    var A=function(key,t,sub,cost,min,max,fn){
      var wrong=p.age<min||p.age>max,off=wrong||p.d[key]||(cost&&S.money<cost);
      b.appendChild(row(t,wrong?'เหมาะกับอายุ '+min+'–'+max+' ปี':p.d[key]?'ทำแล้วในปีนี้':(cost&&S.money<cost?'เงินไม่พอ':sub),off?null:function(){p.d[key]=1;if(cost)mon(-cost);fn();re()},cost?fmt(cost):''));
    };
    var par=S.people.filter(function(x){return x.id===p.par})[0];
    b.appendChild(el('div','sec','👶 หลานของคุณ'));
    b.appendChild(el('div','pcard','<div class="ps">'+(par?'ลูกของ '+esc(par.name)+' · ':'')+'ความฉลาด '+p.kd2.sm+'/100'+(p.sch?' · ได้รับทุนการศึกษาจากคุณ':'')+'</div>'));
    A('g1','🤗 อุ้ม / เล่นด้วย','ความสัมพันธ์และความสุข +',0,0,7,function(){p.rel=cl(p.rel+R(6,12));chg('happy',4);add('คุณอุ้มและเล่นกับ'+p.name+' หัวเราะกันทั้งบ่าย','good')});
    A('g2','🍬 ให้ค่าขนม','ความสัมพันธ์ +',Math.round(2000*W()),4,17,function(){p.rel=cl(p.rel+R(5,10));chg('happy',2);add('คุณให้ค่าขนม'+p.name+' หลานยิ้มแก้มปริ','good')});
    A('g3','📖 เล่านิทาน / ช่วยทำการบ้าน','ความฉลาดหลาน + ความสัมพันธ์ +',0,4,15,function(){p.kd2.sm=cl(p.kd2.sm+R(2,5));p.rel=cl(p.rel+R(3,7));chg('happy',2);add('คุณนั่งเล่านิทานและช่วยทำการบ้านให้'+p.name,'good')});
    A('g4','🎁 ซื้อของขวัญชิ้นใหญ่','ความสัมพันธ์ + มาก',Math.round(15000*W()),3,25,function(){p.rel=cl(p.rel+R(10,18));chg('happy',3);add('คุณซื้อของขวัญชิ้นโตให้'+p.name,'good')});
    if(!p.sch)A('g5','🎓 ออกทุนการศึกษาให้หลาน','ความฉลาด + (ทำได้ครั้งเดียว)',Math.round(200000*W()),15,21,function(){p.sch=1;p.kd2.sm=cl(p.kd2.sm+10);p.rel=cl(p.rel+12);add('คุณออกทุนการศึกษาให้'+p.name+' หลานซาบซึ้งมาก','good')});
  };
  var _a=ageUp;
  ageUp=function(){
    var a0=S&&S.age;_a();
    if(!S||!S.alive||S.age===a0)return;
    try{sync();yearly()}catch(e){}
    try{render()}catch(e){}
  };
  $('#ageBtn').onclick=ageUp;
})();
</script>

<script>
/* ===== ผังครอบครัว: พ่อแม่ → คุณ/คู่/พี่น้อง → ลูก → หลาน (หลานจัดกลุ่มใต้พ่อแม่ของเขา) ===== */
(function(){
  var css=document.createElement('style');
  css.textContent='.ftw{padding:2px 0 8px}'
   +'.fgen{font-size:12.5px;font-weight:600;color:var(--mute,#5d6882);margin:14px 2px 6px;display:flex;align-items:center;gap:6px}'
   +'.fgen::after{content:"";flex:1;height:1px;background:var(--line,#d3dbea)}'
   +'.frow{display:flex;flex-wrap:wrap;gap:8px}'
   +'.fn{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 140px;max-width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid var(--line,#d3dbea);border-radius:14px;background:var(--card,#fff);color:inherit;font:inherit;text-align:left;cursor:pointer}'
   +'.fn:active{transform:scale(.97)}'
   +'.fn .mini{flex:none}'
   +'.fn .ft{min-width:0;display:flex;flex-direction:column;line-height:1.25}'
   +'.fn .ft b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}'
   +'.fn .ft small{font-size:11.5px;color:var(--mute,#5d6882)}'
   +'.fn.me{border:2px solid var(--head,#27389a);background:var(--soft,#f3f6fb)}'
   +'.fn.dead{opacity:.55;cursor:default}'
   +'.fkids{margin:6px 0 4px 18px;padding-left:10px;border-left:2px solid var(--line,#d3dbea);display:flex;flex-direction:column;gap:6px}'
   +'.fkids .fn{flex:none}'
   +'.fbox{margin-bottom:6px}';
  document.head.appendChild(css);

  function node(p,opt){
    opt=opt||{};
    var me=!!opt.me,dead=me?false:!p.alive;
    var first=me?(S.first||String(S.name).split(' ')[0]):String(p.name).split(' ')[0];
    var sub=me?('อายุ '+S.age+' ปี'):(p.type+' · '+(dead?'✝ เสียชีวิต':('อายุ '+p.age+' ปี · '+p.rel+'%'))+((p.type==='ลูก'&&p.kd&&p.kd.sp&&p.kd.mar)?' · คู่: '+String(p.kd.sp).split(' ')[0]:''));
    var ap=me?S.ap:p.ap;
    var b=document.createElement('button');b.type='button';
    b.className='fn'+(me?' me':'')+(dead?' dead':'');
    b.innerHTML='<span class="mini">'+avatar(ap,{age:me?S.age:p.age,happy:me?S.happy:p.rel,dead:dead})+'</span><span class="ft"><b>'+esc(me?'คุณ · '+first:first)+'</b><small>'+esc(sub)+'</small></span>';
    if(!me&&!dead)b.onclick=function(){panelPerson(p)};
    return b;
  }
  function band(b,title,list,extra){
    if(!list.length&&!(extra&&extra.length))return;
    b.appendChild(el('div','fgen',title));
    var r=el('div','frow');list.forEach(function(x){r.appendChild(x)});b.appendChild(r);
  }
  window.openFamilyTree=function(){
    if(!S)return;
    sheet('🌳 ผังครอบครัว',function(b){
      var P=S.people,T=function(t){return P.filter(function(p){return p.type===t&&!p.pl})};
      try{if(window.ensureRel)ensureRel()}catch(e){}
      var parents=T('พ่อ').concat(T('แม่')),gpar=['ปู่','ย่า','ตา','ยาย'].reduce(function(a,t){return a.concat(T(t))},[]),uncles=['ลุง','ป้า','น้า','อา'].reduce(function(a,t){return a.concat(T(t))},[]),cousins=T('ลูกพี่ลูกน้อง');
      var mates=P.filter(function(p){return p.type==='คู่สมรส'||(p.type==='แฟน'&&p.alive)});
      var sibs=T('พี่น้อง'),kids=T('ลูก'),gk=T('หลาน');
      var wrap=el('div','ftw');b.appendChild(wrap);

    ],'💼 ลูกตกงาน');

    if(kid.rel>=50&&chance(50)){var m=money(R(10000,60000));mon(m);add(kid.name+' ส่งเงินมาแบ่งปันความสำเร็จ '+fmt(m),'good')}

    ask(kid.name+' ป่วยหนักและต้องเข้าโรงพยาบาล',[

<script>
/* ===== ญาติ: ปู่ย่าตายาย ลุง ป้า น้า อา ลูกพี่ลูกน้อง เป็นตัวละครจริง (เดิมมีแค่ข้อความลอยๆ) ===== */
(function(){
  var KIN=['ปู่','ย่า','ตา','ยาย','ลุง','ป้า','น้า','อา','ลูกพี่ลูกน้อง'];
  function pk(a){return a[Math.floor(Math.random()*a.length)]}
  function kinAlive(){return S.people.filter(function(p){return p.alive&&KIN.indexOf(p.type)>=0})}
  function aliveP(a){return a<55?1:a<70?.93:a<80?.75:a<90?.45:a<100?.12:0}
  function lastOf(p){var a=String(p.name).split(' ');return a.slice(1).join(' ')||a[0]}
  function money(n){return Math.max(500,Math.round(n*W()/500)*500)}
  function mk(type,g,age,last,par){
    var alive=Math.random()<aliveP(age);
    var p=mkPerson(type,g,age,R(30,70),last);
    p.alive=alive;if(par)p.par=par;
    if(!alive)p.age=Math.min(age,R(58,92));
    return p;
  }
  /* สร้างญาติครั้งเดียวต่อชีวิต (ชีวิตที่เล่นต่อจากรุ่นก่อนไม่สร้างใหม่ เพื่อไม่ให้สายตระกูลสับสน) */
  window.ensureRel=function(){
    if(!S||S.relInit)return;
    S.relInit=1;
    if((S.gen||1)>1)return;
    try{
      var fa=S.people.filter(function(p){return p.type==='พ่อ'})[0],mo=S.people.filter(function(p){return p.type==='แม่'})[0];
      var made=[],uncles=[];
      [[fa,'f'],[mo,'m']].forEach(function(x){
        var par=x[0],side=x[1];if(!par)return;
        var last=side==='f'?lastOf(par):(COUNTRIES[S.country]?pk(COUNTRIES[S.country].L):lastOf(par));
        // ปู่ย่า / ตายาย
        var gA=par.age+R(22,34);
        made.push(mk(side==='f'?'ปู่':'ตา','M',gA,last));
        made.push(mk(side==='f'?'ย่า':'ยาย','F',gA+R(-4,3),last));
        // พี่น้องของพ่อ/แม่
        var n=pk([0,1,1,2,2]);
        for(var i=0;i<n&&uncles.length<4;i++){
          var g=Math.random()<.5?'M':'F',older=Math.random()<.5,a=older?par.age+R(1,8):Math.max(20,par.age-R(1,8));
          var t=older?(g==='M'?'ลุง':'ป้า'):(side==='f'?'อา':'น้า');
          var u=mk(t,g,a,last);made.push(u);uncles.push(u);
        }
      });
      // ลูกพี่ลูกน้อง (สูงสุด 5 คน)
      var cs=0;
      uncles.forEach(function(u){
        var m=pk([0,1,1,2]);
        for(var i=0;i<m&&cs<5;i++){
          var ca=u.age-R(24,34);if(ca<0||u.age<24)continue;
          var c=mk('ลูกพี่ลูกน้อง',Math.random()<.5?'M':'F',ca,lastOf(u),u.id);made.push(c);cs++;
        }
      });
      made.forEach(function(p){S.people.push(p)});
    }catch(e){}
  };
  window.relatives=function(){return S?kinAlive():[]};

  /* กิจกรรมกับญาติ */
  var _pp=panelPerson;
  panelPerson=function(p){
    _pp(p);
    if(KIN.indexOf(p.type)<0||!p.alive)return;
    var b=document.getElementById('sheetBody');if(!b)return;
    p.d=p.d||{};
    var re=function(){panelPerson(p);render()};
    var A=function(key,t,sub,cost,min,fn){
      var wrong=S.age<min,off=wrong||p.d[key]||(cost&&S.money<cost);
      b.appendChild(row(t,wrong?'เหมาะกับอายุ '+min+' ปีขึ้นไป':p.d[key]?'ทำแล้วในปีนี้':(cost&&S.money<cost?'เงินไม่พอ':sub),off?null:function(){p.d[key]=1;if(cost)mon(-cost);fn();re()},cost?fmt(cost):''));
    };
    var old=['ปู่','ย่า','ตา','ยาย','ลุง','ป้า','น้า','อา'].indexOf(p.type)>=0;
    b.appendChild(el('div','sec','👪 ญาติของคุณ'));
    A('k1','☎️ โทรไปสวัสดี','ความสัมพันธ์ +',0,6,function(){p.rel=cl(p.rel+R(3,7));chg('happy',1);add('คุณโทรไปสวัสดี'+p.type+p.name.split(' ')[0]+' ท่านดีใจมาก','good')});
    A('k2','🧺 ซื้อของไปเยี่ยม','ความสัมพันธ์ + ความสุข +',money(3000),8,function(){p.rel=cl(p.rel+R(8,14));chg('happy',2);add('คุณซื้อของไปเยี่ยม'+p.type+p.name.split(' ')[0],'good')});
    if(old&&p.age>=60)A('k3','💰 ให้เงินท่านใช้','ความสัมพันธ์ + มาก',money(20000),18,function(){p.rel=cl(p.rel+R(12,20));chg('happy',3);add('คุณให้เงิน'+p.type+p.name.split(' ')[0]+'ไว้ใช้จ่าย ท่านซาบซึ้งมาก','good')});
    if(p.type==='ลูกพี่ลูกน้อง')A('k4','🎮 ชวนไปเที่ยวด้วยกัน','ความสัมพันธ์ + ความสุข +',money(2500),8,function(){p.rel=cl(p.rel+R(8,15));chg('happy',4);add('คุณพา'+p.name.split(' ')[0]+'ไปเที่ยวด้วยกัน สนุกมาก','good')});
  };

  /* เหตุการณ์ */
  EV.push({cond:function(){return S.age>=6&&Math.random()<.5&&kinAlive().length>=2},go:function(){
