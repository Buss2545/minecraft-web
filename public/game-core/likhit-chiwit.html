<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ลิขิตชีวิต</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#e9eef5;--card:#ffffff;--ink:#1b2236;--mute:#5d6882;--line:#d3dbea;--head:#27389a;--on-head:#ffffff;--pop:#cf4218;--on-pop:#ffffff;--happy:#e2a000;--health:#e2483b;--smart:#2f7de1;--look:#a24bd6;--good:#1c8f5a;--bad:#cf3b34;--soft:#f3f6fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1320;--card:#192031;--ink:#e8ecf6;--mute:#97a2ba;--line:#2a3449;--head:#1d2a6b;--on-head:#ffffff;--pop:#ff7b54;--on-pop:#1a0c06;--happy:#f2b61f;--health:#ff6a5c;--smart:#6aa6ff;--look:#c47cf0;--good:#46c68a;--bad:#ff6b63;--soft:#202a3f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1320;--card:#192031;--ink:#e8ecf6;--mute:#97a2ba;--line:#2a3449;--head:#1d2a6b;--on-head:#ffffff;--pop:#ff7b54;--on-pop:#1a0c06;--happy:#f2b61f;--health:#ff6a5c;--smart:#6aa6ff;--look:#c47cf0;--good:#46c68a;--bad:#ff6b63;--soft:#202a3f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:'Prompt','Noto Sans Thai','Sarabun',system-ui,sans-serif;font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg)}
#top{background:var(--head);color:var(--on-head);padding:10px 14px;display:flex;align-items:center;gap:10px}
#top .who{flex:1;min-width:0}
#nm{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ag{font-size:13px;opacity:.85}
#mo{font-weight:700;font-size:17px}
#mo.neg{color:#ffb4ac}
#menuBtn{background:rgba(255,255,255,.16);border:0;border-radius:10px;color:var(--on-head);width:36px;height:36px;font-size:18px}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.st{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mute)}
.st .sl{display:flex;justify-content:space-between}
.st .sl b{color:var(--ink);font-weight:600}
.track{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:5px;transition:width .35s}
.f-happy{background:var(--happy)}.f-health{background:var(--health)}.f-smart{background:var(--smart)}.f-look{background:var(--look)}.f-rel{background:var(--head)}
#log{flex:1;overflow-y:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
.yr{margin-bottom:14px}
.yh{display:inline-block;font-weight:600;font-size:13px;background:var(--head);color:var(--on-head);border-radius:999px;padding:1px 12px;margin-bottom:6px}
.ln{background:var(--card);border-left:4px solid var(--line);border-radius:8px;padding:7px 11px;margin-bottom:5px}
.ln.good{border-left-color:var(--good)}.ln.bad{border-left-color:var(--bad)}.ln.info{border-left-color:var(--smart)}
#nav{display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:end;background:var(--card);border-top:1px solid var(--line);padding:4px 4px 6px}
#nav button.nb{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;color:var(--mute)}
#nav button.nb span.ic{font-size:21px;line-height:1.2}
#ageBtn{justify-self:center;width:66px;height:66px;margin-top:-26px;border-radius:50%;border:4px solid var(--card);background:var(--pop);color:var(--on-pop);font-weight:700;font-size:13px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#ageBtn b{font-size:24px;line-height:1}
#ageBtn:disabled{opacity:.5}
.ov{position:fixed;inset:0;background:rgba(8,12,26,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.open{display:flex}
.ov.c{align-items:center;padding:18px}
.sh{background:var(--card);width:100%;max-width:560px;max-height:88%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.shh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.shh b{font-size:17px}
.shh button{background:var(--soft);border:0;border-radius:9px;padding:4px 14px}
#sheetBody{overflow-y:auto;padding:10px 14px 16px}
.ev{background:var(--card);width:100%;max-width:460px;border-radius:18px;padding:18px;max-height:90%;overflow-y:auto}
.ev h3{margin:0 0 6px;font-size:17px}
.ev p{margin:0 0 14px;font-size:16px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 10px;width:100%;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px}
.row:disabled{opacity:.5;cursor:default}
.row .rt{font-weight:600}
.row .rs{flex-basis:100%;font-size:12.5px;color:var(--mute);order:3}
.row .rr{font-size:13px;color:var(--mute)}
.ev .row{background:var(--head);color:var(--on-head);border-color:transparent;font-weight:600}
.sec{font-weight:600;color:var(--mute);font-size:13px;margin:12px 2px 6px}
.pcard{background:var(--soft);border-radius:12px;padding:12px;margin-bottom:10px}
.pcard .pl{font-weight:700;font-size:17px}
.pcard .ps{color:var(--mute);font-size:13px;margin-bottom:6px}
.note{color:var(--mute);font-size:13px;padding:6px 2px}
.scr{position:fixed;inset:0;background:var(--bg);display:none;overflow:auto;z-index:20;padding:calc(22px + env(safe-area-inset-top,0px)) 20px calc(22px + env(safe-area-inset-bottom,0px))}
.scr.open{display:block}
.scr .in{max-width:460px;margin:0 auto}
.scr h1{font-size:34px;margin:8px 0 2px;color:var(--head);letter-spacing:-.5px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .scr h1{color:#aab8ff}}
:root[data-theme="dark"] .scr h1{color:#aab8ff}
.scr .sub{color:var(--mute);margin:0 0 18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.box label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:2px}
.box input{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.seg button{padding:9px;border-radius:10px;border:2px solid var(--line);background:var(--soft)}
.seg button.on{border-color:var(--head);background:var(--head);color:var(--on-head)}
.big{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:17px;background:var(--pop);color:var(--on-pop);margin-bottom:10px}
.big.alt{background:var(--head);color:var(--on-head)}
.big.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.sum div{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--mute)}
.sum div b{display:block;color:var(--ink);font-size:16px}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.av0{}
#av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;border:2px solid rgba(255,255,255,.55);background:#fff;padding:0;cursor:pointer}
#av svg{display:block;width:100%;height:100%}
.mini{display:inline-block;width:30px;height:30px;vertical-align:middle;margin-right:8px;border-radius:50%;overflow:hidden}
.mini svg{display:block;width:100%;height:100%}
.portrait{width:112px;height:112px;border-radius:50%;overflow:hidden;margin:0 auto 8px;border:3px solid var(--line)}
.portrait svg{display:block;width:100%;height:100%}
.box select{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:10px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);padding:0}
.sw button.on{border-color:var(--ink)}
.seg3{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.seg3 button{padding:8px 2px;border-radius:10px;border:2px solid var(--line);background:var(--soft);font-size:13px}
.seg3 button.on{border-color:var(--head);background:var(--head);color:var(--on-head)}
.ach{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--soft);margin-bottom:6px}
.ach.lock{opacity:.45}
button:focus-visible{outline:3px solid var(--smart);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
/* ===== UI v2 ===== */
:root{--head2:#5a74f0;--ease:cubic-bezier(.2,.9,.3,1)}
#app{box-shadow:0 0 40px rgba(0,0,0,.14)}
#top{background:linear-gradient(135deg,var(--head),var(--head2));box-shadow:0 3px 16px rgba(20,30,90,.3);position:relative;z-index:2}
#av{transition:transform .3s var(--ease)}#av:active{transform:scale(.9) rotate(-6deg)}
#mo{transition:color .3s}#mo.bump{animation:bump .5s var(--ease)}
@keyframes bump{40%{transform:scale(1.25)}}
#stats{position:relative;z-index:1;box-shadow:0 4px 14px rgba(20,30,70,.07)}
.st{position:relative}
.track{box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.fill{transition:width .8s var(--ease);position:relative;overflow:hidden}
.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:shine 3.2s infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.dl{position:absolute;right:0;top:-4px;font-weight:700;font-size:14px;pointer-events:none;animation:flo 1.1s ease-out forwards}
.dl.up{color:var(--good)}.dl.dn{color:var(--bad)}
@keyframes flo{from{opacity:0;transform:translateY(8px)}20%{opacity:1}to{opacity:0;transform:translateY(-22px)}}
.ln{box-shadow:0 1px 3px rgba(20,30,70,.06)}
.ln.in{animation:lnIn .5s var(--ease) both;animation-delay:calc(var(--i,0)*90ms)}
@keyframes lnIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
.yh{background:linear-gradient(135deg,var(--head),var(--head2))}
#ageBtn{background:linear-gradient(145deg,#ff7b4a,var(--pop));transition:transform .2s var(--ease);position:relative}
#ageBtn::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--pop);opacity:0;animation:ring 2.4s infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.35);opacity:0}}
#ageBtn:active:not(:disabled){transform:scale(.88)}
#ageBtn.go{animation:spin .6s var(--ease)}
@keyframes spin{50%{transform:scale(1.15) rotate(180deg)}100%{transform:rotate(360deg)}}
#nav button.nb{transition:transform .2s var(--ease),color .2s}
#nav button.nb:active{transform:translateY(-3px) scale(1.1);color:var(--head)}
.ov,.ov.c{display:flex;visibility:hidden;opacity:0;transition:opacity .28s,visibility .28s;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.ov.open{visibility:visible;opacity:1}
.sh{transform:translateY(70px);transition:transform .42s var(--ease)}
.ov.open .sh{transform:none}
.ev{transform:scale(.8) translateY(24px);transition:transform .45s cubic-bezier(.3,1.5,.5,1);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.ov.open .ev{transform:none}
.row{transition:transform .15s,box-shadow .2s,border-color .2s}
.row:active:not(:disabled){transform:scale(.97)}
.row:hover:not(:disabled){border-color:var(--head2);box-shadow:0 3px 10px rgba(40,60,160,.15)}
#sheetBody .row,#evC .row,#sheetBody .ach,#sheetBody .pcard{animation:lnIn .4s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.scr{display:block;visibility:hidden;opacity:0;transition:opacity .5s,visibility .5s}
.scr.open{visibility:visible;opacity:1}
.scr h1{animation:lnIn .8s var(--ease) both}
.big{transition:transform .2s var(--ease),box-shadow .2s;box-shadow:0 4px 14px rgba(0,0,0,.15)}.big:active{transform:scale(.96)}
.portrait,.mini{transition:transform .4s var(--ease)}.portrait:hover{transform:scale(1.06) rotate(-3deg)}
#toast{transform:translate(-50%,-14px) scale(.9);transition:opacity .25s,transform .4s var(--ease)}
#toast.show{transform:translate(-50%,0) scale(1)}
.cf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.cf i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:cf 1.8s ease-in forwards}
@keyframes cf{to{transform:translate(var(--x),105vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== UI v7: สไตล์ BitLife ===== */
#app{background:var(--card)}
#top{background:var(--head);box-shadow:none;padding:10px 14px}
#mo{background:rgba(255,255,255,.18);padding:4px 12px;border-radius:999px;font-size:15px}
#nm{font-size:18px}
#log{background:var(--card);padding:6px 16px 16px}
.yr{margin-bottom:6px}
.yh{display:block;background:none!important;color:var(--head2);padding:12px 0 4px;margin:0;border-bottom:2px solid var(--line);border-radius:0;font-size:15px;font-weight:700}
:root[data-theme="dark"] .yh{color:#aab8ff}
.ln{background:none;box-shadow:none;border-radius:0;border-left:3px solid transparent;padding:9px 4px 9px 10px;margin:0;border-bottom:1px solid var(--line);font-size:15.5px}
.ln.good{border-left-color:var(--good)}.ln.bad{border-left-color:var(--bad)}.ln.info{border-left-color:var(--smart)}
#stats{display:grid;grid-template-columns:1fr;gap:7px;padding:10px 16px 8px;background:var(--bg);border-top:1px solid var(--line);box-shadow:none}
.st{display:grid;grid-template-columns:112px 1fr 42px;align-items:center;gap:0 8px;font-size:13.5px}
.st .sl{display:contents}
.st .sl span{order:1;white-space:nowrap;color:var(--ink);font-weight:500}
.track{order:2;height:15px;border-radius:9px}
.fill{border-radius:9px}
.st .sl b{order:3;text-align:right}
.st:nth-child(1) .sl span::before{content:'😊 '}.st:nth-child(2) .sl span::before{content:'❤️ '}
.st:nth-child(3) .sl span::before{content:'🧠 '}.st:nth-child(4) .sl span::before{content:'✨ '}
.dl{right:44px;top:-6px}
#nav{background:var(--card);border-top:0;padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center}
#nav button.nb{font-size:11.5px;font-weight:500;gap:1px}
#nav button.nb span.ic{font-size:26px}
#ageBtn{width:70px;height:70px;margin-top:0;border:0;background:linear-gradient(145deg,#3ddc84,#16a34a);color:#fff;box-shadow:0 4px 0 #0f7a37,0 6px 14px rgba(0,0,0,.25);font-size:12px}
#ageBtn::before{border-color:#3ddc84}
#ageBtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #0f7a37}
.ov:not(.c){align-items:stretch;background:rgba(8,12,26,.3)}
.ov:not(.c) .sh{height:100%;max-height:100%;border-radius:0;background:var(--card);transform:translateX(36px);opacity:0;transition:transform .4s var(--ease),opacity .3s}
.ov.open:not(.c) .sh{transform:none;opacity:1}
.shh{background:var(--head);color:#fff;border:0;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 12px;gap:6px}
.shh b{flex:1;text-align:center;font-size:18px;padding-right:66px}
#shx{order:-1;background:rgba(255,255,255,.2);color:#fff;font-weight:600;padding:6px 12px;border-radius:999px}
#sheetBody{flex:1;padding:0 0 24px;background:var(--card)}
.sec{background:var(--soft);margin:0;padding:8px 16px;font-size:12.5px;letter-spacing:.3px;font-weight:700;color:var(--head2);text-transform:uppercase;border-bottom:1px solid var(--line)}
.note{padding:10px 16px;background:var(--soft);border-bottom:1px solid var(--line)}
#sheetBody .row{display:grid;grid-template-columns:46px 1fr auto;column-gap:12px;align-items:center;position:relative;border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--card);margin:0;padding:12px 38px 12px 16px;width:100%}
#sheetBody .row.nt{grid-template-columns:1fr auto}
#sheetBody .row>.tile{grid-column:1;grid-row:1/span 2}
#sheetBody .row>.rt{grid-column:2;grid-row:1}#sheetBody .row>.rs{grid-column:2;grid-row:2;order:0}#sheetBody .row>.rr{grid-column:3;grid-row:1}
#sheetBody .row.nt>.rt,#sheetBody .row.nt>.rs{grid-column:1}#sheetBody .row.nt>.rr{grid-column:2}
#sheetBody .row::after{content:'›';position:absolute;right:16px;top:50%;transform:translateY(-52%);font-size:26px;color:var(--mute)}
#sheetBody .row:disabled{opacity:.42}#sheetBody .row:disabled::after{content:''}
#sheetBody .row:hover:not(:disabled){background:var(--soft);box-shadow:none}
.tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:23px;background:hsla(var(--h,210),80%,55%,.18)}
#sheetBody .pcard{border-radius:0;margin:0;border-bottom:1px solid var(--line);background:var(--card)}
#sheetBody .sum{padding:0 16px}#sheetBody .ach{margin:0 16px 6px}
.ev{padding:0;overflow:hidden;border-radius:20px}
.ev h3{background:var(--head);color:#fff;margin:0;padding:13px 18px;font-size:17px}
.ev p{padding:16px 18px 6px;margin:0;font-size:16.5px}
#evC{padding:8px 16px 16px}
.ev .row{display:flex!important;justify-content:center;text-align:center;border-radius:12px;background:linear-gradient(145deg,var(--head2),var(--head));box-shadow:0 3px 0 rgba(0,0,0,.25);padding:12px}
.ev .row:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
/* ===== UI v8: เดสก์ท็อป/มือถือ ===== */
html{overscroll-behavior:none}button{touch-action:manipulation}
#log,#sheetBody{overscroll-behavior:contain}
#sb,#sideL,#sideR{display:none}
*::-webkit-scrollbar{width:6px}*::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
@media (min-width:760px) and (min-height:620px){
 html{background:radial-gradient(1100px 700px at 18% 8%,#3a4fd8 0,transparent 60%),radial-gradient(900px 600px at 88% 92%,#a24bd6 0,transparent 60%),#0b1020}
 body{display:grid;place-items:center;overflow:hidden;background:transparent}
 #app{position:relative;width:392px;height:min(840px,calc(100vh - 36px));max-width:none;margin:0;border-radius:46px;border:11px solid #0c0d12;box-shadow:0 0 0 2px #3b3f4d,0 30px 80px rgba(0,0,0,.55);overflow:hidden;transform:translate(0,0);padding:0}
 #sb{display:flex;align-items:flex-end;justify-content:space-between;height:32px;padding:0 24px 4px;background:var(--head);color:#fff;font-size:12.5px;font-weight:600;position:relative;flex:none}
 #sb::after{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);width:84px;height:20px;border-radius:12px;background:#000}
 .scr{padding-left:20px;padding-right:20px}
 .big,.row,#ageBtn,#nav button{cursor:pointer}
}
@media (min-width:1150px) and (min-height:620px){
 #sideL,#sideR{display:block;position:fixed;top:50%;transform:translateY(-50%);width:280px;color:#e8ecf6;font-size:14px;max-height:92vh;overflow:auto}
 #sideL{left:calc(50% - 516px)}#sideR{left:calc(50% + 247px)}
 .gl{background:rgba(255,255,255,.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:16px;margin-bottom:12px;animation:lnIn .6s var(--ease) both}
 .gl h2{margin:0 0 8px;font-size:14px;color:#aab8ff;letter-spacing:.3px}
 .gl .lg{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:0 0 4px}
 .gl p{margin:0;color:#b9c2da;line-height:1.5}

function outfitOf(){
  if(!S.alive)return{c:'#9aa1ad'};
  if(S.jail>0)return{c:'#f08a24',stripe:1};
  if(S.age<2)return{c:S.g==='M'?'#9cc7ff':'#ffb6cf'};
  if(S.service>0)return{c:'#566f38'};
  if(inSchool())return{c:'#f4f6fa',shirt:1,collar:'#24357f'};
  if(S.job){const n=S.job.n;
    if(n==='ตำรวจ')return{c:'#7a5a36',badge:1};
    if(n==='ทหาร')return{c:'#566f38'};
    if(n==='แพทย์')return{c:'#f4f6fa',cross:1,shirt:1};
    if(n==='พยาบาล')return{c:'#8fd0e8',cross:1};
    if(n==='เกษตรกร')return{c:'#4b6b9a',hat:'straw'};
    if(['พนักงานออฟฟิศ','ข้าราชการ','ทนายความ','วิศวกร'].includes(n))return{c:'#2c3550',shirt:1,collar:'#b8322a'};
    return{c:'#3b4f9a'};
  }
  if(S.retired)return{c:'#9a7fb8'};
  return{c:'#2f9d8a'};
}

 ['rich2','มหาเศรษฐี','มีทรัพย์สินสุทธิ 100 ล้านบาท',()=>netWorth()>=1e8],
 ['deg','บัณฑิต','จบปริญญาตรี',()=>S.edu>=4],
 ['doc','คุณหมอ','ได้ทำงานเป็นแพทย์',()=>!!S.job&&S.job.n==='แพทย์'],
 ['wed','ชีวิตคู่','แต่งงาน',()=>S.people.some(p=>p.type==='คู่สมรส')],
 ['kid','พ่อแม่','มีลูก',()=>S.people.some(p=>p.type==='ลูก')],
 ['f5','คนมีเพื่อน','มีเพื่อน 5 คนขึ้นไป',()=>friends().length>=5],
 ['jail','เข้าลิสต์ดำ','เคยติดคุก',()=>!!S.flags.jailed],
 ['jp','ติดลอตเตอรี่','ถูกรางวัลที่ 1',()=>!!S.flags.jackpot],
 ['inf','อินฟลูเอนเซอร์','มีผู้ติดตาม 100,000 คน',()=>(S.fans||0)>=1e5],
 ['abroad','ไปไกลถึงต่างแดน','ย้ายไปต่างประเทศ',()=>!!S.flags.moved],
 ['old','อายุยืน','มีชีวิตถึง 90 ปี',()=>S.age>=90],
 ['pet','รักสัตว์','มีสัตว์เลี้ยง',()=>!!S.pet],
 ['biz','เถ้าแก่','เปิดกิจการของตัวเอง',()=>!!S.biz],
 ['inv','นักลงทุน','มีพอร์ตหุ้นเกิน 1 ล้านบาท',()=>(S.stock||0)>=1e6]
];
function checkAch(){
  if(!S.ach)S.ach=[];if(!S.flags)S.flags={};
  ACH.forEach(a=>{if(!S.ach.includes(a[0])&&a[3]()){S.ach.push(a[0]);add('🏆 ปลดล็อกความสำเร็จ: '+a[1],'good');toast('🏆 '+a[1])}});
}
function fixSave(x){
  x.country=x.country||'ไทย';if(!COUNTRIES[x.country])x.country='ไทย';
  x.ap=x.ap||{g:x.g,skin:SKINS[1],hair:HAIRS[0],style:x.g==='M'?'short':'long'};
  x.flags=x.flags||{};x.ach=x.ach||[];x.stock=x.stock||0;x.fans=x.fans||0;
}

/* ---------- state ---------- */
const KEY='likhit_chiwit_v1';
let S=null,queue=[],showing=false,draft=null;

function save(){try{if(S)localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function loadSave(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(KEY)}catch(e){}}

function mkPerson(type,g,age,rel,last){const fam=['พ่อ','แม่','พี่น้อง','ลูก'].includes(type);return{id:uid(),type,g,name:nm(g)+' '+(last||sn()),age,rel,alive:true,d:{},ap:mkAp(g,fam&&S&&S.ap?S.ap.skin:null)}}
function mkDraft(g,country){g=g||pick(['M','F']);country=country||'ไทย';const C=COUNTRIES[country];const ap=mkAp(g);ap.skin=SKINS[pick(C.sk)];ap.hair=HAIRS[pick(C.hr)];return{g,country,first:pick(C[g]),last:pick(C.L),prov:pick(C.prov),wealth:'r',ap}}

function newLife(d){
  S={v:2,name:d.first+' '+d.last,first:d.first,last:d.last,g:d.g,prov:d.prov,country:d.country,ap:d.ap,stock:0,fans:0,ach:[],flags:{},wealth:d.wealth==='r'?pick([0,0,1,1,1,2]):d.wealth,
     age:0,alive:true,money:0,happy:R(60,100),health:R(60,100),smarts:R(10,90),looks:R(10,90),
     grade:0,boost:0,edu:0,uni:0,dropped:false,job:null,retired:false,jail:0,crime:0,service:0,
     cond:[],smoker:false,assets:[],pet:null,people:[],log:[{age:0,lines:[]}],done:{},cause:''};
  const dad=mkPerson('พ่อ','M',R(24,42),R(55,95),d.last);
  const mom=mkPerson('แม่','F',R(22,40),R(55,95),d.last);
  S.people.push(dad,mom);
  const sib=pick([0,0,1,1,2]);
  for(let i=0;i<sib;i++){const g=pick(['M','F']);S.people.push(mkPerson('พี่น้อง',g,R(1,9),R(30,80),d.last))}
  const wtxt=pick(['คุณเติบโตมาในบ้านที่อบอุ่น','พ่อแม่ของคุณดูแลคุณอย่างดี','คุณลืมตาดูโลกท่ามกลางญาติพี่น้องที่รอต้อนรับ']);
  add('คุณเกิดที่'+CN().pl+d.prov+' ประเทศ'+d.country+' ในชื่อ '+S.name,'info');
  add('พ่อของคุณคือ '+dad.name+' และแม่คือ '+mom.name);
  if(sib)add('คุณมีพี่น้อง '+sib+' คน');
  add(wtxt);
  render();
}

function add(t,c){const L=S.log[S.log.length-1];L.lines.push({t,c:c||''})}
function chg(k,v){S[k]=cl(S[k]+v)}
function mon(v){S.money=Math.round(S.money+v)}
function netPay(g){const k=W();let t=0;[[3e5,1e6,.1],[1e6,3e6,.2],[3e6,1e12,.3]].forEach(b=>{t+=Math.max(0,Math.min(g,b[1]*k)-b[0]*k)*b[2]});return Math.round(g-t)}
function netWorth(){return S.money+(S.stock||0)+(S.biz?S.biz.v:0)-(S.loan||0)+S.assets.reduce((a,x)=>a+x.v,0)}
function pay(n){if(S.money<n){toast('เงินไม่พอ (ต้องใช้ '+fmt(n)+')');return false}mon(-n);return true}
const friends=()=>S.people.filter(p=>p.alive&&p.type==='เพื่อน');
const partner=()=>S.people.find(p=>p.alive&&(p.type==='แฟน'||p.type==='คู่สมรส'));
const parentsAlive=()=>S.people.filter(p=>p.alive&&(p.type==='พ่อ'||p.type==='แม่'));
const hasHome=()=>S.assets.some(a=>a.home);

function inSchool(){return S.alive&&((S.age>=3&&S.age<=17&&!S.dropped)||S.uni>0)}
function schoolName(){
  if(S.uni>0)return'มหาวิทยาลัย ปี '+S.uni;
  const a=S.age;
  if(a<6)return'อนุบาล';
  if(a<12)return'ประถมศึกษา ป.'+(a-5);
  if(a<15)return'มัธยมต้น ม.'+(a-11);
  return'มัธยมปลาย ม.'+(a-14);
}
function stageName(){
  if(!S.alive)return'เสียชีวิต';
  if(S.jail>0)return'ผู้ต้องขัง';
  if(S.service>0)return'ทหารเกณฑ์';
  if(S.age<3)return'เด็กเล็ก';
  if(inSchool())return'นักเรียน · '+schoolName();
  if(S.job)return S.job.n;
  if(S.retired)return'เกษียณ';
  return'ว่างงาน';
}
function jobTitle(){return S.job?((LV[S.job.lvl]?LV[S.job.lvl]+' ':'')+S.job.n):''}

/* ---------- render ---------- */
function render(){
  if(!S)return;
  $('#nm').textContent=S.name;
  $('#ag').textContent='อายุ '+S.age+' ปี · '+stageName();
  $('#av').innerHTML=avatar(S.ap,{g:S.g,age:S.age,happy:S.happy,smarts:S.smarts,out:outfitOf(),dead:!S.alive});
  checkAch();
  const m=$('#mo');m.textContent=fmtHdr(S.money);m.title=fmt(S.money);m.classList.toggle('neg',S.money<0);
  $('#stats').innerHTML=[['happy','ความสุข','happy'],['health','สุขภาพ','health'],['smarts','ความฉลาด','smart'],['looks','หน้าตา','look']]
    .map(x=>'<div class="st"><div class="sl"><span>'+x[1]+'</span><b>'+S[x[0]]+'%</b></div>'+bar(S[x[0]],x[2])+'</div>').join('');
  let h='';
  S.log.slice(-30).forEach(L=>{
    if(!L.lines.length&&L!==S.log[S.log.length-1])return;
    h+='<div class="yr"><span class="yh">อายุ '+L.age+' ปี</span>'+L.lines.map(l=>'<div class="ln '+l.c+'">'+esc(l.t)+'</div>').join('')+'</div>';
  });
  const lg=$('#log');lg.innerHTML=h;lg.scrollTop=lg.scrollHeight;
  $('#ageBtn').disabled=!S.alive;
  save();
}

/* ---------- sheets & events ---------- */
function sheet(title,build){
  $('#sheetTitle').textContent=title;
  const b=$('#sheetBody');b.innerHTML='';build(b);
  $('#sheet').classList.add('open');
}
function closeSheet(){$('#sheet').classList.remove('open');render()}
$('#shx').onclick=closeSheet;

function ask(text,choices,title){queue.push({text,choices,title});pump()}
function pump(){
  if(showing||!queue.length)return;
  showing=true;
  const e=queue.shift();
  $('#evT').textContent=e.title||'เหตุการณ์';
  $('#evX').textContent=e.text;
  const c=$('#evC');c.innerHTML='';
  e.choices.forEach(ch=>{
    c.appendChild(row(esc(ch.t),'',()=>{
      $('#evm').classList.remove('open');
      showing=false;
      ch.f();
      render();
      pump();
      checkEnd();
    }));
  });
  $('#evm').classList.add('open');
}
function checkEnd(){if(S&&!S.alive&&!showing&&!queue.length)setTimeout(showDeath,400)}

/* ---------- death ---------- */
function deathChance(a,hp){
  let c=a<1?0.4:a<40?0.08:a<50?0.4:a<60?1.2:a<70?3:a<80?7:a<90?16:a<100?32:60;
  if(hp<25)c+=8;if(hp<10)c+=25;return c*(1-CN().hc*0.03)*(S.ins?0.85:1);
}
function die(cause){
  S.alive=false;S.cause=cause;
  add('คุณเสียชีวิตแล้วด้วยสาเหตุ: '+cause,'bad');
  render();
}
const WL=['ยากจน','ปานกลาง','ร่ำรวย'];
function tierName(n){return n<0?'ติดหนี้ท่วมตัว':n<300000?'ยากจน':n<1e7?'ปานกลาง':n<1e8?'ร่ำรวย':'มหาเศรษฐี'}
function tierIdx(n){return n<300000?0:n<1e7?1:2}
function showDeath(){
  const kids=S.people.filter(p=>p.type==='ลูก').length;
  const d=$('#death');
  d.innerHTML='<div class="in"><div class="portrait">'+avatar(S.ap,{g:S.g,age:S.age,happy:S.happy,dead:true})+'</div><h1>จบชีวิต</h1><p class="sub">'+esc(S.name)+' เสียชีวิตเมื่ออายุ '+S.age+' ปี</p>'
   +'<div class="box"><div style="font-weight:600;margin-bottom:4px">สาเหตุการเสียชีวิต</div>'+esc(S.cause)+'</div>'
   +'<div class="box"><div style="font-weight:600;margin-bottom:4px">🔓 ปลดล็อกแล้ว: ฐานะการเงิน</div>ฐานะครอบครัวตอนเกิด: <b>'+WL[S.wealth]+'</b><br>ฐานะตอนจบชีวิต: <b>'+tierName(netWorth())+'</b><br>'+(tierIdx(netWorth())>S.wealth?'คุณยกระดับฐานะของตัวเองได้สำเร็จ!':tierIdx(netWorth())<S.wealth?'ฐานะของคุณตกต่ำลงกว่าตอนเกิด':'ฐานะของคุณคงเดิมตลอดชีวิต')+'</div>'
   +'<div class="sum"><div>ทรัพย์สินสุทธิ<b>'+fmt(netWorth())+'</b></div><div>การศึกษา<b>'+EDU[S.edu]+'</b></div><div>จำนวนลูก<b>'+kids+' คน</b></div><div>ประวัติอาชญากรรม<b>'+S.crime+' ครั้ง</b></div></div>'
   +'<button class="big" id="dNew">เริ่มชีวิตใหม่</button><button class="big ghost" id="dLog">ย้อนอ่านชีวิตที่ผ่านมา</button></div>';
  d.classList.add('open');
  $('#dNew').onclick=()=>{d.classList.remove('open');clearSave();S=null;draft=mkDraft();drawStart()};
  $('#dLog').onclick=()=>d.classList.remove('open');
}

/* ---------- age up ---------- */
function ageUp(){
  if(!S||!S.alive||showing||queue.length)return;
  const wasTreated=!!S.done.treated,wasPosted=!!S.done.post;S.age++;S.done={};S.log.push({age:S.age,lines:[]});
  const a=S.age;

  // ผู้คนรอบตัว
  S.people.forEach(p=>{
    if(!p.alive)return;
    if(p.pl){p.d={};return} /* ผู้เล่นจริง (เพื่อนออนไลน์): อายุ/สถานะซิงก์จากเซิร์ฟเวอร์ ไม่แก่หรือตายตามระบบสุ่ม */
    p.age++;p.d={};
    const dc=p.age<50?0.2:p.age<60?1:p.age<70?3:p.age<80?8:p.age<90?18:35;
    if(chance(dc)){
      p.alive=false;
      add(p.type+' '+p.name+' เสียชีวิตแล้ว (อายุ '+p.age+' ปี)','bad');
      chg('happy',p.rel>50?-18:-8);
      if(p.type==='พ่อ'||p.type==='แม่'){
        const inh=[R(0,40000),R(80000,700000),R(800000,7000000)][S.wealth];
        if(inh>0&&a>=18){mon(inh);add('คุณได้รับมรดกจาก'+p.type+' '+fmt(inh),'good')}
      }
      if(p.type==='คู่สมรส')add('คุณกลายเป็นหม้ายแล้ว','bad');
      return;
    }
    if(p.type!=='อดีตคู่รัก')p.rel=cl(p.rel-R(0,3));
  });
  const pt=partner();
  if(pt&&pt.rel<15&&pt.type==='แฟน'&&chance(50)){
    pt.type='อดีตคู่รัก';chg('happy',-10);add(pt.name+' บอกเลิกคุณเพราะความรักจืดจางลง','bad');
  }

  // สัตว์เลี้ยง
  if(S.pet){
    S.pet.age++;
    if(S.pet.age>=R(11,17)){add(S.pet.name+' สัตว์เลี้ยงสุดรักของคุณจากไปแล้ว','bad');chg('happy',-12);S.pet=null}
    else chg('happy',2);
  }

  // เรือนจำ
  if(S.jail>0){
    S.jail--;chg('health',-R(1,4));chg('happy',-R(3,8));
    add(S.jail>0?'คุณยังอยู่ในเรือนจำ (เหลืออีก '+S.jail+' ปี)':'คุณได้รับการปล่อยตัวแล้ว!',S.jail>0?'bad':'good');
  }
  // เกณฑ์ทหาร
  if(S.service>0){
    if(S.job&&S.job.n==='ทหาร'){S.service=0;add('คุณเป็นทหารอาชีพอยู่แล้ว จึงไม่ต้องรับราชการเป็นทหารเกณฑ์','info')}
    else{S.service--;chg('health',3);
      add(S.service>0?'คุณรับใช้ชาติเป็นทหารเกณฑ์ (เหลืออีก '+S.service+' ปี)':'คุณปลดประจำการจากทหารเกณฑ์แล้ว ขอบคุณที่รับใช้ชาติ','info');
      if(S.service===0)chg('happy',4)}
  }

  // การศึกษา
  if(inSchool()&&S.jail===0){
    S.grade=cl(S.smarts*.55+S.boost+R(-5,35));S.boost=0;
    const gpa=Math.min(4,S.grade/25).toFixed(2);
    add('ปีการศึกษาที่ผ่านมา คุณได้เกรดเฉลี่ย '+gpa,S.grade>=75?'good':S.grade<35?'bad':'');
    if(S.grade>=80)chg('happy',3);if(S.grade<30)chg('happy',-4);
    chg('smarts',R(0,3));
    if(S.uni>0){
      if(S.uni>=4){S.uni=0;S.edu=4;add('คุณเรียนจบปริญญาตรีแล้ว ยินดีด้วย!','good');chg('happy',10)}
      else S.uni++;
    }
  }
  if(S.uni>0){
    const fee=[40000,20000,0][S.wealth];
    if(fee>0){mon(-fee);add('ค่าเทอมมหาวิทยาลัย '+fmt(fee)+(S.money<0?' (กู้ยืมเพิ่ม)':''))}
  }

  // ไมล์สโตน
  milestone(a);

  // การเงิน
  let inc=0,exp=0;
  if(S.job&&S.jail===0&&S.service===0){
    if(S.job.v){const J=JOBS.find(j=>j.n===S.job.n);S.job.sal=Math.round(R(J.s[0],Math.round(J.s[0]+(J.s[1]-J.s[0])*(0.15+S.job.perf/130)))*W())}
    else if(S.job.years>0)S.job.sal=Math.round(S.job.sal*1.03);
    inc+=netPay(S.job.sal);
  }
  if(!S.job&&a>=18&&a<60&&!inSchool()&&S.jail===0&&S.service===0&&S.money<30000&&!S.biz){const ur=Math.round(24000*W());inc+=ur;add('คุณได้รับเงินช่วยเหลือผู้ว่างงาน '+fmt(ur))}
  if(a>=60&&!S.job)inc+=Math.max(Math.round(36000*W()),S.pen||0);
  if(inc>100000*W())exp+=Math.round((inc-100000*W())*0.82);
  if(a>=20){
    let lv=(hasHome()?55000:85000)*CN().c;
    if(a<23&&(S.uni>0||!S.job))lv*=1-[0.2,0.6,1][S.wealth];
    if(a>=65)lv*=0.7;
    exp+=Math.round(lv);
  }
  S.assets.forEach(x=>{exp+=Math.round(x.p*x.up);x.v=Math.round(x.v*(1+x.gr+R(-3,3)/100))});
  if(S.pet&&a>=18)exp+=6000;
  S.people.filter(p=>p.alive&&p.type==='ลูก'&&p.age<18).forEach(()=>{exp+=Math.round(40000*CN().c)});
  if(S.jail>0)exp=0;
  if(S.fans>=5000){const fi=Math.round(S.fans*0.6);inc+=fi;add('รายได้จากสปอนเซอร์และโฆษณา '+fmt(fi),'good')}
  if(S.fans>0&&!wasPosted)S.fans=Math.round(S.fans*0.95);
  if(S.stock>0){const r=R(-30,40);S.stock=Math.max(0,S.stock+Math.round(S.stock*r/100));add('พอร์ตหุ้นของคุณ'+(r>=0?'เพิ่มขึ้น ':'ลดลง ')+Math.abs(r)+'% (มูลค่า '+fmt(S.stock)+')',r>=0?'good':'bad')}
  if(S.biz&&S.jail===0){
    if(chance(5)){add('กิจการ'+S.biz.n+'ของคุณล้มละลาย','bad');chg('happy',-10);S.biz=null}
    else{const pr=Math.round(S.biz.v*R(S.biz.lo,S.biz.hi)/100);inc+=pr;S.biz.v=Math.round(S.biz.v*1.02);add('กิจการ'+S.biz.n+(pr>=0?' มีกำไร ':' ขาดทุน ')+fmt(Math.abs(pr)),pr>=0?'good':'bad')}
  }
  if(S.ins)exp+=12000;
  if(S.loan>0){const itr=Math.round(S.loan*0.07);S.loan+=itr;const mp=Math.round(S.loan*0.1);if(S.money+inc-exp>=mp){exp+=mp;S.loan-=mp;add('คุณผ่อนชำระเงินกู้ '+fmt(mp)+' (ยอดหนี้คงเหลือ '+fmt(S.loan)+')')}else{chg('happy',-4);add('คุณผิดนัดชำระเงินกู้ ยอดหนี้ '+fmt(S.loan),'bad')}chg('happy',-1)}
  mon(inc-exp);
  if(inc>0)add('รายได้สุทธิปีนี้ '+fmt(inc)+' ค่าใช้จ่าย '+fmt(exp));
  if(S.money<0){S.money=Math.round(S.money*1.03);chg('happy',-3);if(a>=18)add('คุณมีหนี้สิน '+fmt(-S.money)+' ถูกทวงหนี้ตลอดทั้งปี','bad')}

  // งาน
  if(S.job&&S.jail===0&&S.service===0){
    S.job.years++;
    S.job.perf=cl(S.job.perf+R(-12,10));
    if(S.job.perf<=15&&chance(50)){add('คุณถูกไล่ออกจากงาน '+jobTitle()+' เพราะผลงานแย่','bad');chg('happy',-10);S.job=null}
    else if(S.job.perf>=70&&S.job.lvl<4&&chance(22)){
      S.job.lvl++;S.job.sal=Math.round(S.job.sal*1.18);
      add('คุณได้เลื่อนตำแหน่งเป็น '+jobTitle()+' เงินเดือนเพิ่มขึ้น!','good');chg('happy',8);
    }
  }
  if(S.job&&S.jail>0){S.job=null}

  // สุขภาพและบุคลิก
  let hd=0;
  if(a>40)hd-=(a-40)/12;
  S.cond.forEach(()=>{hd-=wasTreated?1:R(2,5)});
  if(S.smoker)hd-=2;
  if(S.ins&&hd<0)hd+=1;
  chg('health',Math.round(hd)+R(-1,1));
  chg('happy',R(-4,4)+(S.happy>70?-1:S.happy<30?2:0));
  if(a>35)chg('looks',-R(0,2));
  if(a>60)chg('smarts',-R(0,1));

  // เหตุการณ์
  if(S.jail===0){randomEvent();flavor()}

  // ความตาย
  if(S.health<=0){die(S.cond.length?pick(S.cond).cause:'สุขภาพทรุดโทรมสิ้นเชิง')}
  else if(chance(deathChance(a,S.health))){
    die(S.cond.length?pick(S.cond).cause:(a>=70?'ชราภาพ':pick(['อุบัติเหตุบนท้องถนน','ป่วยกะทันหัน','ภาวะแทรกซ้อนจากการติดเชื้อ'])));
  }
  render();
  pump();
  checkEnd();
}

function flavor(){

}

  if(a===6&&!S.dropped){add('คุณเข้าเรียนชั้น ป.1 และได้เพื่อนใหม่','info');addFriend();addFriend()}

  if(a===15&&!S.dropped){S.edu=2;add('คุณเริ่มเรียนชั้น ม.4 และได้ทำบัตรประชาชนใบแรก','info');addFriend()}

    if(!S.dropped){
      const fee=[40000,20000,0][S.wealth];
      ask('คุณจบ ม.6 แล้ว จะเรียนต่อมหาวิทยาลัยหรือไม่? (4 ปี'+(fee?' ค่าเทอมปีละ '+fmt(fee):'')+')',[
        {t:'เรียนต่อมหาวิทยาลัย',f:()=>{S.uni=1;S.job=null;add('คุณสอบเข้ามหาวิทยาลัยได้สำเร็จ!','good');chg('happy',6);askMajor()}},
        {t:'ออกไปหางานทำ',f:()=>add('คุณตัดสินใจเข้าสู่ตลาดแรงงานเลย')}
      ],'ก้าวสำคัญ');
    }
  }
  const isSoldier=()=>!!(S.job&&S.job.n==='ทหาร');
  const leaveJobForService=()=>{if(S.job)add('คุณต้องหยุดงาน '+jobTitle()+' เพื่อไปรับราชการทหาร','bad');S.job=null};
  if(a===22&&S.g==='M'&&CN().mil==='forced'){
    if(isSoldier())add('คุณรับราชการเป็นทหารอาชีพอยู่แล้ว จึงได้รับการยกเว้นการเกณฑ์ทหารภาคบังคับ','good');
    else{S.service=2;leaveJobForService();add('คุณต้องเข้ารับราชการทหารภาคบังคับ 2 ปี','bad');chg('happy',-5)}
  }
  if(a===21&&S.g==='M'&&CN().mil==='draw'){
    if(isSoldier())add('คุณรับราชการเป็นทหารอาชีพอยู่แล้ว จึงไม่ต้องไปจับสลากเกณฑ์ทหาร','good');
    else ask('ถึงเวลาจับสลากเกณฑ์ทหาร ใบดำหรือใบแดง?',[
      {t:'จับสลาก',f:()=>{
        if(isSoldier()){add('คุณเป็นทหารอาชีพอยู่แล้ว จึงไม่ต้องเป็นทหารเกณฑ์','good');return}
        if(chance(55)){add('ใบดำ! คุณไม่ต้องเป็นทหารเกณฑ์','good');chg('happy',8)}
        else{S.service=1;leaveJobForService();add('ใบแดง! คุณต้องเป็นทหารเกณฑ์ 1 ปี','bad');chg('happy',-6)}
      }}
    ],'เกณฑ์ทหาร');
  }
  if(a===60&&S.job){
    ask('คุณอายุครบ 60 ปีแล้ว จะเกษียณหรือทำงานต่อ?',[

    ],'เกษียณ');
  }
  if(a===70&&S.job){add('คุณเกษียณเพราะอายุมากแล้ว','info');S.pen=Math.round(S.job.sal*0.4);S.job=null;S.retired=true}
}

}

      b.appendChild(row('ทำงานหนักขึ้น',S.done.work?'ทำแล้วในปีนี้':'ผลงานดีขึ้น แต่เหนื่อย',S.done.work?null:()=>{S.done.work=1;S.job.perf=cl(S.job.perf+R(6,14));chg('health',-2);chg('happy',-2);add('คุณทุ่มเททำงานหนักปีนี้');panelJob()}));
      b.appendChild(row('ขอขึ้นเงินเดือน',S.done.raise?'ทำแล้วในปีนี้':'ต้องมีผลงานดีพอ',S.done.raise?null:()=>{S.done.raise=1;if(S.job.perf>60&&chance(55)){S.job.sal=Math.round(S.job.sal*1.1);add('หัวหน้าอนุมัติขึ้นเงินเดือนให้คุณ 10%','good');chg('happy',4)}else{add('หัวหน้าปฏิเสธคำขอขึ้นเงินเดือน','bad');chg('happy',-3)}panelJob()}));
      b.appendChild(row('ลาออกจากงาน','',()=>{add('คุณลาออกจากงาน '+jobTitle());if(S.age>=60){S.retired=true;S.pen=Math.round(S.job.sal*0.4)}S.job=null;panelJob()}));
    }else if(S.age>=18||(S.age>=15&&S.dropped)){
      if(S.uni>0||S.service>0||S.jail>0){b.appendChild(el('div','note',S.uni>0?'ขณะนี้คุณกำลังเรียนมหาวิทยาลัย จึงยังสมัครงานเต็มเวลาไม่ได้':S.service>0?'คุณกำลังรับใช้ชาติเป็นทหารเกณฑ์ (เหลืออีก '+S.service+' ปี) ปลดประจำการแล้วจึงสมัครงานได้':'ตอนนี้คุณไม่สามารถสมัครงานได้'))}
      else{
        b.appendChild(el('div','sec','ตำแหน่งงานที่เปิดรับ'));
        JOBS.forEach(J=>{
          let why='';
          if(S.edu<J.edu)why='ต้องจบ'+EDU[J.edu];
          else if(J.maj&&S.major&&S.major!==J.maj)why='ต้องจบสาขา'+majName(J.maj);
          else if(S.smarts<J.sm)why='ต้องมีความฉลาด '+J.sm+'+';
          else if(J.look&&S.looks<J.look)why='ต้องมีหน้าตา '+J.look+'+';
          else if(J.clean&&S.crime>0)why='ห้ามมีประวัติอาชญากรรม';
          const sal=J.v?'รายได้ไม่แน่นอน':fmt(J.s[0]*W())+' - '+fmt(J.s[1]*W())+'/ปี';
          b.appendChild(row(J.n,why||sal,why?null:()=>{
            const p=cl(35+S.smarts*.3+S.looks*.1+(S.edu>=J.edu?10:0)-S.crime*10);
            if(chance(Math.max(10,Math.min(90,p)))){
              S.job={n:J.n,v:J.v,lvl:0,perf:60,years:0,sal:Math.round(R(J.s[0],J.v?Math.round(J.s[0]+(J.s[1]-J.s[0])*.2):J.s[1])*W())};
              S.retired=false;add('คุณได้งานตำแหน่ง '+J.n+'!','good');chg('happy',8);
            }else{add('คุณสมัครงาน '+J.n+' แต่ไม่ผ่านการสัมภาษณ์','bad');chg('happy',-3)}
            panelJob();
          },why?'ไม่ผ่านเงื่อนไข':'สมัคร'));
        });
      }
    }else if(!inSchool()){b.appendChild(el('div','note','คุณยังเด็กเกินไปที่จะทำงาน'))}
  });
}

      b.appendChild(el('div','sec','สิ่งที่คุณมี'));

    b.appendChild(el('div','pcard','<div class="pl">พอร์ตหุ้น '+fmt(S.stock||0)+'</div><div class="ps">ผลตอบแทนแต่ละปีสุ่มตั้งแต่ −30% ถึง +40%</div>'));
    [10000,100000,1000000].forEach(n=>b.appendChild(row('ซื้อหุ้น '+fmt(n),S.age<18?'ต้องอายุ 18 ปีขึ้นไป':(S.money<n?'เงินไม่พอ':''),(S.age>=18&&S.money>=n)?()=>{mon(-n);S.stock=(S.stock||0)+n;add('คุณลงทุนซื้อหุ้น '+fmt(n));panelAssets();render()}:null)));
    if(S.stock>0)b.appendChild(row('ขายหุ้นทั้งหมด','ได้เงิน '+fmt(S.stock),()=>{mon(S.stock);add('คุณขายหุ้นทั้งหมดได้เงิน '+fmt(S.stock));S.stock=0;panelAssets();render()}));
    b.appendChild(el('div','sec','ธุรกิจส่วนตัว'));
    if(S.biz){
      b.appendChild(el('div','pcard','<div class="pl">'+S.biz.i+' '+esc(S.biz.n)+'</div><div class="ps">มูลค่ากิจการ '+fmt(S.biz.v)+' · กำไร/ขาดทุนผันแปรทุกปี</div>'));
      const ec=Math.round(S.biz.v*0.3);
      b.appendChild(row('ลงทุนขยายกิจการ',S.done.expand?'ทำแล้วในปีนี้':(S.money<ec?'เงินไม่พอ':'เพิ่มมูลค่ากิจการ'),(S.done.expand||S.money<ec)?null:()=>{S.done.expand=1;mon(-ec);S.biz.v+=Math.round(ec*1.15);add('คุณลงทุนขยายกิจการ '+S.biz.n+' เพิ่ม '+fmt(ec));panelAssets();render()},fmt(ec)));
      b.appendChild(row('ขายกิจการ','ได้เงิน '+fmt(S.biz.v*0.8),()=>{const m=Math.round(S.biz.v*0.8);mon(m);add('คุณขายกิจการ '+S.biz.n+' ได้เงิน '+fmt(m));S.biz=null;panelAssets();render()}));
    }else{
      BIZ.forEach(x=>b.appendChild(row(x.i+' เปิด'+x.n,S.age<18?'ต้องอายุ 18 ปีขึ้นไป':(S.money<x.p?'เงินไม่พอ':'เสี่ยงกำไร '+x.lo+'% ถึง +'+x.hi+'% ต่อปี'),(S.age>=18&&S.money>=x.p&&S.jail===0)?()=>{mon(-x.p);S.biz={n:x.n,i:x.i,v:x.p,lo:x.lo,hi:x.hi};add('คุณเปิด'+x.n+' ลงทุน '+fmt(x.p),'good');chg('happy',6);panelAssets();render()}:null,fmt(x.p))));
    }
    b.appendChild(el('div','sec','สินเชื่อธนาคาร'));
    {
      const lim=Math.round((S.job?S.job.sal*4:50000*W())+S.assets.reduce((a,x)=>a+x.v,0)*.5+(S.biz?S.biz.v*.5:0)),av=Math.max(0,lim-(S.loan||0));
      b.appendChild(el('div','pcard','<div class="pl">หนี้เงินกู้ '+fmt(S.loan||0)+'</div><div class="ps">วงเงินที่กู้เพิ่มได้ '+fmt(av)+' · ดอกเบี้ย 7%/ปี ผ่อนขั้นต่ำ 10%/ปี</div>'));
      [100000,500000,2000000].forEach(n=>b.appendChild(row('กู้เงิน '+fmt(n),S.age<20?'ต้องอายุ 20 ปีขึ้นไป':(av<n?'เกินวงเงินที่ได้รับอนุมัติ':''),(S.age>=20&&av>=n&&S.jail===0)?()=>{S.loan=(S.loan||0)+n;mon(n);add('คุณกู้เงินจากธนาคาร '+fmt(n));panelAssets();render()}:null)));
      if(S.loan>0){
        const rp=Math.min(S.loan,100000);
        b.appendChild(row('ชำระคืนบางส่วน '+fmt(rp),S.money<rp?'เงินไม่พอ':'',S.money>=rp?()=>{mon(-rp);S.loan-=rp;add('คุณชำระเงินกู้ '+fmt(rp));panelAssets();render()}:null));
        b.appendChild(row('ชำระหนี้ทั้งหมด '+fmt(S.loan),S.money<S.loan?'เงินไม่พอ':'',S.money>=S.loan?()=>{mon(-S.loan);add('คุณชำระเงินกู้หมดแล้ว!','good');chg('happy',6);S.loan=0;panelAssets();render()}:null));
      }
    }
    b.appendChild(el('div','sec','ประกันสุขภาพ'));
    b.appendChild(row(S.ins?'ยกเลิกประกันสุขภาพ':'ซื้อประกันสุขภาพ',S.ins?'กำลังคุ้มครอง ค่าเบี้ย ฿12,000/ปี':'฿12,000/ปี ลดความเสี่ยงเสียชีวิต และพบแพทย์ฟรี',()=>{S.ins=!S.ins;add(S.ins?'คุณซื้อประกันสุขภาพ':'คุณยกเลิกประกันสุขภาพ');panelAssets();render()}));
    b.appendChild(el('div','sec','ซื้อทรัพย์สิน'));
    SHOP.forEach(it=>{
      const ok=S.age>=it.min&&S.money>=it.p;
      b.appendChild(row(it.i+' '+it.n,S.age<it.min?'ต้องอายุ '+it.min+' ปีขึ้นไป':(S.money<it.p?'เงินไม่พอ':'ค่าบำรุงรักษา '+(it.up*100).toFixed(1)+'%/ปี'),ok?()=>{mon(-it.p);S.assets.push({id:uid(),n:it.n,p:it.p,v:it.p,up:it.up,gr:it.gr,i:it.i,home:it.home});add('คุณซื้อ'+it.n+' ราคา '+fmt(it.p),'good');chg('happy',5);panelAssets();render()}:null,fmt(it.p)));
    });
  });
}

function panelPeople(){
  sheet('ความสัมพันธ์',b=>{
    const groups=[['ครอบครัว',['พ่อ','แม่','พี่น้อง']],['คู่รัก',['แฟน','คู่สมรส']],['ลูก',['ลูก']],['เพื่อน',['เพื่อน']],['อดีตคู่รัก',['อดีตคู่รัก']]];
    groups.forEach(g=>{
      const list=S.people.filter(p=>g[1].includes(p.type));
      if(!list.length)return;
      b.appendChild(el('div','sec',g[0]));
      list.forEach(p=>b.appendChild(row('<span class="mini">'+avatar(p.ap,{age:p.age,happy:60,dead:!p.alive})+'</span>'+esc(p.name),p.alive?(p.type+' · อายุ '+p.age+' ปี'+(p.pl?' · 🌐 ผู้เล่นจริง':'')):p.type+' · เสียชีวิตแล้ว'+(p.pl?' · 🌐 ผู้เล่นจริง':''),p.alive?()=>panelPerson(p):null,p.alive?p.rel+'%':'✝')));
    });
    if(!S.people.length)b.appendChild(el('div','note','ยังไม่มีใครในชีวิตคุณ'));
  });
}
function panelPerson(p){
  p.d=p.d||{};
  sheet(p.type+' · '+p.name,b=>{
    b.appendChild(el('div','pcard','<div class="portrait">'+avatar(p.ap,{age:p.age,happy:p.rel})+'</div><div class="pl">'+esc(p.name)+'</div><div class="ps">'+p.type+' · อายุ '+p.age+' ปี</div><div style="font-size:12.5px;color:var(--mute)">ความสัมพันธ์ '+p.rel+'%</div>'+bar(p.rel,'rel')));
    const act=(k,t,s,fn,off)=>b.appendChild(row(t,p.d[k]?'ทำแล้วในปีนี้':s,(p.d[k]||off)?null:()=>{p.d[k]=1;fn();panelPerson(p)}));
    act('talk','คุยกัน','ความสัมพันธ์ดีขึ้นเล็กน้อย',()=>{p.rel=cl(p.rel+R(3,8));add('คุณคุยกับ '+p.name+' อย่างสนิทสนม')});
    act('time','ใช้เวลาด้วยกัน','ความสัมพันธ์ดีขึ้น และคุณมีความสุข',()=>{p.rel=cl(p.rel+R(5,12));chg('happy',2);add('คุณใช้เวลาดี ๆ กับ '+p.name,'good')});
    act('gift','ให้ของขวัญ','฿5,000',()=>{if(pay(5000)){p.rel=cl(p.rel+R(6,15));add('คุณซื้อของขวัญให้ '+p.name)}else p.d.gift=0,0},S.money<5000||S.age<12);
    if(['พ่อ','แม่','พี่น้อง'].includes(p.type)&&p.age>=18)act('ask','ขอเงิน','ขึ้นอยู่กับความสัมพันธ์',()=>{
      if(p.rel>=50&&chance(60+p.rel/4)){const m=R(500,5000)*(1+S.wealth*2);mon(m);add(p.name+' ให้เงินคุณ '+fmt(m),'good')}
      else{p.rel=cl(p.rel-3);add(p.name+' ปฏิเสธที่จะให้เงินคุณ','bad')}});
    act('insult','ด่าทอ','ความสัมพันธ์แย่ลงมาก',()=>{p.rel=cl(p.rel-R(10,25));chg('happy',-2);add('คุณทะเลาะและด่า '+p.name,'bad')});
    if(p.type==='แฟน'||p.type==='คู่สมรส'){
      act('date','ออกเดท','฿2,000',()=>{if(pay(2000)){p.rel=cl(p.rel+R(6,13));chg('happy',4);add('คุณพา '+p.name+' ไปออกเดท','good')}else p.d.date=0},S.money<2000);
      if(p.type==='แฟน'){
        b.appendChild(row('ขอแต่งงาน',S.money<50000?'ต้องมีเงินจัดงาน ฿50,000':'ค่าจัดงาน ฿50,000',(S.money<50000||p.rel<60||S.age<18||p.age<18)?null:()=>{
          if(chance(p.rel-10)&&pay(50000)){p.type='คู่สมรส';chg('happy',15);add('คุณแต่งงานกับ '+p.name+' อย่างอบอุ่น','good')}
          else{p.rel=cl(p.rel-10);add(p.name+' ปฏิเสธการขอแต่งงาน','bad');chg('happy',-8)}
          panelPerson(p);render()}));
        b.appendChild(row('เลิกกัน','',()=>{p.type='อดีตคู่รัก';chg('happy',-6);add('คุณเลิกกับ '+p.name,'bad');panelPeople();render()}));
      }else{
        b.appendChild(row('หย่าร้าง','เสียทรัพย์สินบางส่วน',()=>{p.type='อดีตคู่รัก';if(S.money>0)S.money=Math.round(S.money*.6);chg('happy',-10);add('คุณหย่ากับ '+p.name+' และต้องแบ่งสินสมรส','bad');panelPeople();render()}));
      }
      const canKid=p.g!==S.g&&S.age>=18&&p.age>=18&&(S.g==='F'?S.age:p.age)<=45;
      act('kid','พยายามมีลูก',canKid?'โอกาสประมาณ 40%':'ไม่สามารถมีลูกตามธรรมชาติได้',()=>{
        if(chance(40)){const g=pick(['M','F']);const k=mkPerson('ลูก',g,0,80,S.last);S.people.push(k);chg('happy',15);add('ลูกของคุณเกิดแล้ว! ตั้งชื่อว่า '+k.name,'good')}
        else add('ปีนี้คุณยังไม่มีข่าวดี')},!canKid);
    }
  });
}

function openAdm(){admDraw();ao.classList.add('open')}

function askCode(){
  if(admAuth)return openAdm();
  let lk=0;try{lk=+localStorage.getItem('lk_al')||0}catch(e){}
  if(Date.now()<lk)return toast('ใส่รหัสผิดหลายครั้ง ล็อกชั่วคราว รอสักครู่');
  const inp=$('#admkI');inp.value='';ak.classList.add('open');setTimeout(()=>inp.focus(),300)}
function tryCode(){const v=$('#admkI').value.trim();
  if(hex(sha256(SE.encode(ASALT+v)))===ADMH){admAuth=true;try{sessionStorage.setItem('lk_adm','1')}catch(e){}showFab();att=0;closeKey();openAdm();toast('🛠️ เข้าสู่โหมดแอดมินแล้ว (มีปุ่ม 🛠️ ลอยในเกมให้กดเปิดใหม่)')}
  else{att++;$('#admkI').value='';if(att>=5){att=0;try{localStorage.setItem('lk_al',String(Date.now()+60000))}catch(e){}closeKey();toast('ใส่รหัสผิด 5 ครั้ง ล็อก 1 นาที')}else toast('รหัสไม่ถูกต้อง ('+att+'/5)')}}
$('#admkG').onclick=tryCode;$('#admkX').onclick=closeKey;

/* ปุ่มลับ: แตะชื่อตัวละคร / ชื่อเกมหน้าเริ่ม 7 ครั้ง หรือกด Alt+Shift+A */
let tc=0,tt=0;const tap=()=>{const n=Date.now();if(n-tt>2000)tc=0;tt=n;if(++tc>=7){tc=0;askCode()}};
document.addEventListener('click',e=>{const x=e.target;if(x&&x.closest&&x.closest('#nm,#ag,#evT,#start h1,#death h1'))tap()},true);
/* ขณะแอดมิน/ช่องรหัสเปิดอยู่ ห้ามปุ่มลัดของเกม (เลข 1-6, B, M ฯลฯ) ไปกดโดนเหตุการณ์/เมนูข้างหลัง */
window.addEventListener('keydown',e=>{
  const o=ao.classList.contains('open'),k=ak.classList.contains('open');
  if(!o&&!k)return;
  if(e.altKey&&e.shiftKey&&e.key.toLowerCase()==='a')return;
  if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();k?closeKey():ao.classList.remove('open');return}
  e.stopImmediatePropagation()},true);
document.addEventListener('keydown',e=>{if(e.altKey&&e.shiftKey&&e.key.toLowerCase()==='a'){e.preventDefault();askCode()}});

/* ===== v11: ระบบใหม่ สไตล์ BitLife — ยศทหาร / การเมือง / วงการบันเทิง / สุรา / ชีวิตในเรือนจำ ===== */
(function(){
const N=o=>{o.custom='x';ACTS.splice(ACTS.length-1,0,o)};
const stress=v=>{S.stress=cl((S.stress==null?20:S.stress)+v)};
const act=o=>N({k:o.k,t:o.t,s:o.s,min:o.min,jail:o.jail,open:()=>{
  if(S.jail>0&&!o.jail)return toast('ทำไม่ได้ขณะอยู่ในเรือนจำ');
  if(S.done[o.k])return toast('ทำแล้วในปีนี้');
  if(o.c&&S.money<o.c)return toast('เงินไม่พอ');
  if(o.g&&!o.g())return;
  if(o.c)mon(-o.c);
  S.done[o.k]=1;o.f();closeSheet()}});
const RANK=['พลทหาร','สิบเอก','ร้อยเอก','พันเอก','พลเอก'];
const PRANK=['สิบตำรวจเอก','ร้อยตำรวจเอก','พันตำรวจโท','พันตำรวจเอก','พลตำรวจเอก'];
const POL=['สมาชิกสภาท้องถิ่น','ส.ส.','รัฐมนตรี','นายกรัฐมนตรี'];
const POLC=[50000,300000,1000000,3000000],POLS=[420000,1200000,3000000,6000000],POLA=[25,28,35,40];
const ENTT=['นักแสดงหน้าใหม่','นักแสดง / ศิลปิน','ดารา','ซูเปอร์สตาร์'],ENTS=[120000,500000,2500000,12000000];
const pm=()=>S.polMax==null?-1:S.polMax;
const isJob=n=>!!(S.job&&S.job.n===n);

/* ชื่อตำแหน่งตามยศ */
const _jt=jobTitle;
jobTitle=function(){
  if(!S||!S.job)return '';
  const n=S.job.n,l=Math.max(0,Math.min(4,S.job.lvl||0));
  if(n==='ทหาร')return RANK[l];
  if(n==='ตำรวจ')return PRANK[l];
  if(n==='นักการเมือง')return POL[Math.min(3,l)];
  if(n==='นักแสดง / ศิลปิน')return ENTT[Math.min(3,l)];
  return _jt()};

/* ---------- การเมือง ---------- */
function polChance(L){return Math.max(8,Math.min(80,Math.round(18+S.smarts*.22+S.looks*.08+Math.min(15,(S.fans||0)/30000)+(L===0?12:0)-L*8-S.crime*30+Math.round(((S.karma==null?50:S.karma)-50)/5))))}
function polPanel(){sheet('🗳️ การเมือง',b=>{
  const cur=isJob('นักการเมือง')?S.pol:-1;
  b.appendChild(row('สถานะปัจจุบัน',cur>=0?POL[cur]+' (เหลือวาระ '+S.polT+' ปี)':(pm()>=0?'อดีต'+POL[pm()]:'ยังไม่เคยลงสมัคร')));
  POL.forEach((n,L)=>{
    const need=L===0?3:4;let why='';
    if(S.age<POLA[L])why='ต้องอายุ '+POLA[L]+' ปีขึ้นไป';
    else if(S.edu<need)why='ต้องจบ'+EDU[need];
    else if(L>pm()+1)why='ต้องเคยเป็น'+POL[L-1]+'ก่อน';
    else if(S.crime>0)why='มีประวัติอาชญากรรม';
    else if(S.service>0||S.uni>0)why='ตอนนี้ลงสมัครไม่ได้';
    else if(cur>=L)why='คุณอยู่ในตำแหน่งนี้หรือสูงกว่าแล้ว';
    else if(S.done.pol)why='ลงสมัครไปแล้วในปีนี้';
    else if(S.money<POLC[L])why='เงินไม่พอ';
    b.appendChild(row('🗳️ ลงสมัคร: '+n,why||('ค่าหาเสียง '+fmt(POLC[L])+' · โอกาสชนะ ~'+polChance(L)+'%'),why?null:()=>{
      mon(-POLC[L]);S.done.pol=1;
      if(chance(polChance(L))){
        if(S.job&&S.job.n!=='นักการเมือง')add('คุณลาออกจากงาน '+jobTitle()+' เพื่อเข้าสู่เส้นทางการเมือง','info');
        S.job={n:'นักการเมือง',lvl:L,perf:60,years:0,sal:Math.round(POLS[L]*W())};
        S.pol=L;S.polT=4;S.polMax=Math.max(pm(),L);S.retired=false;
        chg('happy',10);S.fans=Math.min(5e6,(S.fans||0)+R(2000,20000)*(L+1));
        add('คุณชนะการเลือกตั้ง ได้เป็น'+POL[L]+'!','good');
      }else{chg('happy',-6);add('คุณแพ้การเลือกตั้ง เงินหาเสียงสูญเปล่า','bad')}
      closeSheet()},why?'':fmt(POLC[L])));
  });
  if(cur>=0)b.appendChild(row('🚪 ลาออกจากตำแหน่ง','',()=>{add('คุณลาออกจากตำแหน่ง'+POL[S.pol]);S.job=null;closeSheet()}));
})}
act({k:'polmenu',t:'🗳️ การเมือง / ลงสมัครเลือกตั้ง',s:'เริ่มจากสมาชิกสภาท้องถิ่น ไต่ขึ้นเป็นนายกฯ',min:25,jail:0,f:()=>{}});
ACTS.find(a=>a.k==='polmenu').open=()=>{if(S.jail>0)return toast('ทำไม่ได้ขณะอยู่ในเรือนจำ');polPanel()};

/* ---------- วงการบันเทิง ---------- */
act({k:'audition',t:'🎬 ออดิชั่นวงการบันเทิง',s:'ฟรี ใช้หน้าตา ทักษะ และผู้ติดตามช่วยได้',min:16,g:()=>{
    if(S.uni>0||S.service>0){toast('ตอนนี้ยังไม่ว่างออดิชั่น');return false}
    if(S.age<18&&isJob('นักแสดง / ศิลปิน')===false&&false)return false;return true},
  f:()=>{
    const e=S.ent==null?-1:S.ent,comeback=e>=0&&!isJob('นักแสดง / ศิลปิน');
    const sk=(S.sk&&((S.sk.art||0)+(S.sk.music||0)))||0;
    let p=10+S.looks*.35+sk*4+Math.min(15,(S.fans||0)/40000)+S.smarts*.08-(comeback?0:(e+1)*12)+(comeback?25:0);
    p=Math.max(5,Math.min(75,p));
    if(chance(p)){
      if(!comeback)S.ent=Math.min(3,e+1);
      S.fans=Math.min(5e6,(S.fans||0)+R(1000,15000)*(S.ent+1));
      if(S.job&&S.job.n!=='นักแสดง / ศิลปิน')add('คุณลาออกจากงานเดิมเพื่อเข้าวงการบันเทิง','info');
      S.job={n:'นักแสดง / ศิลปิน',lvl:S.ent,perf:60,years:0,sal:Math.round(R(ENTS[S.ent]*.6,ENTS[S.ent]*1.6)*W())};S.retired=false;
      chg('happy',9);add(comeback?'คุณกลับมาโลดแล่นในวงการอีกครั้ง!':'คุณผ่านการออดิชั่น ก้าวสู่ระดับ'+ENTT[S.ent]+'!','good');
    }else{chg('happy',-3);add('คุณไปออดิชั่นแต่ไม่ได้รับเลือก','bad')}}});

/* ---------- สุรา ---------- */
function drink(){

  else add('คุณดื่มสังสรรค์กับเพื่อน ๆ')}
act({k:'drink',t:'🍺 ดื่มสังสรรค์',s:'฿800 คลายเครียด แต่เสี่ยงติดสุรา',min:18,c:800,f:drink});
act({k:'rehab',t:'🏥 เข้ารับการบำบัดการติดสุรา',s:'฿60,000 ต้องติดสุราอยู่จึงเข้าได้',min:18,c:60000,g:()=>{if(!S.addict){toast('คุณไม่ได้ติดสุรา');return false}return true},
  f:()=>{if(chance(65)){S.addict=false;S.alc=0;S.flags.sober=1;chg('happy',6);chg('health',3);add('คุณผ่านการบำบัด เลิกสุราได้สำเร็จ','good')}else{chg('happy',-3);add('การบำบัดไม่สำเร็จ คุณกลับไปดื่มอีกครั้ง','bad')}}});

/* ---------- ชีวิตในเรือนจำ ---------- */
function prisonPanel(){sheet('⛓️ ชีวิตในเรือนจำ (เหลือ '+S.jail+' ปี)',b=>{
  const o=(key,t,s,fn,cost)=>{const off=S.done[key]||(cost&&S.money<cost);

  o('pr_good','😇 ประพฤติตัวดี ขอลดโทษ','โอกาสได้ลดโทษ 1 ปี',()=>{if(chance(45)){S.jail=Math.max(0,S.jail-1);add(S.jail>0?'ผู้คุมพิจารณาลดโทษให้คุณ 1 ปี':'คุณได้รับการลดโทษและพ้นโทษแล้ว!','good')}else add('คำขอลดโทษของคุณไม่ผ่านการพิจารณา')});
  o('pr_work','🧺 ทำงานในเรือนจำ','ได้เงินเล็กน้อย',()=>{const m=R(2000,6000);mon(m);chg('health',-1);add('คุณทำงานในเรือนจำได้ค่าแรง '+fmt(m))});
  o('pr_gym','🏋️ ออกกำลังกายในลานนักโทษ','สุขภาพ +',()=>{chg('health',R(1,3));chg('happy',1);add('คุณออกกำลังกายในเรือนจำ')});
  o('pr_read','📚 อ่านหนังสือในห้องสมุด','ความฉลาด +',()=>{chg('smarts',R(1,3));add('คุณใช้เวลาอ่านหนังสือในห้องสมุดเรือนจำ')});
  o('pr_appeal','⚖️ จ้างทนายอุทธรณ์คดี','มีโอกาสลดโทษ',()=>{if(chance(30+S.smarts/5)){const y=Math.min(S.jail,R(1,3));S.jail-=y;add('ศาลอุทธรณ์ลดโทษให้คุณ '+y+' ปี','good');if(S.jail<=0)add('คุณได้รับการปล่อยตัว!','good')}else{chg('happy',-3);add('ศาลอุทธรณ์ยกคำร้องของคุณ','bad')}},100000);

})}
N({k:'prison',t:'⛓️ ชีวิตในเรือนจำ',s:'ลดโทษ ทำงาน อุทธรณ์ หรือแหกคุก (ใช้ได้ตอนติดคุก)',min:10,jail:1,open:()=>{if(S.jail>0)prisonPanel();else toast('ใช้ได้เฉพาะตอนอยู่ในเรือนจำ')}});

const _ag11=ageUp;
ageUp=function(){
  const a0=S&&S.age,sv=S&&S.service,pj=S&&S.alive&&S.job&&(S.job.n==='นักการเมือง'||S.job.n==='นักแสดง / ศิลปิน')?S.job.n:null;
  if(pj)S.job.perf=Math.max(S.job.perf,32);
  _ag11();
  if(!S||!S.alive||S.age===a0)return;
  /* อาชีพพิเศษ: ล็อกระดับ/เงินเดือนไม่ให้ระบบเลื่อนอัตโนมัติรวน */
  if(pj&&S.job&&S.job.n===pj){
    if(pj==='นักการเมือง'){
      S.job.lvl=S.pol;S.job.sal=Math.round(POLS[S.pol]*W());
      S.polT=(S.polT||1)-1;
      if(S.polT<=0){const L=S.pol;
        ask('วาระ'+POL[L]+'ของคุณสิ้นสุดลงแล้ว จะลงสมัครสมัยต่อไปหรือไม่?',[
          {t:'ลงสมัครต่อ',f:()=>{if(!isJob('นักการเมือง'))return;
            const p=Math.max(15,Math.min(85,Math.round(30+(S.job.perf-50)*.5+Math.min(15,(S.fans||0)/50000)+S.smarts*.1)));
            if(chance(p)){S.polT=4;chg('happy',6);add('คุณได้รับเลือกตั้งอีกสมัย','good')}else{S.job=null;chg('happy',-8);add('คุณแพ้การเลือกตั้งและพ้นจากตำแหน่ง','bad')}}},
          {t:'วางมือทางการเมือง',f:()=>{if(isJob('นักการเมือง')){S.job=null;add('คุณวางมือทางการเมืองและใช้ชีวิตเงียบ ๆ')}}}],'การเมือง')}
    }else{
      S.job.lvl=S.ent;S.job.sal=Math.round(R(ENTS[S.ent]*.6,ENTS[S.ent]*1.6)*W());
      S.fans=Math.min(5e6,(S.fans||0)+R(1000,20000)*(S.ent+1))}
  }
  if(isJob('ทหาร')&&S.job.lvl>=3)S.flags.milTop=1;
  /* ปลดประจำการทหารเกณฑ์ → ชวนเป็นทหารอาชีพ */
  if(sv>0&&S.service===0&&!S.job&&S.edu>=3&&S.crime===0){
    S.flags.discharged=1;
    ask('คุณปลดประจำการจากทหารเกณฑ์แล้ว สนใจสมัครเป็นทหารอาชีพต่อหรือไม่?',[
      {t:'สมัครเป็นทหารอาชีพ',f:()=>{if(S.job)return;const J=JOBS.find(j=>j.n==='ทหาร');
        if(chance(75)){S.job={n:'ทหาร',lvl:0,perf:60,years:0,sal:Math.round(R(J.s[0],J.s[1])*W())};S.retired=false;chg('happy',5);add('คุณสมัครเป็นทหารอาชีพสำเร็จ ได้ยศ '+RANK[0],'good')}else add('คุณสมัครเป็นทหารอาชีพแต่ไม่ผ่านการคัดเลือก','bad')}},
      {t:'กลับสู่ชีวิตพลเรือน',f:()=>{add('คุณกลับสู่ชีวิตพลเรือน')}}],'หลังปลดประจำการ')}
  else if(sv>0&&S.service===0)S.flags.discharged=1;
  /* สุรา */
  if(S.addict){
    chg('health',-R(2,5));chg('happy',-R(1,4));const m=R(8000,40000);mon(-m);
    add('การติดสุราทำให้คุณเสียเงิน '+fmt(m)+' และสุขภาพทรุดลง','bad');
    const pt=partner();if(pt)pt.rel=cl(pt.rel-R(2,6));
    if(S.car&&chance(6)){mon(-30000);chg('happy',-4);add('คุณถูกจับข้อหาเมาแล้วขับ ถูกปรับ '+fmt(30000),'bad')}
  }else if(S.alc>0&&chance(60))S.alc--;
  /* ความสำเร็จ */
  S.ach5=S.ach5||[];
  A5.forEach(a=>{if(!S.ach5.includes(a[0])&&a[4]()){S.ach5.push(a[0]);add('🏆 ปลดล็อกความสำเร็จ: '+a[2],'good');toast('🏆 '+a[2])}});
  render()};

(function(){

 {k:'diligent',n:'ขยัน',e:'🛠️',d:'ผลงานในหน้าที่ดีขึ้นทุกปี'},

function mobJoin(){
  S.mob={r:0,rep:0,since:S.age};S.flags.mobbed=1;kd(-10);chg('happy',2);
  add('คุณเข้าร่วมแก๊งมาเฟียในฐานะ'+MR[0]+' โลกมืดเริ่มต้นขึ้นแล้ว','bad')}
function caught(lo,hi,txt){jail(lo,hi);S.job=null;kd(-6);add(txt+' (เหลือโทษ '+S.jail+' ปี)','bad')}
function mobPanel(){sheet('🕶️ โลกมืด',b=>{
  const m=S.mob;
  if(!m){
    b.appendChild(el('div','note','แก๊งให้เงินดีแต่เสี่ยงติดคุกและเสียกรรม ตำรวจ ทหาร และนักการเมืองเข้าร่วมไม่ได้'));
    let why='';
    if(isJob('ตำรวจ')||isJob('ทหาร')||isJob('นักการเมือง'))why='อาชีพของคุณขัดกับการเข้าแก๊ง';
    else if(S.done.mobjoin)why='ติดต่อไปแล้วในปีนี้';
    b.appendChild(row('🤝 ติดต่อขอเข้าแก๊ง',why||'โอกาสสำเร็จขึ้นกับความฉลาดและหน้าตา',why?null:()=>{
      S.done.mobjoin=1;
      if(chance(Math.min(80,35+S.smarts*.2+S.looks*.15+S.crime*10)))mobJoin();
      else{chg('happy',-3);add('แก๊งปฏิเสธคุณ บอกว่ายังไม่น่าไว้ใจ')}
      closeSheet()}));
    return}
  b.appendChild(row('สถานะในแก๊ง',MR[m.r]+' · ชื่อเสียงในแก๊ง '+m.rep+'/100'));
  const o=(key,t,s,fn)=>b.appendChild(row(t,S.done[key]?'ทำแล้วในปีนี้':s,S.done[key]?null:()=>{S.done[key]=1;fn();if(S.mob&&S.jail===0&&S.alive)mobPanel();else closeSheet();render()}));
  o('mb_collect','💰 เก็บค่าคุ้มครองร้านค้า','เงินปานกลาง เสี่ยงโดนจับ ~'+Math.max(5,18-m.r*2)+'%',()=>{

const _ag12=ageUp;
ageUp=function(){
  const a0=S&&S.age;
  if(!S||!S.alive)return _ag12();
  const d0=Object.assign({},S.done),c0=S.crime,tr=S.trait;
  _ag12();
  if(!S||!S.alive||S.age===a0)return;
  if(S.karma==null)S.karma=50;
  if(!S.trait){S.trait=pick(TR).k}
  /* กรรมจากการกระทำปีที่ผ่านมา */
  if(d0.charity)kd(3);if(d0.temple)kd(2);if(d0.blood)kd(3);
  if(S.crime>c0)kd(-6*(S.crime-c0));
  if(!S.mob){if(kv()>50&&chance(8))kd(-1);else if(kv()<50&&chance(8))kd(1)}
  /* นิสัย */
  switch(S.trait){
    case 'diligent':if(S.job)S.job.perf=cl(S.job.perf+2);break;
    case 'charm':S.people.forEach(p=>{if(p.alive)p.rel=cl(p.rel+R(0,2))});break;
    case 'angry':stress(3);chg('happy',-1);break;
    case 'kind':kd(2);break;
    case 'lazy':if(S.job)S.job.perf=cl(S.job.perf-2);stress(-2);break;
    case 'clever':if(chance(35))chg('smarts',1);break;
    case 'timid':stress(2);break;}
  /* แก๊งมาเฟีย */
  const m=S.mob;
  if(m){
    if(isJob('ตำรวจ')||isJob('ทหาร')||isJob('นักการเมือง')){S.mob=null;add('อาชีพใหม่ทำให้คุณต้องตัดขาดจากแก๊ง')}

    else{
      let g=Math.round(R(5000,20000)*(m.r+1)*W());if(m.r>=4)g+=Math.round(R(300000,1200000)*W());
      mon(g);add('คุณได้ส่วนแบ่งจากแก๊ง '+fmt(g),'info');
      if(chance(Math.max(3,8-m.r))){jail(1,3);S.job=null;add('ตำรวจบุกทลายแก๊ง คุณถูกจับ (เหลือโทษ '+S.jail+' ปี)','bad')}
      else if(chance(5)){chg('health',-R(10,25));add('แก๊งคู่แค้นมาล้างแค้นคุณ บาดเจ็บสาหัส','bad')}
    }
  }
  S.ach6=S.ach6||[];
  A6.forEach(a=>{if(!S.ach6.includes(a[0])&&a[4]()){S.ach6.push(a[0]);add('🏆 ปลดล็อกความสำเร็จ: '+a[2],'good');toast('🏆 '+a[2])}});
  render()};

/* ริบบิ้นชีวิต: สรุปตอนจบเหมือน BitLife */
function ribbons(){
  const r=[],k=S.people.filter(p=>p.type==='ลูก').length,w=netWorth();
  if(w>=1e8)r.push(['💎','มหาเศรษฐี','ทรัพย์สินสุทธิเกิน 100 ล้าน']);else if(w>=1e7)r.push(['💰','เศรษฐี','ทรัพย์สินสุทธิเกิน 10 ล้าน']);
  if(w<0)r.push(['📉','ชีวิตติดลบ','เสียชีวิตทั้งที่มีหนี้']);
  if(S.age>=100)r.push(['🎂','ร้อยปีไม่เสียชีวิต','อายุยืนเกิน 100 ปี']);else if(S.age>=80)r.push(['🧓','ผู้อายุยืน','อายุเกิน 80 ปี']);
  if(S.age<18)r.push(['🕊️','จากไปก่อนวัย','เสียชีวิตก่อนอายุ 18 ปี']);
  if(k>=5)r.push(['👨‍👩‍👧‍👦','ครอบครัวใหญ่','มีลูก 5 คนขึ้นไป']);
  if((S.fame||0)>=55)r.push(['⭐','ดาราดัง','ชื่อเสียงระดับดารา']);
  if((S.hack||0)>=60)r.push(['💻','แฮ็กเกอร์ระดับเทพ','ทักษะไซเบอร์สูงมาก']);
  if(S.cult&&S.cult.r>=4)r.push(['🕯️','ผู้นำสูงสุดของลัทธิ','ขึ้นเป็นผู้นำลัทธิ']);else if(S.flags&&S.flags.cult)r.push(['🕯️','ผู้ศรัทธา','เป็นสมาชิกลัทธิจนวาระสุดท้าย']);
  if(S.flags&&S.flags.escaped)r.push(['🕳️','ผู้หลบหนี','แหกคุกและไม่ถูกจับ']);
  if((S.fans||0)>=1e6)r.push(['📡','ผู้ติดตามล้านคน','มีผู้ติดตามเกิน 1 ล้าน']);
  if((S.crime||0)>=3)r.push(['⛓️','ขาใหญ่สายมืด','ก่ออาชญากรรมหลายครั้ง']);
  if(S.edu>=4)r.push(['🎓','บัณฑิต','จบปริญญาตรีขึ้นไป']);
  if(S.retired)r.push(['🏖️','เกษียณสำเร็จ','ได้ใช้ชีวิตหลังเกษียณ']);
  if(S.people.some(p=>p.type==='ลูก'&&S.adopted))r.push(['💗','พ่อแม่ผู้อุปถัมภ์','รับเลี้ยงบุตรบุญธรรม']);
  return r}
const sd2=showDeath;
showDeath=function(){

<script>
/* ===== ระบบใหม่ 2: ลัทธิ / แฮ็กเกอร์ / สตรีมเมอร์ / แผนแหกคุกขั้นสูง ===== */
(function(){
const fm=n=>'฿'+Math.round(n).toLocaleString('en-US');
const N=o=>{o.custom='x';ACTS.splice(ACTS.length-1,0,o)};
const once=(k,fn)=>{if(S.done[k])return toast('ทำแล้วในปีนี้');S.done[k]=1;fn()};
const done=(k)=>S.done[k];
const nodo=()=>{if(S.jail>0){toast('ใช้ไม่ได้ขณะอยู่ในเรือนจำ');return true}return false};
const fan=v=>{S.fans=Math.max(0,Math.min(5e6,(S.fans||0)+v))};

/* ---------- 🕯️ ลัทธิ ---------- */
const CR=['ผู้ศรัทธาใหม่','สาวก','ผู้นำกลุ่ม','มหาปราชญ์','ผู้นำสูงสุด'];
const CULTS=[['🌞','ลัทธิแสงธรรมสุขใจ','เน้นนั่งสมาธิและชุมชนอบอุ่น'],['🌑','สมาคมจันทร์ดับ','ความลับ พิธีกรรมกลางคืน'],['🛸','ศรัทธาดาวสุดท้าย','เชื่อว่ามนุษย์ต่างดาวจะมารับ']];
function cultPanel(){

  const c=S.cult;
  if(!c){sheet('🕯️ ลัทธิ',b=>{
    b.appendChild(el('div','note','มีกลุ่มศรัทธาชวนคุณเข้าร่วม คุณอาจพบความสุขหรือเสียทั้งเงินและอิสรภาพ'));

    if(S.age<16)b.appendChild(el('div','note','ต้องอายุ 16 ปีขึ้นไป'))});return}
  sheet('🕯️ '+c.n,b=>{
    b.appendChild(el('div','pcard','<div class="pl">'+CR[c.r]+'</div><div class="ps">ความศรัทธา '+c.d+'/100 · เป็นสมาชิกมา '+(S.age-c.since)+' ปี · ความสนใจจากตำรวจ '+c.heat+'</div>'+bar(c.d,'happy')));
    b.appendChild(row('🙏 เข้าร่วมพิธีกรรม','ศรัทธา + ความสุข + (ฟรี)',done('cu1')?null:()=>{once('cu1',()=>{c.d=Math.min(100,c.d+R(5,12));chg('happy',R(2,6));chg('smarts',-1);add('คุณเข้าร่วมพิธีกรรมของ'+c.n,'good')});cultPanel();render()},done('cu1')?'ทำแล้ว':''));
    b.appendChild(row('💸 บริจาคให้ลัทธิ','฿100,000 ศรัทธา +15',done('cu2')||S.money<100000?null:()=>{once('cu2',()=>{mon(-100000);c.d=Math.min(100,c.d+15);add('คุณบริจาค '+fm(100000)+' ให้'+c.n,'info')});cultPanel();render()},S.money<100000?'เงินไม่พอ':''));
    b.appendChild(row('📣 ชักชวนคนเข้าลัทธิ','ศรัทธา + แต่เสี่ยงถูกตำรวจจับตา',done('cu3')?null:()=>{once('cu3',()=>{c.d=Math.min(100,c.d+8);if(chance(35)){c.heat++;add('มีคนแจ้งตำรวจเรื่องที่คุณชักชวนคนเข้าลัทธิ','bad')}else add('คุณชักชวนเพื่อนใหม่เข้ากลุ่มได้','good')});cultPanel();render()},done('cu3')?'ทำแล้ว':''));
    const need=25*(c.r+1);
    b.appendChild(row('⬆️ ขอเลื่อนขั้น',c.r>=4?'คุณเป็นผู้นำสูงสุดแล้ว':'ต้องมีศรัทธา '+need+' ขึ้นไป',c.r<4&&c.d>=need?()=>{c.r++;chg('happy',5);add('คุณได้เลื่อนขั้นเป็น "'+CR[c.r]+'" ในลัทธิ','good');cultPanel();render()}:null));
    if(c.r>=3)b.appendChild(row('💰 รับเงินถวายจากสาวก','ผู้นำได้รับเงินถวายทุกปี',done('cu4')?null:()=>{once('cu4',()=>{const m=R(40000,250000)*(c.r-1);mon(m);c.heat+=chance(40)?1:0;add('คุณได้รับเงินถวายจากสาวก '+fm(m),'good')});cultPanel();render()},done('cu4')?'ทำแล้ว':''));
    b.appendChild(row('🚪 ออกจากลัทธิ',c.d>=60?'ศรัทธาสูง อาจถูกตามตื๊อหรือแก้แค้น':'ออกได้ค่อนข้างง่าย',()=>{
      const risk=c.d>=60?55:15;S.cult=null;S.flags.cult=0;
      if(chance(risk)){const m=Math.min(Math.max(S.money,0),R(20000,150000));mon(-m);chg('happy',-8);add('คุณออกจากลัทธิ แต่ถูกตามตื๊อและเรียกเก็บเงิน '+fm(m),'bad')}
      else{chg('happy',4);add('คุณออกจากลัทธิได้สำเร็จ ชีวิตกลับมาเป็นอิสระ','good')}
      closeSheet()}))})}
N({k:'cult',t:'🕯️ ลัทธิ',s:'เข้าร่วม ไต่ขั้น บริจาค หรือออกจากลัทธิ',min:16,open:cultPanel});
EV.push(
{cond:()=>!!S.cult&&S.jail===0&&S.money>20000&&Math.random()<.4,go:()=>ask('ลัทธิของคุณขอให้ทุกคนช่วยกันบริจาคเพื่อ "พิธีใหญ่ประจำปี"',[
  {t:'บริจาค ฿50,000',f:()=>{if(!S.cult)return;mon(-50000);S.cult.d=Math.min(100,S.cult.d+10);add('คุณบริจาค ฿50,000 ให้ลัทธิ','info')}},
  {t:'ปฏิเสธ',f:()=>{if(!S.cult)return;S.cult.d=Math.max(0,S.cult.d-12);chg('happy',-2);add('คนในลัทธิมองคุณด้วยสายตาไม่พอใจ','bad')}}],'เรียกเก็บเงินลัทธิ')},
{cond:()=>!!S.cult&&S.cult.heat>=2&&S.jail===0&&Math.random()<.5,go:()=>{
  const r=S.cult.r;S.cult.heat=0;
  if(r>=2){add('ตำรวจบุกจับลัทธิ คุณในฐานะแกนนำถูกจับกุม','bad');S.cult=null;S.flags.cult=0;jail(1,4)}
  else add('ตำรวจบุกตรวจค้นลัทธิ คุณถูกสอบสวนแต่ไม่ถูกดำเนินคดี','bad')}}
);

/* ---------- 💻 แฮ็กเกอร์ (เนื้อหาในเกมเท่านั้น ไม่มีรายละเอียดทางเทคนิค) ---------- */
function hackPanel(){
  if(nodo())return;
  if(!(S.inv&&S.inv.laptop))return toast('ต้องมีโน้ตบุ๊กก่อน ซื้อได้ที่ร้านค้า (🎒 กระเป๋า)');
  const k=S.hack||0,d=S.done;
  sheet('💻 แฮ็กเกอร์',b=>{
    b.appendChild(el('div','pcard','<div class="pl">ระดับทักษะ '+k+'/100</div><div class="ps">เรียนรู้ความปลอดภัยไซเบอร์ ใช้ทางสว่างหรือทางมืดก็ได้ · ทางมืดเสี่ยงติดคุก</div>'+bar(k,'smart')));
    b.appendChild(row('📘 ฝึกเขียนโค้ดและความปลอดภัยไซเบอร์','ฟรี ทักษะ + ความฉลาด +',d.hk1?null:()=>{once('hk1',()=>{S.hack=Math.min(100,k+R(3,8));chg('smarts',1);add('คุณฝึกทักษะไซเบอร์จนเก่งขึ้น','good')});hackPanel();render()},d.hk1?'ทำแล้ว':''));
    b.appendChild(row('🐞 ล่าบั๊กบาวน์ตี้ (ถูกกฎหมาย)',k>=15?'รับรางวัลจากบริษัทที่หาช่องโหว่ให้':'ต้องมีทักษะ 15 ขึ้นไป',k>=15&&!d.hk2?()=>{once('hk2',()=>{
      if(chance(40+k/2)){const m=Math.round(R(5000,60000)*(1+k/40));mon(m);S.hack=Math.min(100,k+2);add('คุณพบช่องโหว่และได้รางวัลบาวน์ตี้ '+fm(m),'good')}else add('ปีนี้คุณหาช่องโหว่ไม่เจอ','info')});hackPanel();render()}:null,d.hk2?'ทำแล้ว':''));
    b.appendChild(row('🧑‍💼 รับเป็นที่ปรึกษาความปลอดภัยองค์กร',k>=70?'รายได้ดี ถูกกฎหมาย':'ต้องมีทักษะ 70 ขึ้นไป',k>=70&&!d.hk5?()=>{once('hk5',()=>{const m=R(100000,600000);mon(m);add('คุณรับงานที่ปรึกษาด้านความปลอดภัย ได้ '+fm(m),'good')});hackPanel();render()}:null,d.hk5?'ทำแล้ว':''));
    b.appendChild(row('🏦 แฮ็กบัญชีธนาคาร (ผิดกฎหมาย)',k>=35?'โอกาสสำเร็จขึ้นกับทักษะ ล้มเหลว = ติดคุก':'ต้องมีทักษะ 35 ขึ้นไป',k>=35&&!d.hk3?()=>{once('hk3',()=>{
      if(chance(20+k*.5)){const m=Math.round(R(100000,1500000)*(1+k/60));mon(m);S.crime++;S.hack=Math.min(100,k+3);add('คุณแฮ็กระบบธนาคารสำเร็จ ได้เงิน '+fm(m)+' แต่เสี่ยงถูกตามรอย','bad')}
      else{add('คุณถูกตรวจพบระหว่างแฮ็กระบบธนาคาร','bad');jail(1,5)}});if(S.jail>0)closeSheet();else hackPanel();render()}:null,d.hk3?'ทำแล้ว':''));
    b.appendChild(row('💣 โจมตีระบบบริษัทเรียกค่าไถ่ (ผิดกฎหมายรุนแรง)',k>=60?'กำไรสูงมาก โทษหนัก':'ต้องมีทักษะ 60 ขึ้นไป',k>=60&&!d.hk4?()=>{once('hk4',()=>{
      if(chance(15+k*.4)){const m=Math.round(R(500000,5000000));mon(m);S.crime+=2;add('คุณเรียกค่าไถ่จากบริษัทสำเร็จ ได้เงิน '+fm(m),'bad')}
      else{add('ตำรวจไซเบอร์ตามรอยคุณพบ','bad');jail(2,8)}});if(S.jail>0)closeSheet();else hackPanel();render()}:null,d.hk4?'ทำแล้ว':''))})}
N({k:'hacker',t:'💻 แฮ็กเกอร์',s:'ฝึกทักษะไซเบอร์ ล่าบั๊ก หรือเดินทางมืด (ต้องมีโน้ตบุ๊ก)',min:13,open:hackPanel});

/* ---------- 📡 สตรีมเมอร์ ---------- */
function livePanel(){
  if(nodo())return;
  if(!(S.inv&&(S.inv.phone||S.inv.laptop)))return toast('ต้องมีสมาร์ทโฟนหรือโน้ตบุ๊กก่อน');

      else if(chance(5)){fan(-Math.round(f*.1));add('คุณเผลอพูดพลาดระหว่างไลฟ์ ผู้ติดตามหายไปส่วนหนึ่ง','bad');chg('happy',-4)}
      else add('คุณไลฟ์สดและได้โดเนท '+fm(m),'good')});livePanel();render()},d.lv1?'ทำแล้ว':''));
    b.appendChild(row('🤝 รับสปอนเซอร์',f>=50000?'ค่าโฆษณา '+fm(50000)+'–'+fm(500000):'ต้องมีผู้ติดตาม 50,000 คนขึ้นไป',f>=50000&&!d.lv2?()=>{once('lv2',()=>{const m=Math.round(R(50000,500000)*(1+f/1e6));mon(m);add('คุณรับงานสปอนเซอร์ ได้เงิน '+fm(m),'good')});livePanel();render()}:null,d.lv2?'ทำแล้ว':''))})}
N({k:'streamer',t:'📡 สตรีมเมอร์',s:'ไลฟ์สด รับโดเนทและสปอนเซอร์ (ต้องมีโทรศัพท์/โน้ตบุ๊ก)',min:12,open:livePanel});

/* ---------- 🔓 แผนแหกคุกขั้นสูง (ใช้ได้ตอนติดคุก) ---------- */
function escapePanel(){
  if(S.jail<=0)return toast('ใช้ได้เฉพาะตอนอยู่ในเรือนจำ');
  const d=S.done,k=S.hack||0;
  const go=(key,fn)=>()=>{once(key,()=>{fn()});if(S.jail>0&&S.alive)escapePanel();else closeSheet();render()};
  const win=(how)=>{S.jail=0;S.crime+=2;S.flags.escaped=1;chg('happy',-4);add('คุณแหกคุกสำเร็จด้วยการ'+how+'! แต่ต้องหลบหนีเจ้าหน้าที่','info')};
  const lose=(y,why)=>{S.jail+=y;chg('happy',-6);add(why+' คุณถูกเพิ่มโทษอีก '+y+' ปี','bad')};
  sheet('🔓 แผนแหกคุกขั้นสูง (เหลือ '+S.jail+' ปี)',b=>{

<script>

    b.appendChild(row('🥊 ขึ้นชกสมัครเล่น','โอกาสชนะขึ้นกับฝีมือและสุขภาพ เสี่ยงบาดเจ็บ',d.bx2||S.health<20?null:()=>{once('bx2',()=>{
      const p=Math.min(85,30+x.sk*.5+S.health*.2);

      else{x.l++;chg('health',-R(3,12));chg('happy',-3);add('คุณแพ้การชกและบาดเจ็บ','bad')}});re()},S.health<20?'สุขภาพไม่พร้อม':(d.bx2?'ทำแล้ว':'')));

      if(chance(20+x.sk*.5)){const m=R(200000,2000000);mon(m);x.w++;x.champ=1;S.fame=Math.min(100,(S.fame||0)+5);fan_(R(5000,80000));chg('happy',10);add('คุณคว้าแชมป์! ได้เงินรางวัล '+fm(m),'good')}
      else{x.l++;chg('health',-R(8,20));chg('happy',-6);add('คุณพ่ายแพ้ในศึกชิงแชมป์ และบาดเจ็บหนัก','bad')}});re()}:null,d.bx3?'ทำแล้ว':''))})}
const fan_=v=>{S.fans=Math.max(0,Math.min(5e6,(S.fans||0)+v))};
N({k:'boxing',t:'🥊 สังเวียนมวย',s:'ฝึกซ้อม ขึ้นชก ชิงแชมป์ (อายุ 14–45 ปี)',min:14,open:boxPanel});

/* ---------- 🕵️ นักสืบเอกชน ---------- */
function detPanel(){

  const x=S.det=S.det||{cases:0,rep:0,office:0},d=S.done,mul=x.office?1.5:1,re=()=>{detPanel();render()};
  sheet('🕵️ นักสืบเอกชน',b=>{
    b.appendChild(el('div','pcard','<div class="pl">ชื่อเสียง '+x.rep+'/100'+(x.office?' · มีสำนักงาน':'')+'</div><div class="ps">คดีที่ไขสำเร็จ '+x.cases+' คดี · ความฉลาด '+S.smarts+'</div>'+bar(x.rep,'smart')));
    b.appendChild(row('🔍 รับคดีสืบสวน','โอกาสสำเร็จขึ้นกับความฉลาด',d.dt1?null:()=>{once('dt1',()=>{
      if(chance(40+S.smarts*.4)){const m=Math.round(R(10000,100000)*(1+x.rep/30)*mul);mon(m);x.cases++;x.rep=Math.min(100,x.rep+4);add('คุณไขคดีสืบสวนสำเร็จ ได้ค่าจ้าง '+fm(m),'good')}
      else{x.rep=Math.max(0,x.rep-1);add('คุณสืบคดีนี้ไม่สำเร็จ','info')}});re()},d.dt1?'ทำแล้ว':''));

      const m=Math.round(R(200000,1000000)*mul);mon(m);x.cases++;x.rep=Math.min(100,x.rep+6);
      if(chance(25)){const h=R(10,30);chg('health',-h);add('ปฏิบัติการลับสำเร็จ ได้ '+fm(m)+' แต่คุณบาดเจ็บ','bad')}else add('ปฏิบัติการลับสำเร็จอย่างเงียบเชียบ ได้ '+fm(m),'good')});re()}:null,d.dt2?'ทำแล้ว':''));
    b.appendChild(row('🏢 เปิดสำนักงานนักสืบ',x.office?'เปิดแล้ว ค่าจ้างทุกคดี x1.5':(x.rep>=40?'฿300,000 ค่าจ้างทุกคดี x1.5':'ต้องมีชื่อเสียง 40 ขึ้นไป'),!x.office&&x.rep>=40&&S.money>=300000?()=>{mon(-300000);x.office=1;add('คุณเปิดสำนักงานนักสืบเป็นของตัวเอง','good');re()}:null,x.office?'✓':''))})}
N({k:'detective',t:'🕵️ นักสืบเอกชน',s:'รับคดี ปฏิบัติการลับ เปิดสำนักงาน',min:20,open:detPanel});

/* ---------- 🧬 ตรวจ DNA ---------- */
function dnaPanel(){
  if(nodo())return;
  if(S.done.dna)return toast('ทำแล้วในปีนี้');
  if(S.money<3000)return toast('เงินไม่พอ (฿3,000)');
  mon(-3000);S.done.dna=1;
  const r=Math.random()*100;
  if(r<25&&S.people.filter(p=>p.type==='พี่น้อง'&&p.alive).length<6){
    const g=pick(['M','F']),c=mkPerson('พี่น้อง',g,R(15,60),R(30,60),S.last);S.people.push(c);chg('happy',6);
    add('ผลตรวจ DNA พบว่าคุณมีพี่น้องต่างมารดา/บิดาที่ไม่เคยรู้จัก: '+c.name+' (อายุ '+c.age+' ปี)','info')}
  else if(r<40){chg('happy',-3);add('ผลตรวจ DNA พบความเสี่ยงโรคทางพันธุกรรมบางอย่าง คุณควรตรวจสุขภาพสม่ำเสมอ','info')}
  else if(r<55){const m=R(50000,500000);mon(m);chg('happy',4);add('ผลตรวจ DNA นำไปสู่ญาติห่างๆ ที่ยกมรดกให้คุณ '+fm(m),'good')}
  else if(r<75){chg('happy',2);add('ผลตรวจ DNA บอกว่าบรรพบุรุษของคุณมาจากหลายเชื้อชาติ น่าสนใจมาก','info')}
  else{chg('health',1);add('ผลตรวจ DNA ปกติ ไม่พบสิ่งผิดปกติ','good')}
  closeSheet()}
N({k:'dna',t:'🧬 ตรวจ DNA',s:'฿3,000 ตามหาญาติ ตรวจความเสี่ยงโรค',min:18,open:dnaPanel});

function cryptoPanel(){
  if(nodo())return;

  sheet('🪙 เทรดคริปโต',b=>{
    b.appendChild(el('div','note','ตลาดผันผวนสุดขีด อาจรวยข้ามคืนหรือเงินหายหมด ลงทุนได้ปีละครั้ง'));
    [50000,500000,5000000].forEach(n=>b.appendChild(row('ลงทุน '+fm(n),S.money>=n?'ผลลัพธ์สุ่ม ตั้งแต่เป็นศูนย์ถึง 4 เท่า':'เงินไม่พอ',S.money>=n?()=>{
      S.done.cry=1;mon(-n);const r=Math.random()*100;let k,t,c='bad';
      if(r<8){k=4;t='เหรียญพุ่งทะลุเพดาน!';c='good'}else if(r<32){k=1.6;t='ตลาดเป็นขาขึ้น';c='good'}else if(r<60){k=.8;t='ตลาดแกว่งตัวลง'}else if(r<88){k=.35;t='ตลาดทรุดหนัก'}else{k=0;t='เหรียญที่คุณซื้อโดนโกง ราคาเป็นศูนย์'}
      const back=Math.round(n*k);mon(back);const diff=back-n;stress2(diff<0?12:-4);chg('happy',diff<0?-6:6);
      add('คุณเทรดคริปโตด้วยเงิน '+fm(n)+' — '+t+' ได้คืน '+fm(back)+' ('+(diff>=0?'กำไร ':'ขาดทุน ')+fm(Math.abs(diff))+')',diff>=0?'good':c);closeSheet()}:null)))})}
N({k:'crypto',t:'🪙 เทรดคริปโต',s:'เสี่ยงสูง รวยหรือเจ๊งภายในปีเดียว',min:18,open:cryptoPanel});

<script>

(function(){
const fm=n=>'฿'+Math.round(n).toLocaleString('en-US');
const N=o=>{o.custom='x';ACTS.splice(ACTS.length-1,0,o)};

const nodo=()=>{if(S.jail>0){toast('ใช้ไม่ได้ขณะอยู่ในเรือนจำ');return true}return false};

 {i:'🛏️',n:'หอพัก',r:48000,d:'ประหยัด ความสุข +1/ปี',h:1,s:0,x:0},
 {i:'🏢',n:'ห้องเช่า / คอนโด',r:150000,d:'ความสุข +2/ปี · เครียดลด',h:2,s:-2,x:0},

 {i:'🏡',n:'วิลล่าเช่าหรู',r:900000,d:'ความสุข +5/ปี · สุขภาพ +1 · หน้าตา +1/ปี',h:5,s:-5,x:2}];

  const sp=S.sp=S.sp||{},v=sp[k]||0,d=S.done,ka='sp_'+k+'a',kt='sp_'+k+'t',re=()=>{sportPanel(k);render()};

<script>
/* ===== ระบบใหม่ 5: ตลาดหุ้น (แอปในโทรศัพท์/คอมพิวเตอร์) + ระบบเลี้ยงลูก ===== */
(function(){

const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};

/* ---------- 📊 ตลาดหุ้น ---------- */
const STK=[
 {s:'SJF',n:'สุขใจ ฟู้ดส์',i:'🍚',p:42,mu:.07,sg:.12,dv:.03,b:.6},

  return S.mk}
const worth=()=>{const m=S.mk;return m?STK.reduce((a,t)=>a+((m.hold[t.s]||{n:0}).n*(m.px[t.s]||0)),0):0};
const _nw2=netWorth;netWorth=function(){return _nw2()+Math.round(worth())};
function mkYear(){
  if(!S.mk)return;const m=S.mk;

function spark(h){

    if(i&&ks.length&&!i.querySelector('.heir')){const w=Math.max(0,netWorth()),box=el('div','box heir','<div style="font-weight:600;margin-bottom:4px">🧧 มรดกที่ส่งต่อให้ลูก</div>ลูก '+ks.length+' คน ได้รับมรดกคนละ <b>'+fm(w/ks.length)+'</b>');
      const f=i.querySelector('.sum');if(f)f.before(box);else i.appendChild(box)}}catch(e){}
};
})();
