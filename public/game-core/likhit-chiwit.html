<script>
/* ===== ระบบใหม่ 6: เล่นต่อรุ่นลูก (สืบทอดครอบครัว) + พินัยกรรม + ประกันชีวิต ===== */
(function(){
const fm=n=>'฿'+Math.round(n).toLocaleString('en-US');
const N=o=>{o.custom='x';ACTS.splice(ACTS.length-1,0,o)};
const heirs=()=>S.people.filter(p=>p.alive&&p.type==='ลูก'&&!p.pl);
const WILL={eq:['⚖️','แบ่งเท่าๆ กัน','ลูกทุกคนได้เท่ากัน'],fav:['💗','ให้ลูกคนสนิทที่สุดมากกว่า','คนที่ความสัมพันธ์สูงสุดได้ 50% ที่เหลือแบ่งเท่าๆ กัน'],char:['🤝','บริจาค 20% เพื่อการกุศล','หักไปบริจาค 20% ที่เหลือแบ่งเท่าๆ กัน']};
const prem=()=>Math.round(20000*W());
const PAY=2000000;

/* คำนวณมรดกต่อลูกแต่ละคน (ภาษีมรดก 10% ของส่วนที่เกิน ฿10 ล้าน) */
function shares(){
  const ks=heirs();if(!ks.length)return{list:[],tax:0,est:0};
  let est=Math.max(0,netWorth())+(S.lifeIns?Math.round(PAY*W()):0);
  const tax=est>1e7?Math.round((est-1e7)*.1):0;let net=est-tax;
  if(S.will==='char')net=Math.round(net*.8);
  let map={};
  if(S.will==='fav'&&ks.length>1){const f=ks.reduce((a,b)=>b.rel>a.rel?b:a);map[f.id]=Math.round(net*.5);const rest=Math.round(net*.5/(ks.length-1));ks.forEach(k=>{if(k!==f)map[k.id]=rest})}
  else ks.forEach(k=>{map[k.id]=Math.round(net/ks.length)});
  return{list:ks.map(k=>({k,amt:map[k.id]||0})),tax,est}}

/* ---------- 📜 พินัยกรรมและประกันชีวิต ---------- */
function willPanel(){
  if(S.jail>0)return toast('ใช้ไม่ได้ขณะอยู่ในเรือนจำ');
  const cur=S.will||'eq';
  sheet('📜 พินัยกรรมและประกันชีวิต',b=>{
    const sh=shares();
    b.appendChild(el('div','pcard','<div class="pl">คาดว่ามรดกรวม '+fm(sh.est)+'</div><div class="ps">ภาษีมรดก '+fm(sh.tax)+' (10% ของส่วนที่เกิน ฿10 ล้าน) · ทายาท '+sh.list.length+' คน</div>'));
    b.appendChild(el('div','sec','พินัยกรรม'));
    Object.keys(WILL).forEach(k=>b.appendChild(row(WILL[k][0]+' '+WILL[k][1],WILL[k][2],k===cur?null:()=>{S.will=k;add('คุณเขียนพินัยกรรม: '+WILL[k][1],'info');willPanel()},k===cur?'✓':'')));
    b.appendChild(el('div','sec','ประกันชีวิต'));
    b.appendChild(row(S.lifeIns?'🛡️ ยกเลิกประกันชีวิต':'🛡️ ซื้อประกันชีวิต',S.lifeIns?'หยุดจ่ายเบี้ย':'เบี้ย '+fm(prem())+'/ปี ทายาทได้รับ '+fm(PAY*W())+' เมื่อคุณเสียชีวิต',S.lifeIns||S.money>=prem()?()=>{S.lifeIns=S.lifeIns?0:1;add(S.lifeIns?'คุณซื้อประกันชีวิตให้ทายาท':'คุณยกเลิกประกันชีวิต','info');willPanel()}:null))})}
N({k:'will',t:'📜 พินัยกรรมและประกันชีวิต',s:'วางแผนมรดกให้ลูก เล่นต่อรุ่นลูกได้เมื่อจบชีวิต',min:25,open:willPanel});
function insYear(){if(!S.lifeIns)return;const m=prem();if(S.money<m){S.lifeIns=0;add('คุณจ่ายเบี้ยประกันชีวิตไม่ไหว กรมธรรม์ขาดอายุ','bad');return}mon(-m);add('จ่ายเบี้ยประกันชีวิต '+fm(m),'info')}
const au2=ageUp;
ageUp=function(){const a0=S&&S.age;au2();if(!S||!S.alive||S.age===a0)return;try{insYear()}catch(e){}render()};
$('#ageBtn').onclick=ageUp;

/* ---------- 👪 เล่นต่อเป็นรุ่นลูก ---------- */
function continueAs(kid,amt,takeBiz){
  const old=S,gen=(old.gen||1)+1,k=kid.kd||{},sibs=heirs().filter(x=>x!==kid);
  const spouse=old.people.find(p=>p.alive&&p.type==='คู่สมรส');
  const first=String(kid.name).split(' ')[0],last=old.last||String(kid.name).split(' ').slice(1).join(' ');
  const wealth=amt<3e5?0:amt<1e7?1:2;
  const oldBiz=takeBiz&&old.biz?Object.assign({},old.biz):null,keepFans=Math.round((old.fans||0)*.1),oldName=old.name,oldG=old.g,oldAp=old.ap,oldAge=old.age,oldCause=old.cause;
  newLife({g:kid.g,country:old.country,first,last,prov:old.prov,wealth,ap:kid.ap||old.ap});
  S.age=kid.age;S.name=kid.name;S.gen=gen;S.fans=keepFans;
  if(typeof k.sm==='number')S.smarts=k.sm;if(typeof k.hl==='number')S.health=k.hl;
  S.edu=S.age>=22&&(k.ed||0)>=2?4:S.age>=18?3:S.age>=15?2:S.age>=12?1:0;
  S.money=Math.round(amt);if(oldBiz){S.biz=oldBiz;S.money=Math.max(0,Math.round(amt-oldBiz.v))}S.happy=cl(70-(S.age>=6?10:0));
  S.log=[{age:S.age,lines:[]}];
  const dead={id:uid(),type:oldG==='F'?'แม่':'พ่อ',g:oldG,name:oldName,age:oldAge,rel:80,alive:false,d:{},ap:oldAp};
  S.people=[dead];
  if(spouse)S.people.push(Object.assign({},spouse,{type:oldG==='F'?'พ่อ':'แม่',rel:Math.max(60,spouse.rel||60),d:{}}));
  sibs.forEach(x=>S.people.push(Object.assign({},x,{type:'พี่น้อง',d:{}})));
  add('👪 คุณคือ '+S.name+' ลูกของ '+oldName+' — เล่นต่อเป็นรุ่นที่ '+gen,'info');
  if(oldBiz)add('คุณรับช่วงกิจการ '+oldBiz.n+' ต่อจากครอบครัว','good');
  add(oldName+' เสียชีวิตด้วยสาเหตุ: '+(oldCause||'ไม่ทราบ')+' คุณได้รับมรดก '+fm(amt),'bad');
  if(S.age>=6)add('คุณเศร้าโศกกับการจากไปของ'+(oldG==='F'?'แม่':'พ่อ'),'bad');
  const d=document.getElementById('death');d.classList.remove('open');queue=[];showing=false;
  try{save()}catch(e){}
  render();
}
const sd6=showDeath;
showDeath=function(){
  sd6.apply(this,arguments);
  try{
    const i=document.querySelector('#death .in');if(!i)return;
    const old=i.querySelector('.heir');if(old)old.remove();
    const sh=shares();if(!sh.list.length||S.cheat&&0)return;
    const box=document.createElement('div');box.className='box heirs';
    let h='<div style="font-weight:600;margin-bottom:6px">👪 สืบทอดต่อ — เล่นต่อเป็นรุ่นลูก</div><div style="font-size:12.5px;opacity:.8;margin-bottom:8px">มรดกรวม '+fm(sh.est)+(sh.tax?' · ภาษีมรดก '+fm(sh.tax):'')+' · พินัยกรรม: '+WILL[S.will||'eq'][1]+'</div>';
    box.innerHTML=h;
    sh.list.forEach(x=>{const b=document.createElement('button');b.className='big ghost';b.type='button';b.style.cssText='margin:4px 0;width:100%;text-align:left';
      b.textContent='▶ เล่นเป็น '+x.k.name+' (อายุ '+x.k.age+' ปี) · มรดก '+fm(x.amt);
      b.onclick=function(){continueAs(x.k,x.amt)};box.appendChild(b);
      if(S.biz&&S.biz.v>0){const c=document.createElement('button');c.className='big ghost';c.type='button';c.style.cssText='margin:0 0 6px;width:100%;text-align:left;opacity:.9';c.textContent='   ↳ และรับช่วงกิจการ '+S.biz.n+' (มูลค่า '+fm(S.biz.v)+' หักจากมรดก)';c.onclick=function(){continueAs(x.k,x.amt,true)};box.appendChild(c)}});
    const nb=i.querySelector('#dNew');if(nb)nb.before(box);else i.appendChild(box);
  }catch(e){}
};
const ag=document.getElementById('ag');
new MutationObserver(function(){if(S&&S.gen>1&&ag.textContent.indexOf('รุ่น')<0)ag.textContent+=' · รุ่น '+S.gen}).observe(ag,{childList:true,characterData:true,subtree:true});
})();
</script>
<script>
/* ===== ระบบใหม่ 7: ของหรู / งานวิจัย (โนเบล) / ผจญภัยล่าสมบัติ / ความสำเร็จใหม่ ===== */
(function(){
const fm=n=>'฿'+Math.round(n).toLocaleString('en-US');
const N=o=>{o.custom='x';ACTS.splice(ACTS.length-1,0,o)};
const once=(k,fn)=>{if(S.done[k])return toast('ทำแล้วในปีนี้');S.done[k]=1;fn()};
const nodo=()=>{if(S.jail>0){toast('ใช้ไม่ได้ขณะอยู่ในเรือนจำ');return true}return false};
const fan_=v=>{S.fans=Math.max(0,Math.min(5e6,(S.fans||0)+v))};

/* ---------- 💎 ของหรู ---------- */
const LUX=[
 {k:'yacht',i:'🛥️',n:'เรือยอชต์',p:15e6,dep:.93,up:.02,d:'มูลค่าลดลงปีละ 7% ค่าบำรุงรักษา 2%'},
 {k:'jet',i:'🛩️',n:'เครื่องบินส่วนตัว',p:80e6,dep:.92,up:.03,d:'มูลค่าลดลงปีละ 8% ค่าบำรุงรักษา 3%'},
 {k:'island',i:'🏝️',n:'เกาะส่วนตัว',p:200e6,dep:1.05,up:.005,d:'มูลค่าเพิ่มปีละ 5% ค่าดูแล 0.5%'}];
function luxPanel(){
  if(nodo())return;
  sheet('💎 ของหรู',b=>{
    b.appendChild(el('div','note','ของหรูนับเป็นทรัพย์สิน ขายคืนได้ในเมนูทรัพย์สิน แต่ต้องเสียค่าบำรุงรักษาทุกปี'));
    LUX.forEach(x=>{const price=Math.round(x.p*W()),has=S.assets.some(a=>a.lux===x.k);
      b.appendChild(row(x.i+' '+x.n,has?'คุณมีแล้ว':(S.money<price?'เงินไม่พอ':x.d),has||S.money<price?null:()=>{mon(-price);S.assets.push({i:x.i,n:x.n,v:price,p:price,up:x.up,gr:x.dep-1,lux:x.k});chg('happy',R(8,15));add('คุณซื้อ'+x.n+' มูลค่า '+fm(price),'good');luxPanel();render()},fm(price)))});
    const sp=Math.round(30e6*W());
    b.appendChild(row('🚀 ทัวร์ท่องอวกาศ',S.flags.space?'คุณเคยไปแล้ว':(S.money<sp?'เงินไม่พอ':'ประสบการณ์ครั้งเดียวในชีวิต ความสุขเต็ม ชื่อเสียงพุ่ง'),S.flags.space||S.money<sp?null:()=>{mon(-sp);S.flags.space=1;S.happy=100;S.fame=Math.min(100,(S.fame||0)+8);fan_(R(50000,500000));add('คุณขึ้นไปท่องอวกาศ มองโลกจากนอกโลก!','good');luxPanel();render()},fm(sp)))})}
N({k:'lux',t:'💎 ของหรู',s:'เรือยอชต์ เครื่องบินส่วนตัว เกาะส่วนตัว ทัวร์อวกาศ',min:21,open:luxPanel});
/* มูลค่า/ค่าบำรุงรักษาของหรูใช้ระบบทรัพย์สินเดิมของเกม (p=ราคาซื้อ up=ค่าบำรุงรักษา gr=อัตราเปลี่ยนมูลค่า) */

/* ---------- 🔬 งานวิจัย ---------- */
function researchPanel(){
  if(nodo())return;
  const r=S.rs=S.rs||{pts:0,papers:0,nobel:0},d=S.done,re=()=>{researchPanel();render()};
  sheet('🔬 งานวิจัย',b=>{
    b.appendChild(el('div','pcard','<div class="pl">ชื่อเสียงนักวิจัย '+r.pts+'/100'+(r.nobel?' · 🏅 ผู้ได้รางวัลโนเบล':'')+'</div><div class="ps">ผลงานตีพิมพ์ '+r.papers+' ชิ้น · ความฉลาด '+S.smarts+(r.pts>=90&&r.papers>=10&&!r.nobel?' · มีโอกาสได้รับรางวัลโนเบลทุกปี':'')+'</div>'+bar(r.pts,'smart')));
    b.appendChild(row('🔬 ทำงานวิจัย',S.smarts>=50?'ได้ทุนวิจัยเมื่อสำเร็จ โอกาสขึ้นกับความฉลาด':'ต้องมีความฉลาด 50 ขึ้นไป',S.smarts>=50&&!d.rs1?()=>{once('rs1',()=>{
      if(chance(40+S.smarts*.4)){const m=Math.round(R(20000,150000)*(1+r.pts/50));mon(m);r.papers++;r.pts=Math.min(100,r.pts+R(5,12));add('งานวิจัยของคุณสำเร็จ ได้ทุนวิจัย '+fm(m),'good')}
      else{r.pts=Math.max(0,r.pts-1);add('งานวิจัยปีนี้ไม่ได้ผลตามที่หวัง','info')}});re()}:null,d.rs1?'ทำแล้ว':''));
    b.appendChild(row('📰 ตีพิมพ์ในวารสารระดับโลก',r.pts>=40?'ชื่อเสียงและเงินรางวัลสูง':'ต้องมีชื่อเสียงนักวิจัย 40 ขึ้นไป',r.pts>=40&&!d.rs2?()=>{once('rs2',()=>{
      if(chance(35+r.pts*.3)){r.papers++;r.pts=Math.min(100,r.pts+R(6,12));S.fame=Math.min(100,(S.fame||0)+3);const m=R(100000,600000);mon(m);add('งานวิจัยของคุณได้ตีพิมพ์ในวารสารระดับโลก ได้เงินรางวัล '+fm(m),'good')}
      else add('วารสารปฏิเสธงานของคุณ','bad')});re()}:null,d.rs2?'ทำแล้ว':''))})}
N({k:'research',t:'🔬 งานวิจัย',s:'ทำวิจัย ตีพิมพ์ผลงาน ลุ้นรางวัลโนเบล',min:22,open:researchPanel});
function researchYear(){
  const r=S.rs;if(!r||r.nobel)return;
  if(r.pts>=90&&r.papers>=10&&chance(3)){r.nobel=1;const m=Math.round(40e6*W());mon(m);S.fame=Math.min(100,(S.fame||0)+30);fan_(R(100000,1000000));S.happy=100;add('🏅 คุณได้รับรางวัลโนเบลจากผลงานวิจัย! เงินรางวัล '+fm(m),'good')}}

/* ---------- 🗺️ ผจญภัยล่าสมบัติ ---------- */
function huntPanel(){
  if(nodo())return;
  if(S.age>60)return toast('อายุเกิน 60 ปี ไม่เหมาะกับการผจญภัยหนักๆ');
  if(S.done.hunt)return toast('ทำแล้วในปีนี้');
  if(S.money<30000)return toast('เงินไม่พอ (฿30,000)');
  mon(-30000);S.done.hunt=1;const r=Math.random()*100;
  if(r<8){const m=Math.round(R(1e6,1e7)*W());mon(m);S.flags.treasure=1;chg('happy',15);add('🗺️ คุณขุดพบสมบัติโบราณ! ขายได้ '+fm(m),'good')}
  else if(r<28){const m=R(50000,500000);mon(m);chg('happy',6);add('คุณพบโบราณวัตถุมีค่า ขายได้ '+fm(m),'good')}
  else if(r<63){chg('happy',2);chg('health',-1);add('การผจญภัยครั้งนี้ไม่พบอะไร แต่ได้ประสบการณ์สนุกๆ','info')}
  else if(r<88){const h=R(5,25);chg('health',-h);chg('happy',-3);add('คุณบาดเจ็บระหว่างผจญภัย (สุขภาพ -'+h+')','bad')}
  else{chg('happy',-5);add('คุณหลงทางในป่าและต้องให้หน่วยกู้ภัยช่วย','bad')}
  closeSheet()}
N({k:'hunt',t:'🗺️ ผจญภัยล่าสมบัติ',s:'฿30,000 ลุ้นสมบัติ เสี่ยงบาดเจ็บ (อายุ 18–60)',min:18,open:huntPanel});

/* ---------- 🏆 ความสำเร็จใหม่ ---------- */
const mkWorth=()=>{try{return Object.keys(S.mk.hold).reduce((a,k)=>a+S.mk.hold[k].n*(S.mk.px[k]||0),0)}catch(e){return 0}};
const AC=[
 ['cult','🕯️','ผู้ศรัทธา','เคยเข้าร่วมลัทธิ',()=>!!(S.flags&&S.flags.cult)||!!S.cult],
 ['hack','💻','แฮ็กเกอร์ตัวจริง','ทักษะแฮ็กเกอร์ 60',()=>(S.hack||0)>=60],

 ['gp','👴','ปู่ย่าตายาย','มีหลาน',()=>S.people.some(p=>p.kd&&p.kd.gk>0)],
 ['g3','👪','สืบทอดสามรุ่น','เล่นถึงรุ่นที่ 3',()=>(S.gen||1)>=3],
 ['fr','🌐','เพื่อนจริง','เป็นเพื่อนกับผู้เล่นจริง',()=>S.people.some(p=>p.pl)],
 ['strm','📡','ผู้ติดตามล้านคน','ผู้ติดตาม 1,000,000',()=>(S.fans||0)>=1e6],
 ['spc','🚀','นักท่องอวกาศ','ไปท่องอวกาศ',()=>!!(S.flags&&S.flags.space)],
 ['nob','🏅','ผู้ได้รับรางวัลโนเบล','ได้รับรางวัลโนเบล',()=>!!(S.rs&&S.rs.nobel)],
 ['trs','🗺️','นักล่าสมบัติ','พบสมบัติโบราณ',()=>!!(S.flags&&S.flags.treasure)],
 ['lux','🛥️','เศรษฐีของหรู','มีของหรูในครอบครอง',()=>S.assets.some(a=>a.lux)]];
function achCheck(quiet){
  S.ach5=S.ach5||[];
  AC.forEach(a=>{if(!S.ach5.includes(a[0])&&a[4]()){S.ach5.push(a[0]);if(!quiet){add('🏆 ปลดล็อกความสำเร็จ: '+a[2],'good');toast('🏆 '+a[2])}}})}

<script>
/* ===== ระบบใหม่ 8: กองทุนการศึกษาลูก / ชมรมและกลุ่มเพื่อน / สืบทอดกิจการ ===== */
(function(){
const fm=n=>'฿'+Math.round(n).toLocaleString('en-US');
const N=o=>{o.custom='x';ACTS.splice(ACTS.length-1,0,o)};
const once=(k,fn)=>{if(S.done[k])return toast('ทำแล้วในปีนี้');S.done[k]=1;fn()};
const nodo=()=>{if(S.jail>0){toast('ใช้ไม่ได้ขณะอยู่ในเรือนจำ');return true}return false};
const kids=()=>S.people.filter(p=>p.alive&&p.type==='ลูก'&&!p.pl);

/* ---------- 🎓 กองทุนการศึกษาลูก ---------- */
const _nw3=netWorth;netWorth=function(){return _nw3()+Math.round(S.edf||0)};
function fundPanel2(){
  if(nodo())return;
  const bal=Math.round(S.edf||0),ks=kids().filter(p=>p.age>=4&&p.age<=21);
  sheet('🎓 กองทุนการศึกษาลูก',b=>{
    b.appendChild(el('div','pcard','<div class="pl">ยอดกองทุน '+fm(bal)+'</div><div class="ps">ผลตอบแทน ~4%/ปี · ทุกปีกองทุนจ่ายเรียนพิเศษ ฿60,000 ให้ลูกอายุ 4–21 ปีอัตโนมัติ (ตอนนี้มี '+ks.length+' คน)</div>'));
    [100000,500000,2000000].forEach(n=>b.appendChild(row('ฝากเข้ากองทุน '+fm(n),S.money>=n?'เก็บไว้ให้ลูกเรียน':'เงินไม่พอ',S.money>=n?()=>{mon(-n);S.edf=(S.edf||0)+n;add('คุณฝากเงิน '+fm(n)+' เข้ากองทุนการศึกษาของลูก','info');fundPanel2();render()}:null)));
    if(bal>0)b.appendChild(row('ถอนกองทุนทั้งหมด','รับเงิน '+fm(bal)+' คืน',()=>{mon(bal);S.edf=0;add('คุณถอนกองทุนการศึกษา '+fm(bal),'info');fundPanel2();render()}))})}
N({k:'edfund',t:'🎓 กองทุนการศึกษาลูก',s:'ฝากเงินให้กองทุนจ่ายเรียนพิเศษของลูกอัตโนมัติทุกปี',min:20,open:fundPanel2});
function fundYear(){
  if(!S.edf||S.edf<=0)return;
  S.edf=Math.round(S.edf*1.04);
  kids().filter(p=>p.age>=4&&p.age<=21).forEach(p=>{
    if(S.edf<60000)return;S.edf-=60000;const k=p.kd||(p.kd={sm:R(30,80),hl:R(70,100),ed:0,career:'',gk:0});
    k.ed=Math.min(5,k.ed+1);k.sm=cl(k.sm+R(2,5));add('กองทุนการศึกษาจ่ายเรียนพิเศษให้ '+p.name,'good')})}

/* ---------- 👥 ชมรมและกลุ่มเพื่อน ---------- */
const CL=[
 {k:'book',i:'📚',n:'ชมรมนักอ่าน',d:'ความฉลาด +',f:()=>{chg('smarts',R(1,3))}},
 {k:'hike',i:'🥾',n:'ชมรมเดินป่า',d:'สุขภาพ + ',f:()=>{chg('health',R(1,3))}},
 {k:'band',i:'🎸',n:'วงดนตรีสมัครเล่น',d:'ความสุข + ผู้ติดตาม +',f:()=>{chg('happy',R(2,4));S.fans=Math.min(5e6,(S.fans||0)+R(50,800))}},
 {k:'inv',i:'💼',n:'ชมรมนักลงทุน',d:'ได้ทิปการลงทุนเป็นเงิน',f:()=>{const m=R(2000,30000);mon(m);add('เพื่อนในชมรมแบ่งปันทิปการลงทุน คุณได้กำไร '+fm(m),'good')}}];
function clubPanel(){
  if(nodo())return;
  const c=S.club;
  sheet('👥 ชมรมและกลุ่มเพื่อน',b=>{
    if(c){const x=CL.find(a=>a.k===c.k);
      b.appendChild(el('div','pcard','<div class="pl">'+x.i+' '+x.n+'</div><div class="ps">เป็นสมาชิกมา '+(S.age-c.since)+' ปี · ประชุม '+(c.n||0)+' ครั้ง · '+x.d+'</div>'));
      b.appendChild(row('🎉 ไปร่วมกิจกรรมของชมรม','ฟรี มีโอกาสได้เพื่อนใหม่',S.done.club?null:()=>{once('club',()=>{
        x.f();chg('happy',R(1,3));c.n=(c.n||0)+1;
        if(chance(30)&&S.people.filter(p=>p.type==='เพื่อน').length<12){const f=addFriend();add('คุณได้เพื่อนใหม่จากชมรม: '+f.name,'good')}else add('คุณไปร่วมกิจกรรมของ'+x.n+' สนุกมาก','good')});clubPanel();render()},S.done.club?'ทำแล้ว':''));
      b.appendChild(row('🚪 ออกจากชมรม','',()=>{S.club=null;add('คุณออกจาก'+x.n,'info');clubPanel()}))}
    else{b.appendChild(el('div','note','เข้าชมรมเพื่อได้พบเพื่อนใหม่และพัฒนาตัวเองทุกปี'));
      CL.forEach(x=>b.appendChild(row(x.i+' '+x.n,x.d,()=>{S.club={k:x.k,since:S.age,n:0};add('คุณเข้าร่วม'+x.n,'info');clubPanel()})))}})}
N({k:'club',t:'👥 ชมรมและกลุ่มเพื่อน',s:'เข้าชมรม ได้เพื่อนใหม่ พัฒนาตัวเองทุกปี',min:12,open:clubPanel});

const au4=ageUp;
ageUp=function(){const a0=S&&S.age;au4();if(!S||!S.alive||S.age===a0)return;try{fundYear()}catch(e){}render()};
$('#ageBtn').onclick=ageUp;
})();
</script>
<script>
/* ===== ออนไลน์: นับคนเล่น + แชทรวม + ส่งสถิติตอนจบชีวิต (ล้มเหลวเงียบๆ ไม่กระทบเกม) ===== */
(function(){
  var cid='';try{cid=localStorage.getItem('lk_cid')||''}catch(e){}
  if(!/^[A-Za-z0-9_\-]{6,40}$/.test(cid)){cid='p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{localStorage.setItem('lk_cid',cid)}catch(e){}}
  function post(path,body){body.cid=cid;return fetch('/api/likhit/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),keepalive:true}).then(function(r){return r.json()}).catch(function(){return null})}

  /* ปุ่มแชท + จำนวนออนไลน์ ในหัวเกม */
  var css=document.createElement('style');
  css.textContent='#chatBtn{position:relative;display:flex;align-items:center;gap:4px;height:36px;padding:0 10px;border:0;border-radius:18px;background:rgba(255,255,255,.16);color:#fff;font:600 13px inherit;cursor:pointer;flex:none}#chatBtn:active{transform:scale(.92)}#chatBtn i{width:8px;height:8px;border-radius:50%;background:#3ddc84;flex:none}#chatBtn .cb{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;line-height:18px;text-align:center}'
   +'#lkc{position:fixed;inset:0;z-index:250;display:none;align-items:flex-end;justify-content:center;background:rgba(6,9,20,.55)}#lkc.open{display:flex}'
   +'#lkc .cw{width:min(100%,520px);height:min(78vh,620px);display:flex;flex-direction:column;background:var(--card);color:var(--ink);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.35)}'
   +'#lkc .ch{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}#lkc .ch span{font-weight:500;font-size:12.5px;color:var(--mute);flex:1}#lkc .ch button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer}'
   +'#lkc .cl{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}#lkc .m{max-width:84%;padding:7px 11px;border-radius:14px;background:var(--soft);font-size:14px;line-height:1.4;overflow-wrap:anywhere;align-self:flex-start}#lkc .m b{display:block;font-size:11.5px;color:var(--mute);margin-bottom:1px}#lkc .m.me{align-self:flex-end;background:var(--head);color:var(--on-head)}#lkc .m.me b{color:inherit;opacity:.75}#lkc .em{margin:auto;color:var(--mute);font-size:13px}'
   +'#lkc form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}#lkc input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}#lkc form button{padding:0 16px;border:0;border-radius:12px;background:var(--pop);color:var(--on-pop);font-weight:700;cursor:pointer}';
  document.head.appendChild(css);
  var cb=document.createElement('button');cb.id='chatBtn';cb.type='button';cb.setAttribute('aria-label','แชทรวมและจำนวนคนออนไลน์');cb.innerHTML='<i></i><span id="olc">-</span> 💬<span class="cb" id="cbd" hidden></span>';
  var mb=document.getElementById('menuBtn');mb.parentNode.insertBefore(cb,mb);
  var ov=document.createElement('div');ov.id='lkc';
  ov.innerHTML='<div class="cw"><div class="ch">💬 แชทรวม<span id="cOn"></span><button type="button" id="cX">ปิด</button></div><div class="cl" id="cL"><div class="em">กำลังโหลด…</div></div><form id="cF"><input id="cI" maxlength="120" autocomplete="off" placeholder="พิมพ์ข้อความถึงผู้เล่นคนอื่น…"><button type="submit">ส่ง</button></form></div>';
  document.body.appendChild(ov);
  var L=document.getElementById('cL'),I=document.getElementById('cI'),seen=0,since=0,latest=0,timer=0,opened=false;
  try{seen=+localStorage.getItem('lk_chat_seen')||0}catch(e){}
  function setOn(n){if(n==null)return;document.getElementById('olc').textContent=n;document.getElementById('cOn').textContent='🟢 '+n+' คนออนไลน์'}
  function badge(){var n=Math.max(0,latest-seen),b=document.getElementById('cbd');b.hidden=opened||!n;b.textContent=n>9?'9+':n}
  function myName(){try{return S&&S.name?S.name:'ผู้เล่น'}catch(e){return'ผู้เล่น'}}
  function paint(msgs,reset){
    if(reset)L.innerHTML='';
    var em=L.querySelector('.em');if(em&&msgs.length)em.remove();
    var down=L.scrollHeight-L.scrollTop-L.clientHeight<60||reset;
    msgs.forEach(function(m){var d=document.createElement('div');d.className='m'+(m.me?' me':'');var b=document.createElement('b');b.textContent=m.n;var t=document.createElement('span');t.textContent=m.x;d.appendChild(b);d.appendChild(t);L.appendChild(d);since=Math.max(since,m.id)});
    if(!L.children.length)L.innerHTML='<div class="em">ยังไม่มีข้อความ ลองทักทายคนอื่นดู 👋</div>';
    while(L.children.length>80)L.removeChild(L.firstChild);
    if(down)L.scrollTop=L.scrollHeight;
  }
  function pull(reset){
    return fetch('/api/likhit/chat?since='+(reset?0:since)+'&cid='+encodeURIComponent(cid),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
      setOn(j.online);latest=Math.max(latest,j.seq|0);paint((j.msgs||[]).slice(reset?-50:0),reset);if(opened){seen=latest;try{localStorage.setItem('lk_chat_seen',String(seen))}catch(e){}}badge()}).catch(function(){if(reset)L.innerHTML='<div class="em">โหลดแชทไม่ได้ ลองใหม่อีกครั้ง</div>'});
  }
  function openC(){opened=true;ov.classList.add('open');since=0;pull(true);clearInterval(timer);timer=setInterval(function(){if(!document.hidden)pull(false)},3000);setTimeout(function(){I.focus()},120)}
  function closeC(){opened=false;ov.classList.remove('open');clearInterval(timer);seen=latest;try{localStorage.setItem('lk_chat_seen',String(seen))}catch(e){}badge()}
  cb.addEventListener('click',openC);document.getElementById('cX').addEventListener('click',closeC);
  ov.addEventListener('click',function(e){if(e.target===ov)closeC()});
  ov.addEventListener('keydown',function(e){e.stopPropagation();if(e.key==='Escape')closeC()});
  ov.addEventListener('keyup',function(e){e.stopPropagation()});
  document.getElementById('cF').addEventListener('submit',function(e){
    e.preventDefault();var x=I.value.trim();if(!x)return;I.value='';
    post('chat',{name:myName(),text:x}).then(function(j){
      if(j&&j.ok)pull(false);
      else{I.value=x;if(typeof toast==='function')toast(j&&j.err==='slow'?'พิมพ์ถี่เกินไป รอสักครู่':j&&j.err==='dup'?'ส่งข้อความซ้ำไม่ได้':'ส่งไม่สำเร็จ')}});
  });

  var lastOn=-1;
  function notifyOn(n){ /* แจ้งเตือนเฉยๆ ว่ามีผู้เล่นออนไลน์กี่คน (เมื่อจำนวนเปลี่ยน) */
    if(typeof n!=='number')return;
    try{if(lastOn<0){if(n>1)toast('🟢 ตอนนี้มีผู้เล่นออนไลน์ '+n+' คน (รวมคุณ)')}
    else if(n>lastOn)toast('🟢 มีผู้เล่นเข้าเกมเพิ่ม ตอนนี้ออนไลน์ '+n+' คน');
    else if(n<lastOn)toast('⚪ มีผู้เล่นออกจากเกม เหลือออนไลน์ '+n+' คน')}catch(e){}
    lastOn=n}
  function ping(){if(document.hidden)return;var a=-1;try{if(S&&S.alive)a=S.age}catch(e){}
    post('ping',{age:a,p:window.__lkProf?window.__lkProf():null}).then(function(j){if(j){setOn(j.online);notifyOn(j.online);latest=Math.max(latest,j.seq|0);if(opened){seen=latest}badge()}})}
  ping();setInterval(ping,30000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)ping()});

  /* ปุ่มโทรศัพท์/คอมพิวเตอร์: แสดงเมื่อมีของในกระเป๋าเท่านั้น (กระเป๋าแสดงเสมอ) */
  function tools(){
    var t=document.getElementById('tools');if(!t)return;
    var has=!!S,inv=(S&&S.inv)||{};
    var ph=t.querySelector('[data-t="phone"]'),pc=t.querySelector('[data-t="pc"]');
    if(ph)ph.hidden=!(has&&inv.phone);if(pc)pc.hidden=!(has&&inv.laptop);
    t.style.display=has?'':'none';
  }
  var r0=render;render=function(){r0.apply(this,arguments);tools()};
  tools();setInterval(tools,1000); /* กันพลาดกรณีของเปลี่ยนโดยไม่ผ่าน render */

  var sd=showDeath;
  showDeath=function(){
    sd.apply(this,arguments);
    try{
      if(!S||S.cheat)return; /* โหมดโกง/แอดมินไม่นับสถิติ */
      var sig=S.name+'|'+S.age+'|'+S.cause;
      if(localStorage.getItem('lk_rep')===sig)return; /* ชีวิตเดิมที่รายงานแล้ว (เช่น โหลดหน้าใหม่) */
      localStorage.setItem('lk_rep',sig);
      post('end',{name:S.name,age:S.age,cause:S.cause,worth:netWorth(),job:S.job?S.job.n:(S.retired?'เกษียณ':''),country:S.country,kids:S.people.filter(function(p){return p.type==='ลูก'}).length});
    }catch(e){}
  };
})();
</script>
<script>
/* ===== ทำเนียบผู้เล่น + เพื่อนจริง (เห็นกันได้แม้ออฟไลน์) + โหมดเวลา 6 เดือน ===== */
(function(){
  var ov=document.getElementById('lkc'),cl=document.getElementById('cL'),cf=document.getElementById('cF');
  if(!ov||!cl)return;
  var cid='';try{cid=localStorage.getItem('lk_cid')||''}catch(e){}
  function api(path,body){body.cid=cid;return fetch('/api/likhit/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()}).catch(function(){return null})}
  window.__lkProf=function(){
    if(!S)return null;
    return {name:S.name,age:S.age,alive:!!S.alive,g:S.g,job:S.job?S.job.n:(S.retired?'เกษียณ':''),country:S.country,ap:S.ap,fame:S.fame|0,fans:S.fans|0,worth:netWorth()}
  };

  /* แท็บ แชท / ผู้เล่น */
  var css=document.createElement('style');
  css.textContent='#lkc .tb{display:flex;gap:6px;padding:8px 12px 0}#lkc .tb button{flex:1;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font:600 13px inherit;cursor:pointer}#lkc .tb button.on{background:var(--head);color:var(--on-head);border-color:var(--head)}'
   +'#pL{flex:1;overflow-y:auto;padding:10px 12px;display:none;flex-direction:column;gap:8px}#lkc.pt #pL{display:flex}#lkc.pt #cL,#lkc.pt #cF{display:none}'
   +'#pL .pr{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}#pL .pr .av{width:46px;height:46px;flex:none;border-radius:50%;overflow:hidden}#pL .pr .av svg{width:100%;height:100%;display:block}'
   +'#pL .pr .if{flex:1;min-width:0}#pL .pr b{display:block;font-size:14px;overflow-wrap:anywhere}#pL .pr small{display:block;color:var(--mute);font-size:12px}#pL .pr .dt{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:#9aa3b5}#pL .pr .dt.on{background:#3ddc84}'
   +'#pL .pr button{flex:none;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:600 12.5px inherit;cursor:pointer}#pL .pr button.fr{background:var(--head);color:var(--on-head);border-color:var(--head)}#pL .em{margin:auto;color:var(--mute);font-size:13px;text-align:center}'

  document.head.appendChild(css);
  var tb=document.createElement('div');tb.className='tb';tb.innerHTML='<button type="button" class="on" id="tbC">💬 แชท</button><button type="button" id="tbP">👥 ผู้เล่น</button>';
  cl.parentNode.insertBefore(tb,cl);
  var pL=document.createElement('div');pL.id='pL';cl.after(pL);
  var tm=0;
  function tab(p){
    ov.classList.toggle('pt',p);document.getElementById('tbC').classList.toggle('on',!p);document.getElementById('tbP').classList.toggle('on',p);
    clearInterval(tm);if(p){loadP();tm=setInterval(function(){if(!document.hidden)loadP()},10000)}
  }
  document.getElementById('tbC').onclick=function(){tab(false)};
  document.getElementById('tbP').onclick=function(){tab(true)};
  var obs=new MutationObserver(function(){if(!ov.classList.contains('open')&&ov.classList.contains('pt')){clearInterval(tm);tm=0;ov.classList.remove('pt');document.getElementById('tbC').classList.add('on');document.getElementById('tbP').classList.remove('on')}});
  obs.observe(ov,{attributes:true,attributeFilter:['class']});

  function ago(t){var m=Math.round((Date.now()-t)/60000);return m<1?'เมื่อกี้':m<60?m+' นาทีที่แล้ว':m<1440?Math.floor(m/60)+' ชม.ที่แล้ว':Math.floor(m/1440)+' วันที่แล้ว'}
  function loadP(){
    fetch('/api/likhit/players?cid='+encodeURIComponent(cid),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){paintP(j.players||[])}).catch(function(){if(!pL.children.length)pL.innerHTML='<div class="em">โหลดรายชื่อไม่ได้</div>'});
  }
  function paintP(list){
    pL.innerHTML='';
    if(!list.length){pL.innerHTML='<div class="em">ยังไม่มีผู้เล่นคนอื่นในทำเนียบ<br>ชวนเพื่อนมาเล่นลิขิตชีวิตสิ 🎲</div>';return}
    list.forEach(function(p){
      var d=document.createElement('div');d.className='pr';
      var av=document.createElement('div');av.className='av';try{av.innerHTML=avatar(p.ap,{g:p.g,age:p.age,happy:60,dead:!p.alive})}catch(e){}
      var inf=document.createElement('div');inf.className='if';
      var b=document.createElement('b');b.textContent=p.name+(p.friend?' 💚':'');
      var s1=document.createElement('small');s1.textContent=(p.alive?'อายุ '+p.age+' ปี':'เสียชีวิตแล้ว ('+p.age+' ปี)')+(p.job?' · '+p.job:'')+(p.country?' · '+p.country:'');
      var s2=document.createElement('small');var dt=document.createElement('span');dt.className='dt'+(p.online?' on':'');s2.appendChild(dt);s2.appendChild(document.createTextNode(p.online?'ออนไลน์':'ออฟไลน์ · '+ago(p.t)));
      inf.appendChild(b);inf.appendChild(s1);inf.appendChild(s2);
      var bt=document.createElement('button');bt.type='button';bt.className=p.friend?'':'fr';bt.textContent=p.friend?'เลิกเป็นเพื่อน':'➕ เป็นเพื่อน';
      bt.onclick=function(){bt.disabled=true;api('friend',{to:p.u,op:p.friend?'del':'add'}).then(function(j){
        if(j&&j.ok){toast(p.friend?'เลิกเป็นเพื่อนแล้ว':'เป็นเพื่อนกับ '+p.name+' แล้ว');syncF(true);loadP()}
        else{bt.disabled=false;toast(j&&j.err==='full'?'รายชื่อเพื่อนเต็ม':'ทำไม่สำเร็จ')}})};
      d.appendChild(av);d.appendChild(inf);d.appendChild(bt);pL.appendChild(d);
    });
  }

  /* ซิงก์เพื่อนจริงเข้า "ความสัมพันธ์" ของตัวละคร — เห็นกันได้แม้อีกฝ่ายออฟไลน์ (ใช้ข้อมูลล่าสุดที่เซิร์ฟเวอร์เก็บ) */
  function syncF(now){
    if(!S||!S.alive&&0)return;
    fetch('/api/likhit/friends?cid='+encodeURIComponent(cid),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
      if(!S)return;var fl=j.friends||[],ids={};
      fl.forEach(function(f){
        ids[f.u]=1;
        var p=S.people.find(function(x){return x.pl===f.u});
        if(!p){S.people.push({id:uid(),type:'เพื่อน',g:f.g,name:f.name,age:f.age,rel:60,alive:f.alive,d:{},ap:f.ap&&Object.keys(f.ap).length?f.ap:mkAp(f.g),pl:f.u});add('คุณได้เป็นเพื่อนกับผู้เล่นจริง '+f.name+' 🌐','good')}
        else{p.name=f.name;p.age=f.age;p.g=f.g;if(f.ap&&Object.keys(f.ap).length)p.ap=f.ap;
          if(p.alive&&!f.alive){p.alive=false;add('เพื่อนของคุณ '+f.name+' เสียชีวิตแล้ว (อายุ '+f.age+' ปี)','bad');chg('happy',-8)}
          else if(!p.alive&&f.alive)p.alive=true}
      });
      /* เพื่อนที่ถูกลบฝั่งเซิร์ฟเวอร์ (เลิกเป็นเพื่อน) */
      var before=S.people.length;S.people=S.people.filter(function(x){return !x.pl||ids[x.pl]});
      if(now||before!==S.people.length)render();
    }).catch(function(){});
  }
  setTimeout(function(){syncF(false)},2500);setInterval(function(){if(!document.hidden)syncF(false)},60000);

  /* ===== โหมดเวลา 6 เดือน (ตั้งได้) =====
     เปิดแล้วกดปุ่มอายุครั้งแรก = ผ่านไปครึ่งปี (กิจกรรมประจำปีกลับมาใช้ได้อีกรอบ + เหตุการณ์สุ่ม)
     กดครั้งที่สอง = ครบปี คิดรายได้/รายจ่าย/อายุตามเดิม */
  var half=false;try{half=localStorage.getItem('lk_half')==='1'}catch(e){}
  var ab=document.getElementById('ageBtn'),au=ageUp;
  function abLabel(){ab.innerHTML=half?(S&&S.half?'<b>＋</b>ครบปี':'<b>½</b>6 เดือน'):'<b>＋</b>อายุ'}
  ageUp=function(){
    if(!S||!S.alive||showing||queue.length)return au();
    if(!half){S.half=0;return au()}
    if(!S.half){
      S.half=1;S.done={};
      chg('happy',R(-2,3));chg('health',R(-1,1));
      add('ผ่านไปครึ่งปี (6 เดือน) ชีวิตดำเนินต่อไป','info');
      try{if(S.jail===0&&chance(50))randomEvent()}catch(e){}
      abLabel();render();try{save()}catch(e){}
      return}
    S.half=0;au();abLabel();
  };
  ab.onclick=ageUp;
  var hb=document.createElement('button');hb.id='hfBtn';hb.type='button';
  function hbPaint(){hb.className=half?'on':'';hb.textContent='⏱️ 6 เดือน: '+(half?'เปิด':'ปิด')}
  hbPaint();abLabel();
  hb.addEventListener('click',function(e){e.stopPropagation();half=!half;try{localStorage.setItem('lk_half',half?'1':'0')}catch(x){}hbPaint();abLabel();toast(half?'เปิดโหมด 6 เดือน: กดอายุ 2 ครั้ง = 1 ปี':'ปิดโหมด 6 เดือนแล้ว')});
  var tl=document.getElementById('tools');if(tl)tl.appendChild(hb);
  var ag=document.getElementById('ag');
  new MutationObserver(function(){if(S&&S.half&&half&&ag.textContent.indexOf('เดือน')<0)ag.textContent=ag.textContent.replace(/(อายุ \d+ ปี)/,'$1 6 เดือน')}).observe(ag,{childList:true,characterData:true,subtree:true});
})();
</script>
</body>
</html>
