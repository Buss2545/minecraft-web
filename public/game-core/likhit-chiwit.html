  var best=null;TT.forEach(function(t){if(e[t[0]]&&(!best||t[2]>=best[2]))best=t});S.tp=best?ttn(best):''}
function exBase(n){return 35+((S.chakra||0)-n.ch)*0.6+(S.smarts-50)*0.25+Math.floor(mast()/10)+(nat()==='สายฟ้า'?8:0)+(cln().ex||0)+jp()}
function exStages(n){var st=[
  {q:'ด่านที่ 1: ข้อสอบข้อเขียนและความรู้นินจา',a:[{t:'ตอบอย่างรอบคอบ',p:function(b){return b+12}},{t:'ตอบเร็วและเสี่ยง',p:function(b){return b+(S.smarts>=60?26:-6)}}]},
  {q:'ด่านที่ 2: เอาตัวรอดในป่าอันตราย',a:[{t:'ฝ่าด้านหน้าตรงๆ',p:function(b){return b+((S.chakra||0)-50)*0.2+6},dmg:1},{t:'หลบเลี่ยงอย่างชาญฉลาด',p:function(b){return b+4}}]},
  {q:'ด่านที่ 3: ประลองกับผู้คุมสอบ',a:[{t:'ใช้วิชาที่เก่งที่สุด',p:function(b){return b+jp()*1.2+4},dmg:1},{t:'ใช้กลยุทธ์ต่อสู้',p:function(b){return b+(S.smarts-50)*0.25+8},dmg:1}]}];
  if(n.n==='ผู้นำหมู่บ้าน')st.push({q:'ด่านที่ 4: ประชุมผู้อาวุโสเพื่อรับรองตำแหน่ง',a:[{t:'ใช้บารมีตระกูล',p:function(b){return b+(S.cp||0)/5}},{t:'ใช้ผลงานภารกิจและการเดินทาง',p:function(b){return b+(S.fame||0)/5+8}}]});
  return st}
function exAsk(ex){var st=ex.stages[ex.i],b=exBase(ex.n);
  ask(st.q+' · ผ่านแล้ว '+ex.ok+'/'+ex.i,st.a.map(function(a){return {t:a.t,f:function(){var p=Math.max(15,Math.min(92,Math.round(a.p(b))));
    if(chance(p)){ex.ok++;S.nxp=(S.nxp||0)+3;add('✅ '+st.q.split(': ')[0]+' ผ่าน ('+a.t+')','good')}
    else{if(a.dmg){var h=R(3,10);S.health=Math.max(1,S.health-h);add('❌ '+st.q.split(': ')[0]+' ไม่ผ่าน คุณบาดเจ็บ สุขภาพ −'+h,'bad')}else add('❌ '+st.q.split(': ')[0]+' ไม่ผ่าน','bad')}
    ex.i++;if(ex.i<ex.stages.length)exAsk(ex);else exEnd(ex)}}}),'สอบเลื่อนขั้น: '+ex.n.n)}
function exEnd(ex){if(NR[(S.nrank||0)+1]!==ex.n)return;var need=ex.stages.length-1;
  if(ex.ok>=need){S.nrank=(S.nrank||0)+1;ns('ex');chg('happy',10);add('🎖️ สอบผ่าน '+ex.ok+'/'+ex.stages.length+' ด่าน! คุณเลื่อนขั้นเป็น '+ex.n.n,'good');ensureTeam()}
  else{chg('happy',-5);add('🎖️ ผ่านเพียง '+ex.ok+'/'+ex.stages.length+' ด่าน ไม่ผ่านการสอบเป็น '+ex.n.n+' ลองใหม่ปีหน้า','bad')}
  panelActs();render()}
function tmem(){return S.people.filter(function(p){return p.alive&&(p.type==='เพื่อนร่วมทีม'||p.type==='ครูประจำทีม')})}
function tb(){var b=0;tmem().forEach(function(p){b+=(p.type==='ครูประจำทีม'?5:3)+Math.round((p.rel||0)/25)});return Math.min(18,b)}
function lose(){var m=S.people.filter(function(p){return p.alive&&p.type==='เพื่อนร่วมทีม'});if(m.length&&chance(5)){var p=pick(m);p.alive=false;ns('lost');chg('happy',-15);add('💔 '+p.name+' เพื่อนร่วมทีมเสียชีวิตในภารกิจ','bad')}}
function formTeam(){if(S.team)return;var a=[];for(var i=0;i<2;i++){var p=mkPerson('เพื่อนร่วมทีม',pick(['M','F']),Math.max(10,S.age+R(-1,1)),R(40,70));p.ch=R(25,55);S.people.push(p);a.push(p)}
 var t=mkPerson('ครูประจำทีม',pick(['M','F']),R(28,45),R(45,70));S.people.push(t);S.team=1;
 add('🤝 คุณถูกจัดเข้าทีมนินจากับ '+a[0].name+' และ '+a[1].name+' โดยมี '+t.name+' เป็นอาจารย์ประจำทีม','good')}
function ensureTeam(){if(S.nrank>=1&&!S.team)formTeam()}

function once(k,max){S.done[k]=S.done[k]||0;if(S.done[k]>=(max||1)){toast('ทำครบแล้วในปีนี้');return false}S.done[k]++;return true}
window.ninjaBirth=function(){
  S.world='ninja';S.wy0=0;S.eraSeen='clan';S.clan=rc();S.jt=[];clanJt();S.tb=chance(5.1)?R(1,9):0;S.tc=0;if(S.tb)S.chakra=Math.min(100,(S.chakra||0)+25);S.vil=CN().pl+S.prov;S.chakra=R(10,40);S.nrank=0;S.nxp=0;S.log=[{age:0,lines:[]}];
  add('🌀 คุณเกิดใหม่ในโลกนินจา ณ '+S.vil+' '+S.country+' ตระกูล '+S.last,'info');
  add('พ่อ '+S.people[0].name+' และแม่ '+S.people[1].name+' หวังให้คุณเป็นนินจาผู้แข็งแกร่ง');
  add('อายุ 6 ปีเข้าอคาเดมี ฝึกจักระ แล้วสอบเป็นเก็นนินตอนอายุ 12 ปี');
  add('🕰️ คุณเกิดในปีที่ 0 ของโลกนินจา ยุคตระกูลสงคราม โลกจะดำเนินไปตามกาลเวลาจนถึงจบภาคนารูโตะ ตายแล้วทายาทจะสืบทอดต่อ','info');
  add('🏯 คุณเกิดใน'+cln().n+' · '+cln().d,'info');if(S.tb)add('🦊 คุณถูกผนึกพลังของ'+TBN[S.tb-1]+'ไว้ในตัวตั้งแต่เกิด จักระมหาศาลแต่ชาวบ้านหวาดกลัว ต้องฝึกควบคุมให้ได้','info');
  add('✨ ธาตุจักระของคุณคือธาตุ'+nat()+' ('+NATD[nat()]+')','info');
  render();
};

 {k:'ntrain',nin:1,t:'🌀 ฝึกจักระ',s:'จักระ + · ฟรี 1 ครั้ง/ปี',min:6,open:function(){if(!once('n_train'))return;var g=R(3,8);S.chakra=Math.min(100,(S.chakra||0)+g);S.nxp=(S.nxp||0)+1;chg('health',-R(0,2));add('🌀 คุณฝึกจักระอย่างหนัก จักระ +'+g+' (ตอนนี้ '+S.chakra+')','good');panelActs();render()}},

 {k:'nexam',nin:1,t:'🎖️ สอบเลื่อนขั้นนินจา',s:'สอบหลายด่าน 3-4 ด่าน ต้องมีอายุ จักระ และประสบการณ์ถึงเกณฑ์',min:12,open:function(){

 {k:'nstat',nin:1,t:'🥷 ดูสถานะนินจา',s:'ยศ จักระ ค่าประสบการณ์',min:0,jail:1,open:function(){

function best(a){return a.reduce(function(x,y){return sc(y)>sc(x)?y:x})}
function pool(){var a=[];CL().forEach(function(c,i){if(i!==6)a.push(i)});return a}
function jt(){if(window.nClanJt)window.nClanJt()}

/* ---------- เลือกตระกูลหลัก ---------- */
function freeClans(){var a=[S.clan];if(S.clan2!=null&&S.clan2!==S.clan)a.push(S.clan2);return a.filter(function(x){return x!=null})}
function relClans(){
  if(!S.hrel){var have=freeClans(),P=pool().filter(function(i){return have.indexOf(i)<0}),r=[];
    while(r.length<2&&P.length){var x=pick(P);r.push(x);P=P.filter(function(y){return y!==x})}S.hrel=r}
  return S.hrel}
function setMain(i,how){
  var old=S.clan;
  if(i!==old){S.clan2=(old==null||old===6||old===i)?null:old;S.clan=i}
  S.hcd=1;jt();
  add('🏯 '+how+' ตระกูลหลักของคุณคือ '+cn(S.clan)+(S.clan2!=null?' (ตระกูลที่สอง: '+cn(S.clan2)+')':''),'good');
  chg('happy',4)}
function autoClan(silent){
  var f=freeClans();setMain(best(f),'ผู้ใหญ่ในตระกูลเลือกให้ด้วยความเห็นชอบของทุกคน');
  if(!silent){panelActs();render()}}
function clanPanel(){
  sheet('🏯 เลือกสายตระกูลของทายาท',function(b){
    if(S.hcd){b.appendChild(el('div','pcard','<div class="pl">'+esc(cn(S.clan))+'</div><div class="ps">คุณเลือกสายตระกูลไปแล้ว (เลือกได้ 1 ครั้งต่อชีวิต)'+(S.clan2!=null?'<br>ตระกูลที่สอง: '+esc(cn(S.clan2)):'')+'</div>'));return}
    b.appendChild(el('div','note','ทายาทเลือกตระกูลหลักได้ 1 ครั้งต่อชีวิต ตระกูลหลักให้ผลเต็ม ตระกูลที่สองให้ผลครึ่งหนึ่ง'));
    freeClans().forEach(function(i){
      b.appendChild(row('🏯 ใช้ '+esc(cn(i))+' เป็นตระกูลหลัก',esc(cd(i))+(i===S.clan?' · (ตอนนี้)':'')+' · ฟรี',function(){setMain(i,'คุณตัดสินใจเอง');clanPanel();render()}))});
    relClans().forEach(function(i){
      b.appendChild(row('🤝 ขอเข้าตระกูลญาติ: '+esc(cn(i)),esc(cd(i))+(S.money<CFEE?' · เงินไม่พอ':' · ตระกูลเดิมของคุณจะกลายเป็นตระกูลที่สอง'),S.money<CFEE?null:function(){
        if(!pay(CFEE))return;setMain(i,'คุณยื่นขอเข้าตระกูลญาติและได้รับการยอมรับ');clanPanel();render()},fmt(CFEE)))});
    b.appendChild(row('🎲 ให้ผู้ใหญ่เลือกให้ (อัตโนมัติ)','เลือกตระกูลที่เด่นที่สุดจากสายเลือดของคุณ ไม่เสียเงิน',function(){autoClan(true);clanPanel();render()}))})}

/* ---------- เลือกคู่ครอง ---------- */
function cands(){
  if(!S.done.hcands){
    S.done.hcands=[];var P=pool();
    for(var n=0;n<4;n++){
      var g=chance(85)?(S.g==='M'?'F':'M'):S.g,age=Math.max(18,S.age+R(-4,4)),c=chance(75)?pick(P):6,t=mkPerson('แฟน',g,age,55);
      S.done.hcands.push({name:t.name,g:g,age:age,cl:c,looks:R(25,95),smarts:R(25,95),ap:t.ap,tried:false})}}
  return S.done.hcands}
function chOf(){return Math.max(15,Math.min(90,Math.round(30+S.looks*.35+S.smarts*.1+(S.cp||0)*.25+(S.fame||0)*.1)))}
function cs(c){return sc(c.cl)+(c.looks+c.smarts)/10}
function wed(c,rel,msg,hp){
  if(!pay(FEE))return false;
  var p=mkPerson('คู่สมรส',c.g,c.age,rel);p.name=c.name;p.ap=c.ap;p.cl=c.cl;p.d={};S.people.push(p);
  chg('happy',hp);add('💍 '+msg.replace('{n}',c.name).replace('{c}',cn(c.cl)),'good');
  return true}
function autoMate(silent){
  var L=cands().filter(function(c){return !c.tried});if(!L.length)return false;
  var c=L.reduce(function(x,y){return cs(y)>cs(x)?y:x});
  var ok=wed(c,50,'ผู้ใหญ่ในตระกูลจัดการสู่ขอ {n} จาก{c} ให้คุณ พิธีแต่งงานเรียบร้อย',6);
  if(ok&&!silent){closeSheet()}
  return ok}
function matePanel(){
  if(partner())return toast('คุณมีคู่อยู่แล้ว');
  var L=cands();
  sheet('💞 เลือกคู่ครองของทายาท',function(b){
    b.appendChild(el('div','note','เลือกคู่ครองจากตระกูลต่าง ๆ ได้เอง ค่าจัดพิธีแต่งงาน '+fmt(FEE)+' (จ่ายเมื่อสำเร็จ) · โอกาสสำเร็จของคุณ ~'+chOf()+'% ลูกจะได้พรสวรรค์จากตระกูลของคู่ด้วย'));
    L.forEach(function(c){
      var off=c.tried||S.money<FEE;
      b.appendChild(row('<span class="mini">'+avatar(c.ap,{age:c.age,happy:70})+'</span>'+esc(c.name),
        esc(cn(c.cl))+' · '+esc(cd(c.cl))+'<br>อายุ '+c.age+' · หน้าตา '+c.looks+'% · ฉลาด '+c.smarts+'%'+(S.money<FEE&&!c.tried?' · เงินไม่พอ':''),
        off?null:function(){
          c.tried=true;
          if(chance(chOf())){if(wed(c,65,'คุณสู่ขอ {n} จาก{c} สำเร็จ ทั้งสองตระกูลยินดี',14)){closeSheet()}else c.tried=false}
          else{chg('happy',-5);add(c.name+' จาก'+cn(c.cl)+' ปฏิเสธคำสู่ขอของคุณ','bad');matePanel();render()}},c.tried?'ปฏิเสธแล้ว':''))});
    var anyLeft=L.some(function(c){return !c.tried});
    b.appendChild(row('🎲 ให้ผู้ใหญ่จัดคู่ให้ (อัตโนมัติ)',anyLeft?(S.money<FEE?'เงินไม่พอ':'เลือกคู่ที่เหมาะกับตระกูลที่สุด สำเร็จแน่นอน แต่ความสัมพันธ์เริ่มต้นต่ำกว่า'):'ไม่มีผู้สมัครเหลือแล้ว',(anyLeft&&S.money>=FEE)?function(){autoMate(false);render()}:null,fmt(FEE)));
    b.appendChild(row('🤖 โหมดอัตโนมัติ: '+(S.hauto?'เปิด':'ปิด'),'เมื่อเปิด อายุ 12 ปีจะเลือกตระกูลให้ และอายุ 22 ปีถ้ายังโสดและมีเงินพอ จะจัดคู่ให้เอง',function(){S.hauto=S.hauto?0:1;add('🤖 โหมดอัตโนมัติของทายาท: '+(S.hauto?'เปิด':'ปิด'),'info');matePanel()}))})}

ACTS.push({k:'nhclan',nin:1,custom:'x',min:10,
  get th(){return !heir()},
  get t(){return '🏯 เลือกสายตระกูลของทายาท'},
  get s(){return S&&S.hcd?'เลือกแล้ว: '+cn(S.clan):'เลือกตระกูลหลักเอง หรือให้ผู้ใหญ่เลือกให้ · 1 ครั้งต่อชีวิต'},
  open:function(){if(!heir())return;clanPanel()}});
ACTS.push({k:'nhmate',nin:1,custom:'x',min:18,
  get th(){return !heir()},
  get t(){return '💞 เลือกคู่ครองของทายาท'},
  get s(){return 'เลือกคู่จากตระกูลต่าง ๆ เอง หรือให้ผู้ใหญ่จัดให้ (อัตโนมัติ)'},
  open:function(){if(!heir())return;matePanel()}});

/* ---------- ลูกหลาน (NPC) เลือกคู่เองโดยอัตโนมัติ ---------- */
function kidsMarry(){
  var done=0;
  S.people.filter(function(p){return p.alive&&p.type==='ลูก'&&!p.pl&&p.age>=22&&p.age<=40}).forEach(function(p){
    if(done>=1)return;
    var k=p.kd=p.kd||{sm:R(30,80),hl:R(70,100),ed:0,career:'',gk:0};
    if(k.mar||k.spcl!=null||p.rel<30||!chance(16))return;
    var P=pool(),opts=[pick(P),pick(P),chance(40)?6:pick(P)],c=best(opts),g=p.g==='F'?'M':'F',who=nm(g)+' '+sn();
    k.mar=1;k.sp=who;k.spcl=c;done++;chg('happy',5);
    add('💍 '+p.name+' เลือกคู่ครองด้วยตัวเอง และแต่งงานกับ '+who+' จาก'+cn(c),'good')})}

/* ---------- ผูกกับการเปลี่ยนรุ่นและการผ่านปี ---------- */
var _c=window.__ninCont;
if(_c)window.__ninCont=function(o,kid){
  _c.apply(this,arguments);
  try{
    if(!S||!kid)return;
    if(kid.type==='หลาน'){
      var par=(o.people||[]).filter(function(x){return x.id===kid.par})[0];
      if(par&&par.kd&&par.kd.spcl!=null){S.clan2=(par.kd.spcl===S.clan||par.kd.spcl===6)?null:par.kd.spcl;jt();
        add('💍 พ่อแม่ของคุณคือ '+par.name+' กับ '+par.kd.sp+' จาก'+cn(par.kd.spcl)+' คุณจึงได้สายเลือดจากทั้งสองตระกูล','info')}}
    if(kid.type!=='ศิษย์')add('🏯 คุณเลือกสายตระกูลและคู่ครองของตัวเองได้ที่เมนู "ตระกูล ทีม และศิษย์" หรือเปิดโหมดอัตโนมัติให้ผู้ใหญ่จัดการ','info')
  }catch(e){}};
var _au=ageUp;
ageUp=function(){
  var a0=S&&S.age;_au();
  if(!S||!S.alive||S.age===a0||!nin())return;
  try{kidsMarry()}catch(e){}
  try{if(heir()&&S.hauto){
    if(!S.hcd&&S.age>=12)autoClan(true);
    if(S.age>=22&&!partner()&&S.money>=FEE)autoMate(true)}}catch(e){}
  try{render()}catch(e){}};
var ab=document.getElementById('ageBtn');if(ab)ab.onclick=ageUp;
})();
</script>
<script>
/* ===== ⚔️ โมดูล C: ร้านอาวุธและชุดอุปกรณ์นินจา — แยกอิสระจากโมดูล A/B =====
   เชื่อมกับ doMis (ภารกิจ) ผ่าน window.nGearRisk / nGearDm / nGearPay / nGearWear */
(function(){
var SL=[
 {k:'w',i:'🗡️',n:'อาวุธ',m:1,fx:'ลดความเสี่ยงภารกิจ',v:[2,4,7],u:'%',T:['คุไนเหล็ก','ดาบสั้นนินจา','ดาบวิเศษประจำตระกูล']},
 {k:'a',i:'🦺',n:'เกราะ',m:1.2,fx:'ลดความเสียหายเมื่อบาดเจ็บ',v:[8,15,25],u:'%',T:['ชุดนินจาผ้าหนา','เกราะอกเหล็กเบา','เกราะเกล็ดมังกรเหล็ก']},
 {k:'t',i:'🎒',n:'เครื่องมือ',m:0.8,fx:'เพิ่มค่าตอบแทนภารกิจ',v:[5,10,18],u:'%',T:['ระเบิดควันและลูกกลอนเสบียง','ชุดเครื่องมือสอดแนม','ชุดผนึกและกับดักชั้นเยี่ยม']}];
var BASE=[40000,400000,3500000],RK=[1,2,3],RN=['','เก็นนิน','ชูนิน','โจนิน'],TN=['สามัญ','ดี','ยอดฝีมือ'];
var snap=null;
function nin(){return !!(S&&S.world==='ninja')}
function gear(){return S.gear||(S.gear={})}
function smith(){return !!(S&&S.job&&/ช่างตีอาวุธ/.test(S.job.n||''))}
function price(sl,t){return Math.max(1000,Math.round(BASE[t]*sl.m*W()*(smith()?0.7:1)/1000)*1000)}
function slot(k){return SL.filter(function(s){return s.k===k})[0]}
function val(sl,g){return (g&&g.d>0)?Math.round(sl.v[g.t-1]*(g.d<25?0.5:1)):0}
function calc(){var r={w:0,a:0,t:0};if(!S||!S.gear)return r;SL.forEach(function(sl){r[sl.k]=val(sl,S.gear[sl.k])});return r}
window.nGearRisk=function(){if(snap)return snap.w;return nin()?calc().w:0};
window.nGearDm=function(){var a=snap?snap.a:(nin()?calc().a:0);return 1-a/100};
window.nGearPay=function(){var t=snap?snap.t:(nin()?calc().t:0);return 1+t/100};
window.nGearWear=function(){
  if(!nin())return;
  snap=calc();setTimeout(function(){snap=null},0);
  SL.forEach(function(sl){var g=gear()[sl.k];if(!g||g.d<=0)return;
    var loss=Math.round(R(4,9)*(g.t===3?0.7:1)),was=g.d;g.d=Math.max(0,g.d-loss);
    var nm=sl.T[g.t-1];
    if(g.d===0)add(sl.i+' '+nm+' พังเสียหายจากภารกิจ ต้องซ่อมก่อนใช้งานต่อ','bad');
    else if(was>=25&&g.d<25)add(sl.i+' '+nm+' สึกหรอหนัก ประสิทธิภาพเหลือครึ่งเดียว ควรซ่อมโดยเร็ว','info')})};

function panel(){
  sheet('⚔️ ร้านอาวุธและชุดอุปกรณ์',function(b){
    var c=calc(),g0=gear();
    var lines=SL.map(function(sl){var g=g0[sl.k];return sl.i+' '+sl.n+': '+(g?esc(sl.T[g.t-1])+' ('+TN[g.t-1]+') · ทนทาน '+g.d+'%':'ยังไม่มี')}).join('<br>');
    b.appendChild(el('div','pcard','<div class="pl">ชุดอุปกรณ์ของคุณ</div><div class="ps">'+lines+'<br>รวม: ความเสี่ยงภารกิจ −'+c.w+'% · บาดเจ็บน้อยลง '+c.a+'% · ค่าตอบแทน +'+c.t+'%'+(smith()?'<br>🔨 อาชีพช่างตีอาวุธ: ซื้อและซ่อมถูกลง 30%':'')+'</div>'));
    SL.forEach(function(sl){
      var g=g0[sl.k];
      b.appendChild(el('div','sec',sl.i+' '+sl.n+' — '+sl.fx));
      if(g&&g.d<100){
        var rc=Math.max(500,Math.round(price(sl,g.t-1)*0.3*(100-g.d)/100));
        b.appendChild(row('🔧 ซ่อม '+esc(sl.T[g.t-1]),'คืนความทนทานเป็น 100%',S.money>=rc?function(){if(!pay(rc))return;g.d=100;add('🔧 คุณซ่อม '+sl.T[g.t-1]+' จนเหมือนใหม่','good');panel();render()}:null,fmt(rc)))}
      for(var t=0;t<3;t++){(function(t){
        if(g&&g.t>=t+1)return;
        var p=price(sl,t),okR=(S.nrank||0)>=RK[t],okM=S.money>=p;
        b.appendChild(row((g?'⬆️ อัปเกรดเป็น ':'🛒 ซื้อ ')+esc(sl.T[t])+' ('+TN[t]+')',
          sl.fx+' '+sl.v[t]+'%'+(okR?'':' · ต้องเป็น'+RN[RK[t]]+'ขึ้นไป')+(okR&&!okM?' · เงินไม่พอ':'')+(g?' · ขายของเดิมคืน 30% ตามสภาพ':''),
          (okR&&okM)?function(){
            if(!pay(p))return;
            if(g){var rf=Math.round(price(sl,g.t-1)*0.3*g.d/100);if(rf>0)mon(rf)}
            g0[sl.k]={t:t+1,d:100};
            add(sl.i+' คุณได้ '+sl.T[t]+' ('+TN[t]+') มาใช้งาน','good');chg('happy',2);panel();render()}:null,fmt(p)))})(t)}
    })})}

ACTS.push({k:'ngear',nin:1,custom:'x',min:10,
  get t(){return '⚔️ ร้านอาวุธและชุดอุปกรณ์'},
  get s(){var c=nin()?calc():{w:0,a:0,t:0};return 'ซื้อ อัปเกรด ซ่อมอาวุธ เกราะ เครื่องมือ · ตอนนี้ลดเสี่ยง −'+c.w+'% บาดเจ็บ −'+c.a+'% ค่าจ้าง +'+c.t+'%'},
  open:function(){if(!nin())return;panel()}});

/* ของระดับยอดฝีมือส่งต่อให้ทายาทเป็นมรดกตระกูล (สภาพ 60%) */
var _c=window.__ninCont;
if(_c)window.__ninCont=function(o,kid){
  _c.apply(this,arguments);
  try{if(!S||!o||!o.gear)return;var got=[];
    SL.forEach(function(sl){var g=o.gear[sl.k];if(g&&g.t===3){gear()[sl.k]={t:3,d:60};got.push(sl.i+' '+sl.T[2])}});
    if(got.length)add('🏺 คุณได้รับของประจำตระกูลที่ส่งต่อมา: '+got.join(', ')+' (สภาพ 60%)','good')}catch(e){}};
})();
</script>
<script>
/* ===== 🏠 โมดูล D: กลับหน้าแรก อยู่ในเมนูโปรไฟล์ (กดรูปโปรไฟล์หรือปุ่ม ⋯) ใช้ได้ทั้งโลกปกติและโลกนินจา — แยกอิสระ =====
   บันทึกเกมอัตโนมัติก่อนกลับ แล้วเล่นต่อได้จากปุ่ม "เล่นต่อ" บนหน้าแรก */
(function(){
function goHome(){
  if(!S||!S.alive)return;
  ask('กลับหน้าแรก? ความคืบหน้าของ '+S.name+' จะถูกบันทึกไว้ และกด “เล่นต่อ” บนหน้าแรกเพื่อกลับมาเล่นได้',[
    {t:'🏠 กลับหน้าแรก',f:function(){
      try{save()}catch(e){}
      var nj=!!(S&&S.world==='ninja');
      ['sheet','evm','death'].forEach(function(i){var e=document.getElementById(i);if(e)e.classList.remove('open')});
      queue=[];showing=false;
      window.__wn=nj;draft=mkDraft(S.g,null);
      drawStart();
      /* save() ของเกมหน่วงเวลาเขียน ~250ms จึงวาดหน้าแรกซ้ำเมื่อบันทึกเสร็จ เพื่อให้ปุ่ม “เล่นต่อ” ขึ้น */
      setTimeout(function(){var s=document.getElementById('start');if(s&&s.classList.contains('open'))drawStart()},400)}},
    {t:'เล่นต่อ',f:function(){}}],'🏠 กลับหน้าแรก')}
var mb=document.getElementById('menuBtn');
var _pm=panelMenu;
panelMenu=function(){
  _pm();if(!S)return;

var OK={a:'คุณฝ่าไปได้อย่างห้าวหาญ',b:'แผนของคุณได้ผลเกินคาด',c:'คุณผ่านไปได้อย่างปลอดภัย'};
var MU={a:1.5,b:1,c:0.6};
var run=null;
function nin(){return !!(S&&S.world==='ninja')}

    S.chakra=Math.min(100,(S.chakra||0)+R(1,2));chg('happy',6);
    add(pl.i+' คุณสำรวจ'+pl.n+'ครบทั้ง 3 ด่านสำเร็จ! ได้เงินรวม '+fmt(m)+' ประสบการณ์ +'+x,'good');

  var pl=run.pl,p=odds(k,pl.d);

    var m=Math.round(PAYR[Math.min(4,S.nrank||0)]*W()*pl.pay*MU[k]*R(8,12)/10),x=Math.round(R(4,9)*pl.xp*MU[k]);

    add('🧭 ['+(run.n+1)+'/3] '+OK[k]+' พบของมีค่ามูลค่า '+fmt(m),'good');
    run.n++;if(run.n>=3)finish('done');else stage()}
  else{
    var h=Math.max(1,Math.round(R(6,16)*(1+pl.d/60)*(window.nGearDm?window.nGearDm():1)));

   {t:'⚔️ '+ev[1]+' ('+odds('a',pl.d)+'% · รางวัลมาก)',f:function(){resolve('a')}},

function start(pl){
  S.done.n_exp=1;

function panel(){

    PL.forEach(function(pl){
      var why=used?'สำรวจแล้วในปีนี้':(S.nrank||0)<pl.rk?'ต้องเป็น'+['','เก็นนิน','ชูนิน','โจนิน'][pl.rk]+'ขึ้นไป':(S.chakra||0)<pl.ch?'จักระต้อง '+pl.ch+'+':S.health<35?'สุขภาพต่ำเกินไป (ต้อง 35+)':'';

ACTS.push({k:'nexp',nin:1,custom:'x',min:12,
  get t(){return '🏹 สำรวจถ้ำและสถานที่ลับ'},
  get s(){return S&&S.done&&S.done.n_exp?'ปีนี้สำรวจไปแล้ว':'ออกสำรวจ 3 ด่าน เลือกวิธีรับมือเอง ได้ของมีค่าและคัมภีร์ · ปีละ 1 ครั้ง'},
  open:function(){if(!nin())return;panel()}});
})();

<script>
/* ===== 🩹 โมดูล F: บาดแผลถาวรและศูนย์รักษา (โลกนินจา) — แยกอิสระจากโมดูลอื่น =====

(function(){
var INJ=[
 {id:'scar',i:'😶',n:'แผลเป็นกลางใบหน้า',d:'ดูน่าเกรงขาม แต่หน้าตาเสียไป',eff:'หน้าตา −8 แต่ชื่อเสียง +5 ทันที',on:function(){S.looks=Math.max(1,S.looks-8);S.fame=(S.fame||0)+5}},

        if(!pay(c))return;o.tr=1;if(x.id==='scar')S.looks=Math.min(100,S.looks+4);
        add('🏥 คุณรับการรักษา'+x.n+' ผลเสียบรรเทาลงครึ่งหนึ่ง','good');chg('happy',4);panel();render()},o.tr?'':fmt(c)))});

    if(m.length)add('🩹 บาดแผลเก่ากำเริบ: '+m.join(' · '),'info')}catch(e){}

/* ทายาทไม่รับแผลถาวร แต่ได้เรื่องเล่าของบรรพบุรุษเป็นเกียรติตระกูล */

<script>
/* ===== 🛠️ โมดูล G: แอดมิน แยกฝั่ง 2 โลก (🌍 ปกติ / 🥷 นินจา) — แยกอิสระ ไม่แก้โค้ดแอดมินเดิม =====

(function(){
var NORMAL_ONLY=['อาชีพและการศึกษา','ค่าอื่น ๆ','🔓 ปลดล็อก','🏠 ทรัพย์สิน','🆕 ระบบใหม่ (v11)','🆕 ระบบใหม่ (v12)','ระบบอื่น ๆ','🆕 ระบบอื่น ๆ (อัปเดต v13)'];

var GS=[['w','🗡️','อาวุธ'],['a','🦺','เกราะ'],['t','🎒','เครื่องมือ']],TIERN=['สามัญ','ดี','ยอดฝีมือ'];
var side=null,lastW=null,obs=null;
function curW(){return (S&&S.world==='ninja')?'n':(S?'r':(window.__wn?'n':'r'))}
function isNin(){return !!(S&&S.world==='ninja')}
function esc2(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function activeTab(){var on=document.querySelector('#admtabs button.on'),t=on?on.textContent:'';return t.indexOf('📊')>=0?'view':t.indexOf('⚡')>=0?'cheat':t.indexOf('🧬')>=0?'edit':t.indexOf('⚙')>=0?'sys':''}

function sec(b,t){var d=el('div','sec',t);d.setAttribute('data-g','1');b.appendChild(d)}

function cmd(b,title,sub,fn){

function ig(b,ph,btn,fn){

function num(v,lo,hi){var n=Math.round(+v);if(!isFinite(n)||n<lo||n>hi)throw new Error('ใส่ตัวเลข '+lo+'-'+hi);return n}

/* ---------- ข้อมูลฝั่งนินจา (แท็บเช็กข้อมูล) ---------- */
function ninView(b){
  sec(b,'🥷 ข้อมูลโลกนินจา');

  kv(b,'ฝั่ง',esc2(S.side||'หมู่บ้าน')+(S.bty?' · ค่าหัว '+S.bty+'/100':''));

  kv(b,'ธาตุ',esc2(S.nat||'-'));

  kv(b,'อุปกรณ์',GS.map(function(g){var x=S.gear&&S.gear[g[0]];return g[1]+(x?TIERN[x.t-1]+' '+x.d+'%':'-')}).join(' · '));
  kv(b,'บาดแผลถาวร',(S.inj&&S.inj.length)?S.inj.map(function(o){var x=INJN.filter(function(y){return y[0]===o.id})[0];return x?x[1]+x[2]+(o.tr?'(บรรเทาแล้ว)':''):''}).join(', '):'ไม่มี');
  kv(b,'ทายาท',(S.gen||1)>1?'รุ่นที่ '+S.gen+(S.hcd?' · เลือกตระกูลแล้ว':'')+(S.hauto?' · โหมดอัตโนมัติ':''):'รุ่นแรก')}

/* ---------- คำสั่งฝั่งนินจา (แท็บโกง) ---------- */
function ninCheat(b){
  note(b,'🥷 คำสั่งของฝั่งโลกนินจา (ใช้กับตัวละครนินจาเท่านั้น) · ติดธงแอดมิน ไม่ได้แต้มมรดก');
  sec(b,'🥷 ยศและพลัง');
  RNK.forEach(function(n,i){cmd(b,'🎖️ ตั้งยศเป็น '+n,'',function(){S.nrank=i})});
  cmd(b,'⚡ จักระ 100','',function(){S.chakra=100});
  cmd(b,'📈 ประสบการณ์นินจา +100','',function(){S.nxp=(S.nxp||0)+100});
  cmd(b,'🏆 เกียรติตระกูล +100','',function(){S.cp=(S.cp||0)+100});
  cmd(b,'🌟 ชื่อเสียง +100','',function(){S.fame=(S.fame||0)+100});
  sec(b,'🔥 ธาตุและสัตว์หาง');
  NATS.forEach(function(n){cmd(b,'🔥 ธาตุ'+n,'',function(){S.nat=n})});
  ig(b,'สัตว์หาง 0-9 (0 = ไม่มี)','ตั้งสัตว์หาง',function(v){var n=num(v,0,9);S.tb=n;S.tc=n?100:0});
  sec(b,'🏯 ตระกูลและสายเลือด');
  (window.nClans||[]).forEach(function(c,i){cmd(b,'🏯 ตั้งตระกูลหลัก: '+c.n,'',function(){S.clan=i;S.clan2=null;if(window.nClanJt)window.nClanJt()})});
  sec(b,'📖 วิชานินจา');
  cmd(b,'📖 เรียนวิชาทั้งหมดที่ไม่ผูกกับตระกูล','',function(){var J=window.nJ;if(!J)throw new Error('ระบบวิชายังไม่พร้อม');var k=S.jt||(S.jt=[]);J.JT.forEach(function(j){if(!J.JCL[j[0]]&&k.indexOf(j[0])<0)k.push(j[0])})});
  cmd(b,'📚 เรียนวิชาทั้งหมดในเกม','รวมวิชาลับของทุกตระกูล',function(){var J=window.nJ;if(!J)throw new Error('ระบบวิชายังไม่พร้อม');var k=S.jt||(S.jt=[]);J.JT.forEach(function(j){if(k.indexOf(j[0])<0)k.push(j[0])})});
  cmd(b,'🧹 ลืมวิชาทั้งหมด (แล้วคืนวิชาประจำตระกูล)','',function(){S.jt=[];if(window.nClanJt)window.nClanJt()});
  sec(b,'🐸 สัญญาอัญเชิญ');
  SUMS.forEach(function(x){cmd(b,x[1]+' ทำสัญญากับ'+x[2]+' (สนิท 100)','',function(){S.sum={a:x[0],b:100,sy:S.age,ty:-1}})});
  cmd(b,'🗑️ ยกเลิกสัญญาอัญเชิญ','',function(){S.sum=null});
  sec(b,'⚔️ อุปกรณ์');
  cmd(b,'⚔️ อุปกรณ์ครบชุดระดับยอดฝีมือ','',function(){S.gear={w:{t:3,d:100},a:{t:3,d:100},t:{t:3,d:100}}});
  cmd(b,'🔧 ซ่อมอุปกรณ์ทั้งหมด','',function(){Object.keys(S.gear||{}).forEach(function(k){S.gear[k].d=100})});
  cmd(b,'🗑️ ล้างอุปกรณ์ทั้งหมด','',function(){S.gear={}});

  cmd(b,'🤖 สลับโหมดอัตโนมัติของทายาท','ตอนนี้: '+(S.hauto?'เปิด':'ปิด'),function(){S.hauto=S.hauto?0:1});
  sec(b,'⚖️ ฝั่งและกิจกรรม');

  cmd(b,'🗡️ ตั้งฝั่งเป็นผู้ทรยศ','',function(){S.side='ผู้ทรยศ';S.bty=S.bty||20});
  cmd(b,'🕊️ ล้างค่าหัว','',function(){S.bty=0});
  cmd(b,'🔄 รีเซ็ตกิจกรรมรายปีทั้งหมด','ภารกิจ สำรวจ ฝึกวิชา ฯลฯ ทำได้อีกครั้งในปีนี้',function(){S.done={}})}

/* ---------- ประมวลผลหน้าต่างแอดมินหลังวาดเสร็จ ---------- */
function normalOnly(h){return NORMAL_ONLY.some(function(x){return h.indexOf(x)===0})}
function process(){
  if(obs)obs.disconnect();
  try{
    var b=document.getElementById('admBody'),tb=document.getElementById('admtabs');if(!b||!tb)return;
    var cw=curW();if(lastW!==cw||side==null){side=cw;lastW=cw}
    var bar=document.getElementById('admSide');
    if(!bar){bar=document.createElement('div');bar.id='admSide';tb.parentNode.insertBefore(bar,b)}
    var tab=activeTab(),shared=(tab==='edit'||tab==='sys');
    bar.innerHTML='';
    [['r','🌍 โลกปกติ'],['n','🥷 โลกนินจา']].forEach(function(x){
      var bt=document.createElement('button');bt.type='button';bt.textContent=x[1];
      var on=!shared&&side===x[0];bt.className=on?'on':'';
      bt.style.cssText='border:0;border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;'+(on?'background:var(--head,#2563eb);color:#fff':'background:rgba(128,128,128,.2);color:inherit');
      bt.onclick=function(){side=x[0];redraw()};bar.appendChild(bt)});
    var info=document.createElement('span');info.style.cssText='font-size:12px;opacity:.75;margin-left:4px';
    info.textContent=shared?'แท็บนี้ใช้ร่วมกันทั้ง 2 โลก':('ตัวละครตอนนี้: '+(S?(cw==='n'?'🥷 โลกนินจา':'🌍 โลกปกติ'):'ยังไม่เริ่มชีวิต'));
    bar.appendChild(info);
    bar.style.cssText='display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px';
    [].slice.call(b.querySelectorAll('[data-g]')).forEach(function(e){e.remove()});
    [].slice.call(b.children).forEach(function(e){e.style.display=''});
    if(shared||(tab!=='view'&&tab!=='cheat'))return;
    var cur=null,hide=false,jobs=(typeof JOBS!=='undefined'?JOBS:[]);
    [].slice.call(b.children).forEach(function(e){
      if(e.classList.contains('sec')){cur=e.textContent.trim();hide=(side==='n')&&normalOnly(cur);e.style.display=hide?'none':'';return}
      var h=hide;
      if(!h&&cur&&cur.indexOf('💼 อาชีพ')===0){
        var t=(e.textContent||'').trim(),best=null;
        jobs.forEach(function(J){if(t.indexOf('💼 '+J.n)===0&&(!best||J.n.length>best.n.length))best=J});
        if(best){var nj=!!best.nin;h=(side==='n')!==nj}}
      e.style.display=h?'none':''});
    if(S&&side!==cw){var w=document.createElement('div');w.className='note';w.setAttribute('data-g','1');
      w.textContent='⚠️ ตัวละครตอนนี้อยู่'+(cw==='n'?'โลกนินจา':'โลกปกติ')+' คำสั่งของฝั่งที่เลือกอยู่อาจไม่มีผลหรือทำให้ค่าเพี้ยน';b.insertBefore(w,b.firstChild)}
    if(side==='n'&&isNin()){
      var tmp=document.createElement('div');
      if(tab==='view')ninView(tmp);else ninCheat(tmp);
      var first=b.firstChild,kids=[].slice.call(tmp.childNodes);
      kids.forEach(function(k){b.insertBefore(k,first)})}
  }catch(e){}
  if(obs){obs.takeRecords();var bb=document.getElementById('admBody');if(bb)obs.observe(bb,{childList:true})}}

var bd=document.getElementById('admBody');
if(bd){obs=new MutationObserver(function(){process()});obs.observe(bd,{childList:true})}
})();
</script>
<script>
/* ===== 🧹 โมดูล H: อุดรอยรั่วข้อความโลกปกติในโลกนินจา — แยกอิสระ =====
   ทำงานเฉพาะเมื่อตัวละครอยู่โลกนินจา: แปลงสัญลักษณ์เงิน ฿ เป็นเรียว และเปลี่ยนข้อความที่เป็นของโลกปกติ (หุ้น เกรดเฉลี่ย ผู้ว่างงาน) ให้เข้ากับโลกนินจา
   ไม่เปลี่ยนผลของเหตุการณ์ใดๆ เปลี่ยนเฉพาะข้อความที่แสดง */
(function(){
var MAP=[
 ['📉 เศรษฐกิจถดถอย พอร์ตหุ้นร่วง','📉 บ้านเมืองข้าวยากหมากแพง การค้าในหมู่บ้านซบเซา'],
 ['📈 เศรษฐกิจเติบโตดี ตลาดหุ้นพุ่ง','📈 บ้านเมืองสงบสุข การค้าในหมู่บ้านเฟื่องฟู'],
 ['📈 เศรษฐกิจรุ่งเรือง! ตลาดหุ้นพุ่ง เงินเดือนปรับขึ้น','📈 บ้านเมืองรุ่งเรือง! การค้าเฟื่องฟู ค่าจ้างปรับขึ้น'],

var ctx=cv.getContext('2d');

/* ---------- ข้อมูลทั่วไป ---------- */
function seed(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
function lerp(a,b,t){return a+(b-a)*t}
function hex(c){return [parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)]}
function mix(c1,c2,t){var a=hex(c1),b=hex(c2);return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')'}
function shade(c,k){var a=hex(c);return 'rgb('+Math.max(0,Math.min(255,Math.round(a[0]*k)))+','+Math.max(0,Math.min(255,Math.round(a[1]*k)))+','+Math.max(0,Math.min(255,Math.round(a[2]*k)))+')'}
var SKY=[{t:'#f3a36b',b:'#ffe2b0'},{t:'#5db6ff',b:'#d9f2ff'},{t:'#6d4fc9',b:'#ffa97a'},{t:'#0a0f2e',b:'#2b3170'}];
function sky(ph){var seg=ph*4,i=Math.floor(seg)%4,f=seg-Math.floor(seg),a=SKY[i],b=SKY[(i+1)%4];return {t:mix(a.t,b.t,f),b:mix(a.b,b.b,f)}}
function nightness(ph){return ph<0.5?0:Math.max(0,Math.min(1,Math.abs(ph-0.75)<0.12?1:1-(Math.abs(ph-0.75)-0.12)/0.13))}
function isNin(){return !!(S&&S.world==='ninja')}

 study:{p:3,d:2.6,e:'📚'},work:{p:3,d:2.6,e:'💼'},eat:{p:2,d:2.2,e:'🍜'},sleep:{p:2,d:3,e:'💤'},celebrate:{p:1,d:1.7,e:'🎉'}};

  ch.act=name;ch.actT=a.d;bubTxt=emo||a.e;bubT=a.d+0.4;
  if(name==='hurt')ch.flash=0.5;

  if(!cfg.motion)drawOnce()}
function onLog(t,k){
  if(typeof t!=='string'||!S||!S.alive)return;
  var now=Date.now();if(now-lastEvt<350)return;
  var n=null;
  if(/บาดเจ็บ|ป่วย|ล้มเหลว|ปฏิเสธ|พลาดท่า|พังเสียหาย|ทรุดโทรม|สุขภาพ −/.test(t))n='hurt';
  else if(/ภารกิจ/.test(t))n='mission';
  else if(/สำรวจ|ถ้ำ|หอคอย/.test(t))n='explore';
  else if(/ฝึก|ซ้อม/.test(t))n='train';
  else if(/เรียน|สอบ|อ่าน|คอร์ส|ทุน/.test(t))n='study';
  else if(/ทำงาน|เงินเดือน|เลื่อนตำแหน่ง|ธุรกิจ|กิจการ/.test(t))n='work';
  else if(/กิน|อาหาร|ราเม็ง|เลี้ยง/.test(t))n='eat';
  else if(/พักฟื้น|นอน/.test(t))n='sleep';
  else if(/ปลดล็อก|แต่งงาน|วันเกิด|ได้รับ|สำเร็จ|ชนะ|ยินดี|ตอบรับ/.test(t))n='celebrate';
  else if(k==='bad')n='hurt';
  if(n){lastEvt=now;setAct(n)}}
function burst(col){
  var cols=col?[col,'#ffd34d']:['#ff5b5b','#ffd34d','#4fd1c5','#7aa2ff','#ff9be0'];
  for(var i=0;i<14;i++)parts.push({x:ch.x,y:GY-14,vx:(Math.random()-0.5)*40,vy:-20-Math.random()*30,life:0.9+Math.random()*0.5,c:cols[i%cols.length],g:70})}
function spark(){parts.push({x:ch.x+ch.dir*7,y:GY-10+Math.random()*3,vx:ch.dir*(10+Math.random()*20),vy:-8-Math.random()*8,life:0.35,c:'#fff3a8',g:20})}

/* ---------- ฉากหลัง ---------- */
function buildBg(){
  rnd=seed((S&&S.name||'')+'|'+(S&&S.country||'')+'|'+(S&&S.world||''));bg={b:[],m1:[],m2:[],star:[],leaf:[],cloud:[]};
  var x=0;while(x<W+20){var w=6+Math.floor(rnd()*9),h=12+Math.floor(rnd()*22);bg.b.push({x:x,w:w,h:h,r:rnd()});x+=w+Math.floor(rnd()*3)}
  for(var i=0;i<30;i++)bg.star.push({x:rnd()*W,y:rnd()*(GY-18),p:rnd()*6});
  for(i=0;i<5;i++)bg.cloud.push({x:rnd()*W,y:4+rnd()*14,w:12+rnd()*14,s:2+rnd()*3});
  for(i=0;i<7;i++)bg.leaf.push({x:rnd()*W,y:rnd()*GY,s:5+rnd()*6,p:rnd()*6});
  bg.p1=rnd()*6;bg.p2=rnd()*6;bg.pagoda=Math.floor(W*(0.62+rnd()*0.22))}
function resize(){
  var w=stage.clientWidth||app.clientWidth||360,h=SIZES[cfg.size]||120;
  PX=Math.max(2,Math.round(h/56));W=Math.max(60,Math.floor(w/PX));H=Math.floor(h/PX);GY=H-Math.max(9,Math.round(H*0.2));
  cv.width=W;cv.height=H;cv.style.height=h+'px';
  if(ch.x>W-8)ch.x=ch.tx=W-10;buildBg();if(!cfg.motion)drawOnce()}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}

function drawBg(time,ph,ni){
  var s=sky(ph),g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,s.t);g.addColorStop(1,s.b);ctx.fillStyle=g;ctx.fillRect(0,0,W,GY+1);
  var i,n;
  if(ni>0.3){ctx.globalAlpha=Math.min(1,(ni-0.3)*1.6);for(i=0;i<bg.star.length;i++){n=bg.star[i];if(Math.sin(time*2+n.p)>-0.4)rect(n.x,n.y,1,1,'#fff')}ctx.globalAlpha=1}
  /* ดวงอาทิตย์/ดวงจันทร์ */
  var fr=ph<0.5?ph/0.5:(ph-0.5)/0.5,sx=W*(0.08+0.84*fr),sy=GY-4-Math.sin(Math.PI*fr)*(GY*0.62);
  if(ph<0.5){rect(sx-3,sy-3,7,7,'#ffe27a');rect(sx-2,sy-4,5,9,'#ffe27a');rect(sx-4,sy-2,9,5,'#ffe27a')}
  else{rect(sx-3,sy-3,7,7,'#f4f1e6');rect(sx-2,sy-4,5,9,'#f4f1e6');rect(sx-4,sy-2,9,5,'#f4f1e6');rect(sx,sy-2,3,3,'#d9d5c4')}
  if(ni<0.6){ctx.globalAlpha=0.9*(1-ni);for(i=0;i<bg.cloud.length;i++){n=bg.cloud[i];var cx=((n.x+time*n.s*cfg.speed*(cfg.motion?1:0))%(W+30))-15;rect(cx,n.y,n.w,3,'#fff');rect(cx+3,n.y-2,n.w-8,2,'#fff')}ctx.globalAlpha=1}
  if(isNin()){
    var m,d1=mix('#3b4a7a','#0f1230',ni),d2=mix('#27345f','#0a0c24',ni);
    for(i=0;i<W;i++){m=Math.round(10+Math.sin(i*0.07+bg.p1)*6+Math.sin(i*0.19+bg.p1)*3);rect(i,GY-m-10,1,m+10,d1)}
    for(i=0;i<W;i++){m=Math.round(6+Math.sin(i*0.11+bg.p2)*4+Math.sin(i*0.3)*2);rect(i,GY-m,1,m,d2)}
    var px=bg.pagoda,rc=mix('#6b2f3a','#241024',ni),wc=mix('#b3a58a','#2a2a40',ni);
    for(i=0;i<3;i++){var yy=GY-8-i*7,ww=14-i*3;rect(px-ww/2,yy,ww,5,wc);rect(px-ww/2-2,yy-1,ww+4,2,rc);rect(px-ww/2-3,yy-2,2,2,rc);rect(px+ww/2+1,yy-2,2,2,rc)}
    rect(px-1,GY-30,2,5,rc);
    if(ni>0.4)for(i=0;i<3;i++)rect(px-2+i*2,GY-6-i*0,1,2,'#ffd27a');
  }else{
    for(i=0;i<bg.b.length;i++){n=bg.b[i];var by=GY-n.h,bc=mix('#7d8aa8','#171c3a',ni);rect(n.x,by,n.w,n.h,bc);
      for(var wy=by+2;wy<GY-3;wy+=3)for(var wx=n.x+1;wx<n.x+n.w-1;wx+=3){var lit=ni>0.35&&((wx*7+wy*3+Math.floor(n.r*10))%5<2);rect(wx,wy,1,2,lit?'#ffd878':mix('#a6b3cf','#232a55',ni))}}
  }

  if(isNin()&&cfg.motion)for(i=0;i<bg.leaf.length;i++){n=bg.leaf[i];var lx=(n.x+time*n.s*cfg.speed*2)%(W+10),ly=(n.y+time*n.s*0.9*cfg.speed)%(GY-4)+Math.sin(time*2+n.p)*2;rect(lx,ly,2,1,ni>0.5?'#7a3a3a':'#d9603a')}
}

/* ---------- ตัวละคร ---------- */
var HAIRGRAY='#d4d4d4',RANKC=['#9aa3b2','#4fbf6b','#4a8cff','#e05252','#f2c230'];
function clothes(){
  if(isNin())return {top:'#1f2a44',bot:'#151b30',acc:RANKC[Math.min(4,S.nrank||0)],mask:true};
  var pal=['#e45b5b','#4f8cff','#3ec28f','#f2b134','#9b6bff','#ff8fab'],h=0,nm=String(S.name||'x');for(var i=0;i<nm.length;i++)h=(h*31+nm.charCodeAt(i))>>>0;
  return {top:pal[h%pal.length],bot:'#3a4a6b',acc:null,mask:false}}
function drawChar(time){
  var ap=S.ap||{},age=S.age||0,f=age<2?0.5:age<6?0.62:age<13?0.78:age<18?0.92:1;
  var skin=ap.skin||'#f3c6a0',hairC=age>=62?HAIRGRAY:(ap.hair||'#1f1a17'),st=ap.style||'short',cl=clothes();
  var hH=Math.max(4,Math.round(6*f)),tH=Math.max(3,Math.round(6*f)),lH=Math.max(3,Math.round(6*f)),bw=Math.max(4,Math.round(6*f)),lw=Math.max(1,Math.round(2*f));
  var act=ch.actT>0?ch.act:null,moving=!act&&Math.abs(ch.tx-ch.x)>1.2||act==='mission'||act==='explore';
  var bob=moving?Math.round(Math.abs(Math.sin(ch.ph*2))):Math.round(Math.sin(time*2.2)*0.5+0.5);
  var jump=act==='celebrate'?Math.round(Math.abs(Math.sin(time*9))*5):0;
  var shake=act==='hurt'?Math.round(Math.sin(time*50)*1):0;
  var tot=hH+tH+lH,x=Math.round(ch.x)+shake,y0=GY-tot-jump+(act==='sleep'?0:0);
  /* เงา */
  ctx.globalAlpha=0.28;rect(x-bw/2-1,GY,bw+2,1,'#000');ctx.globalAlpha=1;
  ctx.save();ctx.translate(x,0);ctx.scale(ch.dir,1);
  if(act==='sleep'){
    /* นอนราบ */
    rect(-bw-2,GY-4,bw*2,4,'#8a6bd6');rect(-bw-2,GY-4,bw*2,1,'#a98cf0');
    rect(-bw-5,GY-7,5,5,skin);rect(-bw-5,GY-8,5,2,hairC);
    if(cl.mask)rect(-bw-4,GY-4,3,1,'#222');
    ctx.restore();return}
  /* ขา */
  var sw=moving?Math.round(Math.sin(ch.ph*2)*2):0,ly=y0+hH+tH+bob;
  rect(-lw-0.5+sw,ly,lw,lH-1,cl.bot);rect(0.5-sw,ly,lw,lH-1,shade(cl.bot,1.2));
  rect(-lw-0.5+sw,ly+lH-1,lw+1,1,'#222');rect(0.5-sw,ly+lH-1,lw+1,1,'#222');
  /* ตัว */

  /* แขน */
  var armUp=act==='celebrate',aw=1;
  if(act==='train'||act==='mission'){var pu=Math.floor(time*6)%2;rect(bw/2,ty+1,3+pu*2,1+(f>0.8?1:0),skin);rect(-bw/2-1,ty+1,1,tH-1,shade(cl.top,0.9))}
  else if(act==='work'||act==='study'||act==='eat'){rect(bw/2,ty+2,2,1,skin);rect(-bw/2-1,ty+2,1,2,shade(cl.top,0.9))}
  else if(armUp){rect(bw/2,ty-2,1,4,skin);rect(-bw/2-1,ty-2,1,4,skin)}
  else{var as=moving?Math.round(Math.sin(ch.ph*2)*1):0;rect(bw/2,ty+1+as,aw,tH-1,skin);rect(-bw/2-1,ty+1-as,aw,tH-1,shade(cl.top,0.9))}
  /* หัว */
  var hy=y0+bob,hw=bw;rect(-hw/2,hy,hw,hH,skin);
  if(cl.mask)rect(-hw/2,hy+hH-2,hw,2,'#2a2f45');

    if(st==='buzz'){rect(-hw/2,hy,hw,1,hairC)}
    else if(st==='curly'){rect(-hw/2-1,hy-1,hw+2,3,hairC);rect(-hw/2-1,hy+2,1,2,hairC);rect(hw/2,hy+2,1,2,hairC)}
    else{rect(-hw/2,hy-1,hw,2,hairC);rect(-hw/2,hy+1,1,Math.max(1,Math.round(hH*0.35)),hairC);
      if(st==='long'){rect(-hw/2-1,hy+1,2,hH+2,hairC);rect(hw/2-1,hy+1,2,hH+2,hairC)}
      if(st==='bob'){rect(-hw/2-1,hy+1,2,hH-1,hairC);rect(hw/2-1,hy+1,2,hH-1,hairC)}
      if(st==='ponytail'){rect(-hw/2-2,hy+1,2,Math.round(hH*0.8),hairC)}}}
  if(isNin())rect(-hw/2,hy+Math.round(hH*0.35),hw,1,cl.acc);

  if(!bl){rect(hw/2-3,hy+Math.round(hH*0.5),1,1,'#1b1b1b');rect(0,hy+Math.round(hH*0.5),1,1,'#1b1b1b')}
  if(ap.gl)rect(hw/2-4,hy+Math.round(hH*0.5)-1,6,1,'#334155');

  if(ch.flash>0){ctx.globalAlpha=Math.min(0.55,ch.flash);rect(-hw/2-1,y0-1,hw+3,tot+3,'#ff3b3b');ctx.globalAlpha=1}
  ctx.restore()}

/* ---------- อัปเดต/วาด ---------- */
var last=0,acc=0,t0=performance.now();
function update(dt){
  var sp=cfg.speed;ch.ph+=dt*8*sp;
  if(ch.flash>0)ch.flash-=dt;
  if(ch.actT>0){
    ch.actT-=dt;
    if(ch.act==='mission'){ch.x+=ch.dir*60*dt*sp;if(ch.x>W-10)ch.dir=-1;if(ch.x<10)ch.dir=1;ch.tx=ch.x}
    else if(ch.act==='explore'){ch.x+=ch.dir*14*dt*sp;if(ch.x>W-10)ch.dir=-1;if(ch.x<10)ch.dir=1;ch.tx=ch.x}
    else if(ch.act==='train'&&Math.random()<dt*10)spark();
    if(ch.actT<=0)ch.act=null;
  }else{
    var d=ch.tx-ch.x;
    if(Math.abs(d)>1.2){ch.dir=d>0?1:-1;ch.x+=ch.dir*13*dt*sp}
    else{ch.idle-=dt*sp;if(ch.idle<=0){ch.tx=10+Math.random()*(W-20);ch.idle=1.5+Math.random()*3.5}}}
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
  if(bubT>0)bubT-=dt}
function place(){
  if(!cfg.bubble||bubT<=0||!bubTxt){bub.style.opacity='0';return}
  var tot=Math.round(6*(((S.age||0)<2?0.5:(S.age||0)<6?0.62:(S.age||0)<13?0.78:(S.age||0)<18?0.92:1))*3)+2,sx=stage.clientWidth/W,sy=cv.clientHeight/H;
  var lg=bubTxt.length>3,hf=lg?80:20;

<script>

(function(){

/* ---------- ภูมิอากาศ ---------- */
var COLD='RU NO SE FI IS CA DK EE LV LT BY UA PL GL FO AX SJ MN KZ',TEMP='JP KR KP CN TW US GB DE FR IT ES AT CH NL BE LU CZ SK HU RO BG RS HR SI BA ME MK AL XK IE PT GR TR IR AF AM AZ GE UZ TM KG TJ MD AD MC LI SM VA GG JE IM GI',SOUTH='AR CL UY AU NZ ZA LS SZ PY BO';

<script>
/* ===== 👆 โมดูล S: แตะตัวละครโต้ตอบ (ขั้นที่ 3) — แยกอิสระ =====
   แตะที่ตัวละคร → โบกมือ/กระโดดและพูดประโยคสั้นๆ ตามอายุ อารมณ์ สุขภาพ เงิน สภาพอากาศ และโลกที่เล่นอยู่
   แตะที่ว่างในฉาก → ตัวละครเดินไปหา · แตะรัวๆ จะมีประโยคตลก · เปิด/ปิดได้ในปุ่ม ⚙️ ของฉาก */
(function(){
var stage=document.getElementById('stage'),base=stage&&stage.querySelector('canvas');
if(!stage||!base||!window.lkStage)return;
var KEY='lk_tap',cfg={on:1};
try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv&&sv.on!==undefined)cfg.on=sv.on?1:0}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){}}
function pickOne(a){return a[Math.floor(Math.random()*a.length)]}
var taps=[],lastSay='',pend=null;
function lines(){
  var pool=[],ge=[],age=S.age||0,nin=S.world==='ninja',wt=window.lkWeather&&window.lkWeather.type?window.lkWeather.type():'clear';
  if(age<6)pool.push('หนูอยากกินขนม','ไปเล่นกันเถอะ!','อยากให้แม่กอด','ชอบจังเลย!');
  else if(age<13)pool.push('ไปโรงเรียนสนุกจัง','เลิกเรียนแล้วไปเล่นกัน!','การบ้านเยอะจัง...');
  if(age>=62)pool.push('สมัยก่อนไม่เป็นแบบนี้นะ','เข่าเริ่มไม่ไหวแล้ว','ชีวิตผ่านมาไกลจริงๆ');
  if(S.health<30)pool.push('รู้สึกไม่ค่อยสบายเลย...','ต้องพักผ่อนบ้างแล้ว');
  if(S.happy<30)pool.push('วันนี้เหนื่อยจัง...','อยากให้ใครสักคนฟังหน่อย');
  if(S.happy>80)pool.push('ชีวิตดีจังเลย!','วันนี้อารมณ์ดีสุดๆ');
  if(S.money<0)pool.push('เงินหมดอีกแล้วสิ...','ต้องหาเงินเพิ่มแล้ว');
  if(wt==='rain'||wt==='storm')pool.push('ฝนตกอีกแล้ว...','ดีที่มีร่ม');
  if(wt==='snow')pool.push('หนาวจัง!','หิมะสวยดีนะ');
  if(wt==='fog')pool.push('หมอกจัดจนมองไม่เห็นทางเลย');
  if(nin){
    ge.push('ต้องฝึกให้หนักกว่านี้!','ภารกิจต่อไปคืออะไรนะ','ขอซ้อมอีกรอบ!','จักระกำลังไหลดี','คืนนี้ดวงจันทร์สวยจัง');
    if((S.nrank||0)<3)ge.push('สักวันฉันจะเป็นโจนินให้ได้','อยากเลื่อนขั้นเร็วๆ');
    if(S.sum)ge.push('เจ้าสัตว์อัญเชิญของฉันหิวหรือยังนะ');
    if((S.inj||[]).length)ge.push('แผลเก่าเริ่มปวดอีกแล้ว');
    if(S.tb)ge.push('ข้างในตัวฉันมีบางอย่างขยับ...');
  }else ge.push('วันนี้อากาศดีนะ','ไปหาอะไรกินดีกว่า','ชีวิตก็แบบนี้แหละ','อยากไปเที่ยวบ้างจัง','มีอะไรให้ทำเยอะเลย');
  var all=pool.length&&Math.random()<0.65?pool:ge;
  return all}
function onTap(e){
  if(!cfg.on)return;
  if(e.target.closest&&e.target.closest('button'))return;
  var cs=window.lkStage.cfg;if(!cs.on||!S||!S.alive)return;
  var r=stage.getBoundingClientRect(),sz=window.lkStage.size(),lx=(e.clientX-r.left)/r.width*sz.W,ly=(e.clientY-r.top)/r.height*sz.H,pos=window.lkStage.pos();
  var hit=Math.abs(lx-pos.x)<=9&&ly>=pos.top-6&&ly<=sz.GY+3;
  var now=Date.now();taps=taps.filter(function(x){return now-x<4000});taps.push(now);
  if(hit){
    if(taps.length>=7){clearTimeout(pend);window.lkStage.act('celebrate','🤣');window.lkStage.say(pickOne(['พอแล้ว จั๊กจี้นะ!','หยุดแตะได้แล้วน่า!','ว้าก เดี๋ยวก็เวียนหัวหรอก']),2.6);taps=[];return}
    var t=pickOne(lines());if(t===lastSay)t=pickOne(lines());lastSay=t;
    window.lkStage.act('celebrate',pickOne(['👋','😊','✨']));
    clearTimeout(pend);pend=setTimeout(function(){window.lkStage.say(t,3)},350);
  }else window.lkStage.go(lx)}
stage.addEventListener('click',onTap);
stage.style.cursor='pointer';
window.lkTap={cfg:cfg,save:save};
})();
</script>
<script src="/guest-timer.js"></script>
</body>
</html>
