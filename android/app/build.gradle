plugins {
    id "com.android.application"
}

android {
    namespace "com.baan.suansukjai"
    compileSdk 36

    defaultConfig {
        applicationId "com.baan.suansukjai"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions "edition"

    productFlavors {
        online {
            dimension "edition"
            applicationIdSuffix ".online"
            versionNameSuffix "-online"
            buildConfigField "String", "GAME_URL", '"https://buss2545.github.io/minecraft-web/game-core/baan-suan-sukjai-core.html"'
            buildConfigField "boolean", "EMBEDDED", "false"
        }
        embedded {
            dimension "edition"
            applicationIdSuffix ".embedded"
            versionNameSuffix "-embedded"
            buildConfigField "String", "GAME_URL", '""'
            buildConfigField "boolean", "EMBEDDED", "true"
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.webkit:webkit:1.14.0"
}
