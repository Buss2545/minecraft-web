<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#cfe6df">
<meta name="description" content="บ้านสวนสุขใจ — เกมชีวิตและฟาร์ม 2D">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<title>บ้านสวนสุขใจ | เกม 2D</title>
<style>
:root{
  --sky:#cfe6df; --sky2:#f3f0d6; --paddy:#6aa04f; --paddy-d:#3f7a45; --ink:#17302b;
  --marigold:#f2b233; --marigold-d:#c98a0c; --soil:#8a5a35; --white:#fffdf5;
  --r:18px;
}
@media (prefers-color-scheme:dark){
  :root{--sky:#16302f; --sky2:#27402f; --ink:#f4f1df; --white:#13261f; --paddy:#4f8a42; --paddy-d:#2f6a3a}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:'Noto Sans Thai',system-ui,sans-serif; color:var(--ink);
  background:linear-gradient(var(--sky) 0 55%,var(--sky2));
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  min-height:100%; overflow-x:hidden;
}
.page{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative}

/* ฉากหลัง: ทุ่งนาและบ้านสวน */
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sun{position:absolute;top:9%;right:14%;width:84px;height:84px;border-radius:50%;background:var(--marigold);box-shadow:0 0 0 14px #f2b23333,0 0 0 30px #f2b2331a}
.hill{position:absolute;left:-10%;right:-10%;border-radius:50% 50% 0 0}
.hill.a{bottom:30%;height:30%;background:#8fbd73}
.hill.b{bottom:22%;height:26%;background:var(--paddy);left:20%}
.paddy{position:absolute;left:0;right:0;bottom:0;height:34%;background:
  repeating-linear-gradient(172deg,var(--paddy-d) 0 18px,var(--paddy) 18px 36px)}
.house{position:absolute;left:11%;bottom:31%;width:92px;height:70px}
.house::before{content:"";position:absolute;left:0;right:0;top:0;height:34px;background:var(--soil);clip-path:polygon(50% 0,100% 100%,0 100%)}
.house::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:38px;background:#e9c98e;border-bottom:6px solid var(--soil)}
.house i{position:absolute;left:50%;bottom:0;width:16px;height:24px;margin-left:-8px;background:var(--soil);border-radius:8px 8px 0 0;z-index:2}

/* เนื้อหา */
.panel{
  position:relative;z-index:1;width:min(100%,440px);
  margin:0 auto;padding:28px 20px 40px;
  display:flex;flex-direction:column;gap:14px;
}
.title{font-family:'Mali',sans-serif;font-weight:700;font-size:clamp(2.4rem,11vw,3.4rem);line-height:1.15;text-align:center;letter-spacing:.01em}
.sub{text-align:center;font-size:1rem;opacity:.8;margin-bottom:10px}

.btn{
  display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 18px;
  font:inherit;color:var(--ink);text-align:left;text-decoration:none;cursor:pointer;
  background:var(--white);border:3px solid var(--ink);border-radius:var(--r);
  box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--marigold);outline-offset:3px}
.btn .ico{font-size:1.7rem;width:2.2rem;text-align:center;flex:none}
.btn b{display:block;font-family:'Mali',sans-serif;font-size:1.25rem}
.btn small{display:block;font-size:.85rem;opacity:.75;margin-top:1px}
.btn.main{background:var(--marigold);min-height:84px}
.btn.main b{font-size:1.6rem}

/* หน้าต่างออนไลน์ */
dialog{
  width:min(92vw,400px);padding:22px 20px 20px;color:var(--ink);background:var(--white);
  border:3px solid var(--ink);border-radius:var(--r);box-shadow:0 8px 0 var(--ink);
  margin:auto;overflow-x:hidden;
}
dialog::backdrop{background:#0a1f1ccc}
dialog h2{font-family:'Mali',sans-serif;font-size:1.5rem;margin-bottom:4px}
dialog p{font-size:.92rem;opacity:.8;margin-bottom:14px;line-height:1.5}
.x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-size:1.4rem;cursor:pointer}
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.room{
  min-width:0;min-height:62px;padding:6px 8px;line-height:1.25;font:700 1.05rem 'Mali',sans-serif;color:var(--ink);background:var(--white);
  border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;
}
.room:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.room.last{background:var(--marigold)}
.room:focus-visible,.x:focus-visible{outline:3px solid var(--marigold);outline-offset:3px}
.music{position:fixed;z-index:2;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));
  width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:var(--white);font-size:1.3rem;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.music:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.music:focus-visible{outline:3px solid var(--marigold);outline-offset:3px}
.music[hidden]{display:none}
.title{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.notice{display:flex;flex-direction:column;gap:6px}
.notice[hidden]{display:none}
.nt{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;font-size:.82rem;line-height:1.4;background:var(--white);border:2px solid var(--ink);border-left-width:8px;border-radius:12px;overflow-wrap:anywhere}
.nt.maint{border-left-color:#c0392b}.nt.update{border-left-color:var(--paddy-d)}.nt.info{border-left-color:var(--marigold-d)}
.nt time{display:block;font-size:.7rem;opacity:.6}
#admDlg{width:min(92vw,340px);padding:16px 14px 14px}
#admDlg h2{font-size:1.1rem}
#admDlg input,#admDlg textarea,#admDlg select{width:100%;font:inherit;font-size:.9rem;color:var(--ink);background:transparent;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;margin-bottom:8px}
#admDlg textarea{resize:none;height:84px}
.ab{font:700 .9rem 'Mali',sans-serif;color:var(--ink);background:var(--marigold);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.ab.g{background:transparent}
.arow{display:flex;gap:8px}
.arow .ab{flex:1}
#admErr{min-height:1.2em;font-size:.8rem;color:#c0392b;margin-bottom:4px}
#admList{display:flex;flex-direction:column;gap:6px;margin:10px 0;max-height:34vh;overflow:auto}
#admList .nt{align-items:center}
#admList .nt span{flex:1}
#admList button{flex:none;width:28px;height:28px;border:2px solid var(--ink);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
@media (max-height:560px){.scene{display:none}}

</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="sun"></div><div class="hill a"></div><div class="hill b"></div><div class="paddy"></div>
  <div class="house"><i></i></div>
</div>

<main class="page">
  <div class="panel">
    <h1 class="title" id="ttl">บ้านสวนสุขใจ</h1>
    <p class="sub">ปลูกผัก ผูกมิตร ใช้ชีวิตในหมู่บ้านไทย</p>
    <div class="notice" id="notice" hidden></div>

    <a class="btn main" id="playBtn" href="./game-core/baan-suan-sukjai-core.html">
      <span class="ico">▶</span><span><b>เริ่มเกม</b><small>เล่นต่อจากเซฟ หรือเริ่มเกมใหม่</small></span>
    </a>
    <a class="btn" id="charBtn" href="./game-core/baan-suan-sukjai-core.html">
      <span class="ico">👤</span><span><b>สร้างตัวละคร</b><small>ตั้งชื่อ ทรงผม สีเสื้อ และสัตว์เลี้ยง</small></span>
    </a>
    <button class="btn" id="onlineBtn" type="button">
      <span class="ico">🌐</span><span><b>ออนไลน์</b><small>เข้าห้องเล่นกับเพื่อน</small></span>
    </button>
  </div>
</main>

<button class="music" id="musicBtn" type="button" aria-label="เปิด/ปิดวิทยุอนิเมะ" title="วิทยุอนิเมะ 24 ชั่วโมง">🎵</button>

<dialog id="onlineDlg" aria-labelledby="onTitle">
  <button class="x" id="onClose" type="button" aria-label="ปิด">×</button>
  <h2 id="onTitle">เล่นออนไลน์</h2>
  <p>เลือกห้องเดียวกับเพื่อนเพื่อเจอกันในเกม</p>
  <div class="rooms" id="rooms"></div>
</dialog>

<dialog id="admDlg" aria-label="admin">
  <button class="x" id="admX" type="button" aria-label="ปิด" style="width:32px;height:32px;font-size:1.1rem">×</button>
  <div id="admLogin">
    <h2>🔒</h2>
    <input id="admPw" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="รหัส" maxlength="20">
    <div id="admErr"></div>
    <button class="ab" id="admGo" type="button" style="width:100%">เข้า</button>
  </div>
  <div id="admPanel" hidden>
    <h2>📢 ประกาศ</h2>
    <select id="admK"><option value="update">✨ อัปเดต</option><option value="maint">🛠 ปิดปรับปรุง</option><option value="info">📢 ทั่วไป</option></select>
    <textarea id="admTx" maxlength="200" placeholder="พิมพ์ข้อความประกาศ (สูงสุด 200 ตัวอักษร)"></textarea>
    <div class="arow"><button class="ab" id="admAdd" type="button">ประกาศ</button><button class="ab g" id="admClr" type="button">ล้างทั้งหมด</button></div>
    <div id="admList"></div>
    <div id="admErr2" style="min-height:1.2em;font-size:.8rem;color:#c0392b"></div>
  </div>
</dialog>

<script>
(function(){
  var GAME='./game-core/baan-suan-sukjai-core.html';
  var dlg=document.getElementById('onlineDlg'),box=document.getElementById('rooms');
  var ROOMS=5,MAXP=6;

  function lastRoom(){try{return localStorage.getItem('bsj_last_room')||''}catch(e){return ''}}
  function join(room,mode){
    try{localStorage.setItem('bsj_last_room',room)}catch(e){}
    location.href=GAME+'?room='+encodeURIComponent(room)+'&mode='+(mode==='create'?'create':'join');
  }
  function build(){
    var last=lastRoom();box.innerHTML='';var subs={},btns={};
    for(var i=1;i<=ROOMS;i++){
      (function(id){
        var b=document.createElement('button');
        b.type='button';b.className='room'+(id===last?' last':'');
        b.appendChild(document.createTextNode('ห้อง '+id.split('-')[1]));
        var s=document.createElement('small');s.style.cssText='display:block;font-size:12px;font-weight:400;opacity:.8;margin-top:2px;overflow-wrap:anywhere;line-height:1.25';s.textContent='กำลังเช็ก…';
        b.appendChild(s);subs[id]=s;
        b.addEventListener('click',function(){join(id,b.dataset.mode)});
        b.dataset.mode='join';btns[id]=b;
        box.appendChild(b);
      })('room-'+i);
    }
    fetch('/api/rooms',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
      (d.rooms||[]).forEach(function(r){var s=subs[r.id],b=btns[r.id];if(!s)return;
        var max=d.max||MAXP;
        var hn=r.hostName?'👑 '+r.hostName:'👑 หัวห้อง';
        if(!r.host){s.textContent='⚪ ว่าง • สร้างห้อง';b.dataset.mode='create';b.disabled=false}
        else if(r.online>=max){s.textContent='🔴 เต็ม '+r.online+'/'+max+' • '+hn;b.disabled=true}
        else{s.textContent='🟢 '+r.online+'/'+max+' • '+hn;b.dataset.mode='join';b.disabled=false}});
    }).catch(function(){Object.keys(subs).forEach(function(k){subs[k].textContent=''})});
  }
  function openDlg(){build();if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','')}

  document.getElementById('onlineBtn').addEventListener('click',openDlg);
  document.getElementById('onClose').addEventListener('click',function(){dlg.close?dlg.close():dlg.removeAttribute('open')});
  dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});

  /* ประกาศหน้าแรก: อัปเดต / ปิดปรับปรุง (ดึงจากเซิร์ฟเวอร์) */
  var nbox=document.getElementById('notice');
  var ICON={maint:'🛠',update:'✨',info:'📢'};
  function paintNotice(items,el,del){
    el.innerHTML='';
    (items||[]).forEach(function(n){
      var d=document.createElement('div');d.className='nt '+(n.k||'info');
      var ic=document.createElement('b');ic.textContent=ICON[n.k]||'📢';
      var sp=document.createElement('span');sp.appendChild(document.createTextNode(n.text||''));
      var tm=document.createElement('time');try{tm.textContent=new Date(n.t).toLocaleDateString('th-TH',{day:'numeric',month:'short'})}catch(e){}
      sp.appendChild(tm);d.appendChild(ic);d.appendChild(sp);
      if(del){var x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label','ลบ');x.addEventListener('click',function(){del(n.id)});d.appendChild(x)}
      el.appendChild(d);
    });
  }
  function loadNotice(){
    fetch('/api/notice',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
      var it=d.items||[];nbox.hidden=!it.length;paintNotice(it,nbox);
    }).catch(function(){});
  }
  loadNotice();setInterval(loadNotice,60000);

  /* แอดมินลับ: แตะชื่อเกม "บ้านสวนสุขใจ" 5 ครั้งติดกัน (ภายใน 2.5 วิ) */
  var adm=document.getElementById('admDlg'),aLogin=document.getElementById('admLogin'),aPanel=document.getElementById('admPanel');
  var aPw=document.getElementById('admPw'),aErr=document.getElementById('admErr'),aErr2=document.getElementById('admErr2'),aList=document.getElementById('admList');
  var PW='',taps=0,tapT=0;
  function admApi(body){
    return fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({pw:PW},body))})
      .then(function(r){return r.json().catch(function(){return{ok:false}}).then(function(j){j.status=r.status;return j})});
  }
  function admShow(items){
    aLogin.hidden=true;aPanel.hidden=false;aErr2.textContent='';
    paintNotice(items,aList,function(id){admApi({op:'del',id:id}).then(function(j){if(j.ok){admShow(j.items);loadNotice()}else aErr2.textContent='ลบไม่สำเร็จ'})});
  }
  function admOpen(){
    PW='';aPw.value='';aErr.textContent='';aLogin.hidden=false;aPanel.hidden=true;
    if(adm.showModal)adm.showModal();else adm.setAttribute('open','');
    setTimeout(function(){aPw.focus()},50);
  }
  function admClose(){PW='';aPw.value='';if(adm.close)adm.close();else adm.removeAttribute('open')}
  function admLogin(){
    PW=aPw.value.trim();if(!PW)return;aErr.textContent='';
    admApi({op:'list'}).then(function(j){
      if(j.ok)admShow(j.items);
      else{PW='';aErr.textContent=j.err==='locked'?'ลองใหม่ใน '+Math.ceil((j.wait||300)/60)+' นาที':'รหัสไม่ถูกต้อง'}
    }).catch(function(){PW='';aErr.textContent='เชื่อมต่อไม่ได้'});
  }
  document.getElementById('ttl').addEventListener('click',function(){
    var n=Date.now();taps=(n-tapT>2500)?1:taps+1;tapT=n;
    if(taps>=5){taps=0;admOpen()}
  });
  document.getElementById('admGo').addEventListener('click',admLogin);
  aPw.addEventListener('keydown',function(e){if(e.key==='Enter')admLogin()});
  document.getElementById('admX').addEventListener('click',admClose);
  adm.addEventListener('close',function(){PW=''});
  document.getElementById('admAdd').addEventListener('click',function(){
    var tx=document.getElementById('admTx');if(!tx.value.trim())return;
    admApi({op:'add',k:document.getElementById('admK').value,text:tx.value}).then(function(j){
      if(j.ok){tx.value='';admShow(j.items);loadNotice()}else aErr2.textContent='ส่งไม่สำเร็จ'});
  });
  document.getElementById('admClr').addEventListener('click',function(){
    if(!confirm('ล้างประกาศทั้งหมด?'))return;
    admApi({op:'clear'}).then(function(j){if(j.ok){admShow(j.items);loadNotice()}else aErr2.textContent='ล้างไม่สำเร็จ'});
  });

  /* วิทยุอนิเมะ 24 ชั่วโมง: AnimeAMAZE — สตรีม AAC ผ่าน HTTPS */
  var STREAM_URL='https://radio.animeamaze.net:8443/AnimeAMAZE64';
  var mBtn=document.getElementById('musicBtn');
  if(STREAM_URL){
    var au=new Audio();au.src=STREAM_URL;au.preload='none';au.volume=0.5;
    var muted=false;try{muted=localStorage.getItem('bsj_music_off')==='1'}catch(e){}
    mBtn.hidden=false;
    var paint=function(){mBtn.textContent=muted?'🔇':'🎵';mBtn.setAttribute('aria-label',muted?'เปิดวิทยุอนิเมะ 24 ชั่วโมง':'ปิดวิทยุอนิเมะ 24 ชั่วโมง')};paint();
    var start=function(){
      document.removeEventListener('pointerdown',start);
      if(!muted)au.play().catch(function(){});
    };
    document.addEventListener('pointerdown',start);
    mBtn.addEventListener('pointerdown',function(e){e.stopPropagation()});
    mBtn.addEventListener('click',function(){
      muted=!muted;paint();
      try{localStorage.setItem('bsj_music_off',muted?'1':'0')}catch(e){}
      if(muted)au.pause();else au.play().catch(function(){});
      document.removeEventListener('pointerdown',start);
    });
  }

  /* ล้าง service worker / cache เก่า (คงไว้จากไฟล์เดิม) */
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))})
    .then(function(){if('caches' in window)return caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))})})
    .then(function(){if(navigator.serviceWorker.controller&&!sessionStorage.getItem('bsj-sw-cleaned')){sessionStorage.setItem('bsj-sw-cleaned','1');location.reload()}})
    .catch(function(){});
  }
})();
</script>
</body>
</html>
