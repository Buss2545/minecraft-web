<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1726"><title>บ้านสวนสุขใจ</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#79b65b;color:#fff}#game{width:100%;height:100%;display:block;background:linear-gradient(#8ed0ee 0 42%,#78b55b 42%)}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between}.box{background:#14283ddd;border:2px solid #f4d58a;border-radius:12px;padding:8px 12px}.controls{position:absolute;left:15px;right:15px;bottom:18px;display:flex;justify-content:space-between;align-items:end}.joy,.act{pointer-events:auto;border:3px solid #f4d58a;background:#14283dbb;box-shadow:0 4px #0006;color:#fff}.joy{width:90px;height:90px;border-radius:50%;display:grid;place-items:center}.act{width:78px;height:78px;border-radius:50%;font-weight:800}.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,420px);background:#fff3d6;color:#3a2814;border:3px solid #c79a4b;border-radius:16px;padding:18px;display:none}.panel.on{display:block}.panel button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:10px;background:#f2a900;font-weight:700}</style></head><body><canvas id="game"></canvas><div class="ui"><div class="top"><div class="box">🌿 บ้านสวนสุขใจ</div><div class="box" id="stat">☀️ วัน 1 • 🪙 500</div></div><div class="controls"><button class="joy" id="joy">✚</button><button class="act" id="act">ทำ</button></div></div><div class="panel" id="panel"><h2>🌱 บ้านสวนสุขใจ</h2><p>โลกเกมพร้อมใช้งานจาก GitHub แล้ว</p><button onclick="closePanel()">ปิด</button></div><script>const c=document.getElementById('game'),x=c.getContext('2d');let px=innerWidth/2,py=innerHeight*.58,t=0;function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();function draw(){t+=.016;x.clearRect(0,0,innerWidth,innerHeight);x.fillStyle='#8ed0ee';x.fillRect(0,0,innerWidth,innerHeight*.42);x.fillStyle='#78b55b';x.fillRect(0,innerHeight*.42,innerWidth,innerHeight*.58);for(let i=0;i<16;i++){let tx=(i*137)%innerWidth,ty=innerHeight*.45+(i*71)%Math.max(1,innerHeight*.4);x.fillStyle='#3d873e';x.fillRect(tx,ty,8,18);x.fillStyle='#69a94e';x.beginPath();x.arc(tx+4,ty,14,0,7);x.fill()}x.fillStyle='#ead0a3';x.fillRect(innerWidth*.68,innerHeight*.34,100,80);x.fillStyle='#b86c56';x.beginPath();x.moveTo(innerWidth*.64,innerHeight*.34);x.lineTo(innerWidth*.73,innerHeight*.23);x.lineTo(innerWidth*.82,innerHeight*.34);x.fill();x.fillStyle='#76533f';x.fillRect(innerWidth*.72,innerHeight*.37,25,47);x.fillStyle='#ffcf5a';x.beginPath();x.arc(px,py,15,0,7);x.fill();x.fillStyle='#4a2f20';x.fillRect(px-12,py+9,24,24);requestAnimationFrame(draw)}draw();function move(dx,dy){px=Math.max(15,Math.min(innerWidth-15,px+dx));py=Math.max(innerHeight*.43,Math.min(innerHeight-90,py+dy))}document.getElementById('joy').addEventListener('pointerdown',e=>{move(-12,0)});document.getElementById('act').addEventListener('pointerdown',()=>document.getElementById('panel').classList.add('on'));function closePanel(){document.getElementById('panel').classList.remove('on')}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-10,0);if(e.key==='ArrowRight')move(10,0);if(e.key==='ArrowUp')move(0,-10);if(e.key==='ArrowDown')move(0,10);if(e.key==='Escape')closePanel()});</script></body></html>
