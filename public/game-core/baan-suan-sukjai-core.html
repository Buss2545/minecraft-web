<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1726">
<title>บ้านสวนสุขใจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1726;--panel:#fff3d6;--ink:#3a2814;--line:#c79a4b;--btn:#f2a900;--btnink:#2a1d0c;--pink:#e8749b;--dim:#8a7350;--glass:#16283bf2;--glass2:#0b1726f2;--gold:#f4d58a;--cell:#ffffff30;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#2b2116;--ink:#fdf1d6;--line:#7a5e2c;--dim:#bba37a;--cell:#ffffff14}}
:root[data-theme="dark"]{--panel:#2b2116;--ink:#fdf1d6;--line:#7a5e2c;--dim:#bba37a;--cell:#ffffff14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:'Mali','Noto Sans Thai',system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
#app{position:relative;width:100%;height:100%;overflow:hidden}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.round{position:absolute;border:3px solid var(--gold);border-radius:50%;background:linear-gradient(#1c3550,#0b1726);color:#fff;font:700 15px 'Mali',sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #0008;z-index:3}
.round:active{transform:translateY(2px)}
#qbtns{position:absolute;top:8px;right:8px;display:flex;gap:8px;z-index:3}
#qbtns button{position:static;width:44px;height:44px;font-size:20px;border-radius:12px}
#hud{position:absolute;top:8px;left:8px;background:linear-gradient(#16283bdf,#0b1726df);border:2px solid var(--gold);border-radius:12px;box-shadow:0 4px 0 #0008;color:#fff;padding:6px 10px;font-size:11.5px;line-height:1.45;min-width:132px;z-index:3}
.mini{height:8px;background:#fff3;border-radius:4px;margin-top:4px;overflow:hidden}
.mini i{display:block;height:100%;width:100%}
#barFill{background:#7ed957}#hpFill{background:#e5533d}
#toast{position:absolute;left:50%;top:21%;transform:translateX(-50%);background:#000d;color:#fff;padding:9px 15px;border-radius:14px;border:2px solid #fff3;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86%;text-align:center;white-space:pre-line;z-index:8}
#toast.on{opacity:1}
#joy{position:absolute;left:16px;bottom:112px;width:124px;height:124px;border-radius:50%;background:#0005;border:3px solid #fff6;z-index:3;touch-action:none}
#app.tapmode #joy,#app.tapmode #btnA{display:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fffb;box-shadow:0 2px 6px #0006}
#btnA{right:20px;bottom:124px;width:86px;height:86px;font-size:19px;background:linear-gradient(#ffd45a,#e99500);color:#3a2814;touch-action:none}
#tools{position:absolute;left:50%;bottom:calc(8px);transform:translateX(-50%);display:flex;gap:3px;padding:4px;background:linear-gradient(#16283bee,#071827ee);border:2px solid var(--gold);border-radius:12px;box-shadow:0 5px 0 #0008;z-index:3;max-width:100%}
#tools button{width:41px;height:56px;border-radius:8px;border:2px solid #ffffff44;background:#ffffff12;color:#fff;font:600 8.5px 'Mali',sans-serif;line-height:1.1;padding:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;white-space:nowrap}
#tools button b{font-size:20px;font-weight:400}
#tools button.sel{border-color:var(--btn);background:#f2a90066}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:7}
#fade.on{opacity:1}
#modal{position:absolute;inset:0;display:none;z-index:6}
#modal.on{display:flex;align-items:center;justify-content:center;background:#0008}
#modal.bottom{align-items:flex-end;background:transparent}
.card,.sheet{background:var(--panel);color:var(--ink);border:3px solid var(--line);border-radius:14px;box-shadow:0 7px 0 #0005,0 12px 30px #0007}
.card{padding:14px;width:min(92%,390px);max-height:82%;overflow:auto;touch-action:pan-y}
.card h3{margin:0 0 4px;font-size:18px}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:6px;line-height:1.4}
.b{display:block;width:100%;margin:6px 0;padding:11px 12px;border:0;border-radius:10px;background:var(--btn);color:var(--btnink);font:600 14.5px 'Mali',sans-serif;text-align:left;box-shadow:0 3px 0 #0004}
.b:active{transform:translateY(2px);box-shadow:0 1px 0 #0004}
.b.alt{background:transparent;border:2px solid var(--line);color:var(--ink);box-shadow:none}
.b[disabled],.row button[disabled],.item[disabled]{opacity:.4}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px;white-space:pre-line}
.row>span{flex:1;line-height:1.35}
.row small{color:var(--dim);font-size:11px}
.row button{padding:7px 10px;border:0;border-radius:9px;background:var(--btn);color:var(--btnink);font:600 12.5px 'Mali',sans-serif;box-shadow:0 2px 0 #0004}
.row input[type=range]{flex:1;accent-color:var(--btn)}
.tabs{display:flex;gap:6px;margin:6px 0}
.tabs button{flex:1;padding:8px 4px;border-radius:9px;border:2px solid var(--line);background:transparent;color:var(--ink);font:600 12.5px 'Mali',sans-serif}
.tabs button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.tabs.sm{flex-wrap:wrap}.tabs.sm button{flex:0 0 auto;padding:6px 10px;font-size:12px}
.dlg{background:var(--panel);color:var(--ink);border:3px solid var(--line);border-radius:16px 16px 0 0;width:100%;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:flex-start;min-height:124px}
.dlg canvas,.ncard canvas,.row canvas{flex:none;background:#0002;border-radius:10px}
.dtxt{flex:1;font-size:15px;line-height:1.5}
.dtxt p{margin:2px 0 6px}
.dtxt small{color:var(--dim)}
.ncard{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.hearts{color:var(--pink);letter-spacing:1px;font-size:14px}
.pill{background:var(--cell);border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;margin:6px 0}
/* stardew-style sheet */
.sheet{width:min(96%,430px);height:min(92%,720px);display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(#17304a,#0b1726);color:#eef4ff;border-color:var(--gold)}
.shead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:linear-gradient(#27496d,#18324d);border-bottom:2px solid var(--gold)}
.shead b{font-size:16px}
.shead .x{border:0;background:#0006;color:#fff;border-radius:8px;width:32px;height:32px;font-size:15px}
.stabs{display:flex;gap:4px;padding:6px;overflow-x:auto;background:#0a1624;touch-action:pan-x}
.stabs button{flex:0 0 auto;min-width:58px;border:2px solid #ffffff22;background:#ffffff0c;color:#cfe0f5;border-radius:10px;padding:5px 6px;font:600 10.5px 'Mali',sans-serif;display:flex;flex-direction:column;align-items:center;gap:1px}
.stabs button span{font-size:19px}
.stabs button.on{background:var(--btn);color:#2a1d0c;border-color:#fff8}
.sbody{flex:1;overflow-y:auto;padding:10px;touch-action:pan-y}
.sheet .sub{color:#9fb6d2}
.sheet .row{border-color:#ffffff22}
.sheet .row small{color:#9fb6d2}
.sheet .tabs button{border-color:#ffffff33;color:#e3eefc}
.sheet .tabs button.on{color:#2a1d0c}
.sheet .pill,.sheet .statBox{background:#ffffff10;border-color:#ffffff2a;color:#eef4ff}
.sheet h4{margin:12px 0 4px;color:var(--gold)}
.itemGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:6px 0}
.itemGrid.o3{grid-template-columns:repeat(3,1fr)}
.item{min-height:76px;border:2px solid #ffffff2a;border-radius:10px;background:#ffffff12;padding:4px 2px;text-align:center;color:inherit;font:600 10.5px 'Mali',sans-serif;line-height:1.2}
.card .item{border-color:var(--line);background:var(--cell);color:var(--ink)}
.item b{font-size:24px;display:block;font-weight:400}
.item.tool{border-color:var(--gold)}.item.on{border-color:var(--btn);background:#f2a90044}
.item .tier{color:#e9c46a;font-size:9.5px}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}
.statBox{border:2px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12px}
.statBox b{display:block;font-size:15px}
.meter{height:7px;background:#0004;border-radius:6px;overflow:hidden;margin-top:5px;min-width:60px}
.meter i{display:block;height:100%}
.quest{border:2px solid #ffffff2a;border-radius:10px;padding:8px 10px;margin:7px 0;background:#ffffff0d}
.qbar{height:7px;background:#0005;border-radius:5px;overflow:hidden;margin:6px 0}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#e9c46a,#f2a900)}
.qrow{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.qrow button{padding:6px 10px;border:0;border-radius:9px;background:#3fbf6a;color:#052;font:700 12px 'Mali',sans-serif}
.minimap{width:100%;height:auto;border:3px solid var(--gold);border-radius:10px;image-rendering:pixelated;background:#000}
.lbl2{font-size:12px;color:#9fb6d2;margin-top:6px}
.sw{display:flex;gap:8px;margin:5px 0 8px;flex-wrap:wrap}
.sw i{width:28px;height:28px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 2px #ffffff55;display:block}
.sw i.on{border-color:#fff}
.ftrack{position:relative;width:64px;height:230px;background:linear-gradient(#5fb4e0,#1f6f9a);border:3px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.fzone{position:absolute;left:3px;right:3px;background:#e5533dcc;border-radius:6px;transition:background .1s}.fzone.in{background:#3fbf6add}
.ffish{position:absolute;left:50%;transform:translateX(-50%);font-size:24px;line-height:1}
.frow{display:flex;gap:10px;justify-content:center}
.fprog{position:relative;width:16px;height:230px;border:3px solid var(--line);border-radius:8px;background:#0003;overflow:hidden;display:flex;align-items:flex-end}
.fprog i{display:block;width:100%;background:#3fbf6a}
/* title */
#title{position:absolute;inset:0;z-index:9;background:linear-gradient(#f6c667 0,#f3a64a 30%,#2c6b3f 30%,#1d3a2a 100%);display:flex;align-items:flex-start;justify-content:center;overflow:auto;touch-action:pan-y;padding:12px 0}
#title .card{margin:8px 0;max-height:none;text-align:center;width:min(94%,400px)}
#title h1{margin:0;font-size:28px;color:#b3261e}
#title .tag{font-size:12.5px;color:var(--dim);margin-bottom:8px}
#title .sw{justify-content:center}
#title .sw i{box-shadow:0 0 0 2px var(--line)}#title .sw i.on{border-color:var(--ink)}
.seg{display:flex;gap:8px;margin:6px 0}
.seg button{flex:1;padding:9px 4px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);font:700 13.5px 'Mali',sans-serif}
.seg button.on{background:var(--btn);border-color:var(--btn);color:var(--btnink)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:0 0 auto;padding:6px 9px;font-size:12px}
.rnd{display:flex;gap:8px;align-items:center}.rnd .inp{flex:1;min-width:0}.dice{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff6;font-size:22px;cursor:pointer;line-height:1;padding:0;transition:transform .15s}.dice:active{transform:rotate(180deg) scale(.92)}
.inp{width:100%;padding:9px;border-radius:10px;border:2px solid var(--line);background:#fff3;color:var(--ink);font:600 15px 'Mali',sans-serif;text-align:center;-webkit-user-select:text;user-select:text;margin:4px 0}
.lbl{font-size:12.5px;color:var(--dim);margin-top:6px;text-align:left}
.upload{display:flex;gap:8px;align-items:center;font-size:12px}.upload input{flex:1;min-width:0;font-size:11px}
.cine{position:fixed;inset:0;z-index:60;background:#000;font-family:'Mali','Noto Sans Thai',system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow:hidden}
.cine canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cbar{position:absolute;left:0;right:0;height:7%;background:#000;z-index:2}
.cbar.t{top:0}.cbar.b{bottom:0}
.ctitle{position:absolute;left:0;right:0;top:34%;z-index:2;text-align:center;color:#fff;font:700 26px 'Mali',sans-serif;text-shadow:0 3px 12px #000,0 0 24px #e8749b;padding:0 18px;opacity:0;transition:opacity .9s;pointer-events:none;white-space:pre-line;line-height:1.5}
.ccap{position:absolute;left:0;right:0;bottom:0;z-index:3;padding-bottom:env(safe-area-inset-bottom,0px)}
.ccbox{display:flex;gap:12px;align-items:flex-start;margin:0 10px 14px;padding:12px 14px;min-height:96px;background:rgba(11,23,38,.9);color:#fff;border:3px solid #f4d58a;border-radius:14px;box-shadow:0 6px 0 #0008}
.ccbox canvas{position:static;width:auto;height:auto;flex:none;background:#0003;border-radius:10px}
.ccbox .dtxt{font-size:15px;line-height:1.55;min-height:3.1em}
.ccbox .dtxt b{color:#f4d58a}
.cskip{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:4;border:2px solid #ffffff88;background:#0009;color:#fff;border-radius:999px;padding:6px 12px;font:600 12px 'Mali',sans-serif}

</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div id="hud"><div id="hudTop"></div><div class="mini"><i id="hpFill"></i></div><div class="mini"><i id="barFill"></i></div></div>
<div id="qbtns"><button class="round" id="bPhone" aria-label="โทรศัพท์" style="display:none">📱</button><button class="round" id="bQuest" aria-label="ภารกิจ">📜</button><button class="round" id="bMap" aria-label="แผนที่">🗺️</button><button class="round" id="menuBtn" aria-label="เมนู">☰</button></div>
<div id="toast"></div>
<div id="joy"><div id="knob"></div></div>
<button id="btnA" class="round">ทำ</button>
<div id="tools"></div>
<div id="fade"></div>
<div id="modal"></div>
<div id="title">
  <div class="card">
    <h1>บ้านสวนสุขใจ</h1>
    <div class="tag">ปลูกผัก เลี้ยงสัตว์ ตกปลา ลงเหมือง ผูกมิตร และจีบใครสักคนในหมู่บ้านไทย</div>
    <div class="rnd"><input id="nameIn" class="inp" maxlength="10" value="ใจดี" aria-label="ชื่อตัวละคร"><button type="button" class="dice" id="diceName" aria-label="สุ่มชื่อตัวละคร">🎲</button></div>
    <div class="rnd"><input id="farmIn" class="inp" maxlength="14" value="ไร่สุขใจ" aria-label="ชื่อไร่"><button type="button" class="dice" id="diceFarm" aria-label="สุ่มชื่อไร่">🎲</button></div>
    <div class="lbl">🎂 วันเกิดของคุณ</div><div class="rnd"><select id="bdS" class="inp" aria-label="ฤดูที่เกิด"></select><select id="bdD" class="inp" aria-label="วันที่เกิด"></select></div>
    <div class="seg" id="gSeg"><button data-g="f" class="on">หญิง</button><button data-g="m">ชาย</button></div>
    <canvas id="prev" width="110" height="130"></canvas>
    <div class="lbl">ทรงผม</div><div class="seg wrap" id="hsSeg"></div>
    <div class="lbl">สีผม</div><div class="sw" id="swHair"></div>
    <div class="lbl">สีเสื้อ</div><div class="sw" id="swShirt"></div>
    <div class="lbl">สีผิว</div><div class="sw" id="swSkin"></div>
    <div class="seg" id="hatSeg"><button data-h="1" class="on">หมวกฟาง</button><button data-h="0">ไม่ใส่หมวก</button></div>
    <div class="lbl">ชุดเริ่มต้น</div><div class="seg" id="fitSeg"><button data-f="casual" class="on">ลำลอง</button><button data-f="mohom">ชาวนา (หม้อฮ่อม)</button></div>
    <div class="lbl">สัตว์เลี้ยง</div><div class="seg" id="petSeg"><button data-p="dog" class="on">🐕 สุนัข</button><button data-p="cat">🐈 แมว</button></div>
    <div class="lbl">ภาพตัวละครของคุณ (ถ้ามีไฟล์ PNG/JPG ใส่ได้)</div><div class="upload"><input id="avatarIn" type="file" accept="image/png,image/jpeg,image/webp"><button class="b alt" id="avatarClear" style="margin:0;width:auto;padding:6px 10px">ล้าง</button></div>
    <button class="b" id="startBtn" style="text-align:center">เริ่มเกมใหม่</button>
    <button class="b alt" id="contBtn" style="text-align:center;display:none">เล่นต่อจากที่บันทึก</button>
    <button class="b alt" id="impBtn" style="text-align:center">⬆️ นำเข้าไฟล์เซฟ</button>
  </div>
</div>
</div>
<script>
(()=>{
const TIME_RATE=1.0;
const TS=32, MW=64, MH=48, SAVE='baan_suan_sukjai_v2', SL=28;
const $=s=>document.querySelector(s);
const cv=$('#game'), g=cv.getContext('2d'), M=$('#modal');
let W=0,H=0,Z=1,DPR=1;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in (attrs||{})){const v=attrs[k];if(k==='onclick')e.addEventListener('click',v);else if(k==='class')e.className=v;else if(k==='disabled'||k==='checked'||k==='selected'||k==='value')e[k]=v;else if(k==='style')e.style.cssText=v;else e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let toastT=0;
function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms||2200)}

/* ---------- audio ---------- */
 // ข้ามมินิเกมตกปลา: คูลดาวน์หลังใช้แต่ละครั้ง (วันในเกม) แนะนำไม่เกิน 15
 // ดึงปลาอัตโนมัติ: คูลดาวน์หลังใช้แต่ละครั้ง (วันในเกม) ปรับได้ แนะนำไม่เกิน 15
let AC=null;const OPT={music:.25,sfx:.6,vib:1,saver:0,night:1,autoReel:1,skipFish:0,voice:1};
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,when,vol){const a=ac();if(!a||!vol)return;const o=a.createOscillator(),gn=a.createGain();o.type=type||'square';o.frequency.value=f;const t0=a.currentTime+(when||0);gn.gain.setValueAtTime(Math.max(.0002,v*vol),t0);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(gn);gn.connect(a.destination);o.start(t0);o.stop(t0+d+.03)}

function roosterSfx(vol,delay,far){const a=ac();if(!a)return;const m=OPT.sfx*(vol==null?1:vol);if(!(m>0))return;
 const t0=Math.max(a.currentTime+(delay||0),ROO_END+.25),master=a.createGain();master.gain.value=1;

 const sy=[[0,.17,430,640,590,0],[.21,.24,620,1000,1060,0],[.5,.55,790,1190,1090,22],[1.12,.9,990,1280,500,34]];
 sy.forEach(([off,dur,f0,f1,f2,vib],si)=>{const s=t0+off,fs=far?.86:1;
  const env=a.createGain();env.gain.setValueAtTime(.0001,s);env.gain.linearRampToValueAtTime(.17*m,s+.03);env.gain.setValueAtTime(.15*m,s+dur-.07);env.gain.exponentialRampToValueAtTime(.0001,s+dur);
  const f1n=a.createBiquadFilter(),f2n=a.createBiquadFilter(),fb=a.createGain(),b1=a.createGain(),b2=a.createGain(),b3=a.createGain();

  [-7,7].forEach(cent=>{const o=a.createOscillator();o.type='sawtooth';o.detune.value=cent;o.frequency.setValueAtTime(f0*fs,s);o.frequency.linearRampToValueAtTime(f1*fs,s+dur*.42);o.frequency.linearRampToValueAtTime(f2*fs,s+dur);
   if(vib){const lf=a.createOscillator(),lg=a.createGain();lf.frequency.value=9+si*.8;lg.gain.value=vib;lf.connect(lg);lg.connect(o.frequency);lf.start(s);lf.stop(s+dur+.05)}
