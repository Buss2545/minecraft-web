<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สมัครสมาชิก — Mari JP SMP</title><style>
:root{--bg:#070b12;--bg2:#0d1420;--card:#111b2b;--card2:#172235;--line:#26354d;--text:#f8fafc;--muted:#93a4bb;--gold:#f6b73c;--gold2:#ffd36a;--green:#36d47a;--red:#f05a67;--shadow:0 20px 60px rgba(0,0,0,.32);--r:20px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#20304b 0%,transparent 70%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
.shell{min-height:100vh}.top{position:sticky;top:0;z-index:100;background:rgba(7,11,18,.86);backdrop-filter:blur(18px);border-bottom:1px solid rgba(148,163,184,.12)}
.nav{max-width:1180px;margin:auto;min-height:70px;padding:10px 16px;display:flex;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:10px;font-weight:950;font-size:20px;margin-right:auto}.brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#b86d09);color:#111;font-weight:1000;box-shadow:0 8px 25px #f6b73c30}
.navlinks{display:flex;gap:4px}.navlinks button,.auth button{background:transparent;color:#cbd5e1;border:1px solid transparent;padding:10px 12px;border-radius:12px}.navlinks button:hover,.auth button:hover{background:var(--card2);color:#fff}
.auth{display:flex;gap:5px}.auth .primary{background:var(--gold);color:#15100a;font-weight:850}.hamb{display:none;background:var(--card2);color:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.container{max-width:1180px;margin:auto;padding:0 16px}.hero{padding:55px 0 30px}.hero-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.card{background:linear-gradient(180deg,rgba(23,34,53,.94),rgba(12,19,31,.96));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--gold2);font-weight:850;font-size:14px}.pulse{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 6px #36d47a18;animation:pulse 1.5s infinite}@keyframes pulse{50%{transform:scale(.7);opacity:.5}}
h1{font-size:clamp(42px,7vw,78px);line-height:.95;letter-spacing:-2px;margin:18px 0 15px}.gold{color:var(--gold)}.lead{color:var(--muted);font-size:17px;line-height:1.7;max-width:650px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}.btn{border:1px solid var(--line);background:var(--card2);color:#fff;padding:12px 16px;border-radius:13px;font-weight:800}.btn.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#16110a;border:0}
.section{padding:18px 0 36px}.title{margin-bottom:14px}.title h2{margin:0;font-size:27px}.title p{margin:5px 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.tile{text-align:left;min-height:145px;transition:.18s}.tile:hover{transform:translateY(-3px);border-color:#415370}.icon{font-size:30px;margin-bottom:20px}.tile h3{margin:0 0 6px}.tile p{margin:0;color:var(--muted);line-height:1.5}
.server-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{padding:17px;border:1px solid var(--line);border-radius:15px;background:#0b1320}.stat small{display:block;color:var(--muted);margin-bottom:5px}.stat b{font-size:18px}
.page{padding:35px 0 60px}.page-head{margin-bottom:20px}.page-head h1{font-size:clamp(34px,6vw,58px);margin:0 0 10px}.page-head p{color:var(--muted)}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:200}.modal.show{display:flex}.modal-box{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}.modal-top{display:flex;gap:10px;align-items:center}.modal-top h2{margin:0}.close{margin-left:auto;border:0;background:var(--card2);color:#fff;border-radius:10px;padding:8px 11px}
footer{text-align:center;color:#64748b;padding:35px 16px;border-top:1px solid #172235}
@media(max-width:820px){.navlinks{display:none}.auth{display:none}.hamb{display:block}.nav{min-height:62px}.hero-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.hero{padding-top:30px}h1{font-size:46px}.grid,.server-grid{grid-template-columns:1fr}.card{padding:17px}.actions .btn{width:100%}}
.auth-page{min-height:100vh;display:grid;place-items:center;padding:18px}.auth-card{width:min(440px,100%);padding:25px}label{display:block;margin:14px 0 6px;color:#cbd5e1}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:#0a1220;color:#fff;outline:0}.full{width:100%;margin-top:18px}</style></head><body><main class="auth-page"><section class="card auth-card"><a href="javascript:window.close()">← ปิดแท็บ</a><h1 style="font-size:40px;margin-top:22px">📝 สมัครสมาชิก</h1><p class="lead">Mari JP SMP</p><form id="form"><label>Username</label><input id="username" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="new-password"><button class="btn primary full">สมัครสมาชิก</button></form><p id="msg" class="lead"></p><p>มีบัญชีแล้ว? <a class="gold" href="login.html">เข้าสู่ระบบ</a></p></section></main><script>
form.onsubmit=async e=>{e.preventDefault();msg.textContent='กำลังดำเนินการ...';try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||d.message||'สมัครสมาชิกไม่สำเร็จ');msg.textContent='สมัครสมาชิกสำเร็จ ✅';setTimeout(()=>window.opener?(window.opener.location.reload(),window.close()):location.href='index.html',700)}catch(x){msg.textContent=x.message}};
</script></body></html>
