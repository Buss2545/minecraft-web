<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mari Community Center</title><style>:root{--p:#ee7fa5;--ink:#2b2026;--mut:#806b75;--line:#efd6e0;--dark:#21171d;--green:#35a95c}
*{box-sizing:border-box}html{scroll-behavior:smooth}html,body{overflow-x:hidden;max-width:100vw}
body{margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#fff6fa,#fff,#fff8fb);color:var(--ink)}
img{max-width:100%}button,a{font:inherit}button{cursor:pointer}a{text-decoration:none}
.nav{position:sticky;top:0;z-index:50;background:#21171dec;backdrop-filter:blur(12px)}
.navin{width:min(1180px,94%);margin:auto;min-height:70px;display:flex;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:9px;color:#fff;font-weight:900;white-space:nowrap;margin-right:auto;padding:4px 6px}
.brand .logo{font-size:28px}.brand small{display:block;color:#f6bdcf;font-size:9px;letter-spacing:.4px}.brand b{display:block;font-size:15px;line-height:1.1}
.nav a,.nav button{border:0;background:transparent;color:#fff;padding:10px 12px;border-radius:10px;font-weight:800;white-space:nowrap}
.nav a:hover,.nav button:hover,.nav .active{background:#74465a}
.nav .lang-toggle{background:#fff;color:var(--dark)}
.wrap{width:min(1180px,94%);margin:22px auto 50px}
.hero{background:linear-gradient(135deg,#fff,#fff0f5);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 12px 35px #d38aa51c}
.hero h1{margin:0 0 7px;font-size:clamp(28px,6vw,48px);letter-spacing:-.5px}.hero p{color:var(--mut);margin:0}
.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0;padding:3px 1px 6px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 14px;font-weight:900;white-space:nowrap;box-shadow:0 4px 12px #00000006}.tabs button.active{background:var(--p);color:#fff;border-color:var(--p)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 7px 22px #00000008}.card h2{margin-top:0}.card h3{margin:0 0 8px}
.muted{color:var(--mut);font-size:13px}.btn{border:0;border-radius:11px;background:var(--p);color:#fff;padding:10px 14px;font-weight:900;cursor:pointer}.btn.alt{background:#f5edf1;color:var(--ink)}
input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:5px 0 10px;font:inherit}label{font-weight:800;font-size:13px}.form{max-width:680px}.row{display:flex;gap:8px}.row>*{flex:1}
.map{height:430px;border-radius:18px;background:linear-gradient(135deg,#edf8e8,#d8eed0 48%,#c7e5c0);position:relative;overflow:hidden;border:1px solid #b6d3ad}.map:before,.map:after{content:"";position:absolute;background:#fff8;border-radius:50%;filter:blur(1px)}.map:before{width:55%;height:18%;left:5%;top:35%;transform:rotate(-18deg)}.map:after{width:45%;height:15%;right:4%;bottom:18%;transform:rotate(24deg)}
.pin{position:absolute;transform:translate(-50%,-50%);background:#fff;border:2px solid var(--p);border-radius:14px;padding:5px 8px;font-size:18px;box-shadow:0 5px 15px #0003;cursor:pointer}
.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff}.badge{display:inline-block;border-radius:999px;padding:4px 9px;background:#f8e9ef;font-size:11px;font-weight:900}.ok{background:#e7f7eb;color:#23783d}.warn{background:#fff4d9;color:#855c00}.danger{background:#fde7ea;color:#9a2637}.empty{text-align:center;padding:35px;color:var(--mut)}
.achievement{display:flex;gap:12px;align-items:center}.achievement .icon{font-size:35px}.locked{opacity:.45;filter:grayscale(.8)}
@media(max-width:700px){.grid{grid-template-columns:1fr}.map{height:330px}.navin{width:96%}.brand{margin-right:2px}.brand small{font-size:8px}.brand b{font-size:13px}.nav a,.nav button{padding:9px 10px;font-size:13px}.hero{padding:20px;border-radius:20px}.wrap{margin-top:16px}.row{flex-direction:column}}
</style><script src="/i18n-jp.js?v=6"></script></head><body>
<header class="nav"><div class="navin">
<a class="brand" href="/index.html"><span class="logo">🌸</span><span><small>MINECRAFT SERVER</small><b>MARI JP SMP</b></span></a>
<a href="/index.html">🏠 <span class="i18n"><span class="th">หน้าหลัก</span><span class="jp" hidden>ホーム</span></span></a>
<a href="/topup.html">💰 <span class="i18n"><span class="th">เติมเงิน</span><span class="jp" hidden>チャージ</span></span></a>
<a href="/promo.html">🎁 <span class="i18n"><span class="th">โปรโมชั่น</span><span class="jp" hidden>プロモーション</span></span></a>
<a href="/vip.html">👑 VIP</a>
<a href="/rules.html">📜 <span class="i18n"><span class="th">กฎ</span><span class="jp" hidden>ルール</span></span></a>
<a href="/team.html">👥 <span class="i18n"><span class="th">ทีมงาน</span><span class="jp" hidden>チーム</span></span></a>
<a href="/rpg.html">⚔️ RPG</a>
<a href="/minigames.html">🎮 <span class="i18n"><span class="th">มินิเกม</span><span class="jp" hidden>ミニゲーム</span></span></a>
<a class="active" href="/community.html">🌸 <span class="i18n"><span class="th">Community</span><span class="jp" hidden>コミュニティ</span></span></a>
<a href="/chat.html">💬 แชท</a>
<button type="button" id="langToggle" class="lang-toggle" onclick="toggleLang()">🇯🇵 日本語</button>
</div></header>
<main class="wrap"><section class="hero"><h1>🌸 Mari Community Center</h1><p id="intro">ศูนย์รวมแผนที่ กิจกรรม แจ้งปัญหา รายงานผู้เล่น และ Achievement ของ Mari</p></section><div class="tabs" id="tabs"><button class="active" data-tab="map">🗺️ Mari Map</button><button data-tab="ticket">🎫 Ticket</button><button data-tab="event">📝 สมัครกิจกรรม</button><button data-tab="report">🛡️ Report</button><button data-tab="achievement">🏅 Achievement</button></div><section id="content"></section></main>
<script>
let lang='th',tab='map',mapPoints=[];
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'เกิดข้อผิดพลาด');return d}
function toggleLang(){if(window.MariI18n)window.MariI18n.toggle();}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});
async function render(){const c=$('content');c.innerHTML='<div class="empty">กำลังโหลด...</div>';try{if(tab==='map')return renderMap();if(tab==='ticket')return renderTicket();if(tab==='event')return renderEvent();if(tab==='report')return renderReport();return renderAch();}catch(e){c.innerHTML=`<div class="card"><b>❌ ${esc(e.message)}</b><p class="muted">หากยังไม่ได้เข้าสู่ระบบ ให้เข้าสู่ระบบก่อน</p><a class="btn" href="/auth.html">เข้าสู่ระบบ</a></div>`}}
async function renderMap(){const d=await api('/api/community/map');mapPoints=d.points||[];$('content').innerHTML=`<div class="card"><h2>🗺️ Mari Map</h2><p class="muted">แผนที่ชุมชนสำหรับจุดสำคัญในเซิร์ฟเวอร์</p><div class="map">${mapPoints.map((p,i)=>`<button class="pin" style="left:${Math.max(5,Math.min(95,Number(p.x)||10))}%;top:${Math.max(5,Math.min(95,Number(p.y)||10))}%" onclick="alert('${esc((p.name||'')+'\n'+(p.description||''))}')">${esc(p.icon||'📍')}</button>`).join('')}</div><div class="list" style="margin-top:12px">${mapPoints.map(p=>`<div class="item"><b>${esc(p.icon||'📍')} ${esc(p.name)}</b><div class="muted">${esc(p.description||'')}</div></div>`).join('')||'<div class="empty">ยังไม่มีจุดบนแผนที่ — ให้ Admin เพิ่มจาก Admin Panel</div>'}</div></div>`}
async function renderTicket(){const d=await api('/api/community/tickets');$('content').innerHTML=`<div class="grid"><div class="card"><h2>🎫 แจ้งปัญหา</h2><div class="form"><label>หัวข้อ<input id="ts" placeholder="เช่น เข้าเซิร์ฟเวอร์ไม่ได้"></label><label>ประเภท<select id="tc"><option>ทั่วไป</option><option>ปัญหาเซิร์ฟเวอร์</option><option>การชำระเงิน</option><option>ผู้เล่น</option><option>อื่น ๆ</option></select></label><label>รายละเอียด<textarea id="tm" rows="7"></textarea></label><button class="btn" onclick="sendTicket()">ส่ง Ticket</button></div></div><div class="card"><h2>📋 Ticket ของฉัน</h2><div class="list">${(d.tickets||[]).map(t=>`<div class="item"><b>${esc(t.subject)}</b> <span class="badge ${t.status==='closed'?'ok':'warn'}">${esc(t.status)}</span><p>${esc(t.message)}</p>${(t.replies||[]).map(r=>`<div class="item">🛡️ ${esc(r.message)}</div>`).join('')}</div>`).join('')||'<div class="empty">ยังไม่มี Ticket</div>'}</div></div></div>`}
async function sendTicket(){try{await api('/api/community/tickets',{method:'POST',body:JSON.stringify({subject:$('ts').value,message:$('tm').value,category:$('tc').value})});alert('ส่ง Ticket แล้ว ✅');render()}catch(e){alert(e.message)}}
async function renderEvent(){const d=await api('/api/community/event-forms');const mine=Object.fromEntries((d.mine||[]).map(x=>[x.formId,x]));$('content').innerHTML=`<div class="grid">${(d.forms||[]).map(f=>`<div class="card"><h2>📝 ${esc(f.title)}</h2><p>${esc(f.description||'')}</p>${mine[f.id]?`<span class="badge ok">ส่งแล้ว: ${esc(mine[f.id].status)}</span>`:`<div class="form">${(f.fields||[]).map(x=>`<label>${esc(x.label)}${x.required?' *':''}<input id="${esc(x.id)}_${esc(f.id)}"></label>`).join('')}<button class="btn" onclick="submitForm('${esc(f.id)}',${JSON.stringify(f.fields||[]).replace(/</g,'\\u003c')})">ส่งใบสมัคร</button></div>`}</div>`).join('')||'<div class="card empty">ยังไม่มีกิจกรรมที่เปิดรับสมัคร</div>'}</div>`}
async function submitForm(id,fields){const answers={};fields.forEach(f=>answers[f.id]=document.getElementById(f.id+'_'+id)?.value||'');try{await api('/api/community/event-forms/'+encodeURIComponent(id)+'/submit',{method:'POST',body:JSON.stringify({answers})});alert('ส่งใบสมัครแล้ว ✅');render()}catch(e){alert(e.message)}}
async function renderReport(){const d=await api('/api/community/reports/mine');$('content').innerHTML=`<div class="grid"><div class="card"><h2>🛡️ รายงานผู้เล่น</h2><div class="form"><label>ชื่อ Minecraft / UID<input id="rt" placeholder="ชื่อผู้เล่น"></label><label>เหตุผล<select id="rr"><option>โกง</option><option>ก่อกวน</option><option>ใช้คำไม่เหมาะสม</option><option>หลอกลวง</option><option>อื่น ๆ</option></select></label><label>รายละเอียด<textarea id="rd" rows="6"></textarea></label><button class="btn" onclick="sendReport()">ส่งรายงาน</button></div></div><div class="card"><h2>📋 รายงานของฉัน</h2><div class="list">${(d.reports||[]).map(r=>`<div class="item"><b>${esc(r.targetName)}</b> <span class="badge">${esc(r.status)}</span><div class="muted">${esc(r.reason)} • ${new Date(r.createdAt).toLocaleString()}</div></div>`).join('')||'<div class="empty">ยังไม่มีรายงาน</div>'}</div></div></div>`}
async function sendReport(){try{await api('/api/community/reports',{method:'POST',body:JSON.stringify({targetId:$('rt').value,reason:$('rr').value,details:$('rd').value})});alert('ส่งรายงานแล้ว ขอบคุณที่ช่วยดูแลชุมชน 🛡️');render()}catch(e){alert(e.message)}}
async function renderAch(){const d=await api('/api/community/achievements');$('content').innerHTML=`<div class="card"><h2>🏅 Achievement</h2><p class="muted">สะสมเหรียญรางวัลของ Mari</p><div class="grid">${(d.achievements||[]).map(a=>`<div class="item achievement ${a.unlocked?'':'locked'}"><div class="icon">${esc(a.icon||'🏅')}</div><div><b>${esc(a.name)}</b><div class="muted">${esc(a.description||'')}</div><span class="badge ${a.unlocked?'ok':''}">${a.unlocked?'ปลดล็อกแล้ว':'ยังไม่ปลดล็อก'}</span></div></div>`).join('')||'<div class="empty">ยังไม่มี Achievement</div>'}</div></div>`}
render();
</script><script src="/mari-global-ui.js?v=11"></script></body></html>
