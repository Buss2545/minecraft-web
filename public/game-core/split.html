<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>บ้านสวนสุขใจ • เล่น 2 จอ</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0b1220;color:#fff;font-family:system-ui,"Noto Sans Thai",sans-serif;overflow:hidden}
#wrap{display:flex;height:100%;gap:4px;background:#0b1220}
@media (max-aspect-ratio:1/1){#wrap{flex-direction:column}}
.pane{position:relative;flex:1;min-width:0;min-height:0;background:#000}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.tag{position:absolute;left:8px;bottom:8px;z-index:3;pointer-events:none;padding:3px 9px;border-radius:12px;font:700 12px/1.4 system-ui;background:#0009;border:1px solid #fff3}
.p1 .tag{color:#7bd1ff}.p2 .tag{color:#ffb36b}
#bar{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:9;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:96vw;padding:5px 8px;border-radius:16px;background:#0b1220e6;border:1px solid #fff3;font:600 12px/1.3 system-ui;transition:opacity .4s}
#bar.hide{opacity:0;pointer-events:none}
#hdl{position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:10;width:54px;height:18px;border:0;border-radius:0 0 12px 12px;background:#0b1220cc;color:#fff;font:700 11px/18px system-ui;cursor:pointer;opacity:.75;padding:0}
#hdl:hover{opacity:1}
#bar button{border:0;border-radius:12px;padding:5px 10px;font:700 12px system-ui;background:#ffd166;color:#2a1a00;cursor:pointer}
#bar button.x{background:#ff7b54;color:#1a0c06}
.chip{padding:3px 8px;border-radius:10px;background:#ffffff14;white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
.chip.ok{background:#1f6b3a}
</style>
</head>
<body>
<div id="wrap">
  <div class="pane p1"><iframe id="f1" src="./baan-suan-sukjai-core.html?split=1&lroom=local" title="ผู้เล่น 1" allow="fullscreen; autoplay; gamepad"></iframe><div class="tag">👤 ผู้เล่น 1 • เซฟหลัก</div></div>
  <div class="pane p2"><iframe id="f2" src="./baan-suan-sukjai-core.html?split=2&lroom=local" title="ผู้เล่น 2" allow="fullscreen; autoplay; gamepad"></iframe><div class="tag">👤 ผู้เล่น 2 • ตัวละครใหม่ (เซฟแยก)</div></div>
</div>
<button id="hdl" type="button" aria-label="เมนู 2 จอ">☰ 2P</button>
<div id="bar">
  <span class="chip" id="c1">P1: …</span><span class="chip" id="c2">P2: …</span>
  <button id="net" type="button">🌐 ออนไลน์</button><button id="swap" type="button">⇄ สลับจอย</button><button id="fs" type="button">⛶ เต็มจอ</button><button class="x" id="out" type="button">✕ ออก</button>
</div>
<script>
/* หน้าแยกครึ่งจอ 2 ผู้เล่น: เปิดเกมเดียวกัน 2 ช่อง (เซฟคนละช่อง) • หน้านี้อ่านจอยเกมแล้วส่งต่อให้แต่ละช่อง (เพราะเบราว์เซอร์ส่งค่าจอยให้เฉพาะหน้าที่โฟกัส)
   จอยตัวที่ 1 → ผู้เล่น 1 • จอยตัวที่ 2 → ผู้เล่น 2 • คีย์บอร์ด/เมาส์ใช้กับช่องที่คลิกอยู่ • อยากเห็นกันในโลกเดียวกัน ให้ทั้งสองช่องเข้าห้องออนไลน์ห้องเดียวกัน */
(()=>{
const $=s=>document.querySelector(s),f1=$('#f1'),f2=$('#f2');let swap=false,hideT=0,last1='',last2='',stPrev=false,stT=0;
const nm=p=>p?String(p.id).replace(/\(.*?\)/g,'').trim().slice(0,30)||'จอยเกม':null;
const snap=p=>p?{id:p.id,mapping:p.mapping,axes:Array.from(p.axes),buttons:Array.from(p.buttons,b=>[!!b.pressed,+b.value||0])}:null;
function tick(){
  let ps=[];try{ps=Array.from(navigator.getGamepads?navigator.getGamepads():[]).filter(p=>p&&p.connected)}catch(e){}
  const a=ps[swap?1:0]||null,b=ps[swap?0:1]||null;
  /* มีจอยตัวเดียว: ให้ผู้เล่น 1 (ถ้าสลับ จะให้ผู้เล่น 2) */
  const one=ps.length===1,pa=one?(swap?null:ps[0]):a,pb=one?(swap?ps[0]:null):b;
  try{f1.contentWindow.postMessage({bssj:'gp',snap:snap(pa)},'*')}catch(e){}
  try{f2.contentWindow.postMessage({bssj:'gp',snap:snap(pb)},'*')}catch(e){}
  const t1='P1: '+(pa?'🎮 '+nm(pa):'คีย์บอร์ด/เมาส์ (ยังไม่มีจอย)'),t2='P2: '+(pb?'🎮 '+nm(pb):'ต่อจอยตัวที่ 2 • กด Start = สลับออนไลน์เน็ต');
  if(t1!==last1){$('#c1').textContent=t1;$('#c1').classList.toggle('ok',!!pa);last1=t1}
  if(t2!==last2){$('#c2').textContent=t2;$('#c2').classList.toggle('ok',!!pb);last2=t2}
  /* กด Start (ปุ่ม 9) บนจอยตัวที่ 2 = ออนไลน์ห้องเดียวกับ P1 อัตโนมัติ (สุ่มรหัสห้อง) • กดอีกครั้งตอนออนไลน์อยู่ = ออกจากห้อง */
  const st=ps.length>=2&&ps.some((q,i)=>i===1&&q.buttons[9]&&q.buttons[9].pressed);
  if(st&&!stPrev&&performance.now()-stT>2500){stT=performance.now();toastMsg(room?'🔗 กลับโหมดเห็นกันในเครื่อง':'🌐 กำลังเข้าห้องออนไลน์ (เน็ต)…');goNet(room?'':String(Math.floor(1000+Math.random()*9000)));show()}
  stPrev=st;
  requestAnimationFrame(tick)}
requestAnimationFrame(tick);
const bar=$('#bar'),show=()=>{bar.classList.remove('hide');clearTimeout(hideT);hideT=setTimeout(()=>bar.classList.add('hide'),7000)};
['pointermove','pointerdown','keydown'].forEach(ev=>addEventListener(ev,show,{passive:true}));show();
$('#hdl').onclick=()=>show();
/* ออนไลน์ห้องเดียวกัน: P1 สร้างห้อง แล้ว P2 เข้าตามหลังเมื่อห้องพร้อม */
let tmT=0;const toastMsg=m=>{let t=$('#tm');if(!t){t=document.createElement('div');t.id='tm';t.style.cssText='position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:12;background:#0b1220ee;color:#fff;padding:8px 16px;border-radius:16px;font:700 13px system-ui;border:1px solid #fff3';document.body.append(t)}t.textContent=m;t.style.display='block';clearTimeout(tmT);tmT=setTimeout(()=>t.style.display='none',2600)};
const BASE='./baan-suan-sukjai-core.html?split=',qs=new URLSearchParams(location.search),netBtn=$('#net');
let room=(qs.get('room')||'').trim().toLowerCase().replace(/[^a-z0-9ก-๙_-]/g,'').slice(0,24);
let mode=qs.get('mode')==='join'?'join':'create';
function goNet(r){room=r;try{const u=new URL(location.href);if(r){u.searchParams.set('room',r);u.searchParams.set('mode',mode)}else{u.searchParams.delete('room');u.searchParams.delete('mode')};history.replaceState(null,'',u)}catch(e){}
  const q=r?'&room='+encodeURIComponent(r):'';
  f1.src=BASE+'1'+(r?q+'&mode='+mode:'&lroom=local');
  clearTimeout(goNet.t);
  if(r){f2.src='about:blank';goNet.t=setTimeout(()=>{f2.src=BASE+'2'+q+'&mode=join'},3000)}else f2.src=BASE+'2&lroom=local';
  netBtn.textContent=r?'🌐 ห้อง '+r+' (กดเพื่อกลับโหมดในเครื่อง)':'🌐 ออนไลน์เน็ต'}
netBtn.onclick=()=>{if(room){goNet('');return}
  const d=String(Math.floor(1000+Math.random()*9000)),r=prompt('รหัสห้องออนไลน์ (P1 สร้าง • P2 เข้าตาม • เพื่อนใช้รหัสเดียวกันเข้าร่วมได้)\nการเปลี่ยนโหมดจะรีโหลดเกมทั้งสองจอ',d);
  if(r===null)return;const c=r.trim().toLowerCase().replace(/[^a-z0-9ก-๙_-]/g,'').slice(0,24)||d;mode=confirm('ห้อง "'+c+'"\nOK = สร้างห้องใหม่ (P1 เป็นหัวห้อง)\nยกเลิก = เข้าห้องที่มีคนสร้างไว้แล้ว')?'create':'join';goNet(c);show()};
if(room){f1.src=BASE+'1&room='+encodeURIComponent(room)+'&mode='+mode;f2.src='about:blank';setTimeout(()=>{f2.src=BASE+'2&room='+encodeURIComponent(room)+'&mode=join'},3000);netBtn.textContent='🌐 ห้อง '+room+' (กดเพื่อออก)'}
$('#swap').onclick=()=>{swap=!swap;last1=last2='';show()};
$('#fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
$('#out').onclick=()=>{location.href='./baan-suan-sukjai-core.html'};
f1.addEventListener('load',()=>{try{f1.contentWindow.focus()}catch(e){}});
/* ปุ่มพิมพ์ในช่องที่โฟกัส: แตะ/คลิกที่ช่องไหน ช่องนั้นได้คีย์บอร์ด */
})();
</script>
</body>
</html>
