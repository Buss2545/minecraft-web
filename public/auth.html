<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ee7fa5">
<title>เข้าสู่ระบบ • Mari JP SMP</title>
<style>
:root{--p:#ee7fa5;--ink:#2b2026;--mut:#806b75;--line:#efd6e0;--dark:#21171d;--green:#35a95c;--red:#d9455f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Segoe UI,Tahoma,Arial,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#fff6fa,#fff,#fff8fb);
  display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:28px 22px;box-shadow:0 10px 30px #ee7fa522}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:18px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#ffb7cf,#e96b97);
  display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px}
.brand b{font-size:19px}
.tabs{display:flex;background:#fff2f6;border-radius:14px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:transparent;padding:11px;border-radius:11px;font-weight:800;
  color:var(--mut);font-size:15px}
.tabs button.active{background:var(--p);color:#fff}
label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:12px 0 6px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);font-size:16px;
  background:#fffafc}
input:focus{outline:2px solid var(--p);border-color:transparent}
.btn{width:100%;margin-top:20px;padding:14px;border:0;border-radius:14px;background:var(--p);
  color:#fff;font-weight:900;font-size:16px}
.btn:active{opacity:.85}
.btn:disabled{opacity:.6}
.err{margin-top:12px;padding:10px 12px;border-radius:10px;background:#fdecef;color:var(--red);
  font-size:14px;display:none}
.ok{text-align:center;padding:10px 0}
.ok h2{margin:6px 0}
.ok p{color:var(--mut);font-size:14px}
.back{display:inline-block;margin-top:14px;padding:12px 20px;border-radius:12px;background:var(--dark);
  color:#fff;text-decoration:none;font-weight:800}
.hide{display:none}
</style>
</head>
<body>
<div id="mariLoader" class="mari-loader" aria-hidden="true">
  <svg class="mlc" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <ellipse class="mlc-dust d1" cx="40" cy="178" rx="10" ry="4"/>
    <ellipse class="mlc-dust d2" cx="25" cy="170" rx="7" ry="3"/>
    <ellipse class="mlc-shadow" cx="100" cy="186" rx="34" ry="7"/>
    <path class="mlc-leg mlc-leg-back" d="M95 120 Q90 148 78 176" stroke="#f6a8c9" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path class="mlc-arm mlc-arm-back" d="M108 90 Q132 94 142 74" stroke="#f487ae" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path class="mlc-body" d="M75 68 Q100 54 125 68 L136 128 Q100 144 64 128 Z" fill="#f487ae"/>
    <circle cx="88" cy="98" r="4" fill="#ffd7e6"/>
    <circle cx="112" cy="110" r="3" fill="#ffd7e6"/>
    <circle cx="100" cy="120" r="3" fill="#ffd7e6"/>
    <path class="mlc-arm mlc-arm-front" d="M88 88 Q64 80 56 56" stroke="#ef82a7" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path class="mlc-leg mlc-leg-front" d="M105 122 Q118 150 129 178" stroke="#fbd6e6" stroke-width="13" stroke-linecap="round" fill="none"/>
    <ellipse class="mlc-shoe" cx="76" cy="180" rx="9" ry="6" fill="#c9527d"/>
    <ellipse class="mlc-shoe" cx="131" cy="181" rx="9" ry="6" fill="#c9527d"/>
    <circle cx="100" cy="46" r="25" fill="#ffe1c4"/>
    <path d="M73 44 Q68 4 100 8 Q133 3 128 45 Q120 18 100 20 Q80 18 73 44Z" fill="#ffcf5c"/>
    <path d="M69 38 Q64 58 75 65" stroke="#ffcf5c" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M131 38 Q136 58 125 65" stroke="#ffcf5c" stroke-width="8" stroke-linecap="round" fill="none"/>
  </svg>
  <div class="mari-loader-text">MARI JP SMP</div>
</div>
<div id="adminPageOverride"></div>
<style>
.mari-loader{position:fixed;inset:0;z-index:99999;background:linear-gradient(180deg,#fff6fa,#fff,#fff8fb);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease}
.mari-loader.mlh{opacity:0;pointer-events:none}
.mlc{width:130px;height:130px;animation:mlcBob .45s ease-in-out infinite alternate}
.mlc-leg-back{transform-origin:95px 118px;animation:mlcLegB .45s ease-in-out infinite alternate}
.mlc-leg-front{transform-origin:105px 118px;animation:mlcLegF .45s ease-in-out infinite alternate}
.mlc-arm-back{transform-origin:108px 88px;animation:mlcArmB .45s ease-in-out infinite alternate}
.mlc-arm-front{transform-origin:88px 86px;animation:mlcArmF .45s ease-in-out infinite alternate}
.mlc-dust{fill:#f3c8d8;opacity:0;animation:mlcDust .9s ease-in infinite}
.mlc-dust.d2{animation-delay:.25s}
@keyframes mlcLegB{from{transform:rotate(-20deg)}to{transform:rotate(24deg)}}
@keyframes mlcLegF{from{transform:rotate(20deg)}to{transform:rotate(-24deg)}}
@keyframes mlcArmB{from{transform:rotate(16deg)}to{transform:rotate(-20deg)}}
@keyframes mlcArmF{from{transform:rotate(-16deg)}to{transform:rotate(20deg)}}
@keyframes mlcBob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
@keyframes mlcDust{0%{opacity:.7;transform:translateX(0)}100%{opacity:0;transform:translateX(-16px)}}
.mari-loader-text{margin-top:16px;font-family:Segoe UI,Tahoma,Arial,sans-serif;font-weight:900;color:#d95e88;letter-spacing:2px;font-size:14px}
</style>
<script>
(function(){
  var el=document.getElementById('mariLoader');
  var shownAt=Date.now();
  function hideLoader(){
    var wait=Math.max(0,450-(Date.now()-shownAt));
    setTimeout(function(){
      if(!el)return;
      el.classList.add('mlh');
      setTimeout(function(){el.remove()},550);
    },wait);
  }
  if(document.readyState==='complete'){hideLoader();}
  else{window.addEventListener('load',hideLoader);}

  var __PAGE_NAME__='auth';
  fetch('/api/page-editor/'+__PAGE_NAME__).then(function(r){return r.ok?r.json():null}).then(function(d){
    if(!d||!d.page||d.page.enabled===false)return;
    var p=d.page;
    if(p.css){
      var st=document.createElement('style');
      st.id='adminCustomCss';
      st.textContent=p.css;
      document.head.appendChild(st);
    }
    if(p.html){
      var box=document.getElementById('adminPageOverride');
      if(box)box.innerHTML=p.html;
    }
  }).catch(function(){});
})();
</script>

<div class="card">
  <div class="brand"><div class="logo">M</div><b>Mari JP SMP</b></div>

  <div id="formView">
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="switchTab('login')">เข้าสู่ระบบ</button>
      <button id="tabRegister" onclick="switchTab('register')">สมัครสมาชิก</button>
    </div>
    <form id="authForm" onsubmit="submitAuth(event)">
      <label>Username</label>
      <input id="fUser" autocomplete="username" required minlength="3" maxlength="24">
      <label>Password</label>
      <input id="fPass" type="password" autocomplete="current-password" required minlength="6" maxlength="200">
      <button class="btn" id="fSubmit" type="submit">เข้าสู่ระบบ</button>
      <div class="err" id="fErr"></div>
    </form>
    <div id="forgotLink" style="text-align:center;margin-top:14px;font-size:13px">
      ลืมรหัสผ่าน? <a href="https://discord.gg/sN3U7tEHc" target="_blank" rel="noopener" style="color:#e96b97;font-weight:800;text-decoration:none">ทักแอดมินทาง Discord</a> เพื่อขอตั้งรหัสใหม่
    </div>
  </div>

  <div id="okView" class="ok hide">
    <div style="font-size:40px">✅</div>
    <h2 id="okTitle">สำเร็จ!</h2>
    <p>เข้าสู่ระบบเรียบร้อยแล้ว</p>
    <button class="back" onclick="goBack()">กลับไปหน้าหลัก</button>
  </div>
</div>

<script>
let mode=(new URLSearchParams(location.search).get('mode')==='register')?'register':'login';
function switchTab(m){
  mode=m;
  document.getElementById('tabLogin').classList.toggle('active',m==='login');
  document.getElementById('tabRegister').classList.toggle('active',m==='register');
  document.getElementById('fSubmit').textContent=m==='login'?'เข้าสู่ระบบ':'สมัครสมาชิก';
  document.getElementById('fPass').autocomplete=m==='login'?'current-password':'new-password';
  document.getElementById('forgotLink').style.display=m==='login'?'block':'none';
  hideErr();
}
function showErr(msg){const e=document.getElementById('fErr');e.textContent=msg;e.style.display='block'}
function hideErr(){document.getElementById('fErr').style.display='none'}

async function submitAuth(e){
  e.preventDefault();
  hideErr();
  const username=document.getElementById('fUser').value.trim();
  const password=document.getElementById('fPass').value;
  const btn=document.getElementById('fSubmit');
  btn.disabled=true;
  const originalText=btn.textContent;
  btn.textContent='กำลังดำเนินการ...';
  try{
    const r=await fetch('/api/'+mode,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'same-origin',
      body:JSON.stringify({username,password})
    });
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||'ไม่สำเร็จ');
    document.getElementById('formView').classList.add('hide');
    document.getElementById('okView').classList.remove('hide');
    document.getElementById('okTitle').textContent=mode==='login'?'เข้าสู่ระบบสำเร็จ!':'สมัครสมาชิกสำเร็จ!';
  }catch(err){
    showErr(err.message||'เกิดข้อผิดพลาด กรุณาลองใหม่');
  }finally{
    btn.disabled=false;
    btn.textContent=originalText;
  }
}

function goBack(){
  location.href='/';
}

// Reflect ?mode=register in the tab UI on load.
switchTab(mode);
</script>
</body>
</html>
