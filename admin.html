<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#21171d">
<title>Admin • Mari JP SMP</title>
<style>
:root{--p:#ee7fa5;--ink:#2b2026;--mut:#806b75;--line:#efd6e0;--dark:#21171d;--green:#35a95c;--red:#d9455f;--amber:#c98a1c}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;color:var(--ink);background:#fbf3f6;padding:16px}
.wrap{max-width:640px;margin:auto}
h1{font-size:20px;display:flex;align-items:center;gap:8px}
.keybar{display:flex;gap:8px;margin-bottom:16px}
.keybar input{flex:1;padding:11px 12px;border-radius:10px;border:1px solid var(--line);font-size:15px}
.keybar button{padding:11px 16px;border:0;border-radius:10px;background:var(--dark);color:#fff;font-weight:800}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tabs button{flex:1 1 120px;padding:10px;border:0;border-radius:10px;background:#fff;border:1px solid var(--line);
  font-weight:800;color:var(--mut)}
.tabs button.active{background:var(--p);color:#fff;border-color:transparent}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.row b{font-size:16px}
.muted{color:var(--mut);font-size:13px}
.amount{font-size:20px;font-weight:900;color:var(--green)}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1;padding:10px;border:0;border-radius:10px;font-weight:800;color:#fff}
.approve{background:var(--green)}
.reject{background:var(--red)}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.badge{display:inline-block;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:800}
.badge.pending{background:#fff2d6;color:var(--amber)}
.badge.approved{background:#e6f7ec;color:var(--green)}
.badge.rejected{background:#fdecef;color:var(--red)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;
  padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.music-form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.music-form input{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);font:inherit}
.music-form .wide{grid-column:1/-1}
.music-form button{padding:10px;border:0;border-radius:10px;background:var(--p);color:#fff;font-weight:800}
.music-item{display:flex;align-items:center;gap:10px}
.music-item .music-copy{min-width:0;flex:1}
.music-item .music-copy b,.music-item .music-copy small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-item .music-copy small{color:var(--mut);font-size:12px;margin-top:3px}
.music-order{display:flex;gap:5px}.music-order button{padding:7px 9px;border:0;border-radius:8px;background:#f7e8ee;color:var(--ink);font-weight:900}.music-order button:disabled{opacity:.35;cursor:not-allowed}
.music-delete{padding:8px 11px;border:0;border-radius:9px;background:var(--red);color:#fff;font-weight:800}
@media(max-width:520px){.music-form{grid-template-columns:1fr}.music-form .wide{grid-column:auto}.music-item{align-items:flex-start;flex-wrap:wrap}.music-item .music-copy{width:calc(100% - 42px)}.music-order{margin-left:32px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠️ Mari JP SMP — Admin</h1>

  <div class="keybar">
    <input id="adminKey" type="password" placeholder="ใส่ Admin Key">
    <button onclick="saveKey()">เข้าสู่ระบบ</button>
  </div>

  <div id="panel" style="display:none">
    <div class="tabs">
      <button id="tabPending" class="active" onclick="loadTopups('pending')">รอดำเนินการ</button>
      <button id="tabApproved" onclick="loadTopups('approved')">อนุมัติแล้ว</button>
      <button id="tabRejected" onclick="loadTopups('rejected')">ปฏิเสธแล้ว</button>
      <button id="tabOrders" onclick="loadOrders()">คำสั่งซื้อ</button>
      <button id="tabUsers" onclick="showUserSearch()">ผู้ใช้</button>
      <button id="tabMusic" onclick="showMusic()">🎵 เพลง</button>
    </div>
    <div id="list"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
function getKey(){return localStorage.getItem('mari_admin_key')||''}
function saveKey(){
  const k=document.getElementById('adminKey').value.trim();
  if(!k)return;
  localStorage.setItem('mari_admin_key',k);
  document.getElementById('adminKey').value='';
  document.getElementById('panel').style.display='block';
  loadTopups('pending');
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function setActiveTab(id){
  ['tabPending','tabApproved','tabRejected','tabOrders','tabUsers','tabMusic'].forEach(t=>
    document.getElementById(t).classList.toggle('active',t===id));
}
async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','x-admin-key':getKey(),...(opts.headers||{})}});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){
    if(r.status===401||r.status===403){
      localStorage.removeItem('mari_admin_key');
      document.getElementById('panel').style.display='none';
      showToast(d.error||'Admin key ไม่ถูกต้อง กรุณาใส่ใหม่');
    }
    throw new Error(d.error||'เกิดข้อผิดพลาด');
  }
  return d;
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function loadTopups(status){
  setActiveTab(status==='pending'?'tabPending':status==='approved'?'tabApproved':'tabRejected');
  const list=document.getElementById('list');
  list.innerHTML='<div class="empty">กำลังโหลด...</div>';
  try{
    const d=await api('/api/admin/topups?status='+status);
    if(!d.topups.length){list.innerHTML='<div class="empty">ไม่มีรายการ</div>';return}
    list.innerHTML=d.topups.map(t=>`
      <div class="card">
        <div class="row">
          <div>
            <b>${esc(t.username)}</b> ${t.minecraft?`<span class="muted">(${esc(t.minecraft)})</span>`:''}<br>
            <span class="muted">${new Date(t.createdAt).toLocaleString('th-TH')}</span>
            ${t.note?`<br><span class="muted">โน้ต: ${esc(t.note)}</span>`:''}
            ${t.reason?`<br><span class="muted">เหตุผล: ${esc(t.reason)}</span>`:''}
          </div>
          <div style="text-align:right">
            <div class="amount">฿${t.amount}</div>
            <span class="badge ${t.status}">${t.status==='pending'?'รอดำเนินการ':t.status==='approved'?'อนุมัติแล้ว':'ปฏิเสธแล้ว'}</span>
          </div>
        </div>
        ${status==='pending'?`<div class="actions">
          <button class="approve" onclick="decide('${t.id}','approve')">✅ อนุมัติ</button>
          <button class="reject" onclick="decide('${t.id}','reject')">❌ ปฏิเสธ</button>
        </div>`:''}
      </div>`).join('');
  }catch(e){list.innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}

async function decide(id,action){
  if(action==='reject'&&!confirm('ยืนยันปฏิเสธรายการนี้?'))return;
  try{
    await api(`/api/admin/topups/${id}/${action}`,{method:'POST',body:JSON.stringify({})});
    showToast(action==='approve'?'อนุมัติแล้ว เติมเครดิตให้ผู้ใช้แล้ว':'ปฏิเสธรายการแล้ว');
    loadTopups('pending');
  }catch(e){showToast(e.message)}
}

function showUserSearch(){
  setActiveTab('tabUsers');
  const list=document.getElementById('list');
  list.innerHTML=`
    <div class="card">
      <div style="display:flex;gap:8px">
        <input id="userSearchInput" placeholder="พิมพ์ username ที่จะค้นหา" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--line)">
        <button class="approve" style="flex:none;padding:10px 16px" onclick="searchUsers()">ค้นหา</button>
      </div>
    </div>
    <div id="userResults"></div>`;
  document.getElementById('userSearchInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchUsers()});
}

async function searchUsers(){
  const q=document.getElementById('userSearchInput')?.value.trim();
  const results=document.getElementById('userResults');
  if(!q){results.innerHTML='';return}
  results.innerHTML='<div class="empty">กำลังค้นหา...</div>';
  try{
    const d=await api('/api/admin/users?search='+encodeURIComponent(q));
    if(!d.users.length){results.innerHTML='<div class="empty">ไม่พบผู้ใช้</div>';return}
    results.innerHTML=d.users.map(u=>`
      <div class="card">
        <b>${esc(u.username)}</b> ${u.minecraft?`<span class="muted">(${esc(u.minecraft)})</span>`:''}<br>
        <span class="muted">เครดิต: ฿${u.balance}</span>
        <div class="actions">
          <button class="reject" style="flex:none;padding:8px 14px" onclick="resetPassword('${u.id}','${esc(u.username)}')">🔑 รีเซ็ตรหัสผ่าน</button>
          <button class="approve" style="flex:none;padding:8px 14px" onclick="adjustBalance('${u.id}','${esc(u.username)}')">💰 ปรับเครดิต</button>
        </div>
      </div>`).join('');
  }catch(e){results.innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}

async function adjustBalance(userId,username){
  const input=prompt(`ปรับยอดเครดิตของ "${username}"\nใส่ตัวเลข (บวก = เพิ่ม, ลบ = หัก) เช่น -100 หรือ 50:`);
  if(input===null)return;
  const delta=Math.trunc(Number(input));
  if(!delta){showToast('กรุณากรอกตัวเลขที่ไม่เป็น 0');return}
  const reason=prompt('เหตุผล (ไม่บังคับ เช่น "คืนเครดิตแลก Point พลาด"):')||'';
  if(!confirm(`ยืนยัน${delta>0?'เพิ่ม':'หัก'}เครดิต ${Math.abs(delta)} บาท ให้ "${username}" ?`))return;
  try{
    const d=await api(`/api/admin/users/${userId}/adjust-balance`,{method:'POST',body:JSON.stringify({delta,reason})});
    showToast(`ปรับเครดิตแล้ว ยอดใหม่: ฿${d.user.balance}`);
    searchUsers();
  }catch(e){showToast(e.message)}
}

async function resetPassword(userId,username){
  const pw=prompt(`ตั้งรหัสผ่านใหม่ให้ "${username}" (อย่างน้อย 6 ตัวอักษร):`);
  if(!pw)return;
  if(pw.length<6){showToast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');return}
  if(!confirm(`ยืนยันตั้งรหัสผ่านใหม่ให้ "${username}" เป็น "${pw}" ?`))return;
  try{
    await api(`/api/admin/users/${userId}/reset-password`,{method:'POST',body:JSON.stringify({newPassword:pw})});
    showToast(`ตั้งรหัสผ่านใหม่ให้ ${username} แล้ว - แจ้งรหัสนี้ให้ผู้เล่นเอง`);
  }catch(e){showToast(e.message)}
}

async function loadOrders(){
  setActiveTab('tabOrders');
  const list=document.getElementById('list');
  list.innerHTML='<div class="empty">กำลังโหลด...</div>';
  try{
    const d=await api('/api/admin/orders');
    if(!d.orders.length){list.innerHTML='<div class="empty">ยังไม่มีคำสั่งซื้อ</div>';return}
    list.innerHTML=d.orders.map(o=>`
      <div class="card">
        <div class="row">
          <div><b>${esc(o.username)}</b> — ${esc(o.product)}<br>
            <span class="muted">Minecraft: ${esc(o.minecraft)} • ${new Date(o.createdAt).toLocaleString('th-TH')}</span>
          </div>
          <div style="text-align:right">
            <div class="amount">฿${o.price}</div>
            <span class="muted">${esc(o.status)}</span>
          </div>
        </div>
        <div class="actions">
          <button class="approve" onclick="grantOrder('${o.id}','${esc(o.username)}','${esc(o.product)}')">🎖️ ติดยศใหม่ (LuckPerms)</button>
          <button class="reject" onclick="deleteOrder('${o.id}','${esc(o.username)}','${esc(o.product)}')">🗑️ ลบ (ยศหาย/แก้ไข)</button>
        </div>
      </div>`).join('');
  }catch(e){list.innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}

async function grantOrder(id,username,product){
  if(!confirm(`สั่งติดยศ "${product}" ให้ ${username} ผ่าน LuckPerms อีกครั้ง?\n\nใช้เมื่อรายการนี้ยังไม่เคยติดยศอัตโนมัติ หรือครั้งก่อนล้มเหลว`))return;
  try{
    await api(`/api/admin/orders/${id}/grant`,{method:'POST',body:JSON.stringify({})});
    showToast('สั่งติดยศสำเร็จแล้ว');
    loadOrders();
  }catch(e){showToast(e.message)}
}

async function deleteOrder(id,username,product){
  if(!confirm(`ลบคำสั่งซื้อ "${product}" ของ ${username}?\n\nใช้เมื่อยศหายในเกม - ลบแล้วผู้เล่นจะซื้อยศนี้ซ้ำได้อีกครั้ง (ไม่คืนเครดิตอัตโนมัติ ถ้าต้องคืนเงินให้ทำแยกต่างหาก)`))return;
  try{
    await api(`/api/admin/orders/${id}`,{method:'DELETE'});
    showToast('ลบคำสั่งซื้อแล้ว ผู้เล่นซื้อยศนี้ซ้ำได้แล้ว');
    loadOrders();
  }catch(e){showToast(e.message)}
}

function musicFileBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function showMusic(){
  setActiveTab('tabMusic');
  const list=document.getElementById('list');
  list.innerHTML=`
    <div class="card">
      <h3 style="margin-top:0">🎵 เพิ่มเพลงออนไลน์</h3>
      <p class="muted">อัปโหลดเพลงที่มีสิทธิ์ใช้งานได้เท่านั้น รองรับ MP3, OGG และ WAV ขนาดไม่เกิน 15 MB</p>
      <div class="music-form">
        <input id="musicTitle" placeholder="ชื่อเพลง (ไม่บังคับ)">
        <input id="musicArtist" placeholder="ศิลปิน (ไม่บังคับ)">
        <input id="musicFile" class="wide" type="file" accept=".mp3,.ogg,.wav,audio/mpeg,audio/ogg,audio/wav">
        <button id="musicUploadButton" class="wide" onclick="uploadAdminMusic()">อัปโหลดเพลง</button>
      </div>
    </div>
    <div id="musicItems"><div class="empty">กำลังโหลดเพลง...</div></div>`;
  await loadAdminMusic();
}

async function loadAdminMusic(){
  const box=document.getElementById('musicItems');
  if(!box)return;
  try{
    const d=await api('/api/music/tracks');
    adminMusicTracks=d.tracks||[];
    if(!adminMusicTracks.length){box.innerHTML='<div class="empty">ยังไม่มีเพลง</div>';return}
    box.innerHTML=adminMusicTracks.map((track,index)=>`
      <div class="card music-item">
        <div style="font-size:22px">🎵</div>
        <div class="music-copy"><b>${index+1}. ${esc(track.title)}</b><small>${esc(track.artist||'ไม่ระบุศิลปิน')} · ${(Number(track.size||0)/1024/1024).toFixed(1)} MB</small></div>
        <div class="music-order">
          <button onclick="moveMusic('${esc(track.id)}',-1)" title="เลื่อนขึ้น" ${index===0?'disabled':''}>↑</button>
          <button onclick="moveMusic('${esc(track.id)}',1)" title="เลื่อนลง" ${index===adminMusicTracks.length-1?'disabled':''}>↓</button>
        </div>
        <button class="music-delete" onclick="deleteMusic('${esc(track.id)}','${esc(track.title)}')">ลบ</button>
      </div>`).join('');
  }catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}

let adminMusicTracks=[];
async function moveMusic(id,direction){
  const from=adminMusicTracks.findIndex(track=>track.id===id);
  const to=from+direction;
  if(from<0||to<0||to>=adminMusicTracks.length)return;
  [adminMusicTracks[from],adminMusicTracks[to]]=[adminMusicTracks[to],adminMusicTracks[from]];
  try{
    await api('/api/admin/music/order',{
      method:'POST',
      body:JSON.stringify({orders:adminMusicTracks.map(track=>({id:track.id}))})
    });
    showToast('เปลี่ยนตำแหน่งเพลงแล้ว');
    await loadAdminMusic();
  }catch(e){
    showToast(e.message||'เปลี่ยนตำแหน่งเพลงไม่สำเร็จ');
    await loadAdminMusic();
  }
}

async function uploadAdminMusic(){
  const file=document.getElementById('musicFile')?.files?.[0];
  const title=document.getElementById('musicTitle')?.value.trim();
  const artist=document.getElementById('musicArtist')?.value.trim();
  const button=document.getElementById('musicUploadButton');
  if(!file){showToast('เลือกไฟล์เพลงก่อน');return}
  if(file.size>15*1024*1024){showToast('ไฟล์ต้องมีขนาดไม่เกิน 15 MB');return}
  if(!['audio/mpeg','audio/ogg','audio/wav','audio/x-wav'].includes(file.type)){
    showToast('รองรับเฉพาะ MP3, OGG หรือ WAV');return;
  }
  if(button)button.disabled=true;
  try{
    const data=await musicFileBase64(file);
    await api('/api/admin/music',{
      method:'POST',
      body:JSON.stringify({
        title:title||file.name.replace(/\.[^.]+$/,''),
        artist,
        filename:file.name,
        mimeType:file.type,
        data
      })
    });
    showToast('เพิ่มเพลงสำเร็จ 🎵');
    await showMusic();
  }catch(e){showToast(e.message||'อัปโหลดเพลงไม่สำเร็จ')}
  finally{if(button)button.disabled=false}
}

async function deleteMusic(id,title){
  if(!confirm(`ยืนยันลบเพลง "${title}" ?\n\nไฟล์จะถูกลบออกจาก MongoDB GridFS และผู้ใช้จะเปิดเพลงนี้ไม่ได้อีก`))return;
  try{
    await api(`/api/admin/music/${id}`,{method:'DELETE'});
    showToast('ลบเพลงแล้ว');
    loadAdminMusic();
  }catch(e){showToast(e.message||'ลบเพลงไม่สำเร็จ')}
}

if(getKey()){document.getElementById('panel').style.display='block';loadTopups('pending');}
</script>
</body>
</html>
