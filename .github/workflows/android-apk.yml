name: Build บ้านสวนสุขใจ APKs

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "public/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare embedded game assets
        run: |
          rm -rf android/app/src/embedded/assets/site
          mkdir -p android/app/src/embedded/assets
          cp -R public android/app/src/embedded/assets/site

      - name: Build Online APK
        working-directory: android
        run: gradle assembleOnlineDebug --no-daemon

      - name: Build Embedded APK
        working-directory: android
        run: gradle assembleEmbeddedDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/online/debug/app-online-debug.apk apk-output/baan-suan-sukjai-online.apk
          cp android/app/build/outputs/apk/embedded/debug/app-embedded-debug.apk apk-output/baan-suan-sukjai-embedded.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: baan-suan-sukjai-apks
          path: apk-output/*.apk
