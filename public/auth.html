<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ee7fa5"><title>เข้าสู่ระบบ • Mari JP SMP</title><link rel="stylesheet" href="/app.css?v=1"><style>body{min-height:100vh;display:grid;place-items:center;padding:18px}.auth-card{width:min(440px,100%)}.auth-brand{text-align:center;margin-bottom:18px}.auth-brand .brand-icon{width:58px;height:58px;margin:0 auto 10px;font-size:24px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#fff2f6;padding:4px;border-radius:13px;margin-bottom:16px}.auth-tabs button{border:0;background:transparent;padding:11px;border-radius:10px;font-weight:900;color:var(--muted)}.auth-tabs button.active{background:var(--pink);color:#fff}.err{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:#fdecef;color:var(--danger);white-space:pre-line;font-size:13px}.success{display:none;text-align:center}</style></head><body><main class="card auth-card"><div class="auth-brand"><div class="brand-icon">M</div><h1 style="margin:0 0 4px">Mari JP SMP</h1><div class="muted">ระบบบัญชีใหม่ ใช้ข้อมูลบัญชีเดิม</div></div><div id="formView"><div class="auth-tabs"><button id="tabLogin" class="active" type="button">เข้าสู่ระบบ</button><button id="tabRegister" type="button">สมัครสมาชิก</button></div><form id="authForm" class="form"><label>Username</label><input id="username" autocomplete="username" minlength="3" maxlength="24" required><label>Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" maxlength="200" required><button id="submitBtn" class="btn primary" type="submit">เข้าสู่ระบบ</button><div id="err" class="err"></div></form><div style="text-align:center;margin-top:14px"><a href="/" class="muted">← กลับหน้าหลัก</a></div></div><div id="successView" class="success"><div style="font-size:46px">✅</div><h2 id="successTitle">สำเร็จ</h2><p class="muted">กำลังกลับหน้าหลัก...</p></div></main><script src="/client-reset.js?v=1"></script><script>let mode=new URLSearchParams(location.search).get('mode')==='register'?'register':'login';const l=document.getElementById('tabLogin'),r=document.getElementById('tabRegister'),b=document.getElementById('submitBtn'),p=document.getElementById('password'),f=document.getElementById('authForm'),e=document.getElementById('err');function setMode(m){mode=m;l.classList.toggle('active',m==='login');r.classList.toggle('active',m==='register');b.textContent=m==='login'?'เข้าสู่ระบบ':'สมัครสมาชิก';p.autocomplete=m==='login'?'current-password':'new-password';e.style.display='none'}l.onclick=()=>setMode('login');r.onclick=()=>setMode('register');f.addEventListener('submit',async ev=>{ev.preventDefault();e.style.display='none';b.disabled=true;const old=b.textContent;b.textContent='กำลังตรวจสอบ...';try{const res=await fetch('/api/'+mode,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:p.value})});const d=await res.json().catch(()=>({}));if(!res.ok)throw new Error(d.error||'ดำเนินการไม่สำเร็จ');document.getElementById('formView').style.display='none';document.getElementById('successView').style.display='block';document.getElementById('successTitle').textContent=mode==='login'?'เข้าสู่ระบบสำเร็จ':'สมัครสมาชิกสำเร็จ';setTimeout(()=>location.href='/',350)}catch(err){e.textContent=err.message;e.style.display='block'}finally{b.disabled=false;b.textContent=old}});setMode(mode)</script></body></html>
