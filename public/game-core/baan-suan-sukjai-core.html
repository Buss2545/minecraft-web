<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1726">
<title>บ้านสวนสุขใจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1726;--panel:#fff3d6;--ink:#3a2814;--line:#c79a4b;--btn:#f2a900;--btnink:#2a1d0c;--pink:#e8749b;--dim:#8a7350;--glass:#16283bf2;--glass2:#0b1726f2;--gold:#f4d58a;--cell:#ffffff30;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#2b2116;--ink:#fdf1d6;--line:#7a5e2c;--dim:#bba37a;--cell:#ffffff14}}
:root[data-theme="dark"]{--panel:#2b2116;--ink:#fdf1d6;--line:#7a5e2c;--dim:#bba37a;--cell:#ffffff14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:'Mali','Noto Sans Thai',system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
#app{position:relative;width:100%;height:100%;overflow:hidden}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.round{position:absolute;border:3px solid var(--gold);border-radius:50%;background:linear-gradient(#1c3550,#0b1726);color:#fff;font:700 15px 'Mali',sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #0008;z-index:3}
.round:active{transform:translateY(2px)}
#qbtns{position:absolute;top:8px;right:8px;display:flex;gap:8px;z-index:3}
#qbtns button{position:static;width:44px;height:44px;font-size:20px;border-radius:12px}
#hud{position:absolute;top:8px;left:8px;background:linear-gradient(#16283bdf,#0b1726df);border:2px solid var(--gold);border-radius:12px;box-shadow:0 4px 0 #0008;color:#fff;padding:6px 10px;font-size:11.5px;line-height:1.45;min-width:132px;z-index:3}
.mini{height:8px;background:#fff3;border-radius:4px;margin-top:4px;overflow:hidden}
.mini i{display:block;height:100%;width:100%}
#barFill{background:#7ed957}#hpFill{background:#e5533d}
#toast{position:absolute;left:50%;top:21%;transform:translateX(-50%);background:#000d;color:#fff;padding:9px 15px;border-radius:14px;border:2px solid #fff3;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86%;text-align:center;white-space:pre-line;z-index:8}
#toast.on{opacity:1}
#joy{position:absolute;left:16px;bottom:112px;width:124px;height:124px;border-radius:50%;background:#0005;border:3px solid #fff6;z-index:3;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fffb;box-shadow:0 2px 6px #0006}
#btnA{right:20px;bottom:124px;width:86px;height:86px;font-size:19px;background:linear-gradient(#ffd45a,#e99500);color:#3a2814;touch-action:none}
#tools{position:absolute;left:50%;bottom:calc(8px);transform:translateX(-50%);display:flex;gap:3px;padding:4px;background:linear-gradient(#16283bee,#071827ee);border:2px solid var(--gold);border-radius:12px;box-shadow:0 5px 0 #0008;z-index:3;max-width:100%}
#tools button{width:41px;height:56px;border-radius:8px;border:2px solid #ffffff44;background:#ffffff12;color:#fff;font:600 8.5px 'Mali',sans-serif;line-height:1.1;padding:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;white-space:nowrap}
#tools button b{font-size:20px;font-weight:400}
#tools button.sel{border-color:var(--btn);background:#f2a90066}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:7}
#fade.on{opacity:1}
#modal{position:absolute;inset:0;display:none;z-index:6}
#modal.on{display:flex;align-items:center;justify-content:center;background:#0008}
#modal.bottom{align-items:flex-end;background:transparent}
.card,.sheet{background:var(--panel);color:var(--ink);border:3px solid var(--line);border-radius:14px;box-shadow:0 7px 0 #0005,0 12px 30px #0007}
.card{padding:14px;width:min(92%,390px);max-height:82%;overflow:auto;touch-action:pan-y}
.card h3{margin:0 0 4px;font-size:18px}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:6px;line-height:1.4}
.b{display:block;width:100%;margin:6px 0;padding:11px 12px;border:0;border-radius:10px;background:var(--btn);color:var(--btnink);font:600 14.5px 'Mali',sans-serif;text-align:left;box-shadow:0 3px 0 #0004}
.b:active{transform:translateY(2px);box-shadow:0 1px 0 #0004}
.b.alt{background:transparent;border:2px solid var(--line);color:var(--ink);box-shadow:none}
.b[disabled],.row button[disabled],.item[disabled]{opacity:.4}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px;white-space:pre-line}
.row>span{flex:1;line-height:1.35}
.row small{color:var(--dim);font-size:11px}
.row button{padding:7px 10px;border:0;border-radius:9px;background:var(--btn);color:var(--btnink);font:600 12.5px 'Mali',sans-serif;box-shadow:0 2px 0 #0004}
.row input[type=range]{flex:1;accent-color:var(--btn)}
.tabs{display:flex;gap:6px;margin:6px 0}
.tabs button{flex:1;padding:8px 4px;border-radius:9px;border:2px solid var(--line);background:transparent;color:var(--ink);font:600 12.5px 'Mali',sans-serif}
.tabs button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.tabs.sm{flex-wrap:wrap}.tabs.sm button{flex:0 0 auto;padding:6px 10px;font-size:12px}
.dlg{background:var(--panel);color:var(--ink);border:3px solid var(--line);border-radius:16px 16px 0 0;width:100%;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:flex-start;min-height:124px}
.dlg canvas,.ncard canvas,.row canvas{flex:none;background:#0002;border-radius:10px}
.dtxt{flex:1;font-size:15px;line-height:1.5}
.dtxt p{margin:2px 0 6px}
.dtxt small{color:var(--dim)}
.ncard{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.hearts{color:var(--pink);letter-spacing:1px;font-size:14px}
.pill{background:var(--cell);border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;margin:6px 0}
/* stardew-style sheet */
.sheet{width:min(96%,430px);height:min(92%,720px);display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(#17304a,#0b1726);color:#eef4ff;border-color:var(--gold)}
.shead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:linear-gradient(#27496d,#18324d);border-bottom:2px solid var(--gold)}
.shead b{font-size:16px}
.shead .x{border:0;background:#0006;color:#fff;border-radius:8px;width:32px;height:32px;font-size:15px}
.stabs{display:flex;gap:4px;padding:6px;overflow-x:auto;background:#0a1624;touch-action:pan-x}
.stabs button{flex:0 0 auto;min-width:58px;border:2px solid #ffffff22;background:#ffffff0c;color:#cfe0f5;border-radius:10px;padding:5px 6px;font:600 10.5px 'Mali',sans-serif;display:flex;flex-direction:column;align-items:center;gap:1px}
.stabs button span{font-size:19px}
.stabs button.on{background:var(--btn);color:#2a1d0c;border-color:#fff8}
.sbody{flex:1;overflow-y:auto;padding:10px;touch-action:pan-y}
.sheet .sub{color:#9fb6d2}
.sheet .row{border-color:#ffffff22}
.sheet .row small{color:#9fb6d2}
.sheet .tabs button{border-color:#ffffff33;color:#e3eefc}
.sheet .tabs button.on{color:#2a1d0c}
.sheet .pill,.sheet .statBox{background:#ffffff10;border-color:#ffffff2a;color:#eef4ff}
.sheet h4{margin:12px 0 4px;color:var(--gold)}
.itemGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:6px 0}
.itemGrid.o3{grid-template-columns:repeat(3,1fr)}
.item{min-height:76px;border:2px solid #ffffff2a;border-radius:10px;background:#ffffff12;padding:4px 2px;text-align:center;color:inherit;font:600 10.5px 'Mali',sans-serif;line-height:1.2}
.card .item{border-color:var(--line);background:var(--cell);color:var(--ink)}
.item b{font-size:24px;display:block;font-weight:400}
.item.tool{border-color:var(--gold)}.item.on{border-color:var(--btn);background:#f2a90044}
.item .tier{color:#e9c46a;font-size:9.5px}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}
.statBox{border:2px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12px}
.statBox b{display:block;font-size:15px}
.meter{height:7px;background:#0004;border-radius:6px;overflow:hidden;margin-top:5px;min-width:60px}
.meter i{display:block;height:100%}
.quest{border:2px solid #ffffff2a;border-radius:10px;padding:8px 10px;margin:7px 0;background:#ffffff0d}
.qbar{height:7px;background:#0005;border-radius:5px;overflow:hidden;margin:6px 0}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#e9c46a,#f2a900)}
.qrow{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.qrow button{padding:6px 10px;border:0;border-radius:9px;background:#3fbf6a;color:#052;font:700 12px 'Mali',sans-serif}
.minimap{width:100%;height:auto;border:3px solid var(--gold);border-radius:10px;image-rendering:pixelated;background:#000}
.lbl2{font-size:12px;color:#9fb6d2;margin-top:6px}
.sw{display:flex;gap:8px;margin:5px 0 8px;flex-wrap:wrap}
.sw i{width:28px;height:28px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 2px #ffffff55;display:block}
.sw i.on{border-color:#fff}
.ftrack{position:relative;width:64px;height:230px;background:linear-gradient(#5fb4e0,#1f6f9a);border:3px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.fzone{position:absolute;left:3px;right:3px;background:#e5533dcc;border-radius:6px;transition:background .1s}.fzone.in{background:#3fbf6add}
.ffish{position:absolute;left:50%;transform:translateX(-50%);font-size:24px;line-height:1}
.frow{display:flex;gap:10px;justify-content:center}
.fprog{position:relative;width:16px;height:230px;border:3px solid var(--line);border-radius:8px;background:#0003;overflow:hidden;display:flex;align-items:flex-end}
.fprog i{display:block;width:100%;background:#3fbf6a}
/* title */
#title{position:absolute;inset:0;z-index:9;background:linear-gradient(#f6c667 0,#f3a64a 30%,#2c6b3f 30%,#1d3a2a 100%);display:flex;align-items:flex-start;justify-content:center;overflow:auto;touch-action:pan-y;padding:12px 0}
#title .card{margin:8px 0;max-height:none;text-align:center;width:min(94%,400px)}
#title h1{margin:0;font-size:28px;color:#b3261e}
#title .tag{font-size:12.5px;color:var(--dim);margin-bottom:8px}
#title .sw{justify-content:center}
#title .sw i{box-shadow:0 0 0 2px var(--line)}#title .sw i.on{border-color:var(--ink)}
.seg{display:flex;gap:8px;margin:6px 0}
.seg button{flex:1;padding:9px 4px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);font:700 13.5px 'Mali',sans-serif}
.seg button.on{background:var(--btn);border-color:var(--btn);color:var(--btnink)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:0 0 auto;padding:6px 9px;font-size:12px}
.inp{width:100%;padding:9px;border-radius:10px;border:2px solid var(--line);background:#fff3;color:var(--ink);font:600 15px 'Mali',sans-serif;text-align:center;-webkit-user-select:text;user-select:text;margin:4px 0}
.lbl{font-size:12.5px;color:var(--dim);margin-top:6px;text-align:left}
.upload{display:flex;gap:8px;align-items:center;font-size:12px}.upload input{flex:1;min-width:0;font-size:11px}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div id="hud"><div id="hudTop"></div><div class="mini"><i id="hpFill"></i></div><div class="mini"><i id="barFill"></i></div></div>
<div id="qbtns"><button class="round" id="bQuest" aria-label="ภารกิจ">📜</button><button class="round" id="bMap" aria-label="แผนที่">🗺️</button><button class="round" id="menuBtn" aria-label="เมนู">☰</button></div>
<div id="toast"></div>
<div id="joy"><div id="knob"></div></div>
<button id="btnA" class="round">ทำ</button>
<div id="tools"></div>
<div id="fade"></div>
<div id="modal"></div>
<div id="title">
  <div class="card">
    <h1>บ้านสวนสุขใจ</h1>
    <div class="tag">ปลูกผัก เลี้ยงสัตว์ ตกปลา ลงเหมือง ผูกมิตร และจีบใครสักคนในหมู่บ้านไทย</div>
    <input id="nameIn" class="inp" maxlength="10" value="ใจดี" aria-label="ชื่อตัวละคร">
    <input id="farmIn" class="inp" maxlength="14" value="ไร่สุขใจ" aria-label="ชื่อไร่">
    <div class="seg" id="gSeg"><button data-g="f" class="on">หญิง</button><button data-g="m">ชาย</button></div>
    <canvas id="prev" width="110" height="130"></canvas>
    <div class="lbl">ทรงผม</div><div class="seg wrap" id="hsSeg"></div>
    <div class="lbl">สีผม</div><div class="sw" id="swHair"></div>
    <div class="lbl">สีเสื้อ</div><div class="sw" id="swShirt"></div>
    <div class="lbl">สีผิว</div><div class="sw" id="swSkin"></div>
    <div class="seg" id="hatSeg"><button data-h="1" class="on">หมวกฟาง</button><button data-h="0">ไม่ใส่หมวก</button></div>
    <div class="lbl">ชุดเริ่มต้น</div><div class="seg" id="fitSeg"><button data-f="casual" class="on">ลำลอง</button><button data-f="mohom">ชาวนา (หม้อฮ่อม)</button></div>
    <div class="lbl">สัตว์เลี้ยง</div><div class="seg" id="petSeg"><button data-p="dog" class="on">🐕 สุนัข</button><button data-p="cat">🐈 แมว</button></div>
    <div class="lbl">ภาพตัวละครของคุณ (ถ้ามีไฟล์ PNG/JPG ใส่ได้)</div><div class="upload"><input id="avatarIn" type="file" accept="image/png,image/jpeg,image/webp"><button class="b alt" id="avatarClear" style="margin:0;width:auto;padding:6px 10px">ล้าง</button></div>
    <button class="b" id="startBtn" style="text-align:center">เริ่มเกมใหม่</button>
    <button class="b alt" id="contBtn" style="text-align:center;display:none">เล่นต่อจากที่บันทึก</button>
    <button class="b alt" id="impBtn" style="text-align:center">⬆️ นำเข้าไฟล์เซฟ</button>
  </div>
</div>
</div>
<script>
(()=>{
const TS=32, MW=64, MH=48, SAVE='baan_suan_sukjai_v2', SL=28;
const $=s=>document.querySelector(s);
const cv=$('#game'), g=cv.getContext('2d'), M=$('#modal');
let W=0,H=0,Z=1,DPR=1;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in (attrs||{})){const v=attrs[k];if(k==='onclick')e.addEventListener('click',v);else if(k==='class')e.className=v;else if(k==='disabled'||k==='checked'||k==='selected'||k==='value')e[k]=v;else if(k==='style')e.style.cssText=v;else e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let toastT=0;
function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms||2200)}

/* ---------- audio ---------- */
let AC=null;const OPT={music:.25,sfx:.6,vib:1,saver:0,night:1};
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,when,vol){const a=ac();if(!a||!vol)return;const o=a.createOscillator(),gn=a.createGain();o.type=type||'square';o.frequency.value=f;const t0=a.currentTime+(when||0);gn.gain.setValueAtTime(Math.max(.0002,v*vol),t0);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(gn);gn.connect(a.destination);o.start(t0);o.stop(t0+d+.03)}
const SFX={tap:[[660,.05]],coin:[[988,.07],[1319,.12]],hoe:[[120,.1,'sawtooth']],water:[[500,.05,'sine'],[400,.08,'sine']],chop:[[150,.08,'sawtooth'],[110,.08,'sawtooth']],pick:[[900,.04],[600,.06]],harvest:[[523,.06],[784,.1]],splash:[[300,.15,'sine'],[220,.12,'sine']],heart:[[784,.08,'sine'],[1047,.15,'sine']],level:[[523,.1],[659,.1],[784,.1],[1047,.22]],hurt:[[110,.2,'sawtooth']],err:[[200,.12]],bite:[[880,.08],[880,.08],[1180,.14]],sword:[[300,.05,'sawtooth'],[200,.07,'sawtooth']]};
function sfx(n){const s=SFX[n];if(!s||!OPT.sfx)return;let t=0;s.forEach(x=>{tone(x[0],x[1],x[2]||'square',.1,t,OPT.sfx);t+=x[1]*.9})}
function buzz(ms){try{if(OPT.vib&&navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
const PENTA=[262,294,330,392,440,523,588,660];
setInterval(()=>{if(!OPT.music||!window._started||window._paused)return;const n=PENTA[Math.floor(Math.random()*PENTA.length)];tone(n,.9,'sine',.07,0,OPT.music);if(Math.random()<.3)tone(n/2,1.2,'sine',.05,.1,OPT.music)},700);

/* ---------- calendar ---------- */
const SEASONS=['ฤดูร้อน','ฤดูฝน','ฤดูหนาว'],SIC=['☀️','🌧️','❄️'],DAYN=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'];
const FEST=[{s:0,d:13,k:'songkran',n:'สงกรานต์',ic:'💦'},{s:1,d:14,k:'harvest',n:'งานบุญข้าวใหม่ ประกวดผลผลิต',ic:'🌾'},{s:2,d:15,k:'loy',n:'ลอยกระทง',ic:'🪷'}];

/* ---------- crops, fish, forage, items ---------- */
const CROPS={
 kang:{n:'ผักบุ้ง',d:2,sell:14,seed:6,s:[0,1,2],fruit:'#2e9b3f',ic:'🥬'},
 chili:{n:'พริก',d:4,reg:2,sell:32,seed:15,s:[0,1],fruit:'#e53935',ic:'🌶️'},
 brinjal:{n:'มะเขือ',d:4,reg:2,sell:26,seed:12,s:[0,1],fruit:'#7e57c2',ic:'🍆'},
 corn:{n:'ข้าวโพด',d:6,reg:3,sell:48,seed:25,s:[0,1],fruit:'#fdd835',ic:'🌽'},
 papaya:{n:'มะละกอ',d:6,sell:60,seed:30,s:[0,1],fruit:'#ff9a3c',ic:'🍈'},
 rice:{n:'ข้าว',d:7,sell:50,seed:22,s:[1],fruit:'#e6c04a',ic:'🌾'},
 pumpkin:{n:'ฟักทอง',d:8,sell:90,seed:45,s:[1,2],fruit:'#fb8c00',ic:'🎃'},
 cabbage:{n:'กะหล่ำปลี',d:5,sell:44,seed:20,s:[2],fruit:'#b5e07a',ic:'🥬'},
 mari:{n:'ดาวเรือง',d:4,sell:34,seed:14,s:[0,2],fruit:'#ffb300',ic:'🌼'},
 strawb:{n:'สตรอว์เบอร์รี',d:6,reg:3,sell:62,seed:35,s:[2],fruit:'#ef3b5a',ic:'🍓'}
};
const FISH={
 chon:{n:'ปลาช่อน',ic:'🐟',sell:60,zone:['lake','pond'],diff:35,w:10},
 duk:{n:'ปลาดุก',ic:'🐟',sell:45,zone:['lake','pond'],diff:30,w:10},
 nin:{n:'ปลานิล',ic:'🐠',sell:40,zone:['lake','pond'],diff:25,w:12},
 thap:{n:'ปลาทับทิม',ic:'🐠',sell:85,zone:['lake'],diff:45,w:6,s:[0,1]},
 krai:{n:'ปลากราย',ic:'🐟',sell:140,zone:['lake'],diff:60,w:4,lv:3},

function isSolid(x,y){
 if(x<0||y<0||x>=MW||y>=MH)return true;

}

function findPath(sx,sy,tx,ty){

  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const n=ny*MW+nx;if(prev[n]!==-1||isSolid(nx,ny))continue;prev[n]=c;q.push(n)}}

}

 if(scene==='i')return x<0||y<0||x>=curInt.w||y>=curInt.h||curInt.sol[y][x]===1;
 return x<0||y<0||x>=MINE.w||y>=MINE.h||MINE.g[y][x]==='#'||MINE.rocks.some(r=>r.hp>0&&r.x===x&&r.y===y);
}
function pxSolid(px,py){return curSolid(Math.floor(px/TS),Math.floor(py/TS))}
function free(x,y){return!(pxSolid(x-7,y-6)||pxSolid(x+7,y-6)||pxSolid(x-7,y+2)||pxSolid(x+7,y+2))}
function tryMove(dx,dy){if(free(P.x+dx,P.y))P.x+=dx;if(free(P.x,P.y+dy))P.y+=dy}

function qEvent(ev,n,key){
 n=n||1;S.stat[ev]=(S.stat[ev]||0)+n;
 S.daily.forEach(q=>{if(q.ev===ev&&!q.done)q.c=Math.min(q.n,q.c+n)});
 const m=MAINQ[S.mq];if(!m)return;
 if(m.ev===ev||m.ev==='talk:'+key&&ev==='talk'){S.q.main=Math.min(m.n,(S.q.main||0)+n)}
 if(m.ev==='floor'&&ev==='floor'){S.q.main=Math.max(S.q.main||0,key)}
 if(m.ev==='talkdist'&&ev==='talk'){S.talkedSet[key]=1;S.q.main=Math.min(m.n,Object.keys(S.talkedSet).length)}
 if(m.ev==='hearts8'&&ev==='hearts'){if(key>=8)S.q.main=1}
}

function nextLoc(n){
 const hr=S.min/60,x=NX[n.id],fe=festToday();
 if(fe&&hr>=10&&hr<22&&x.home!=='grocery'&&x.home!=='clothes')return 'plaza';
 let loc=x.sched[0][1];x.sched.forEach(s=>{if(hr>=s[0])loc=s[1]});
 if(hr>=22&&x.home)loc=(n.id==='daeng'||n.id==='laddaa')?loc:'home';
 if(S.rain&&!loc.startsWith('in:')&&loc!=='home'&&x.home&&n.id!=='tian'&&hr>=7)loc='home';
 return loc;
}
function locTarget(loc,n){
 if(loc==='home'){const b=BID[S.spouse===n.id?'player':NX[n.id].home];return{b,tx:b.d,ty:b.y2+1}}
 if(loc.startsWith('in:')){const b=BID[loc.slice(3)];return{b,tx:b.d,ty:b.y2+1}}
 const l=LOC[loc];return{b:null,tx:Math.floor(l[0]),ty:Math.floor(l[1]),fx:l[0]*TS,fy:l[1]*TS}
}
function updateNPCs(dt){
 NPCS.forEach(n=>{
  const r=S.npcR[n.id],loc=nextLoc(n);
  if(r.loc!==loc){r.loc=loc;r.path=null;r.arrived=false}
  const tg=locTarget(loc,n);const homeId=tg.b?tg.b.id:null;
  if(tg.b&&r.inside===tg.b.id)return;
  if(r.inside&&(!tg.b||r.inside!==tg.b.id)){const ib=BID[r.inside];r.x=(ib.d+.5)*TS+8;r.y=(ib.y2+1.6)*TS;r.inside=null;r.path=null}
  if(!r.path){const sx=Math.floor(r.x/TS),sy=Math.floor((r.y-4)/TS);r.path=findPath(sx,sy,tg.tx,tg.ty)||[];r.pi=0}
  if(r.path.length&&r.pi<r.path.length){const [cx,cy]=r.path[r.pi],tx=(cx+.5)*TS,ty=(cy+.9)*TS,dx=tx-r.x,dy=ty-r.y,d=Math.hypot(dx,dy);r.moving=true;
   if(d<3)r.pi++;else{const sp=54*dt;r.x+=dx/d*Math.min(sp,d);r.y+=dy/d*Math.min(sp,d);r.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'l':'r'):(dy<0?'u':'d')}}
  else{r.moving=false;if(tg.b){r.inside=tg.b.id}else if(tg.fx){const dx=tg.fx-r.x,dy=tg.fy-r.y,d=Math.hypot(dx,dy);if(d>3){r.x+=dx/d*Math.min(40*dt,d);r.y+=dy/d*Math.min(40*dt,d);r.moving=true}}}
 });
}

 if(scene==='w'){if(Math.hypot(P.x-p.x,P.y-p.y)>200){p.tx=P.x+(Math.random()*60-30);p.ty=P.y+10}else if(Math.hypot(p.tx-p.x,p.ty-p.y)<4&&Math.random()<dt*.4){p.tx=p.x+(Math.random()*90-45);p.ty=p.y+(Math.random()*60-30)}

function pickFish(zone){

 let tot=pool.reduce((a,[,f])=>a+f.w*(f.legend?1+luck()*.02:1),0),r=Math.random()*tot;

/* ---------- mine ---------- */
function enterMine(fl){
 const w=30,hh=22,r=rng(fl*131+S.day*7);const gg=[];
 for(let y=0;y<hh;y++){gg.push([]);for(let x=0;x<w;x++)gg[y].push(x===0||y===0||x===w-1||y===hh-1?'#':'.')}
 for(let i=0;i<40;i++){const x=1+Math.floor(r()*(w-2)),y=1+Math.floor(r()*(hh-2));if(y<hh-5&&Math.abs(x-w/2)>2||y<hh-5)gg[y][x]=r()<.5?'#':'.'}
 for(let y=hh-4;y<hh-1;y++)for(let x=w/2-3;x<=w/2+3;x++)gg[y][x]='.';
 gg[hh-2][Math.floor(w/2)]='<';
 const rocks=[],mons=[];const occupied=(x,y)=>gg[y][x]!=='.'||rocks.some(q=>q.x===x&&q.y===y);
 const nr=16+Math.floor(r()*8);
 for(let i=0;i<nr;i++){const x=1+Math.floor(r()*(w-2)),y=1+Math.floor(r()*(hh-7));if(occupied(x,y))continue;const o=r();let ore=null;if(o<.25){ore=fl<6?'ore:copper':fl<12?(r()<.4?'ore:copper':'ore:iron'):(r()<.5?'ore:iron':'ore:gold')}rocks.push({x,y,hp:2,ore})}
 if(rocks.length)rocks[0].ladder=1;
 const nm=3+Math.min(6,Math.floor(fl/2));
 for(let i=0;i<nm;i++){const x=2+Math.floor(r()*(w-4)),y=2+Math.floor(r()*(hh-9));if(gg[y][x]!=='.')continue;const t=fl<4?(r()<.7?'slime':'bat'):(r()<.4?'slime':r()<.6?'bat':'khamod');mons.push({t,x:(x+.5)*TS,y:(y+.9)*TS,hp:t==='slime'?4+Math.floor(fl/3):t==='bat'?3+Math.floor(fl/3):6+Math.floor(fl/2),mhp:0,hit:0,cd:0});mons[mons.length-1].mhp=mons[mons.length-1].hp}
 MINE={fl,w,h:hh,g:gg,rocks,mons,swing:0,cool:0,inv:0};
 toScene('m');P.x=(w/2+.5)*TS;P.y=(hh-2)*TS+8;S.mineMax=Math.max(S.mineMax,fl);qEvent('floor',1,fl);
 toast('เหมืองชั้น '+fl+(fl%5===0?' ⭐ จุดบันทึก':''));if(fl>1)save();
}
function leaveMine(){MINE=null;toScene('w');P.x=(58+1)*TS;P.y=29*TS+16;P.dir='d';save()}
function mineAct(){
 const m=MINE,d=DV[P.dir],t=target();
 const cell=(m.g[Math.floor((P.y-4)/TS)]||[])[Math.floor(P.x/TS)];
 if(cell==='<'){if(m.fl>1){return enterMine(m.fl-1)}return leaveMine()}
 if(cell==='>')return enterMine(m.fl+1);
 const tool=TOOLS[S.hotbar].id;
 if(tool==='pick'||tool==='axe'||tool==='hoe'){
  const r=m.rocks.find(q=>q.hp>0&&q.x===t.x&&q.y===t.y);
  if(r){if(!useEnergy(cost(2,'pick')))return;r.hp-=1+tTier('pick')*.6;sfx('pick');floatTxt('⛏️');
   if(r.hp<=0){addInv('stone',1+Math.floor(Math.random()*2));if(r.ore){const n=1+(Math.random()<.2+lvOf('mine')*.04?1:0);addInv(r.ore,n);floatTxt('+'+iname(r.ore))}addXP('mine',r.ore?12:5);qEvent('mine');if(r.ladder)m.g[r.y][r.x]='>';}return}
  return toast('เล็งไปที่ก้อนหิน แล้วกดทำ');
 }
 if(tool==='sword'||true){
  if(m.cool>0)return;if(S.energy>0&&tool==='sword')S.energy-=.5;m.cool=.35;m.swing=.25;sfx('sword');
  m.mons.forEach(o=>{if(o.hp<=0)return;const dx=o.x-P.x,dy=(o.y-8)-(P.y-8),dist=Math.hypot(dx,dy);if(dist<44&&(dx*d[0]+dy*d[1])>-6){const dmg=tool==='sword'?atk():1;o.hp-=dmg;o.hit=.25;floatTxt('-'+dmg);if(o.hp<=0){const loot={slime:'slime',bat:'wing',khamod:'khamod'}[o.t];if(Math.random()<.6)addInv(loot,1);addXP('mine',10);S.stat.kill=(S.stat.kill||0)+1}}});
 }
}
function updateMine(dt){
 const m=MINE;m.cool=Math.max(0,m.cool-dt);m.swing=Math.max(0,m.swing-dt);m.inv=Math.max(0,m.inv-dt);
 m.mons.forEach(o=>{if(o.hp<=0)return;o.hit=Math.max(0,o.hit-dt);const dx=P.x-o.x,dy=P.y-o.y,d=Math.hypot(dx,dy);
  if(d<170){const sp=(o.t==='bat'?62:o.t==='khamod'?38:28)*(o.hit>0?0:1)*dt;const nx=o.x+dx/d*sp,ny=o.y+dy/d*sp;if(o.t==='bat'||o.t==='khamod'||!pxSolid(nx,ny)){o.x=nx;o.y=ny}}
  if(d<20&&m.inv<=0){const dmg=Math.max(1,(o.t==='slime'?6:o.t==='bat'?5:9)-defn());S.hp-=dmg;m.inv=1;sfx('hurt');buzz(120);floatTxt('-'+dmg+' HP');if(S.hp<=0){faint('ถูกมอนสเตอร์ในเหมืองจนสลบ… ใบเตยพาไปรักษาที่คลินิก')}}});
}

function sleepNow(forced,msg){
 paused=true;const f=$('#fade');f.classList.add('on');
 setTimeout(()=>{
  const [shipN,shipV]=ship();
  const prev=season();
  const spr=[];for(const k in S.placed)if(S.placed[k]==='sprinkler'){const [sx,sy]=k.split(',').map(Number);for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const q=S.soil[(sx+dx)+','+(sy+dy)];if(q)q.w=true}}
  for(const k in S.soil){const s=S.soil[k];if(s.c&&s.w){s.c.d+=1+(s.f?1:0)}s.w=false}
  S.animals.forEach(a=>{if(a.fed){a.p=true}a.fed=false;a.hungry=true});
  for(const k in S.stump){S.stump[k]--;if(S.stump[k]<=0)delete S.stump[k]}
  if(S.pet)S.pet.fed=false;
  S.day++;S.min=360;S.energy=forced?Math.floor(maxEn()*.5):maxEn();S.hp=maxHp();S.blessed=false;S.fishing=null;
  const ns=season();let msg2='เช้าวันใหม่ วัน'+DAYN[dow()]+'ที่ '+dayIn()+' '+SEASONS[ns];
  if(ns!==prev){let w=0;for(const k in S.soil){const s=S.soil[k];if(s.c&&!CROPS[s.c.t].s.includes(ns)){s.c=null;w++}}msg2='เข้าสู่'+SEASONS[ns]+'แล้ว'+(w?' พืชที่ผิดฤดูเหี่ยวไป '+w+' ต้น':'')}
  S.rain=Math.random()<(ns===1?.6:.1);
  if(S.rain){for(const k in S.soil)S.soil[k].w=true;msg2+=' • ฝนตก'}
  if(S.spouse){const sp=NPC[S.spouse];const ks=Object.keys(S.soil).filter(k=>!S.soil[k].w);let n=0;ks.slice(0,6).forEach(k=>{S.soil[k].w=true;n++});if(n)msg2+=' • '+sp.name+'ช่วยรดน้ำให้ '+n+' แปลง'}
  Object.values(S.npc).forEach(n=>{n.talked=false;n.gifted=false});
  initNPCR();spawnWeeds();spawnForage();newDaily();checkBirthday();
  scene='w';P.x=16.5*TS;P.y=20.6*TS;P.dir='d';curInt=null;
  save();f.classList.remove('on');paused=false;
  const parts=[];if(msg)parts.push(msg);if(shipN)parts.push('ขายของจากลังได้ ฿'+shipV+' ('+shipN+' ชิ้น)');parts.push(msg2);
  toast(parts.join('\n'),4200);if(shipV)sfx('coin');
 },750);
}

function update(dt){
 time+=dt;
 floats.forEach(f=>f.t-=dt*.8);floats=floats.filter(f=>f.t>0);
 if(!started||!S)return;
 updateAnimals(dt);
 if(paused)return;
 if(scene!=='m'){S.min+=dt*2.4*(OPT.saver?1:1)}
 else S.min+=dt*1.2;
 if(S.min>=1560){sleepNow(true,'ดึกแล้ว คุณหมดสติไปกลางทาง…');return}
 checkBuff();updateNPCs(dt);updatePet(dt);updateFishing(dt);
 if(scene==='m')updateMine(dt);
 if(!S.blessedInit)S.blessedInit=1;
 checkCutscene();
 let mx=joy.dx,my=joy.dy;
 if(keys.ArrowLeft||keys.KeyA)mx-=1;if(keys.ArrowRight||keys.KeyD)mx+=1;if(keys.ArrowUp||keys.KeyW)my-=1;if(keys.ArrowDown||keys.KeyS)my+=1;
 const m=Math.hypot(mx,my);
 if(m>.22){if(m>1){mx/=m;my/=m}P.moving=true;P.t+=dt;if(Math.abs(mx)>Math.abs(my))P.dir=mx<0?'l':'r';else P.dir=my<0?'u':'d';
  tryMove(mx*spd()*dt,my*spd()*dt);if(S.fishing&&S.fishing.t>.5&&m>.5)S.fishing=null}
 else P.moving=false;
 if(scene==='i'&&curInt&&P.y>(curInt.h-1)*TS+4&&P.x>curInt.ex*TS&&P.x<(curInt.ex+2)*TS)leaveInt();
 if(scene==='w'&&ground[Math.floor((P.y-4)/TS)]&&ground[Math.floor((P.y-4)/TS)][Math.floor(P.x/TS)]===5){S.energy=Math.min(maxEn(),S.energy+dt*3);S.hp=Math.min(maxHp(),S.hp+dt*2);if(!S._sp||time-S._sp>3){S._sp=time;floatTxt('♨️ ผ่อนคลาย')}}
}

  let ic=t.ic,lb=t.n;
  if(t.id==='seed'){if(S.placeSel){ic=PLACE_N[S.placeSel][1];lb=PLACE_N[S.placeSel][0]}else{const c=CROPS[S.seedSel];ic='🌱';lb=c.n+'×'+(S.inv['seed:'+S.seedSel]||0)}}
  if(t.id==='can')lb='💧'+S.water;
  const b=h('button',{class:S.hotbar===i?'sel':''},h('b',{},ic),lb);b.addEventListener('pointerdown',e=>{e.preventDefault();pickTool(i)});return b}));
}
function pickTool(i){if(!S||paused)return;if(TOOLS[i].id==='seed'&&S.hotbar===i){if(S.placeSel)S.placeSel=null;else cycleSeed()}S.hotbar=i;updTools();sfx('tap')}
function hud(){if(!S)return;const hr=Math.floor(S.min/60)%24,mn=Math.floor(S.min%60/10)*10;
 $('#hudTop').textContent=`${S.rain?'🌧':SIC[season()]} ${DAYN[dow()]} ${dayIn()}\n🕒 ${String(hr).padStart(2,'0')}:${String(mn).padStart(2,'0')}   🪙 ${S.money}`+(scene==='m'?`\n⛏ ชั้น ${MINE.fl}`:'')+(S.buff?'\n✨ บัฟ':'')+(S.blessed?'\n🙏 โชคดี':'');
 $('#hudTop').style.whiteSpace='pre';
 const f=$('#barFill');f.style.width=clamp(S.energy/maxEn()*100,0,100)+'%';f.style.background=S.energy<30?'#e5533d':'#7ed957';
 $('#hpFill').style.width=clamp(S.hp/maxHp()*100,0,100)+'%';
 const a=$('#btnA');a.textContent=scene==='m'?'ฟัน/ทุบ':S.fishing?(S.fishing.bite?'ดึง!':'รอ…'):'ทำ';
}

/* ---------- loop & resize ---------- */
let last=0;
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(S){update(dt);render()}requestAnimationFrame(frame)}
setInterval(()=>{hud()},250);
function resize(){DPR=OPT.saver?1:Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth*DPR;H=cv.clientHeight*DPR;cv.width=W;cv.height=H;Z=Math.max(.8,Math.min(cv.clientWidth,cv.clientHeight)/(TS*9.5));g.imageSmoothingEnabled=false}
window.addEventListener('resize',resize);

/* ---------- input ---------- */
const jEl=$('#joy'),knob=$('#knob');
function jupd(e){const r=jEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy),mx=r.width/2-8;if(m>mx){dx*=mx/m;dy*=mx/m}knob.style.transform=`translate(${dx}px,${dy}px)`;joy.dx=dx/mx;joy.dy=dy/mx}
jEl.addEventListener('pointerdown',e=>{e.preventDefault();joy.id=e.pointerId;jEl.setPointerCapture(e.pointerId);jupd(e)});
jEl.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)jupd(e)});
const jend=e=>{if(e.pointerId===joy.id)resetJoy()};
jEl.addEventListener('pointerup',jend);jEl.addEventListener('pointercancel',jend);
$('#btnA').addEventListener('pointerdown',e=>{e.preventDefault();ac();act()});
const openMenu=t=>e=>{e.preventDefault();ac();if(!started)return;if(paused&&M.classList.contains('on')){return}menu(t)};
$('#menuBtn').addEventListener('pointerdown',openMenu('bag'));$('#bQuest').addEventListener('pointerdown',openMenu('quest'));$('#bMap').addEventListener('pointerdown',openMenu('map'));
addEventListener('keydown',e=>{keys[e.code]=true;if(!started)return;
 if(e.code==='Space'||e.code==='KeyE'||e.code==='Enter'){e.preventDefault();if(M.classList.contains('bottom')&&M.firstChild)M.firstChild.click();else if(!M.classList.contains('on'))act()}
 if(!paused&&e.code.startsWith('Digit')){const n=+e.code.slice(5)-1;if(n>=0&&n<TOOLS.length)pickTool(n)}
 if(e.code==='Escape'){if(M.classList.contains('on'))closeM();else menu('bag')}
 if(e.code==='KeyI'&&!paused)menu('bag');if(e.code==='KeyM'&&!paused)menu('map');if(e.code==='KeyQ'&&!paused)menu('quest')});
addEventListener('keyup',e=>{keys[e.code]=false});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&started)save()});
addEventListener('pagehide',()=>{if(S&&started)save()});

/* ---------- title screen ---------- */
const look={hair:HAIRS[1],shirt:SHIRTS[0],skin:SKINS[0],hat:1,hs:'long',pants:PANTS[0]};let gen='f',startFit='casual',petSel='dog';
function prev(){const c=$('#prev').getContext('2d');c.clearRect(0,0,110,130);c.fillStyle='#7fb15b';c.fillRect(0,106,110,24);
 person(c,55,118,{hair:look.hair,skin:look.skin,shirt:look.shirt,pants:look.pants,g:gen,hs:look.hs,hat:look.hat,fit:startFit},'d',0,4.5)}
function swatches(id,arr,key){const el=$(id);el.replaceChildren(...arr.map(c=>{const i=h('i',{style:'background:'+c,class:look[key]===c?'on':''});i.addEventListener('click',()=>{look[key]=c;[...el.children].forEach(x=>x.classList.remove('on'));i.classList.add('on');prev()});return i}))}
swatches('#swHair',HAIRS,'hair');swatches('#swShirt',SHIRTS,'shirt');swatches('#swSkin',SKINS,'skin');
$('#hsSeg').replaceChildren(...HAIRSTY.map(([k,n])=>h('button',{'data-k':k,class:look.hs===k?'on':'',onclick:function(){look.hs=k;[...$('#hsSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.k===k));prev()}},n)));
const seg=(id,fn)=>$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;fn(b);[...$(id).children].forEach(x=>x.classList.toggle('on',x===b));prev()});
seg('#gSeg',b=>{gen=b.dataset.g;look.hs=gen==='f'?'long':'short';[...$('#hsSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.k===look.hs))});
seg('#hatSeg',b=>{look.hat=+b.dataset.h});seg('#fitSeg',b=>{startFit=b.dataset.f});seg('#petSeg',b=>{petSel=b.dataset.p});
$('#avatarIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{window._avatarData=r.result;toast('เลือกภาพตัวละครแล้ว ✓')};r.readAsDataURL(f)});
$('#avatarClear').addEventListener('click',()=>{window._avatarData='';$('#avatarIn').value='';toast('ล้างภาพตัวละครแล้ว')});
function introCut(){
 document.head.append(h('style',{},'@keyframes ipop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}'));
 const ov=h('div',{style:'position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;font:600 17px Mali,sans-serif;padding:24px;transition:background 1s,opacity .6s;background:#0b1726'});document.body.append(ov);
 const sc=[['#0b1726','🚌','รถสองแถวคันสุดท้ายของวัน พา {p} ออกจากเมืองใหญ่...'],['linear-gradient(#f6c667,#f3a64a)','🌅','เช้าวันใหม่ที่หมู่บ้านสุขใจ อากาศหอมกลิ่นดินและต้นข้าว'],['linear-gradient(#9ad0f5,#6d9f62)','🏡','บ้านไม้หลังเก่ากับไร่ผืนเล็ก... มรดกที่ญาติห่างๆ ทิ้งไว้ให้ {p}']];let i=0;
 const ask=()=>{const rw=[['🌾 อยากลองทำไร่ทำสวนครับ/ค่ะ',()=>{S.inv['seed:chili']=(S.inv['seed:chili']||0)+6;S.inv['seed:kang']=(S.inv['seed:kang']||0)+6;return 'ดีมาก! ลุงแถมเมล็ดพันธุ์ให้ไปลองปลูกนะ (+เมล็ดพันธุ์)'}],
  ['🤝 อยากมีเพื่อนบ้านดีๆ',()=>{if(S.npc.chai)addPts('chai',60);return 'ที่นี่ใจดีกันทุกคนแหละ ลุงนับ {p} เป็นลูกหลานแล้วนะ (+มิตรภาพลุงชัย)'}],
  ['🌅 อยากพักผ่อนช้าๆ',()=>{S.money+=300;return 'งั้นเอาค่าขนมไปซื้อของกินที่ร้านป้าแดงนะ (+300 บาท)'}]];
  const box=h('div',{class:'dlg',style:'flex-direction:column'},h('div',{style:'display:flex;gap:12px'},portrait(NPC.chai.look,3),h('div',{class:'dtxt'},h('b',{},NPC.chai.name),h('p',{},fmt('แล้ว {p} ตัดสินใจย้ายมาอยู่บ้านสวนเพราะอะไรล่ะ?')))),
   rw.map(r=>h('button',{class:'b',onclick:()=>{sfx('coin');const m=r[1]();save();closeM();say(NPC.chai,[m,'ไร่ผืนนี้เป็นของ {p} แล้ว ที่แถบด้านล่างคือเครื่องมือ แตะเลือก แล้วกดปุ่ม "ทำ" ใช้งาน','มีภารกิจที่ปุ่ม 📜 ด้านบน เริ่มจากมาทักทายลุงที่ลานกลางหมู่บ้านนะ'],()=>toast('บ้านของคุณอยู่ใกล้ถนนทางใต้ • ไร่อยู่ทางใต้ของบ้าน',3500))}},r[0])));show(box,true)};
 const step=()=>{if(i>=sc.length){ov.style.opacity=0;setTimeout(()=>{ov.remove();say(NPC.chai,['ยินดีต้อนรับสู่หมู่บ้านสุขใจ {p}! ลุงชัยเป็นผู้ใหญ่บ้านเอง','ไร่ผืนนี้เคยเป็นของญาติห่างๆ ของเธอ...'],ask)},600);return}
  const s=sc[i++];ov.style.background=s[0];ov.replaceChildren(h('div',{style:'font-size:84px;animation:ipop .8s'},s[1]),h('p',{style:'max-width:320px;line-height:1.7;text-shadow:0 2px 6px #0008'},fmt(s[2])),h('small',{style:'opacity:.7;margin-top:18px'},'แตะเพื่อไปต่อ ▸'))};
 ov.addEventListener('click',()=>{sfx('tap');step()});step()}
function begin(fresh){
 $('#title').style.display='none';started=true;window._started=true;setPause(false);
 resize();updTools();hud();render();
 if(fresh){S.outfit=startFit;setPause(true);introCut()}
 else toast('ยินดีต้อนรับกลับ '+S.name);
}
$('#startBtn').addEventListener('click',e=>{e.preventDefault();ac();newGame({name:$('#nameIn').value.trim()||'ใจดี',farm:$('#farmIn').value.trim()||'ไร่สุขใจ',gender:gen,look:{...look},pet:petSel});S.outfit=startFit;save();begin(true)});
if(hasSave()){$('#contBtn').style.display='block';$('#contBtn').addEventListener('click',e=>{e.preventDefault();ac();if(loadSave())begin(false);else toast('ไม่พบข้อมูลบันทึก หรือเซฟเสียหาย')})}
$('#impBtn').addEventListener('click',e=>{e.preventDefault();impFile.click()});
try{if(sessionStorage.getItem('bsj_ac')&&hasSave()){sessionStorage.removeItem('bsj_ac');setTimeout(()=>$('#contBtn').click(),80)}}catch(e){}
loadOpt();resize();prev();updTools();requestAnimationFrame(frame);
window.__bsj={get S(){return S},P,act,menu,TS,get scene(){return scene},get paused(){return paused},enterBld,BID,NPCS,findPath,isSolid,sleepNow,MAINQ,update,render,closeM,toScene,enterMine,shop,fishGame,castRod,mkInt,LOC,NX,npcWorldPos,npcMenu,penMenu,binMenu,boardMenu,templeMenu,shrineMenu,festMenu,say,intAct,mineAct,get MINE(){return MINE},addInv,hearts,addPts,qEvent,nextLoc,reelStart,pickFish,FISH,CROPS,FEST,festToday,chestMenu,itemDetail,get curInt(){return curInt}};
})();
