<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1726">
<title>บ้านสวนสุขใจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1726;--panel:#fff3d6;--ink:#3a2814;--line:#c79a4b;--btn:#f2a900;--btnink:#2a1d0c;--pink:#e8749b;--dim:#8a7350;--glass:#16283bf2;--glass2:#0b1726f2;--gold:#f4d58a;--cell:#ffffff30;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#2b2116;--ink:#fdf1d6;--line:#7a5e2c;--dim:#bba37a;--cell:#ffffff14}}
:root[data-theme="dark"]{--panel:#2b2116;--ink:#fdf1d6;--line:#7a5e2c;--dim:#bba37a;--cell:#ffffff14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:'Mali','Noto Sans Thai',system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
#app{position:relative;width:100%;height:100%;overflow:hidden}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.round{position:absolute;border:3px solid var(--gold);border-radius:50%;background:linear-gradient(#1c3550,#0b1726);color:#fff;font:700 15px 'Mali',sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #0008;z-index:3}
.round:active{transform:translateY(2px)}
#qbtns{position:absolute;top:8px;right:8px;display:flex;gap:8px;z-index:3}
#qbtns button{position:static;width:44px;height:44px;font-size:20px;border-radius:12px}
#hud{position:absolute;top:8px;left:8px;background:linear-gradient(#16283bdf,#0b1726df);border:2px solid var(--gold);border-radius:12px;box-shadow:0 4px 0 #0008;color:#fff;padding:6px 10px;font-size:11.5px;line-height:1.45;min-width:132px;z-index:3}
.mini{height:8px;background:#fff3;border-radius:4px;margin-top:4px;overflow:hidden}
.mini i{display:block;height:100%;width:100%}
#barFill{background:#7ed957}#hpFill{background:#e5533d}
#toast{position:absolute;left:50%;top:21%;transform:translateX(-50%);background:#000d;color:#fff;padding:9px 15px;border-radius:14px;border:2px solid #fff3;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86%;text-align:center;white-space:pre-line;z-index:8}
#toast.on{opacity:1}
#joy{position:absolute;left:16px;bottom:112px;width:124px;height:124px;border-radius:50%;background:#0005;border:3px solid #fff6;z-index:3;touch-action:none}
#app.tapmode #joy,#app.tapmode #btnA{display:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fffb;box-shadow:0 2px 6px #0006}
#btnA{right:20px;bottom:124px;width:86px;height:86px;font-size:19px;background:linear-gradient(#ffd45a,#e99500);color:#3a2814;touch-action:none}
#tools{position:absolute;left:50%;bottom:calc(8px);transform:translateX(-50%);display:flex;gap:3px;padding:4px;background:linear-gradient(#16283bee,#071827ee);border:2px solid var(--gold);border-radius:12px;box-shadow:0 5px 0 #0008;z-index:3;max-width:100%}
#tools button{width:41px;height:56px;border-radius:8px;border:2px solid #ffffff44;background:#ffffff12;color:#fff;font:600 8.5px 'Mali',sans-serif;line-height:1.1;padding:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;white-space:nowrap}
#tools button b{font-size:20px;font-weight:400}
#tools button.sel{border-color:var(--btn);background:#f2a90066}
#app.layedit .lay{outline:2px dashed #ffd45a;outline-offset:3px;cursor:move;touch-action:none}
#app.layedit #mpTop,#app.layedit #mpTop *{pointer-events:auto}
#app.layedit #tools{outline:2px solid #8fa3b8;outline-offset:2px;opacity:.8}
#layBar{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:12;width:min(88%,330px);background:var(--panel);color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 6px 0 #0005,0 10px 26px #0007;text-align:center;font:600 13px 'Mali',sans-serif}
#layBar .sub{margin:2px 0 8px}#layBar .lr{display:flex;gap:8px}#layBar button{flex:1;padding:9px 6px;border:0;border-radius:10px;background:var(--btn);color:var(--btnink);font:700 13.5px 'Mali',sans-serif;box-shadow:0 3px 0 #0004}#layBar button.alt{background:transparent;border:2px solid var(--line);color:var(--ink);box-shadow:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:7}
#fade.on{opacity:1}
#modal{position:absolute;inset:0;display:none;z-index:6}
#modal.on{display:flex;align-items:center;justify-content:center;background:#0008}
#modal.bottom{align-items:flex-end;background:transparent}
.card,.sheet{background:var(--panel);color:var(--ink);border:3px solid var(--line);border-radius:14px;box-shadow:0 7px 0 #0005,0 12px 30px #0007}
.card{padding:14px;width:min(92%,390px);max-height:82%;overflow:auto;touch-action:pan-y}
.card h3{margin:0 0 4px;font-size:18px}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:6px;line-height:1.4}
.b{display:block;width:100%;margin:6px 0;padding:11px 12px;border:0;border-radius:10px;background:var(--btn);color:var(--btnink);font:600 14.5px 'Mali',sans-serif;text-align:left;box-shadow:0 3px 0 #0004}
.b:active{transform:translateY(2px);box-shadow:0 1px 0 #0004}
.b.alt{background:transparent;border:2px solid var(--line);color:var(--ink);box-shadow:none}
.b[disabled],.row button[disabled],.item[disabled]{opacity:.4}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px;white-space:pre-line}
.row>span{flex:1;line-height:1.35}
.row small{color:var(--dim);font-size:11px}
.row button{padding:7px 10px;border:0;border-radius:9px;background:var(--btn);color:var(--btnink);font:600 12.5px 'Mali',sans-serif;box-shadow:0 2px 0 #0004}
.row input[type=range]{flex:1;accent-color:var(--btn)}
.tabs{display:flex;gap:6px;margin:6px 0}
.tabs button{flex:1;padding:8px 4px;border-radius:9px;border:2px solid var(--line);background:transparent;color:var(--ink);font:600 12.5px 'Mali',sans-serif}
.tabs button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.tabs.sm{flex-wrap:wrap}.tabs.sm button{flex:0 0 auto;padding:6px 10px;font-size:12px}
.dlg{background:var(--panel);color:var(--ink);border:3px solid var(--line);border-radius:16px 16px 0 0;width:100%;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:flex-start;min-height:124px}
.dlg canvas,.ncard canvas,.row canvas{flex:none;background:#0002;border-radius:10px}
.dtxt{flex:1;font-size:15px;line-height:1.5}
.dtxt p{margin:2px 0 6px}
.dtxt small{color:var(--dim)}
.ncard{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.hearts{color:var(--pink);letter-spacing:1px;font-size:14px}
.pill{background:var(--cell);border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;margin:6px 0}
/* stardew-style sheet */
.sheet{width:min(96%,430px);height:min(92%,720px);display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(#17304a,#0b1726);color:#eef4ff;border-color:var(--gold)}
.shead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:linear-gradient(#27496d,#18324d);border-bottom:2px solid var(--gold)}
.shead b{font-size:16px}
.shead .x{border:0;background:#0006;color:#fff;border-radius:8px;width:32px;height:32px;font-size:15px}
.stabs{display:flex;gap:4px;padding:6px;overflow-x:auto;background:#0a1624;touch-action:pan-x}
.stabs button{flex:0 0 auto;min-width:58px;border:2px solid #ffffff22;background:#ffffff0c;color:#cfe0f5;border-radius:10px;padding:5px 6px;font:600 10.5px 'Mali',sans-serif;display:flex;flex-direction:column;align-items:center;gap:1px}
.stabs button span{font-size:19px}
.stabs button.on{background:var(--btn);color:#2a1d0c;border-color:#fff8}
.sbody{flex:1;overflow-y:auto;padding:10px;touch-action:pan-y}
.sheet .sub{color:#9fb6d2}
.sheet .row{border-color:#ffffff22}
.sheet .row small{color:#9fb6d2}
.sheet .tabs button{border-color:#ffffff33;color:#e3eefc}
.sheet .tabs button.on{color:#2a1d0c}
.sheet .pill,.sheet .statBox{background:#ffffff10;border-color:#ffffff2a;color:#eef4ff}
.sheet h4{margin:12px 0 4px;color:var(--gold)}
.itemGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:6px 0}
.itemGrid.o3{grid-template-columns:repeat(3,1fr)}
.item{min-height:76px;border:2px solid #ffffff2a;border-radius:10px;background:#ffffff12;padding:4px 2px;text-align:center;color:inherit;font:600 10.5px 'Mali',sans-serif;line-height:1.2}
.card .item{border-color:var(--line);background:var(--cell);color:var(--ink)}
.item b{font-size:24px;display:block;font-weight:400}
.item.tool{border-color:var(--gold)}.item.on{border-color:var(--btn);background:#f2a90044}
.item .tier{color:#e9c46a;font-size:9.5px}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}
.statBox{border:2px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12px}
.statBox b{display:block;font-size:15px}
.meter{height:7px;background:#0004;border-radius:6px;overflow:hidden;margin-top:5px;min-width:60px}
.meter i{display:block;height:100%}
.quest{border:2px solid #ffffff2a;border-radius:10px;padding:8px 10px;margin:7px 0;background:#ffffff0d}
.qbar{height:7px;background:#0005;border-radius:5px;overflow:hidden;margin:6px 0}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#e9c46a,#f2a900)}
.qrow{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.qrow button{padding:6px 10px;border:0;border-radius:9px;background:#3fbf6a;color:#052;font:700 12px 'Mali',sans-serif}
.minimap{width:100%;height:auto;border:3px solid var(--gold);border-radius:10px;image-rendering:pixelated;background:#000}
.lbl2{font-size:12px;color:#9fb6d2;margin-top:6px}
.sw{display:flex;gap:8px;margin:5px 0 8px;flex-wrap:wrap}
.sw i{width:28px;height:28px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 2px #ffffff55;display:block}
.sw i.on{border-color:#fff}
.ftrack{position:relative;width:64px;height:230px;background:linear-gradient(#5fb4e0,#1f6f9a);border:3px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.fzone{position:absolute;left:3px;right:3px;background:#e5533dcc;border-radius:6px;transition:background .1s}.fzone.in{background:#3fbf6add}
.ffish{position:absolute;left:50%;transform:translateX(-50%);font-size:24px;line-height:1}
.frow{display:flex;gap:10px;justify-content:center}
.fprog{position:relative;width:16px;height:230px;border:3px solid var(--line);border-radius:8px;background:#0003;overflow:hidden;display:flex;align-items:flex-end}
.fprog i{display:block;width:100%;background:#3fbf6a}
/* title */
#title{position:absolute;inset:0;z-index:9;background:linear-gradient(#f6c667 0,#f3a64a 30%,#2c6b3f 30%,#1d3a2a 100%);display:flex;align-items:flex-start;justify-content:center;overflow:auto;touch-action:pan-y;padding:12px 0}
#title .card{margin:8px 0;max-height:none;text-align:center;width:min(94%,400px)}
#title h1{margin:0;font-size:28px;color:#b3261e}
#title .tag{font-size:12.5px;color:var(--dim);margin-bottom:8px}
#title .sw{justify-content:center}
#title .sw i{box-shadow:0 0 0 2px var(--line)}#title .sw i.on{border-color:var(--ink)}
.seg{display:flex;gap:8px;margin:6px 0}
.seg button{flex:1;padding:9px 4px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);font:700 13.5px 'Mali',sans-serif}
.seg button.on{background:var(--btn);border-color:var(--btn);color:var(--btnink)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:0 0 auto;padding:6px 9px;font-size:12px}
.rnd{display:flex;gap:8px;align-items:center}.rnd .inp{flex:1;min-width:0}.dice{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff6;font-size:22px;cursor:pointer;line-height:1;padding:0;transition:transform .15s}.dice:active{transform:rotate(180deg) scale(.92)}
.inp{width:100%;padding:9px;border-radius:10px;border:2px solid var(--line);background:#fff3;color:var(--ink);font:600 15px 'Mali',sans-serif;text-align:center;-webkit-user-select:text;user-select:text;margin:4px 0}
.lbl{font-size:12.5px;color:var(--dim);margin-top:6px;text-align:left}
.upload{display:flex;gap:8px;align-items:center;font-size:12px}.upload input{flex:1;min-width:0;font-size:11px}
.cine{position:fixed;inset:0;z-index:60;background:#000;font-family:'Mali','Noto Sans Thai',system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow:hidden}
.cine canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cbar{position:absolute;left:0;right:0;height:7%;background:#000;z-index:2}
.cbar.t{top:0}.cbar.b{bottom:0}
.ctitle{position:absolute;left:0;right:0;top:34%;z-index:2;text-align:center;color:#fff;font:700 26px 'Mali',sans-serif;text-shadow:0 3px 12px #000,0 0 24px #e8749b;padding:0 18px;opacity:0;transition:opacity .9s;pointer-events:none;white-space:pre-line;line-height:1.5}
.ccap{position:absolute;left:0;right:0;bottom:0;z-index:3;padding-bottom:env(safe-area-inset-bottom,0px)}
.ccbox{display:flex;gap:12px;align-items:flex-start;margin:0 10px 14px;padding:12px 14px;min-height:96px;background:rgba(11,23,38,.9);color:#fff;border:3px solid #f4d58a;border-radius:14px;box-shadow:0 6px 0 #0008}
.ccbox canvas{position:static;width:auto;height:auto;flex:none;background:#0003;border-radius:10px}
.ccbox .dtxt{font-size:15px;line-height:1.55;min-height:3.1em}
.ccbox .dtxt b{color:#f4d58a}
.cskip{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:4;border:2px solid #ffffff88;background:#0009;color:#fff;border-radius:999px;padding:6px 12px;font:600 12px 'Mali',sans-serif}

</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div id="hud"><div id="hudTop"></div><div class="mini"><i id="hpFill"></i></div><div class="mini"><i id="barFill"></i></div></div>
<div id="qbtns"><button class="round" id="bQuest" aria-label="ภารกิจ">📜</button><button class="round" id="bMap" aria-label="แผนที่">🗺️</button><button class="round" id="bPhone" aria-label="โทรศัพท์" style="display:none">📱</button><button class="round" id="menuBtn" aria-label="เมนู">☰</button></div>
<div id="toast"></div>
<div id="joy"><div id="knob"></div></div>
<button id="btnA" class="round">ทำ</button>
<div id="tools"></div>
<div id="fade"></div>
<div id="modal"></div>
<div id="title">
  <div class="card">
    <h1>บ้านสวนสุขใจ</h1>
    <div class="tag">ปลูกผัก เลี้ยงสัตว์ ตกปลา ลงเหมือง ผูกมิตร และจีบใครสักคนในหมู่บ้านไทย</div>
    <div class="rnd"><input id="nameIn" class="inp" maxlength="10" value="ใจดี" aria-label="ชื่อตัวละคร"><button type="button" class="dice" id="diceName" aria-label="สุ่มชื่อตัวละคร">🎲</button></div>
    <div class="rnd"><input id="farmIn" class="inp" maxlength="14" value="ไร่สุขใจ" aria-label="ชื่อไร่"><button type="button" class="dice" id="diceFarm" aria-label="สุ่มชื่อไร่">🎲</button></div>
    <div class="lbl">🎂 วันเกิดของคุณ</div><div class="rnd"><select id="bdS" class="inp" aria-label="ฤดูที่เกิด"></select><select id="bdD" class="inp" aria-label="วันที่เกิด"></select></div>
    <div class="seg" id="gSeg"><button data-g="f" class="on">หญิง</button><button data-g="m">ชาย</button></div>
    <canvas id="prev" width="110" height="130"></canvas>
    <div class="lbl">ทรงผม</div><div class="seg wrap" id="hsSeg"></div>
    <div class="lbl">สีผม</div><div class="sw" id="swHair"></div>
    <div class="lbl">สีเสื้อ</div><div class="sw" id="swShirt"></div>
    <div class="lbl">สีผิว</div><div class="sw" id="swSkin"></div>
    <div class="seg" id="hatSeg"><button data-h="1" class="on">หมวกฟาง</button><button data-h="0">ไม่ใส่หมวก</button></div>
    <div class="lbl">ชุดเริ่มต้น</div><div class="seg" id="fitSeg"><button data-f="casual" class="on">ลำลอง</button><button data-f="mohom">ชาวนา (หม้อฮ่อม)</button></div>
    <div class="lbl">สัตว์เลี้ยง</div><div class="seg" id="petSeg"><button data-p="dog" class="on">🐕 สุนัข</button><button data-p="cat">🐈 แมว</button></div>
    <div class="lbl">ภาพตัวละครของคุณ (ถ้ามีไฟล์ PNG/JPG ใส่ได้)</div><div class="upload"><input id="avatarIn" type="file" accept="image/png,image/jpeg,image/webp"><button class="b alt" id="avatarClear" style="margin:0;width:auto;padding:6px 10px">ล้าง</button></div>
    <button class="b" id="startBtn" style="text-align:center">เริ่มเกมใหม่</button>
    <button class="b alt" id="contBtn" style="text-align:center;display:none">เล่นต่อจากที่บันทึก</button>
    <button class="b alt" id="impBtn" style="text-align:center">⬆️ นำเข้าไฟล์เซฟ</button>
  </div>
</div>
</div>
<script>
(()=>{
const TIME_RATE=1.0;
const TS=32, MW=64, MH=48, SAVE='baan_suan_sukjai_v2', SL=28;
const $=s=>document.querySelector(s);
const cv=$('#game'), g=cv.getContext('2d'), M=$('#modal');
let W=0,H=0,Z=1,DPR=1;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in (attrs||{})){const v=attrs[k];if(k==='onclick')e.addEventListener('click',v);else if(k==='class')e.className=v;else if(k==='disabled'||k==='checked'||k==='selected'||k==='value')e[k]=v;else if(k==='style')e.style.cssText=v;else e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let toastT=0;
function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms||2200)}

/* ---------- audio ---------- */
 // ข้ามมินิเกมตกปลา: คูลดาวน์หลังใช้แต่ละครั้ง (วันในเกม) แนะนำไม่เกิน 15
 // ดึงปลาอัตโนมัติ: คูลดาวน์หลังใช้แต่ละครั้ง (วันในเกม) ปรับได้ แนะนำไม่เกิน 15
let AC=null;const OPT={music:.25,sfx:.6,vib:1,saver:0,night:1,autoReel:1,skipFish:0,voice:1,fs:1,fd:0,lay:{}};
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,when,vol){const a=ac();if(!a||!vol)return;const o=a.createOscillator(),gn=a.createGain();o.type=type||'square';o.frequency.value=f;const t0=a.currentTime+(when||0);gn.gain.setValueAtTime(Math.max(.0002,v*vol),t0);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(gn);gn.connect(a.destination);o.start(t0);o.stop(t0+d+.03)}

let ROO_END=0;
function roosterSfx(vol,delay,far){const a=ac();if(!a)return;const m=OPT.sfx*(vol==null?1:vol);if(!(m>0))return;
 const t0=Math.max(a.currentTime+(delay||0),ROO_END+.25),master=a.createGain();master.gain.value=1;
 const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=far?1500:4200;master.connect(lp);lp.connect(a.destination);
 const sy=[[0,.17,430,640,590,0],[.21,.24,620,1000,1060,0],[.5,.55,790,1190,1090,22],[1.12,.9,990,1280,500,34]];
 sy.forEach(([off,dur,f0,f1,f2,vib],si)=>{const s=t0+off,fs=far?.86:1;
  const env=a.createGain();env.gain.setValueAtTime(.0001,s);env.gain.linearRampToValueAtTime(.17*m,s+.03);env.gain.setValueAtTime(.15*m,s+dur-.07);env.gain.exponentialRampToValueAtTime(.0001,s+dur);
  const f1n=a.createBiquadFilter(),f2n=a.createBiquadFilter(),fb=a.createGain(),b1=a.createGain(),b2=a.createGain(),b3=a.createGain();
  f1n.type='bandpass';f1n.frequency.value=1150;f1n.Q.value=3.2;f2n.type='bandpass';f2n.frequency.value=2500;f2n.Q.value=4.5;b1.gain.value=1.1;b2.gain.value=.7;b3.gain.value=.35;
  env.connect(f1n);env.connect(f2n);env.connect(b3);f1n.connect(b1);f2n.connect(b2);b1.connect(master);b2.connect(master);b3.connect(master);
  [-7,7].forEach(cent=>{const o=a.createOscillator();o.type='sawtooth';o.detune.value=cent;o.frequency.setValueAtTime(f0*fs,s);o.frequency.linearRampToValueAtTime(f1*fs,s+dur*.42);o.frequency.linearRampToValueAtTime(f2*fs,s+dur);
   if(vib){const lf=a.createOscillator(),lg=a.createGain();lf.frequency.value=9+si*.8;lg.gain.value=vib;lf.connect(lg);lg.connect(o.frequency);lf.start(s);lf.stop(s+dur+.05)}
   o.connect(env);o.start(s);o.stop(s+dur+.05)});
  const r=a.createOscillator(),rg=a.createGain();r.type='square';r.frequency.setValueAtTime(f0*fs*.5,s);r.frequency.linearRampToValueAtTime(f1*fs*.5,s+dur*.42);r.frequency.linearRampToValueAtTime(f2*fs*.5,s+dur);rg.gain.value=.22;r.connect(rg);rg.connect(env);r.start(s);r.stop(s+dur+.05)});
 ROO_END=t0+2.05}

   ทำให้ขอบสไปรต์ (เส้นขอบ/สี) ถูก anti-alias ไม่เท่ากันในแต่ละเฟรม = สั่น/กระพริบ
   จึง snap ตำแหน่งผู้เล่นเข้ากริดพิกเซลจอ "เฉพาะตอนวาด" แล้วคืนค่าจริงทันที (ระบบเดิน/ชน/เซฟไม่ถูกแตะ) */

 /* ---------- ไร่ร่วมของคู่แต่งงาน (ข้อ 1: ดูไร่ของคู่แบบอ่านอย่างเดียว) ----------

 /* บ้านร่วมของคู่แต่งงาน: key เดียวกันทั้งสองคน (เรียง uid แล้วแฮช) เปิดใช้เมื่อเปิดสวิตช์ 🌾 */
 function coupleKey(){if(!fsOn()||!S.pid||!S.pm||!S.pm.uid)return'';const a=[S.pid,S.pm.uid].sort().join('|');let h=5381;for(let i=0;i<a.length;i++)h=((h<<5)+h+a.charCodeAt(i))>>>0;return'c'+h.toString(36)}

 function rpos(r){if(!(scene==='i'&&curInt&&curInt.id==='player'))return r;return{x:Math.max(TS*1.3,Math.min((curInt.w-1.3)*TS,r.x)),y:Math.max(TS*2.3,Math.min((curInt.h-1)*TS,r.y))}}
 const FSG={map:null,with:0,pend:new Map(),hl:{water:0,plant:0,fert:0,harvest:0,dig:0,clear:0},t:0,chk:0,sent:'',last:'',lastT:0,shown:0};

 function fsPack(){const a=[];for(const k in S.soil){const m=/^(\d+),(\d+)$/.exec(k);if(!m)continue;const x=+m[1],y=+m[2];if(!inRect(FARM,x,y))continue;const s=S.soil[k];if(!s)continue;const c=s.c&&CROPS[s.c.t]?s.c:null;
   a.push([x,y,(s.w?1:0)|(s.f?2:0)|(c&&c.wilt?4:0),c?c.t:0,c?Math.round((+c.d||0)*10)/10:0,c&&c.wd?c.wd|0:0]);if(a.length>=200)break}return a}
 function fsClean(a){const o={};if(!Array.isArray(a))return o;let n=0;

 const HELP_WHY={gone:'แปลงนี้เปลี่ยนไปแล้ว',season:'ผิดฤดูกาล',off:'คู่ปิดไร่ร่วมอยู่',busy:'ทำไม่ได้ตอนนี้',spot:'ขุดตรงนี้ไม่ได้ (มีของขวางอยู่ในไร่ของคู่)'};

function curSolid(x,y){
 if(scene==='w')return isSolid(x,y);
 if(scene==='i')return x<0||y<0||x>=curInt.w||y>=curInt.h||curInt.sol[y][x]===1;
 return x<0||y<0||x>=MINE.w||y>=MINE.h||MINE.g[y][x]==='#'||MINE.rocks.some(r=>r.hp>0&&r.x===x&&r.y===y);
}
function pxSolid(px,py){return curSolid(Math.floor(px/TS),Math.floor(py/TS))}
function free(x,y){return!(pxSolid(x-7,y-6)||pxSolid(x+7,y-6)||pxSolid(x-7,y+2)||pxSolid(x+7,y+2))}
function tryMove(dx,dy){const ox=P.x,oy=P.y;if(free(P.x+dx,P.y))P.x+=dx;if(free(P.x,P.y+dy))P.y+=dy;P.wd=(P.wd||0)+Math.hypot(P.x-ox,P.y-oy)}
function target(){const d=DV[P.dir];return{x:Math.floor(P.x/TS)+d[0],y:Math.floor((P.y-4)/TS)+d[1]}}

 const prev=new Int16Array(w*h).fill(-1),q=[sy*w+sx];prev[sy*w+sx]=sy*w+sx;

const NPCIMG={},imgC=new Map();
function persistImg(){try{localStorage.setItem(SAVE+'_npcimg',JSON.stringify(NPCIMG))}catch(e){toast('พื้นที่เก็บรูปเต็ม ลองใช้รูปที่เล็กลง')}}
function loadImg(){try{Object.assign(NPCIMG,JSON.parse(localStorage.getItem(SAVE+'_npcimg')||'{}'))}catch(e){}}
function npcPortrait(n,u){
 const url=NPCIMG[n.id];if(!url)return portrait(n.look,u);
 const c=document.createElement('canvas');c.width=u*24;c.height=u*28;
 let im=imgC.get(url);
 const dr=()=>{const x=c.getContext('2d'),iw=im.naturalWidth,ih=im.naturalHeight,r=c.width/c.height;let sw=iw,sh=iw/r;if(sh>ih){sh=ih;sw=ih*r}x.imageSmoothingEnabled=true;x.drawImage(im,(iw-sw)/2,(ih-sh)*.12,sw,sh,0,0,c.width,c.height)};
 if(!im){im=new Image();im.onload=dr;im.src=url;imgC.set(url,im)}
 else if(im.complete&&im.naturalWidth)dr();else im.addEventListener('load',dr);
 return c;
}
function setNpcImg(id,file,cb){
 const r=new FileReader();
 r.onload=()=>{const im=new Image();
  im.onload=()=>{const m=420,s=Math.min(1,m/Math.max(im.width,im.height)),cv2=document.createElement('canvas');cv2.width=Math.max(1,Math.round(im.width*s));cv2.height=Math.max(1,Math.round(im.height*s));
   const x=cv2.getContext('2d');x.fillStyle='#f7e9cf';x.fillRect(0,0,cv2.width,cv2.height);x.drawImage(im,0,0,cv2.width,cv2.height);
   NPCIMG[id]=cv2.toDataURL('image/jpeg',.86);persistImg();cb&&cb()};
  im.onerror=()=>toast('อ่านไฟล์รูปไม่ได้');im.src=r.result};
 r.readAsDataURL(file);
}

/* ---------- เสียงพูด (Web Speech API ภาษาไทย) ---------- */
const speechOK=()=>typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined';
let thVoices=[];
function loadVoices(){try{thVoices=speechSynthesis.getVoices().filter(v=>/^th/i.test(v.lang))}catch(e){}}
if(speechOK()){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){}}
function stopSpeak(){try{if(speechOK())speechSynthesis.cancel()}catch(e){}}
function stripName(t,who){const p=who.name+': ';return t.startsWith(p)?t.slice(p.length):t}
const FEM_V=/kanya|narisa|achara|premwadee|female|หญิง|siri.*(f|female)|google.*(th|ไทย)/i,MAL_V=/pattara|niwat|male|ชาย|siri.*male/i;
function pickVoice(fem){if(!thVoices.length)return null;const f=thVoices.find(v=>FEM_V.test(v.name)&&!MAL_V.test(v.name)),m=thVoices.find(v=>MAL_V.test(v.name)&&!/female/i.test(v.name));
 const v=fem?(f||null):(m||null);return v}
function speak(text,who,onend){
 const fin=()=>{if(onend)onend()};
 if(!OPT.voice||!speechOK()){fin();return false}
 try{
  if(!ALMS_SPEAK)stopChant();
  speechSynthesis.cancel();
  const clean=fmt(text).replace(/\([^)]*\)/g,'').replace(/[♥♡▸💍💗💞✨]/g,'').trim();
  if(!clean){fin();return false}
  const u=new SpeechSynthesisUtterance(clean);u.lang='th-TH';
  const n=who&&who!=='player'?(NPC[who]||SK.find(q=>q.id===who)||(who==='granny'?GRANNY:null)):null;let pitch=1,rate=.95;
  if(n){pitch=(n.g||n.look.g)==='f'?1.32:.82;if(n.u&&n.u<2)pitch+=.25;if(n.t==='monk'){pitch=.78;rate=.85}if(n.id==='granny'){pitch=1.08;rate=.8}if(n.id==='chai'||n.id==='tian'){pitch=.6;rate=.88}if(n.id==='daeng'||n.id==='laddaa'){pitch=1.1;rate=.92}}
  else if(who==='player'){pitch=S.gender==='f'?1.2:.95}else{rate=.9}
  {const fem=n?(n.g||n.look.g)==='f':who==='player'?S.gender==='f':false,v=pickVoice(fem);
   if(v){u.voice=v;pitch=1+(pitch-(fem?1.32:.82))*.6+(fem?.12:-.08);if(n&&n.u&&n.u<2)pitch+=.3;if(n&&(n.id==='chai'||n.id==='tian'||n.t==='monk'))pitch-=.15}
   else if(thVoices.length)u.voice=thVoices[0]}
  u.pitch=clamp(pitch,.1,2);u.rate=rate;u.volume=1;
  u.onend=u.onerror=fin;speechSynthesis.speak(u);return true;
 }catch(e){fin();return false}
}

// บรรทัด: '(บรรยาย)' | 'N:คำพูด NPC' | 'P:คำพูดผู้เล่น' | 'chai:คำพูด' | 'ชื่อ: คำพูด'
function mkSteps(lines,n,bg,fx,o){
 o=o||{};
 const pc=o.cast||[{id:'player',x:.3,dir:'r',from:-.14},{id:n.id,x:.7,dir:'l',from:1.14}];
 const steps=lines.map((l,i)=>{
  let who=null,text=l;const m=/^([A-Za-z]+):([\s\S]*)$/.exec(l);
  if(m){who=m[1]==='N'?n.id:m[1]==='P'?'player':(ACT(m[1])?m[1]:n.id);text=m[2]}
  else if(l[0]!=='('){who=n.id;const pre=n.name+': ';if(l.startsWith(pre))text=l.slice(pre.length)}
  return{bg,fx,cast:i===0?pc.map(a=>Object.assign({},a)):null,who,text};
 });
 return{title:o.title||null,steps};
}

function heartData(n,lv){
 if(lv===5){const d=H5[n.id];if(!d)return null;const b=H5BG[n.id]||['day','sparkle'];return{bg:b[0],fx:b[1],lines:d.slice(0,-2),mon:d[d.length-2],msg:d[d.length-1]}}
 const x=HS[n.id]&&HS[n.id][lv];return x?{bg:x[0],fx:x[1],lines:x[2]}:null;
}
function heartScene(n,lv){const d=heartData(n,lv);return mkSteps(d.lines,n,d.bg,d.fx,{title:'♥'.repeat(lv)+'  '+lv+' หัวใจ • '+n.name})}
function playHeart(n,lv){
 const d=heartData(n,lv);S.cut['h'+lv+'_'+n.id]=1;
 playScene(heartScene(n,lv),()=>{
  let mon,msg;
  if(n.t==='monk'){mon=0;S.blessed=true;if(lv===3)msg=n.name+'ให้พร • ได้รับพรประจำวัน';else if(lv===5){S.energy=maxEn();msg=d.msg}else if(lv===7){addInv('potion',1);msg=n.name+'มอบยาสมุนไพรบำรุงกำลัง'}else{addInv('potion',2);msg=n.name+'ผูกสายสิญจน์ให้ ได้ยาสมุนไพรและพร'}}
  else if(lv===5){mon=d.mon;msg=d.msg;if(n.id==='tian')S.blessed=true;if(n.id==='daeng')addInv('feed',5);if(n.id==='phum')addInv('bait',10)}
  else{mon={3:80,7:200,10:450}[lv];msg={3:'ของขวัญน้ำใจจาก'+n.name,7:'ของขวัญแทนใจจาก'+n.name,10:'ของขวัญล้ำค่าจาก'+n.name}[lv];
   if(lv===3)addInv('sweet',1);if(lv===7)addInv('potion',2);if(lv===10)addInv('sweet',3)}
  mon=fm(mon);S.money+=mon;sfx('heart');buzz(80);save();hud();toast('🎁 '+msg+(mon?' (+'+mon+' บาท)':''),3500);
 });
}
function checkHearts(){
 for(const n of NPCS.concat(SK)){const hr=hearts(n.id);
  for(const lv of [3,5,7,10]){if(hr>=lv&&!S.cut['h'+lv+'_'+n.id]&&heartData(n,lv)){playHeart(n,lv);return true}}}
 return false;
}

const jobRank=c=>c<3?['ฝึกงาน',1]:c<8?['พนักงานประจำ',1.3]:c<15?['ชำนาญ',1.6]:['หัวหน้างาน',2];
const jobPay=id=>Math.round(JOBS[id].pay*jobRank(S.jobs[id]||0)[1]*(1+lvOf('job')*.04)*pc('job'));
function applyFx(f,npcId){
 const o=[];
 if(f.m){S.money=Math.max(0,S.money+f.m);o.push('💰 '+(f.m>0?'+':'')+f.m)}
 if(f.e){S.energy=clamp(S.energy+f.e,0,maxEn());o.push('⚡ '+(f.e>0?'+':'')+f.e)}
 if(f.hp){S.hp=clamp(S.hp+f.hp,1,maxHp());o.push('❤️ '+(f.hp>0?'+':'')+f.hp)}
 if(f.it){addInv(f.it[0],f.it[1]);o.push('+'+iname(f.it[0])+' ×'+f.it[1])}
 if(f.pts){const id=f.who||npcId;if(id&&S.npc[id]){addPts(id,f.pts);o.push('♥ '+NPC[id].name+(f.pts>0?' +':' ')+f.pts)}}
 if(f.xp)addXP(f.xp[0],f.xp[1]);
 if(f.bless){S.blessed=true;o.push('🙏 โชคดีวันนี้')}
 return o.join('   ');
}
function jobMenu(n){
 const J=JOBS[n.id],c0=S.jobs[n.id]||0,rk=jobRank(c0);
 const done=S.jobDay[n.id]===S.day,late=S.min/60+J.hrs>24,tired=S.energy<J.en;
 const items=[{t:'▶ เริ่มกะ ('+J.hrs+' ชม. • ⚡-'+J.en+')'+(done?' – วันนี้ทำแล้ว':late?' – ดึกเกินไป':tired?' – เหนื่อยเกินไป':''),dis:done||late||tired,fn:()=>startJob(n)},{t:'← กลับ',alt:1,fn:()=>npcMenu(n)}];
 card(J.ic+' '+J.n,'ตำแหน่ง: '+rk[0]+' • ทำมาแล้ว '+c0+' กะ\nค่าจ้างวันนี้ ฿'+jobPay(n.id)+' (+ทิป/โบนัสตามการตัดสินใจ)\nใช้เวลา '+J.hrs+' ชั่วโมง • ทำซ้ำเลื่อนตำแหน่ง ค่าจ้างเพิ่ม',items).querySelector('.sub').style.whiteSpace='pre-line';
}
function startJob(n){
 const J=JOBS[n.id];closeM();S.jobDay[n.id]=S.day;S.energy=Math.max(0,S.energy-J.en);
 playScene(mkSteps([J.nar,'N:'+J.q,'(เวลาผ่านไป '+J.hrs+' ชั่วโมง งานเริ่มเข้าที่ แล้วก็มีเรื่องให้ตัดสินใจ…)'],n,J.bg,null,{title:J.ic+' '+J.n+' • '+n.name}),()=>{
  S.min=Math.min(S.min+J.hrs*60,1500);
  const sc=J.sc[Math.floor(Math.random()*J.sc.length)];
  card(J.ic+' '+J.n,fmt(sc[0]),sc[1].map(ch=>({t:ch[0],fn:()=>finishJob(n,J,ch)}))).querySelector('.sub').style.whiteSpace='pre-line';
 });
}
function finishJob(n,J,ch){
 const c0=S.jobs[n.id]||0,pay=jobPay(n.id);
 S.money+=pay;S.jobs[n.id]=c0+1;addXP('job',16);addPts(n.id,12);qEvent('job');
 const ex=applyFx(ch[2]||{},n.id),up=jobRank(c0)[0]!==jobRank(c0+1)[0];
 sfx('coin');if(up)setTimeout(()=>sfx('level'),300);save();
 card('✅ จบกะแล้ว',fmt(ch[1])+'\n\n💰 ค่าจ้าง +฿'+pay+(ex?'\n'+ex:'')+(up?'\n🎖️ เลื่อนตำแหน่งเป็น "'+jobRank(c0+1)[0]+'"!':''),[{t:'ตกลง',fn:closeM}]).querySelector('.sub').style.whiteSpace='pre-line';
}

function rollEvent(){if(!S)return;S.ev=Math.random()<.7?{i:Math.floor(Math.random()*EVENTS.length),at:9+Math.random()*8,done:0}:null}
function runEvent(e){
 if(S.ev)S.ev.done=1;
 const items=e.ch.map(ch=>{const need=ch[2]&&ch[2].m<0?-ch[2].m:0;
  return{t:ch[0],dis:S.money<need,fn:()=>{const o=applyFx(ch[2]||{},null);save();sfx('coin');card(e.t,fmt(ch[1])+(o?'\n\n'+o:''),[{t:'ตกลง',fn:closeM}]).querySelector('.sub').style.whiteSpace='pre-line'}}});
 sfx('level');card(e.t,fmt(e.x),items).querySelector('.sub').style.whiteSpace='pre-line';
}

/* ---------- ตรวจคัตซีน / ฉากเหตุการณ์ ---------- */
function checkCutscene(){
 if(!S||paused||CS.on||(scene!=='w'&&scene!=='i'))return;
 if(S.engaged&&NPC[S.engaged]&&S.day>=S.wedDay&&S.min/60>=9&&S.min/60<22)return weddingScene(NPC[S.engaged]);
 if(checkHearts())return;
 if(scene!=='w')return;
 if(S.ev&&!S.ev.done&&S.min/60>=S.ev.at&&S.min/60<22&&!S.fishing&&!sprOn()&&!danceOn())return runEvent(EVENTS[S.ev.i]);
 const ev=CUTSCENES.find(e=>e.day===S.day&&!S.cut[e.key]&&S.min/60>=e.from&&S.min/60<e.to);
 if(!ev)return;const n=NPC[ev.npc];if(!n)return;const p=npcWorldPos(n);if(!p)return;
 if(Math.hypot(P.x-p.x,P.y-p.y)>150)return;
 S.cut[ev.key]=1;save();
 playScene(mkSteps(ev.lines,n,'day','sparkle',{}),()=>toast('ฉากเหตุการณ์จบแล้ว'));
}

function say(who,lines,done){
 let i=0;const box=h('div',{class:'dlg'});
 const render=()=>{box.replaceChildren(npcPortrait(who,3),h('div',{class:'dtxt'},h('b',{},who.name),h('p',{},fmt(lines[i])),h('small',{},'แตะเพื่อไปต่อ ▸')));speak(stripName(lines[i],who),who.id)};
 box.addEventListener('click',()=>{sfx('tap');i++;if(i>=lines.length){stopSpeak();closeM();done&&done()}else render()});
 render();show(box,true);
}

/* ---------- UI plumbing ---------- */
const joy={dx:0,dy:0,id:null};
function resetJoy(){joy.dx=joy.dy=0;joy.id=null;$('#knob').style.transform=''}
function setPause(v){paused=v;window._paused=v;if(v){GO=null;HOLD=null}}
function show(el,bottom){M.replaceChildren(el);M.className='on'+(bottom?' bottom':'');setPause(true);resetJoy()}
function closeM(){M.className='';M.replaceChildren();stopSpeak();setPause(false);updTools();hud()}

function card(title,sub,items,head){const c=h('div',{class:'card'});if(head)c.append(head);if(title)c.append(h('h3',{},title));if(sub)c.append(h('div',{class:'sub'},sub));
 items.forEach(it=>{const b=h('button',{class:'b'+(it.alt?' alt':'')},it.t);if(it.dis)b.disabled=true;else b.addEventListener('click',()=>{sfx('tap');it.fn()});c.append(b)});show(c);return c}
function sheet(title,tabs,cur,onTab,body){
 const c=h('div',{class:'sheet'});
 c.append(h('div',{class:'shead'},h('b',{},title),h('button',{class:'x',onclick:closeM},'✕')));
 if(tabs)c.append(h('div',{class:'stabs'},...tabs.map(([k,ic,n])=>h('button',{class:cur===k?'on':'',onclick:()=>{sfx('tap');onTab(k)}},h('span',{},ic),n))));
 const b=h('div',{class:'sbody'});[].concat(body).forEach(x=>x&&b.append(x));c.append(b);show(c);return c}
const heartStr=n=>'♥'.repeat(n)+'♡'.repeat(10-n);
const bar=(v,m,col)=>h('div',{class:'meter'},h('i',{style:'width:'+clamp(v/m*100,0,100)+'%;background:'+(col||'#55b98a')}));
const sellPrice=k=>{const i=info(k);let v=i.sell||0;return v};

/* ---------- NPCs ---------- */
function addPts(id,d){const st=S.npc[id],b=hearts(id);st.pts=clamp(st.pts+d,0,800);const a=hearts(id);if(a>b){sfx('heart');buzz(60);qEvent('hearts',1,a)}}
function taste(n,k){return n.love.includes(k)?3:n.like.includes(k)?2:n.hate.includes(k)?0:1}

  if(FQ.n>=120){const avg=FQ.sum/FQ.n;FQ.n=0;FQ.sum=0;
   // ถ้าเฉลี่ยช้ากว่ารอบจอเกิน 35% ติดกันสองรอบ ลดความละเอียดลงทีละขั้น (ไม่ต่ำกว่า 0.6) ให้ลื่นขึ้น
   if(avg>FQ.min*1.35&&!OPT.saver){if(++FQ.lows>=2&&FQ.qs>.6){FQ.qs=Math.max(.6,FQ.qs-.15);FQ.lows=0;FQ.skip=60;resize()}}else FQ.lows=0}}}
 if(FQ.el){FQ.fn++;if(ts-FQ.ft>=500){FQ.fps=FQ.fn*1000/(ts-FQ.ft);FQ.fn=0;FQ.ft=ts;FQ.el.textContent=Math.round(FQ.fps)+' FPS • จอ '+Math.round(1/FQ.min)+'Hz • ความละเอียด '+Math.round(FQ.qs*100)+'%'}}}
/* fpsTick อาจเรียก resize() (ตั้ง canvas.width = ล้างภาพ) จึงต้องทำก่อนวาด ไม่งั้นเฟรมนั้นจะเป็นจอว่าง = กะพริบวาบ */
function frame(ts){const raw=(ts-last)/1000||0,dt=Math.min(.05,raw);last=ts;fpsTick(raw,ts);if(S){update(dt);MP.tick(dt);render()}requestAnimationFrame(frame)}

 g.imageSmoothingEnabled=false}

jEl.addEventListener('pointerdown',e=>{e.preventDefault();joy.id=e.pointerId;jEl.setPointerCapture(e.pointerId);jupd(e)});

/* ---------- สุ่มชื่อตัวละคร / ชื่อไร่ ---------- */
const RN_F=['ฟ้าใส','ดาวเรือง','ลำดวน','แพรวา','ขวัญข้าว','ใบบัว','มะปราง','น้ำตาล','พิมพ์ใจ','รวงทอง','ส้มโอ','ไข่มุก','ฝ้าย','ชมพู่','ปลายฝน','พลอย','แก้วตา','หยาดฟ้า','ทับทิม','อรุณรุ่ง','กุหลาบ','นางฟ้า','จันทร์เพ็ญ','ข้าวปุ้น'];
const RN_M=['ตะวัน','พายุ','ภูผา','ปลายนา','ข้าวเม่า','ธารา','เมฆา','ไผ่','สายลม','ต้นข้าว','ทองดี','บุญมา','ฟ้าคราม','กันต์','ก้อนเมฆ','ภูเขา','คมสัน','ทะเลทอง','ขุนทอง','ธีรภัทร','ศิลา','น้ำใส','ลมโชย','สายฟ้า'];
const RN_U=['ใจดี','ขวัญใจ','ชื่นใจ','สุขใจ','มีสุข','สายรุ้ง','ดวงดี','ใบไม้','ปุยนุ่น','ข้าวโพด','แตงโม','ลูกพีช','มะลิลา','ตะวันฉาย','ทุ่งทอง','เมฆขาว'];
const RF_A=['ไร่','สวน','บ้านสวน','ฟาร์ม','ไร่นา','สวนสุข'];
const RF_B=['สุขใจ','ทองดี','ฟ้าใส','ลมโชย','รวงทอง','ดอกไม้','ตะวันฉาย','ชายทุ่ง','ปลายนา','มะลิลา','สายน้ำ','เมฆขาว','ใบเขียว','ข้าวหอม','ธารทิพย์','ขวัญดิน','ลำดวน','พระจันทร์','ดาวเรือง','ฝนพรำ','สายหมอก','ริมคลอง','ใต้ร่มมะม่วง','รักษ์ดิน'];
const rnPick=(arr,max,cur,bad)=>{const ok=arr.filter(x=>x.length<=max&&x!==cur&&!(bad&&bad.includes(x)));return ok[Math.floor(Math.random()*ok.length)]||cur};
function rndName(){const bad=(typeof NPCS!=='undefined'?NPCS.map(n=>n.name):[]),cur=$('#nameIn').value.trim();return rnPick((gen==='f'?RN_F:RN_M).concat(RN_U),10,cur,bad)}
